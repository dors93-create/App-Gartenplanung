<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- mobile-first: korrekte Skalierung auf dem Handy, Notch-/Safe-Area-Unterstützung -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Grünriss – plane deinen Garten in NRW auf dem aktuellen Luftbild."
    />
    <title>Grünriss – Gartenplanung für NRW</title>
  </head>
  <body>
    <!-- Die Karte füllt den gesamten Bildschirm. -->
    <div id="map"></div>

    <!-- Schwebende Suchleiste – das Hauptelement der Oberfläche. -->
    <div class="search" role="search">
      <form id="search-form" class="search__box" autocomplete="off">
        <!-- Lupen-Icon (Inline-SVG, damit wir keine zusätzliche Bild-Datei brauchen) -->
        <svg
          class="search__icon"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>

        <input
          id="search-input"
          class="search__input"
          type="text"
          name="adresse"
          placeholder="Adresse eingeben, um zu starten …"
          aria-label="Adresse suchen"
        />

        <!-- Lade-Spinner (nur sichtbar während der Adresssuche) -->
        <span id="search-spinner" class="search__spinner" hidden></span>
      </form>

      <!-- Trefferliste der Adresssuche (wird per JavaScript gefüllt) -->
      <ul id="search-results" class="results" hidden></ul>

      <!-- Hinweis im leeren Zustand bzw. Fehlermeldungen -->
      <p id="search-hint" class="search__hint">
        Gib deine Adresse ein, um zu starten.
      </p>

      <!-- Kleiner Knopf unter dem Hinweis: blendet die Liste „Meine Gärten“
           ein. Gibt es noch keinen Garten, öffnet er die Dateiauswahl, um
           einen gesicherten Garten zu laden. -->
      <button id="gaerten-knopf" class="search__link" type="button" hidden>
        Meine Gärten
      </button>

      <!-- „Meine Gärten“: gespeicherte Pläne zum Weiterplanen
           (die Liste wird per JavaScript gefüllt). -->
      <div id="gaerten" class="gaerten" hidden>
        <div class="gaerten__kopf">Meine Gärten</div>
        <ul id="gaerten-liste" class="gaerten__liste"></ul>
        <div class="gaerten__fuss">
          <button id="gaerten-laden" class="btn btn--ghost" type="button">
            Garten aus Datei laden
          </button>
        </div>
      </div>

      <!-- Unsichtbare Dateiauswahl für „Garten aus Datei laden“ -->
      <input id="gaerten-datei" type="file" accept=".json,application/json" hidden />
    </div>

    <!-- Unteres Bedienfeld: führt Schritt für Schritt durch die
         Grundstücksauswahl (erscheint erst, wenn eine Adresse gefunden ist). -->
    <div id="gp-panel" class="panel" hidden>
      <p id="gp-text" class="panel__text"></p>
      <div class="panel__buttons">
        <button id="gp-zurueck" class="btn btn--ghost" type="button" hidden></button>
        <button id="gp-aktion" class="btn btn--primary" type="button"></button>
      </div>
    </div>

    <!-- Werkzeugleiste des Objekt-Editors (Schritt 3a) – zunächst verborgen. -->
    <div id="ed-toolbar" class="toolbar" hidden>
      <div id="ed-chips" class="toolbar__chips"></div>

      <!-- Form-Umschalter für Flächen (nur sichtbar, wenn eine Fläche gewählt ist) -->
      <div id="ed-form" class="seg-group" hidden>
        <button id="ed-form-frei" class="seg is-active" type="button">
          Frei zeichnen
        </button>
        <button id="ed-form-rechteck" class="seg" type="button">Rechteck</button>
      </div>

      <div class="toolbar__actions">
        <button id="ed-undo" class="btn btn--ghost" type="button" hidden>
          Punkt zurück
        </button>
        <button id="ed-finish" class="btn btn--primary" type="button" hidden>
          Fläche fertig
        </button>
        <button id="ed-confirm" class="btn btn--primary" type="button" hidden>
          Fertig
        </button>
        <button id="ed-delete" class="btn btn--danger" type="button" hidden>
          Löschen
        </button>
        <button id="ed-cancel" class="btn btn--danger" type="button" hidden>
          Abbrechen
        </button>
        <button id="ed-rest" class="btn btn--ghost" type="button" hidden>
          Restfläche als Rasen
        </button>
        <button id="ed-auto" class="btn btn--primary" type="button" hidden>
          Automatisch erfassen
        </button>
        <button id="ed-close" class="btn btn--ghost" type="button">Schließen</button>
      </div>
      <!-- Warnung, falls der Plan nicht gespeichert werden konnte -->
      <p id="ed-warnung" class="toolbar__warnung" hidden>
        Achtung: Der Plan konnte nicht gespeichert werden – der Speicher des
        Browsers ist voll oder gesperrt.
      </p>
      <p id="ed-hint" class="toolbar__hint"></p>
    </div>

    <!-- Rückfrage-Fenster: stellt eine Frage und bietet die Antworten als
         beschriftete Knöpfe an. Titel, Text und Knöpfe füllt das JavaScript
         (src/rueckfrage.js). Unsichtbar, solange keine Frage offen ist. -->
    <dialog id="rueckfrage" class="rueckfrage" aria-labelledby="rueckfrage-titel">
      <h2 id="rueckfrage-titel" class="rueckfrage__titel"></h2>
      <p id="rueckfrage-text" class="rueckfrage__text"></p>
      <div id="rueckfrage-knoepfe" class="rueckfrage__knoepfe"></div>
    </dialog>

    <!-- Einstiegspunkt: Vite lädt von hier unseren JavaScript-Code. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
