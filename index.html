<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- mobile-first: korrekte Skalierung auf dem Handy, Notch-/Safe-Area-Unterstützung -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Grünriss – plane deinen Garten in NRW auf dem aktuellen Luftbild."
    />
    <title>Grünriss – Gartenplanung für NRW</title>
  </head>
  <body>
    <!-- Die Karte füllt den gesamten Bildschirm. -->
    <div id="map"></div>

    <!-- Schwebende Suchleiste – das Hauptelement der Oberfläche. -->
    <div class="search" role="search">
      <form id="search-form" class="search__box" autocomplete="off">
        <!-- Lupen-Icon (Inline-SVG, damit wir keine zusätzliche Bild-Datei brauchen) -->
        <svg
          class="search__icon"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>

        <input
          id="search-input"
          class="search__input"
          type="text"
          name="adresse"
          placeholder="Adresse eingeben, um zu starten …"
          aria-label="Adresse suchen"
        />

        <!-- Lade-Spinner (nur sichtbar während der Adresssuche) -->
        <span id="search-spinner" class="search__spinner" hidden></span>
      </form>

      <!-- Trefferliste der Adresssuche (wird per JavaScript gefüllt) -->
      <ul id="search-results" class="results" hidden></ul>

      <!-- Hinweis im leeren Zustand bzw. Fehlermeldungen -->
      <p id="search-hint" class="search__hint">
        Gib deine Adresse ein, um zu starten.
      </p>
    </div>

    <!-- Unteres Bedienfeld: führt Schritt für Schritt durch die
         Grundstücksauswahl (erscheint erst, wenn eine Adresse gefunden ist). -->
    <div id="gp-panel" class="panel" hidden>
      <p id="gp-text" class="panel__text"></p>
      <div class="panel__buttons">
        <button id="gp-zurueck" class="btn btn--ghost" type="button" hidden></button>
        <button id="gp-aktion" class="btn btn--primary" type="button"></button>
      </div>
    </div>

    <!-- Werkzeugleiste des Objekt-Editors (Schritt 3a) – zunächst verborgen. -->
    <div id="ed-toolbar" class="toolbar" hidden>
      <div id="ed-chips" class="toolbar__chips"></div>
      <div class="toolbar__actions">
        <button id="ed-undo" class="btn btn--ghost" type="button" hidden>
          Punkt zurück
        </button>
        <button id="ed-finish" class="btn btn--primary" type="button" hidden>
          Fläche fertig
        </button>
        <button id="ed-delete" class="btn btn--ghost" type="button" hidden>
          Löschen
        </button>
        <button id="ed-done" class="btn btn--primary" type="button">Fertig</button>
      </div>
      <p id="ed-hint" class="toolbar__hint"></p>
    </div>

    <!-- Einstiegspunkt: Vite lädt von hier unseren JavaScript-Code. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
