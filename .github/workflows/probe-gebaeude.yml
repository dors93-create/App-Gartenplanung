# Einmaliger Test (kein Deployment): prüft den ALKIS-Dienst auf die Objektart
# Gebäude (für die automatische Bestandsaufnahme, Schritt 3b).
name: Probe ALKIS Gebaeude

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verfügbare ave-Typnamen (Capabilities)
        run: |
          BASE="https://www.wfs.nrw.de/geobasis/wfs_nw_alkis_vereinfacht"
          echo "########## alle ave:-Typnamen ##########"
          curl -s "$BASE?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities" \
            | grep -oE "ave:[A-Za-z]+" | sort -u

      - name: GetFeature ave:GebaeudeBauwerk (kleine Bbox in Köln)
        run: |
          BASE="https://www.wfs.nrw.de/geobasis/wfs_nw_alkis_vereinfacht"
          for TN in ave:GebaeudeBauwerk ave:Gebaeude ave:Bauwerk; do
            echo "########## TYPENAMES=$TN ##########"
            URL="$BASE?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=$TN&COUNT=1&SRSNAME=urn:ogc:def:crs:EPSG::25832&BBOX=356000,5644000,356200,5644200,urn:ogc:def:crs:EPSG::25832"
            curl -s "$URL" | head -25
            echo
          done
