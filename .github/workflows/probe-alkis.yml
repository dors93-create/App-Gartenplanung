# Einmaliger Test (kein Deployment): Prüft, ob der NRW-Kataster-Dienst (ALKIS)
# aus einer Browser-App nutzbar ist – Datenformat, Koordinatensystem, CORS.
# Wird nur manuell über "Run workflow" gestartet.
name: Probe ALKIS WFS

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GetCapabilities – Header (inkl. CORS) und Fähigkeiten
        run: |
          BASE="https://www.wfs.nrw.de/geobasis/wfs_nw_alkis_vereinfacht"
          echo "########## 1) Antwort-Header MIT Origin (CORS-Check) ##########"
          curl -s -D - -o /dev/null \
            -H "Origin: https://dors93-create.github.io" \
            "$BASE?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities" | tr -d '\r'
          echo
          echo "########## 2) Unterstützte outputFormats / CRS ##########"
          curl -s "$BASE?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities" \
            | grep -ioE "<(ows:)?Value>[^<]*</(ows:)?Value>|application/json|geojson" \
            | sort -u | head -120

      - name: GetFeature – JSON + EPSG:4326 testen
        run: |
          BASE="https://www.wfs.nrw.de/geobasis/wfs_nw_alkis_vereinfacht"
          echo "########## 3a) GetFeature OUTPUTFORMAT=application/json, BBOX in EPSG:25832 ##########"
          URL_JSON="$BASE?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=ave:Flurstueck&COUNT=1&SRSNAME=urn:ogc:def:crs:EPSG::25832&BBOX=356000,5644000,356100,5644100,urn:ogc:def:crs:EPSG::25832&OUTPUTFORMAT=application/json"
          echo "URL: $URL_JSON"
          curl -s -D - "$URL_JSON" | head -50
          echo
          echo "########## 3b) Gleiche Abfrage, aber SRSNAME=EPSG:4326 (Reprojektion?) ##########"
          URL_4326="$BASE?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=ave:Flurstueck&COUNT=1&SRSNAME=urn:ogc:def:crs:EPSG::4326&BBOX=356000,5644000,356100,5644100,urn:ogc:def:crs:EPSG::25832&OUTPUTFORMAT=application/json"
          curl -s "$URL_4326" | head -30
          echo
          echo "########## 3c) Standard-GML (zur Sicherheit) ##########"
          URL_GML="$BASE?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=ave:Flurstueck&COUNT=1&SRSNAME=urn:ogc:def:crs:EPSG::25832&BBOX=356000,5644000,356100,5644100,urn:ogc:def:crs:EPSG::25832"
          curl -s "$URL_GML" | head -40
