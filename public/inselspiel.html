    if ((k.typ === 'gras' || k.typ === 'wald') && !belegtAuf(x, y)) n++;
  });
  return n;
}

// Wasserkacheln im Umkreis (Fanggründe des Fischers)
function wasserImUmkreis(cx, cy, radius) {
  let n = 0;
  imUmkreis(cx, cy, radius, k => { if (k.typ === 'wasser' || k.typ === 'fluss') n++; });
  return n;
}

// Gesteinsvorkommen mit Restbestand im Umkreis finden
function steinKachelImUmkreis(cx, cy, radius) {
  let fund = null;
  imUmkreis(cx, cy, radius, (k) => {
    if (k.typ === 'berg' && k.stein > 0 && !fund) fund = k;
  });
  return fund;
}

// Eisenvorkommen mit Restbestand im Umkreis finden
function eisenKachelImUmkreis(cx, cy, radius) {
  let fund = null;
  imUmkreis(cx, cy, radius, (k) => { if (k.eisen > 0 && !fund) fund = k; });
  return fund;
}

// Goldvorkommen mit Restbestand im Umkreis finden (nur auf der Goldinsel)
function goldKachelImUmkreis(cx, cy, radius) {
  let fund = null;
  imUmkreis(cx, cy, radius, (k) => {
    if (k.golderz > 0 && !fund) fund = k;
  });
  return fund;
}

// Verläuft zwischen zwei Punkten ein Fluss ohne Brücke? (Sichtlinie)
function flussDazwischen(ax, ay, bx, by) {
  const schritte = Math.ceil(Math.hypot(bx - ax, by - ay) * 2);
  for (let i = 1; i < schritte; i++) {
    const x = Math.floor(ax + (bx - ax) * i / schritte);
    const y = Math.floor(ay + (by - ay) * i / schritte);
    const k = kachel(x, y);
    if (k && k.typ === 'fluss') {
      const b = belegtAuf(x, y);
      if (!b || b.typ !== 'bruecke') return true;
    }
  }
  return false;
}

// Hat dieser Spieler ein Kontor auf der angegebenen Insel?
function kontorAufInsel(sid, insel) {
  if (insel < 0) return false;
  for (const g of gebaeude)
    if (g.typ === 'kontor' && g.spieler === sid &&
        inselMarke[g.y * N + g.x] === insel) return true;
  return false;
}

// Ist ein Punkt an einen EIGENEN Marktplatz bzw. das Kontor angebunden?
function marktAnbindung(cx, cy, sid = ICH) {
  for (const g of gebaeude) {
    const def = GEBAEUDE[g.typ];
    if (!def.marktRadius || g.spieler !== sid) continue;
    const z = zentrum(g);
    if (Math.hypot(z.x - cx, z.y - cy) > wirkRadius(g)) continue;
    // Ein Fluss ohne Brücke unterbricht die Versorgung
    if (flussDazwischen(z.x, z.y, cx, cy)) continue;
    return true;
  }
  return false;
}

// Steht ein Gebäude dieses Typs (Kapelle, Schule, Theater …) in Reichweite?
function gebaeudeInReichweite(typ, cx, cy, sid = ICH) {
  for (const g of gebaeude) {
    if (g.typ !== typ || g.spieler !== sid) continue;
    const z = zentrum(g);
    if (Math.hypot(z.x - cx, z.y - cy) <= wirkRadius(g)) return true;
  }
  return false;
}

/* ---------- 5. BAUEN & ABREISSEN ------------------------------ */

// Diese Betriebe legen ihre Felder selbst an: rund um das Gebäude
// (3×3) werden freie Grasfelder zum Acker bzw. zur Weide.
// 6 eigene Felder = volle Leistung.
const FELD_FARMEN = new Set(['schaffarm', 'getreidefarm', 'zuckerrohr',
  'tabakplantage', 'gewuerzplantage', 'rinderfarm']);
const FELD_DEKO = {   // Farbe + Symbol der Felder je Farm
  schaffarm:       ['rgba(226,238,208,0.85)', '🐑'],
  getreidefarm:    ['rgba(238,222,150,0.85)', '🌾'],
  zuckerrohr:      ['rgba(210,232,176,0.85)', '🎋'],
  tabakplantage:   ['rgba(222,204,160,0.85)', '🍂'],
  gewuerzplantage: ['rgba(230,196,174,0.85)', '🌶️'],
  rinderfarm:      ['rgba(224,216,190,0.85)', '🐄'],
};

// Freie Grasfelder im 3×3 rund um den Bauplatz (als Kachel-Indizes)
function feldPlaetze(typ, ax, ay) {
  const liste = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const x = ax + dx, y = ay + dy;
    const k = kachel(x, y);
    if (k && k.typ === 'gras' && !belegtAuf(x, y)) liste.push(y * N + x);
  }
  return liste;
}

// Bei zweitem und weiteren Kontoren fällt eine Ausbaugebühr an
const KONTOR_AUSBAU = { gold: 1500, holz: 30, werkzeuge: 10 };
function gebKosten(typ, sid = ICH) {
  if (typ === 'kontor' && spieler[sid].kontor) return KONTOR_AUSBAU;
  return GEBAEUDE[typ].kosten;
}

// Der Anker (linke obere Ecke) liegt so, dass der Mauszeiger
// ungefähr in der Gebäudemitte ist.
function ankerVon(typ, tx, ty) {
  const def = GEBAEUDE[typ];
  return { x: tx - Math.floor((def.w - 1) / 2), y: ty - Math.floor((def.h - 1) / 2) };
}

// Prüft, ob ein Gebäude an dieser Stelle stehen darf.
function platzOK(typ, ax, ay, sid = ICH) {
  const def = GEBAEUDE[typ];
  if (spieler[sid].maxStufe < def.abStufe)
    return { ok: false, grund: 'Erst ab ' + STUFEN[def.abStufe].name + 'n verfügbar' };
  if (def.einmalig && gebaeude.some(g => g.typ === typ && g.spieler === sid))
    return { ok: false, grund: `${def.name}: gibt es nur einmal je Siedlung` };
  if (def.gunst && spieler[sid].gunst < def.gunst)
    return { ok: false, grund: `Dafür brauchst du ${def.gunst} 🏅 Gunst (du hast ${spieler[sid].gunst}) – halte deine Bürger zufrieden` };
  if (ax < 0 || ay < 0 || ax + def.w > N || ay + def.h > N)
    return { ok: false, grund: 'Außerhalb der Karte' };

  for (let y = ay; y < ay + def.h; y++) for (let x = ax; x < ax + def.w; x++) {
    const k = kachel(x, y);
    if (typ === 'bruecke') {
      if (k.typ !== 'fluss') return { ok: false, grund: 'Brücken stehen auf Flüssen' };
    } else {
      if (k.typ === 'wasser') return { ok: false, grund: 'Im Wasser kann nicht gebaut werden' };
      if (k.typ === 'fluss')  return { ok: false, grund: 'Auf Flüssen kann nur eine Brücke stehen' };
      if (k.typ === 'berg')   return { ok: false, grund: 'Auf Bergen kann nicht gebaut werden' };
    }
    if (belegtAuf(x, y)) return { ok: false, grund: 'Hier steht bereits ein Gebäude' };
  }

  // Ohne eigenes Kontor auf der Insel wird dort nicht gebaut
  if (typ !== 'kontor' && inselMarke) {
    const insel = inselMarke[ay * N + ax];
    if (!kontorAufInsel(sid, insel))
      return { ok: false, grund: 'Kein eigenes Kontor auf dieser Insel – zuerst besiedeln' };
  }
  if (def.brauchtKueste && !kuesteNah(ax, ay, def, typ === 'fischer'))
    return { ok: false, grund: typ === 'fischer'
      ? 'Muss an Küste oder Fluss liegen' : 'Muss an der Küste liegen' };
  if (FELD_FARMEN.has(typ) && feldPlaetze(typ, ax, ay).length === 0)
    return { ok: false, grund: 'Braucht freies Grasland rundherum für die Felder (3×3)' };

  const cx = ax + def.w / 2, cy = ay + def.h / 2;
  if (typ === 'kontor' && sid === ICH &&
      Math.hypot(schiff.x - cx, schiff.y - cy) > SIM.schiffBauRadius)
    return { ok: false, grund: 'Zu weit vom Schiff – segle zuerst vor diese Küste' };
  if (typ === 'holzfaeller' && baeumeImUmkreis(cx, cy, def.radius) < 0.5)
    return { ok: false, grund: 'Kein Wald in Reichweite' };
  if (typ === 'jagd' && baeumeImUmkreis(cx, cy, def.radius) < 0.5)
    return { ok: false, grund: 'Kein Wald in Reichweite' };
  if (typ === 'ziegelei' && !steinKachelImUmkreis(cx, cy, def.radius))
    return { ok: false, grund: 'Kein Gesteinsvorkommen (Berge) in der Nähe' };
  if (typ === 'eisenmine' && !eisenKachelImUmkreis(cx, cy, def.radius))
    return { ok: false, grund: 'Kein Eisenvorkommen 🔩 in der Nähe – such einen Berg' };
  if (typ === 'goldmine' && !goldKachelImUmkreis(cx, cy, def.radius))
    return { ok: false, grund: 'Kein Goldvorkommen 🪙 – das gibt es nur auf der Goldinsel!' };
  if (typ === 'goldschmiede' && !goldKachelImUmkreis(cx, cy, def.radius))
    return { ok: false, grund: 'Kein Goldvorkommen 🪙 – das gibt es nur auf der Goldinsel!' };
  if (typ === 'wohnhaus' && !marktAnbindung(cx, cy, sid))
    return { ok: false, grund: 'Außerhalb der Reichweite von Marktplatz/Kontor' };

  return { ok: true };
}

function kostenReichen(typ, sid = ICH) {
  const R = spieler[sid].res;
  for (const [ware, menge] of Object.entries(gebKosten(typ, sid)))
    if (R[ware] < menge) return false;
  return true;
}

function platziere(typ, tx, ty, sid = ICH) {
  // Als Gast wird nicht selbst gebaut, sondern der Wunsch gesendet
  if (istGast() && sid === ICH) return befehlSenden({ art: 'bau', typ, tx, ty });
  const { x: ax, y: ay } = ankerVon(typ, tx, ty);
  const pruefung = platzOK(typ, ax, ay, sid);
  if (!pruefung.ok) { if (sid === ICH) melden(pruefung.grund); return false; }
  if (!kostenReichen(typ, sid)) {
    if (sid === ICH) melden('Zu wenig Rohstoffe für dieses Gebäude');
    return false;
  }

  const def = GEBAEUDE[typ];
  const R = spieler[sid].res;
  for (const [ware, menge] of Object.entries(gebKosten(typ, sid))) R[ware] -= menge;
  if (def.gunst) spieler[sid].gunst -= def.gunst;

  const geb = {
    id: naechsteId++, typ, x: ax, y: ay, spieler: sid,
    hp: def.hp || 100, maxHp: def.hp || 100,   // für Belagerungen
    ausbau: 1,                                 // Ausbaustufe 1–3
    fortschritt: 0,   // Produktionsfortschritt in Sekunden
    eff: 0,           // Auslastung 0..1 (für das Info-Panel)
  };
  if (typ === 'wohnhaus') {
    Object.assign(geb, {
      stufe: 0,  // Index in STUFEN: 0 = Pioniere
      ew: 2, maxEw: STUFEN[0].maxEw,
      zufrieden: true, hungerZeit: 0, wachsZeit: 0, aufstiegZeit: 0,
    });
  }
  gebaeude.push(geb);
  bauStand++;

  // Kacheln belegen; Bäume auf dem Baufeld werden gerodet
  for (let y = ay; y < ay + def.h; y++) for (let x = ax; x < ax + def.w; x++) {
    belegt[y * N + x] = geb;
    const k = kachel(x, y);
    if (k.baum > 0) { k.baum = 0; kachelSchmutzig(x, y); }
  }

  // Farmen legen ihre Felder im 3×3 rundherum an (wie im klassischen Vorbild)
  if (FELD_FARMEN.has(typ)) {
    geb.felder = feldPlaetze(typ, ax, ay);
    for (const idx of geb.felder) belegt[idx] = geb;
  }

  // Ein Kontor auf einer bereits besiedelten Insel sorgt für Ärger
  if (typ === 'kontor' && inselMarke) {
    const insel = inselMarke[ay * N + ax];
    if (insel >= 0) for (const andere of spieler) {
      if (andere.id === sid) continue;
      const wohntDort = gebaeude.some(g => g.typ === 'kontor' && g.spieler === andere.id &&
                                           inselMarke[g.y * N + g.x] === insel);
      if (!wohntDort) continue;
      feindAendern(sid, andere.id, 22);
      if (sid === ICH)
        melden(`⚡ ${andere.name} duldet dein Kontor auf seiner Insel nur widerwillig – die Spannungen steigen`);
      else if (andere.id === ICH)
        melden(`⚡ ${spieler[sid].name} setzt sich auf deine Insel – das sorgt für Spannungen`);
    }
  }

  if (typ === 'kontor' && !spieler[sid].kontor) spieler[sid].kontor = geb;
  if (typ === 'kontor' && sid === ICH) {
    state.kontorGebaut = true;
    werkzeugWaehlen('zeiger');   // zurück zum Auswahl-Werkzeug (auch Cursor)
    document.getElementById('hinweis').style.display = 'none';
    melden('Kontor errichtet – jetzt Wohnhäuser und Betriebe bauen!');
    menueBauen(); // Menü neu aufbauen (Kontor zeigt jetzt die Ausbaugebühr)
  }
  return true;
}

function abreissen(geb) {
  if (istGast() && geb.spieler === ICH) return befehlSenden({ art: 'abriss', id: geb.id });
  const def = GEBAEUDE[geb.typ];
  // Kacheln freigeben
  for (let y = geb.y; y < geb.y + def.h; y++)
    for (let x = geb.x; x < geb.x + def.w; x++)
      belegt[y * N + x] = null;
  if (geb.felder) for (const idx of geb.felder) belegt[idx] = null;
  gebaeude = gebaeude.filter(g => g !== geb);
  bauStand++;

  // Die Hälfte der Kosten gibt es zurück
  const R = spieler[geb.spieler].res;
  for (const [ware, menge] of Object.entries(def.kosten))
    R[ware] += Math.floor(menge / 2);

  if (geb.typ === 'kontor' && geb.spieler === ICH) { state.kontorGebaut = false; menueBauen(); }
  if (state.auswahl === geb) { state.auswahl = null; panelZeigen(); }
  melden(def.name + ' abgerissen');
}

/* ---------- 5b. DIE KI-KONKURRENTEN ----------------------------
   Drei Computer-Spieler besiedeln eigene Inseln und wachsen dort so,
   wie du es auch tust: nach BEDARF. Jeder Zug fragt: Was fehlt gerade
   am dringendsten – Nahrung, eine Ware, ein Betrieb in der Kette, eine
   Schule für den Aufstieg, Wohnraum? Genau das wird gebaut, und zwar
   dort, wo es am besten passt. Wird die Insel zu eng, bauen sie ihre
   Betriebe aus und gründen ein Kontor auf einer weiteren Insel.
   --------------------------------------------------------------- */

const KI_TAKT = 18;       // Sekunden zwischen zwei Bauvorhaben (Grundwert)
// Reife: So viele gut gefüllte Häuser braucht die KI auf einer Stufe,
// bevor sie die nächste anpeilt (Pioniere → Siedler → Bürger → …).
// Dadurch wächst sie erst in die Breite, dann in die Höhe – wie eine
// echte Siedlung – und rennt dir nicht mit drei Palästen davon.
const KI_REIFE = [3, 12, 14, 16];
const KI_EIGENANTEIL = 0.7;   // so viel ihres Warenbedarfs soll sie vorher selbst herstellen
// Handelnde Naturen bauen etwas flotter als kriegerische
function kiTakt(sp) { return KI_TAKT * (0.85 + 0.6 * Math.max(0, Math.min(0.5, sp.aggression - 0.85))); }

// Was jeder Betrieb je Durchgang liefert – daraus rechnet die KI aus,
// wie viel sie von einer Ware selbst herstellen kann
const KI_ERTRAG = {
  fischer: ['nahrung', 1], jagd: ['nahrung', 1], rinderfarm: ['nahrung', 2], baeckerei: ['nahrung', 2],
  holzfaeller: ['holz', 1], ziegelei: ['ziegel', 1], eisenmine: ['eisenerz', 1], schmiede: ['werkzeuge', 1],
  schaffarm: ['wolle', 1], weberei: ['stoffe', 1], zuckerrohr: ['zuckerrohr', 1], brennerei: ['alkohol', 1],
  getreidefarm: ['getreide', 1], muehle: ['mehl', 1],
  tabakplantage: ['tabakblaetter', 1], tabakladen: ['tabak', 1], gewuerzplantage: ['gewuerze', 1],
  schneiderei: ['kleidung', 1], goldschmiede: ['schmuck', 1], waffenschmiede: ['waffen', 1],
};
// Die Warenketten der Bedürfnisse: Rohstoff-Betrieb → Verarbeiter
const KI_KETTEN = [
  { ware: 'stoffe',   roh: 'schaffarm',       werk: 'weberei' },
  { ware: 'alkohol',  roh: 'zuckerrohr',      werk: 'brennerei' },
  { ware: 'tabak',    roh: 'tabakplantage',   werk: 'tabakladen' },
  { ware: 'gewuerze', roh: 'gewuerzplantage', werk: null },
  { ware: 'kleidung', roh: null,              werk: 'schneiderei' },    // verarbeitet Stoffe
  { ware: 'schmuck',  roh: null,              werk: 'goldschmiede' },   // nur am Goldberg
];
// Welcher Ware dient ein Betrieb letztlich? (Die Tabakplantage dem Tabak …)
const KI_DIENT = { fischer: 'nahrung', jagd: 'nahrung', rinderfarm: 'nahrung',
  getreidefarm: 'nahrung', muehle: 'nahrung', baeckerei: 'nahrung' };
for (const k of KI_KETTEN) {
  if (k.roh) KI_DIENT[k.roh] = k.ware;
  if (k.werk) KI_DIENT[k.werk] = k.ware;
}
const KI_SAMMLER = new Set(['fischer', 'jagd', 'holzfaeller']);
const KI_VERARBEITER = new Set(['weberei', 'brennerei', 'muehle', 'baeckerei', 'tabakladen',
  'schneiderei', 'schmiede', 'waffenschmiede']);
const KI_OEFFENTLICH = new Set(['kapelle', 'schule', 'badehaus', 'theater']);

/* --- Inseln einschätzen und besiedeln --- */
// Was taugt eine Insel? Größe zählt am meisten, dazu Berge (Eisen,
// Ziegel) und Wald. Die zwei besten gelten als „Top-Inseln".
let inselInfoKarte = null, inselInfoListe = [];
function inselInfo() {
  if (inselInfoKarte === karte && inselInfoListe.length === inselGroessen.length) return inselInfoListe;
  const liste = inselGroessen.map(g => ({ groesse: g, berg: 0, wald: 0, eisen: 0, gold: 0, top: false }));
  for (let i = 0; i < N * N; i++) {
    const m = inselMarke[i];
    if (m < 0) continue;
    const k = karte[i];
    if (k.typ === 'berg') {
      liste[m].berg++;
      if (k.eisen > 0) liste[m].eisen++;
      if (k.golderz > 0) liste[m].gold++;
    } else if (k.baum > 0) liste[m].wald++;
  }
  for (const e of liste)
    e.wert = e.groesse + Math.min(e.berg, 12) * 6 + Math.min(e.wald, 150) * 0.5 + (e.eisen ? 60 : 0);
  const rang = liste.map((e, i) => i).sort((a, b) => liste[b].wert - liste[a].wert);
  if (rang.length > 1) liste[rang[0]].top = liste[rang[1]].top = true;
  inselInfoKarte = karte; inselInfoListe = liste;
  return liste;
}

// Inseln, auf denen schon jemand sitzt oder die ein anderer ansteuert
function inselnVergeben(sp) {
  const besetzt = new Set();
  for (const g of gebaeude)
    if (g.typ === 'kontor') besetzt.add(inselMarke[g.y * N + g.x]);
  for (const andere of spieler)
    if (andere !== sp && andere.zielInsel >= 0 && (!andere.kontor || andere.expedition)) besetzt.add(andere.zielInsel);
  return besetzt;
}

// Beste freie Insel für diesen Spieler. Damit du immer eine Top-Insel
// zur Wahl hast, lassen dir die Gegner eine frei, solange du selbst noch
// kein Kontor gebaut hast (im Spiel zu zweit: jedem Menschen eine).
function kiInselWahl(sp, wunsch) {
  const info = inselInfo(), besetzt = inselnVergeben(sp);
  const menschenOhneInsel = spieler.filter(x => !x.ki && !x.kontor && !x.besiegt).length;
  let topFrei = info.filter((e, i) => e.top && !besetzt.has(i)).length;
  let beste = -1, besterWert = -1;
  for (let i = 0; i < info.length; i++) {
    if (besetzt.has(i) || info[i].groesse < 60) continue;
    if (info[i].top && topFrei <= menschenOhneInsel) continue;      // für die Menschen aufgehoben
    // Top-Inseln sind gleichwertig gedacht: zwischen ihnen entscheidet der Zufall
    let wert = info[i].top && !wunsch ? 5000 + Math.random() * 100 : info[i].wert;
    if (wunsch === 'eisen' && info[i].eisen) wert += 400;
    if (wunsch === 'gold' && info[i].gold) wert += 800;
    if (wunsch === 'berg' && info[i].berg) wert += 300;
    if (wert > besterWert) { besterWert = wert; beste = i; }
  }
  return beste;
}

// Das Schiff der KI zu einer Insel schicken (true = Kurs gesetzt)
function kiSegeln(sp, insel) {
  const s = sp.schiff;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (inselMarke[y * N + x] !== insel) continue;
    const k = karte[y * N + x];
    if (k.typ !== 'strand' && k.typ !== 'gras') continue;      // nur am Ufer suchen
    const hafen = freiesFeldNeben(x + 0.5, y + 0.5, seeFrei);
    if (!hafen || Math.hypot(hafen.x - x - 0.5, hafen.y - y - 0.5) > 2.5) continue;
    const weg = wegSuche(Math.floor(s.x), Math.floor(s.y),
                         Math.floor(hafen.x), Math.floor(hafen.y), seeFrei);
    if (!weg) continue;
    sp.zielInsel = insel;
    s.pfad = weg;
    return true;
  }
  return false;
}

// Kontor in Ufernähe beim Schiff errichten – an der Stelle, von der aus
// sich am meisten Land versorgen lässt (gute Stadtmitte statt Landzunge)
function kiLanden(sp, insel) {
  const s = sp.schiff, def = GEBAEUDE.kontor;
  let beste = null, besteNote = -1;
  for (let dy = -11; dy <= 11; dy++) for (let dx = -11; dx <= 11; dx++) {
    const x = Math.floor(s.x) + dx, y = Math.floor(s.y) + dy;
    if (x < 0 || y < 0 || x >= N || y >= N || inselMarke[y * N + x] !== insel) continue;
    if (!platzOK('kontor', x, y, sp.id).ok) continue;
    let land = 0;
    imUmkreis(x + 1, y + 1, def.marktRadius, (k, kx, ky) => {
      if ((k.typ === 'gras' || k.typ === 'wald' || k.typ === 'strand') && !belegt[ky * N + kx]) land++;
    });
    if (land > besteNote) { besteNote = land; beste = { x, y }; }
  }
  return !!beste && platziere('kontor', beste.x, beste.y, sp.id);
}

// Erstbesiedlung: Insel aussuchen, hinsegeln, Kontor bauen
function kiSiedeln(sp) {
  const s = sp.schiff;
  if (!s || s.pfad.length) return;      // noch auf See

  // Ziel schon vergeben (jemand war schneller)? Dann neu wählen.
  if (sp.zielInsel >= 0 && inselnVergeben(sp).has(sp.zielInsel) && kiInselWahl(sp) >= 0) sp.zielInsel = -1;

  if (sp.zielInsel < 0) {
    const insel = kiInselWahl(sp);
    if (insel >= 0 && kiSegeln(sp, insel)) melden(`⛵ ${sp.name} sticht in See!`, 'ki-start-' + sp.id);
    return;
  }
  if (kiLanden(sp, sp.zielInsel)) melden(`⚓ ${sp.name} hat eine Insel besiedelt!`, 'ki-siedeln');
  else sp.zielInsel = -1;               // dort ging nichts – neues Ziel suchen
}

/* --- Lage: Was hat die KI, was kann sie herstellen? --- */
function kiLage(sp) {
  const L = { zahl: {}, kap: {}, haeuser: [], platz: 0, ew: 0, gebZahl: 0, liste: [] };
  for (const g of gebaeude) {
    if (g.spieler !== sp.id) continue;
    L.gebZahl++;
    L.liste.push(g);
    L.zahl[g.typ] = (L.zahl[g.typ] || 0) + 1;
    if (g.typ === 'wohnhaus') { L.haeuser.push(g); L.platz += g.maxEw; L.ew += g.ew; continue; }
    const e = KI_ERTRAG[g.typ];
    if (!e) continue;
    // Leistungsfähigkeit: Farmen nach Feldern und Boden, Sammler nach
    // ihrem Standort; Verarbeiter gelten als voll leistungsfähig
    let guete = 1;
    if (FELD_FARMEN.has(g.typ))
      guete = Math.min(1, (g.felder || []).length / 6) * bodenFaktor(inselMarke[g.y * N + g.x], g.typ);
    else if (KI_SAMMLER.has(g.typ)) guete = Math.max(0.25, g.eff);
    L.kap[g.typ] = (L.kap[g.typ] || 0) + e[1] * ausbauFaktor(g) * guete / GEBAEUDE[g.typ].dauer;
  }
  return L;
}

/* --- Umfeld: wo darf und wo sollte gebaut werden? --- */
function kiUmfeld(sp, L) {
  const U = { kontore: [], maerkte: [], inseln: new Set(), versorgt: null, eigene: L.liste };
  let x0 = N, x1 = 0, y0 = N, y1 = 0;
  for (const g of L.liste) {
    const def = GEBAEUDE[g.typ];
    if (g.typ === 'kontor') { U.kontore.push(g); U.inseln.add(inselMarke[g.y * N + g.x]); }
    if (def.marktRadius) U.maerkte.push({ z: zentrum(g), r: wirkRadius(g) });
    x0 = Math.min(x0, g.x); x1 = Math.max(x1, g.x + def.w);
    y0 = Math.min(y0, g.y); y1 = Math.max(y1, g.y + def.h);
  }
  // Suchfenster: die Siedlung plus ein Rand – so wächst sie Ring um Ring
  U.fenster = { x0: Math.max(0, x0 - 10), x1: Math.min(N - 1, x1 + 10),
                y0: Math.max(0, y0 - 10), y1: Math.min(N - 1, y1 + 10) };
  return U;
}

// Welche Kacheln liegen im Radius eines eigenen Marktes? (ohne Flussprüfung)
function kiVersorgung(U) {
  if (U.versorgt) return U.versorgt;
  const v = new Uint8Array(N * N);
  for (const m of U.maerkte) {
    const r = Math.ceil(m.r);
    for (let y = Math.max(0, Math.floor(m.z.y - r)); y <= Math.min(N - 1, Math.ceil(m.z.y + r)); y++)
      for (let x = Math.max(0, Math.floor(m.z.x - r)); x <= Math.min(N - 1, Math.ceil(m.z.x + r)); x++)
        if (Math.hypot(x + 0.5 - m.z.x, y + 0.5 - m.z.y) <= m.r) v[y * N + x] = 1;
  }
  return (U.versorgt = v);
}

// Ist dieses Land bebaubar und frei?
function kiLandFrei(U, x, y) {
  if (x < 0 || y < 0 || x >= N || y >= N) return false;
  const i = y * N + x, t = karte[i].typ;
  return (t === 'gras' || t === 'wald' || t === 'strand') && !belegt[i] && U.inseln.has(inselMarke[i]);
}

// Abstand zum nächsten eigenen Kontor
function kiKernAbstand(U, cx, cy) {
  let best = 1e9;
  for (const k of U.kontore) best = Math.min(best, Math.hypot(k.x + 1 - cx, k.y + 1 - cy));
  return best;
}

// Wie viele eigene Gebäude eines Typs stehen im Umkreis?
function kiNachbarn(U, typen, cx, cy, radius) {
  let n = 0;
  for (const g of U.eigene)
    if (typen.includes(g.typ) && Math.hypot(g.x + 0.5 - cx, g.y + 0.5 - cy) <= radius) n++;
  return n;
}

// Note für einen Bauplatz (höher = besser, -Infinity = ungeeignet).
// Hier steckt, was eine Siedlung „organisch" macht: Häuser rücken an den
// Markt und aneinander, Felder liegen draußen auf gutem Boden, Fischer
// am fischreichen Ufer, Holzfäller im dichten Wald.
function kiPlatzNote(sp, typ, x, y, U) {
  const def = GEBAEUDE[typ];
  const cx = x + def.w / 2, cy = y + def.h / 2;
  const kern = kiKernAbstand(U, cx, cy);
  const v = kiVersorgung(U);
  const imMarkt = v[y * N + x] === 1;

  if (typ === 'wohnhaus') {
    if (!imMarkt) return -Infinity;
    // nächster Markt, der ohne Fluss dazwischen erreichbar ist
    let markt = 1e9;
    for (const m of U.maerkte) {
      const dist = Math.hypot(m.z.x - cx, m.z.y - cy);
      if (dist <= m.r && dist < markt && !flussDazwischen(m.z.x, m.z.y, cx, cy)) markt = dist;
    }
    if (markt > 1e8) return -Infinity;
    const k = karte[y * N + x];
    let note = 20 - markt * 0.6 + Math.min(3, kiNachbarn(U, ['wohnhaus'], cx, cy, 1.6)) * 1.4;
    if (kuesteNah(x, y, def)) note -= 2.5;         // das Ufer bleibt für Fischer und Werft
    if (k.baum > 0.4) note -= 1.5;                 // Wald lieber stehen lassen
    return note;
  }
  if (typ === 'fischer') {
    const eff = Math.min(1, wasserImUmkreis(cx, cy, def.radius) / 6);
    return eff < 0.8 ? -Infinity : 10 * eff - kern * 0.15;
  }
  if (typ === 'holzfaeller' || typ === 'jagd') {
    const wald = baeumeImUmkreis(cx, cy, def.radius);
    if (wald < (typ === 'jagd' ? 4.5 : 3.5)) return -Infinity;
    return Math.min(wald, 9) - kern * 0.2 - kiNachbarn(U, ['holzfaeller', 'jagd'], cx, cy, 5) * 3 - (imMarkt ? 2 : 0);
  }
  if (FELD_FARMEN.has(typ)) {
    const felder = feldPlaetze(typ, x, y).length;
    if (felder < (U.wenigFelder ? 3 : 5)) return -Infinity;
    return felder * 2 + 5 * bodenFaktor(inselMarke[y * N + x], typ) - kern * 0.25 - (imMarkt ? 5 : 0);
  }
  if (typ === 'marktplatz') {
    // Ein neuer Markt soll möglichst viel NEUES Bauland erschließen und
    // an die Siedlung anschließen
    let neu = 0, alt = 0;
    const r = def.marktRadius;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const kx = Math.floor(cx) + dx, ky = Math.floor(cy) + dy;
      if (Math.hypot(kx + 0.5 - cx, ky + 0.5 - cy) > r || !kiLandFrei(U, kx, ky)) continue;
      if (v[ky * N + kx]) alt++; else neu++;
    }
    if (neu < 30 || alt < 4) return -Infinity;
    return neu - kern * 0.4;
  }
  if (KI_OEFFENTLICH.has(typ)) {
    // dorthin, wo die meisten Häuser noch ohne dieses Gebäude sind
    let gewinn = 0;
    for (const g of U.eigene) {
      if (g.typ !== 'wohnhaus' || Math.hypot(g.x + 0.5 - cx, g.y + 0.5 - cy) > def.radius) continue;
      if (!gebaeudeInReichweite(typ, g.x + 0.5, g.y + 0.5, sp.id)) gewinn++;
    }
    if (!gewinn) return -Infinity;
    return gewinn * 3 - kern * 0.1;
  }
  if (typ === 'wachturm') return 10 - Math.abs(kern - 3.5);
  if (typ === 'kaserne' || typ === 'werft') return 10 - kern * 0.3;
  if (KI_VERARBEITER.has(typ) || def.gunst)
    return 10 - kern * 0.3 - (imMarkt && !def.gunst ? 3 : 0) - (kuesteNah(x, y, def) ? 2 : 0);
  // Minen, Ziegelei, Goldschmiede: ob das Vorkommen reicht, prüft platzOK
  return 10 - kern * 0.2;
}

// Bester Bauplatz für einen Gebäudetyp: alle Kacheln im Umfeld der
// Siedlung benoten und die besten der Reihe nach wirklich prüfen
function kiBauplatz(sp, typ, U) {
  if (!U) U = kiUmfeld(sp, kiLage(sp));
  const def = GEBAEUDE[typ], f = U.fenster;
  const schritt = typ === 'marktplatz' ? 2 : 1;
  const beste = [];
  for (let y = f.y0; y <= f.y1; y += schritt) for (let x = f.x0; x <= f.x1; x += schritt) {
    let frei = true;
    for (let dy = 0; dy < def.h && frei; dy++) for (let dx = 0; dx < def.w; dx++)
      if (!kiLandFrei(U, x + dx, y + dy)) { frei = false; break; }
    if (!frei) continue;
    const note = kiPlatzNote(sp, typ, x, y, U);
    if (note === -Infinity) continue;
    if (beste.length < 10) beste.push({ x, y, note });
    else {
      let schlecht = 0;
      for (let i = 1; i < 10; i++) if (beste[i].note < beste[schlecht].note) schlecht = i;
      if (note > beste[schlecht].note) beste[schlecht] = { x, y, note };
    }
  }
  beste.sort((a, b) => b.note - a.note);
  for (const k of beste)
    if (platzOK(typ, k.x, k.y, sp.id).ok) return k;
  return null;
}

/* --- Wünsche: Was fehlt am dringendsten? --- */
// Liefert eine Liste von Bauvorhaben, das wichtigste zuerst. Jedes ist
// { typ } für einen Neubau oder { ausbau: gebäude } für einen Ausbau.
// „sparen" heißt: Fehlt dafür das Geld, wird nichts Unwichtigeres gebaut.
function kiWuensche(sp, L) {
  const R = sp.res, B = sp._bedarf || {}, W = [];
  const hat = typ => L.zahl[typ] || 0;
  const kap = typ => L.kap[typ] || 0;
  const will = (typ, opt) => W.push(Object.assign({ typ }, opt || {}));
  const stufe = sp.maxStufe;

  // 1. Nahrung: Fischer, Jäger, Rinder und die Brotkette
  const brot = Math.min(kap('baeckerei'), 2 * kap('muehle'), 2 * kap('getreidefarm'));
  const essenKann = kap('fischer') + kap('jagd') + kap('rinderfarm') + brot;
  const essenSoll = (B.nahrung || 0) * 1.25 + 0.12;
  if (essenKann < essenSoll || sp.hunger) {
    will('fischer');
    will('jagd');
    if (stufe >= 2) will('rinderfarm');
    if (stufe >= 1) {
      // Brotkette im Gleichgewicht halten: Farm → Mühle → Bäckerei
      if (kap('getreidefarm') <= kap('muehle')) will('getreidefarm');
      else if (kap('muehle') * 2 <= kap('baeckerei')) will('muehle');
      else will('baeckerei');
    }
  }

  // 2. Bauholz
  if (!hat('holzfaeller') || (R.holz < 25 && kap('holzfaeller') < 0.14 + L.gebZahl * 0.004 && hat('holzfaeller') < 8))
    will('holzfaeller');

  // 3. Waren der Bedürfnisse. Je Kette wird das schwächere Glied
  //    verstärkt. Drei Dringlichkeiten: 'mangel' (das Lager ist leer),
  //    'eigen' (die eigene Herstellung deckt weniger als den Eigenanteil)
  //    und 'vorsorge' (knapp bemessen).
  let unterversorgt = false;
  const kettenWunsch = art => {
    for (const k of KI_KETTEN) {
      let bedarf = B[k.ware] || 0;
      if (k.ware === 'stoffe') bedarf += kap('schneiderei');      // Schneider brauchen Stoffe
      if (bedarf <= 0) continue;
      const roh = k.roh ? kap(k.roh) : Infinity, werk = k.werk ? kap(k.werk) : Infinity;
      const kann = Math.min(roh, werk);
      const unmoeglich = k.ware === 'schmuck' && sp.fehlt === 'gold';
      if (kann < bedarf * KI_EIGENANTEIL && !unmoeglich) unterversorgt = true;
      const passt = art === 'mangel' ? !!sp.mangel[k.ware]
                  : art === 'eigen'  ? kann < bedarf * KI_EIGENANTEIL
                  : kann < bedarf * 1.2;
      if (!passt) continue;
      if (k.roh && roh <= werk) will(k.roh, { kette: k.ware });
      else if (k.werk) will(k.werk, { kette: k.ware });
    }
  };
  kettenWunsch('mangel');
  kettenWunsch('eigen');

  // 4. Aufstieg: Erst wenn genug Häuser reif sind und die Siedlung sich
  //    weitgehend selbst versorgt, kommen die Betriebe für die Waren der
  //    nächsten Stufe und danach Kapelle, Schule, Badehaus oder Theater.
  for (let s = 0; s < STUFEN.length - 1; s++) {
    const bereit = L.haeuser.filter(h => h.stufe === s && h.ew >= Math.ceil(STUFEN[s].maxEw * 0.75));
    if (bereit.length < KI_REIFE[s] || (s > 0 && unterversorgt)) continue;
    const n = STUFEN[s + 1];
    for (const k of KI_KETTEN) {
      if (!(k.ware in n.brauch) || (k.ware in STUFEN[s].brauch)) continue;   // nur die NEUEN Waren
      if (k.roh && !hat(k.roh)) will(k.roh, { kette: k.ware });
      else if (k.werk && !hat(k.werk)) will(k.werk, { kette: k.ware });
    }
    const ohne = bereit.filter(h => !gebaeudeInReichweite(n.gebaeudeNah, h.x + 0.5, h.y + 0.5, sp.id)).length;
    if (ohne >= Math.max(1, bereit.length * 0.3) && GEBAEUDE[n.gebaeudeNah].abStufe <= stufe)
      will(n.gebaeudeNah, { sparen: true });
  }

  // 5. Werkzeug aus eigenem Eisen (sonst wird zugekauft)
  if (stufe >= 1 && hat('wohnhaus') >= 8) {
    if (!hat('eisenmine')) will('eisenmine', { rohstoff: 'eisen' });
    else if (!hat('schmiede')) will('schmiede');
  }
  // … und Ziegel für die höheren Häuser
  if (stufe >= 1 && !hat('ziegelei') && hat('wohnhaus') >= 10) will('ziegelei', { rohstoff: 'berg' });
  else if (stufe >= 2 && R.ziegel < 15 && hat('ziegelei') < 3 && kap('ziegelei') < 0.3) will('ziegelei', { rohstoff: 'berg' });

  // 6. Wohnraum: Neue Häuser, sobald die vorhandenen sich füllen und es
  //    den Leuten gut geht. Fehlt der Platz, kommt ein neuer Markt.
  const fuell = L.platz ? L.ew / L.platz : 1;
  const mangelZahl = Object.keys(sp.mangel).length;
  if (L.haeuser.length < 5 || (fuell >= 0.68 && !sp.hunger && mangelZahl <= 1))
    will('wohnhaus', { sonst: 'marktplatz' });

  // 7. Vorsorge: Ketten verstärken, bevor der Mangel da ist
  kettenWunsch('vorsorge');

  // 8. Denkmäler, wenn die Bürger Gunst gewähren
  if (sp.gunst >= 1 && stufe >= 1 && !hat('statue')) will('statue');
  if (sp.gunst >= 2 && stufe >= 2 && !hat('ruhmeshalle')) will('ruhmeshalle');
  if (sp.gunst >= 3 && stufe >= 3 && !hat('triumphbogen')) will('triumphbogen');

  // 9. Ausbau: Mit vollem Geldbeutel wird verbessert, was schon steht
  const ausbau = kiAusbauZiel(sp, L);
  if (ausbau) W.push({ ausbau });
  return W;
}

// Welches Gebäude lohnt den Ausbau am meisten?
function kiAusbauZiel(sp, L) {
  const R = sp.res;
  if (R.gold < (sp.inselVoll ? 1200 : 2500)) return null;
  let ziel = null, bester = -1e9;
  for (const g of L.liste) {
    const st = g.ausbau || 1;
    if (st >= AUSBAU_MAX) continue;
    const def = GEBAEUDE[g.typ];
    // Kosten müssen locker bezahlbar sein
    const kosten = ausbauKosten(g);
    let bezahlbar = true;
    for (const [ware, menge] of Object.entries(kosten))
      if (R[ware] < menge + (ware === 'gold' ? (sp.inselVoll ? 500 : 1500) : 4)) { bezahlbar = false; break; }
    if (!bezahlbar) continue;
    let wert = -st * 10;                                   // niedrige Stufen zuerst
    const voll = !!sp.inselVoll;
    if (def.marktRadius) wert += voll ? 40 : 6;            // größerer Radius = neues Bauland
    else if (g.typ === 'wohnhaus') {
      // Lieber neue Häuser bauen als die vorhandenen aufzustocken: eine Stadt
      // aus vielen Häusern, nicht aus wenigen Türmen. Aufgestockt wird erst,
      // wenn die Insel voll ist oder die Stadt schon groß.
      if (!voll && L.haeuser.length < 45) continue;
      wert += (voll ? 24 : 8) + g.stufe * 4 + (g.ew >= g.maxEw ? 8 : 0);
    }
    else if (KI_DIENT[g.typ]) wert += sp.mangel[KI_DIENT[g.typ]] ? 30 : (voll ? 10 : 2);
    else if (KI_ERTRAG[g.typ]) wert += voll ? 6 : 1;
    else if (KI_OEFFENTLICH.has(g.typ)) wert += voll ? 22 : 0;
    else if (g.typ === 'kaserne' || g.typ === 'wachturm') wert += 1;
    else wert -= 20;
    if (wert > bester) { bester = wert; ziel = g; }
  }
  return ziel;
}

/* --- Handel: Engpässe überbrücken, Überschüsse zu Geld machen --- */
function kiHandel(sp, L) {
  const R = sp.res, B = sp._bedarf || {};
  // Ein Polster bleibt fürs Bauen – erst recht, wenn auf etwas gespart wird
  const polster = Math.max(500 + L.haeuser.length * 25, sp.sparGold || 0);
  const kaufen = (ware, menge, wichtig) => {
    if (!PREISE[ware] || menge <= 0) return;
    // Bei Wucherpreisen wird nur das Nötigste gekauft
    if (!wichtig && markt[ware] > 3 && R.gold < 8000) return;
    while (menge > 0 && R.gold - kaufpreis(ware) * menge < (wichtig ? 100 : polster)) menge -= 10;
    if (menge > 0) handelAusfuehren(sp, ware, Math.min(menge, Math.floor(sp.kontingent)));
  };

  // Verbrauchswaren: Vorrat für etwa zwei Minuten anstreben
  for (const [ware, bedarf] of Object.entries(B)) {
    if (bedarf <= 0) continue;
    const ziel = Math.max(12, bedarf * 120);
    if (R[ware] < ziel * 0.35)
      kaufen(ware, Math.min(40, Math.ceil((ziel * 0.7 - R[ware]) / 10) * 10), ware === 'nahrung');
  }
  // Für den Aufstieg müssen die Waren der nächsten Stufe im Lager liegen.
  // Gekauft wird der Grundstock aber erst, wenn die eigene Herstellung
  // steht – oder die Ware auf den eigenen Inseln gar nicht herstellbar ist.
  for (let s = 0; s < STUFEN.length - 1; s++) {
    const bereit = L.haeuser.filter(h => h.stufe === s && h.ew >= Math.ceil(STUFEN[s].maxEw * 0.75)).length;
    if (bereit < KI_REIFE[s]) continue;
    const n = STUFEN[s + 1];
    for (const ware of Object.keys(n.brauch)) {
      if (R[ware] >= 3) continue;
      const k = KI_KETTEN.find(x => x.ware === ware);
      const da = typ => !typ || L.zahl[typ] > 0 || GEBAEUDE[typ].abStufe > sp.maxStufe;
      const steht = !k || (da(k.roh) && da(k.werk));
      const unmoeglich = ware === 'schmuck' && sp.fehlt === 'gold';
      if (steht || (unmoeglich && R.gold > 5000)) kaufen(ware, 10, false);
    }
    for (const [ware, menge] of Object.entries(n.material || {})) if (R[ware] < menge * 3) kaufen(ware, 10, false);
  }
  // Wird auf ein Gebäude gespart, kommen dessen Baustoffe gezielt ins Lager
  if (sp.sparTyp) {
    for (const [ware, menge] of Object.entries(GEBAEUDE[sp.sparTyp].kosten)) {
      if (ware === 'gold' || R[ware] >= menge) continue;
      const fehlt = Math.ceil((menge - R[ware]) / 10) * 10;
      if (R.gold > kaufpreis(ware) * fehlt + 150 && sp.kontingent >= fehlt) handelAusfuehren(sp, ware, fehlt);
    }
  }
  // Baustoffe
  if (R.holz < 10) kaufen('holz', 20, true);
  if (R.werkzeuge < 5) kaufen('werkzeuge', 10, true);
  if (sp.maxStufe >= 1 && R.ziegel < 8 && !(L.zahl.ziegelei > 0)) kaufen('ziegel', 10, false);
  // Rüstung: Waffen für Schiffe und Soldaten
  if (sp.ruestet && R.waffen < 12) kaufen('waffen', 10, false);
  // Rohstoffe für Verarbeiter, deren Zulieferer (noch) fehlt
  if ((L.zahl.schmiede || L.zahl.waffenschmiede) && R.eisenerz < 4 && !(L.zahl.eisenmine > 0)) kaufen('eisenerz', 10, false);

  // Überschüsse verkaufen
  for (const ware of Object.keys(PREISE)) {
    const halten = 70 + (B[ware] || 0) * 400 +
      (ware === 'holz' || ware === 'ziegel' || ware === 'werkzeuge' ? 60 : 0) +
      (ware === 'waffen' && sp.ruestet ? 40 : 0);
    if (R[ware] > halten + 25 && sp.kontingent >= 20) handelAusfuehren(sp, ware, -20);
  }
}

/* --- Bauen: den dringendsten Wunsch erfüllen, der sich erfüllen lässt --- */
function kiBauen(sp, L) {
  const R = sp.res;
  const U = kiUmfeld(sp, L);
  sp.sparGold = 0; sp.sparTyp = null;
  let hausPlatz = true;

  // Schreibt die KI rote Zahlen, baut sie nur noch, was Geld oder Essen bringt
  const klamm = (sp.bilanz || 0) < 0 && R.gold < 2500;

  for (const w of kiWuensche(sp, L)) {
    if (w.ausbau) { if (!klamm && ausbauen(w.ausbau)) return true; continue; }
    const def = GEBAEUDE[w.typ];
    if (sp.maxStufe < def.abStufe) continue;
    if (klamm && w.typ !== 'wohnhaus' && w.typ !== 'fischer' && w.typ !== 'jagd') continue;
    if (!kostenReichen(w.typ, sp.id)) {
      // Auf Wichtiges wird gespart: nichts Unwichtigeres dazwischenschieben
      if (w.sparen) { sp.sparGold = (def.kosten.gold || 0) + 200; sp.sparTyp = w.typ; return false; }
      continue;
    }
    let platz = kiBauplatz(sp, w.typ, U);
    let typ = w.typ;
    if (!platz && FELD_FARMEN.has(typ)) {      // kein gutes Ackerland mehr: kleinere Felder genügen
      U.wenigFelder = true;
      platz = kiBauplatz(sp, typ, U);
      U.wenigFelder = false;
    }
    if (!platz && w.sonst) {              // kein Platz fürs Haus → neuer Markt
      hausPlatz = false;
      if (kostenReichen(w.sonst, sp.id)) { platz = kiBauplatz(sp, w.sonst, U); typ = w.sonst; }
    }
    if (!platz) {
      if (w.rohstoff) sp.fehlt = w.rohstoff;      // das gibt es auf dieser Insel nicht
      if (w.kette === 'schmuck') sp.fehlt = 'gold';
      // Kein Platz für einen weiteren Betrieb: den kleinsten vorhandenen ausbauen
      if ((w.kette || KI_DIENT[w.typ]) && !klamm) {
        let klein = null;
        for (const g of L.liste)
          if (g.typ === w.typ && (g.ausbau || 1) < AUSBAU_MAX && (!klein || (g.ausbau || 1) < (klein.ausbau || 1))) klein = g;
        if (klein && ausbauen(klein)) return true;
        if (klein) sp.eng = (sp.eng || 0) + 0.5;  // nicht einmal das ging: es wird eng
      }
      continue;
    }
    if (platziere(typ, platz.x, platz.y, sp.id)) {
      if (typ === 'wohnhaus' || typ === 'marktplatz') { sp.eng = 0; sp.inselVoll = false; }
      return true;
    }
  }
  // Weder Haus noch Markt gefunden: die Insel ist voll. Ab jetzt wächst
  // die Siedlung nach oben – Märkte, Häuser und Betriebe werden ausgebaut.
  if (!hausPlatz) { sp.eng = (sp.eng || 0) + 1; sp.inselVoll = true; }
  return false;
}

/* --- Expedition: ein Kontor auf einer weiteren Insel --- */
// Wird die Heimat zu eng oder fehlt dort ein Rohstoff, schickt die KI
// ihr Schiff los. Angekommen, gründet sie ein zweites (drittes) Kontor.
function kiExpedition(sp, L) {
  const s = sp.schiff, R = sp.res, jetzt = state.spielzeit;
  if (sp.expedition) {
    if (s.pfad.length) return;                               // noch unterwegs
    if (inselnVergeben(sp).has(sp.expedition.insel)) {       // jemand war schneller
      sp.expedition = null; sp.zielInsel = -1; return;
    }
    if (!kostenReichen('kontor', sp.id)) {                   // am Ziel, aber das Material fehlt noch
      if (R.holz < KONTOR_AUSBAU.holz && R.gold > 600) handelAusfuehren(sp, 'holz', 10);
      if (R.werkzeuge < KONTOR_AUSBAU.werkzeuge && R.gold > 600) handelAusfuehren(sp, 'werkzeuge', 10);
      return;
    }
    if (kiLanden(sp, sp.expedition.insel))
      melden(`⚓ ${sp.name} gründet ein Kontor auf einer weiteren Insel`, 'ki-expedition');
    sp.expedition = null; sp.eng = 0; sp.fehlt = null;
    sp.expeditionZuletzt = jetzt;
    return;
  }
  const kontore = L.zahl.kontor || 0;
  if (kontore >= (sp.maxStufe >= 3 ? 3 : 2) || jetzt - (sp.expeditionZuletzt || 0) < 480) return;
  const grund = (sp.eng || 0) >= 4 ? 'platz' : (sp.fehlt && sp.maxStufe >= 2 && L.haeuser.length >= 20 ? sp.fehlt : null);
  if (!grund || R.gold < KONTOR_AUSBAU.gold + 1500) return;
  const insel = kiInselWahl(sp, grund);
  if (insel < 0) { sp.eng = 0; sp.expeditionZuletzt = jetzt; return; }   // nichts frei – später wieder schauen
  if (kiSegeln(sp, insel)) sp.expedition = { insel };
  else sp.expeditionZuletzt = jetzt;
}

// Pleite: verkaufen, was nicht gebraucht wird, und im Frieden das Heer entlassen
function kiNotlage(sp) {
  const R = sp.res, B = sp._bedarf || {};
  for (const ware of Object.keys(PREISE))
    if (R[ware] > 15 + (B[ware] || 0) * 60 && sp.kontingent >= 10) handelAusfuehren(sp, ware, -10);
  for (let b = 0; b < spieler.length; b++) sp.embargo[b] = false;
  if (!spieler.some(g => g.id !== sp.id && imKriegMit(sp.id, g.id)))
    for (const t of kiHeere(sp)) truppAktion(t, 'aufloesen');
}

/* --- Diplomatie und Kriegsführung der KI ---
   Jede KI hat ein eigenes Wesen: Isabella handelt lieber, Wilhelm wägt
   ab, Giovanna sucht den Streit. Daraus ergeben sich alle Schwellen.
   Der Weg in den Krieg ist immer derselbe und für dich sichtbar:
   Argwohn → Bestechung/Embargo → Ultimatum → Kriegserklärung → Angriff. */
function kiWesen(sp) {
  const a = Math.max(0, Math.min(0.5, sp.aggression - 0.85));   // 0 friedlich … 0,5 kriegerisch
  return {
    neidBis:    56 + 20 * a,      // so weit treibt bloßer Neid die Stimmung
    grollMax:   a < 0.15 ? 15 : 30,   // … und so viel legt jahrelanger Groll noch drauf
    wirtschaft: 60 - 20 * a,      // ab hier greift die KI zu Sanktionen
    krieg:      94 - 40 * a,      // ab hier stellt sie ein Ultimatum
    schiffe:    2 + Math.round(4 * a),          // Größe der Flotte im Frieden
    muede:      420 + 480 * a,                  // Sekunden bis zur Kriegsmüdigkeit
    art: a < 0.15 ? 'friedliche Händlerin' : a < 0.4 ? 'kühler Rechner' : 'streitlustige Eroberin',
  };
}

function kiFlotten(sp) { return truppen.filter(t => t.spieler === sp.id && t.art === 'flotte'); }
function kiHeere(sp)   { return truppen.filter(t => t.spieler === sp.id && t.art === 'heer'); }

// Wasserfeld in der Nähe eines Gebäudes (Ankerplatz)
function wasserFeldNeben(geb) {
  const z = zentrum(geb);
  return freiesFeldNeben(z.x, z.y, seeFrei);
}

// Heimathafen der KI: das Wasser vor ihrer Werft, sonst vor dem Kontor
function kiHeimat(sp) {
  const werft = gebaeude.find(g => g.typ === 'werft' && g.spieler === sp.id);
  return wasserFeldNeben(werft || sp.kontor);
}

// Alle Wasserfelder, die eine Flotte erreichen kann (ein einziger Flutlauf –
// viel billiger, als für jedes mögliche Ziel einzeln einen Weg zu suchen)
function seeErreichbar(t) {
  const marke = new Uint8Array(N * N);
  const start = Math.floor(t.y) * N + Math.floor(t.x);
  if (!seeFrei(start)) return marke;
  const schlange = [start];
  marke[start] = 1;
  for (let kopf = 0; kopf < schlange.length; kopf++) {
    const j = schlange[kopf], x = j % N, y = (j / N) | 0;
    for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + ax, ny = y + ay;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const ni = ny * N + nx;
      if (!marke[ni] && seeFrei(ni)) { marke[ni] = 1; schlange.push(ni); }
    }
  }
  return marke;
}

// Lohnendes Ziel für eine KI-Flotte: ein feindliches Gebäude in Reichweite
// der Schiffsgeschütze. Kleine Flotten meiden Wachtürme und überfallen
// lieber Fischer, Werften und ungeschützte Häuser am Ufer.
function kiAngriffsziel(gegner, flotte, landungGeplant) {
  const erreichbar = seeErreichbar(flotte);
  const tuerme = gebaeude.filter(g => g.typ === 'wachturm' && g.spieler === gegner.id);
  const stark = flotte.schiffe >= 4;
  let bestes = null, besterWert = -1e9;
  for (const g of gebaeude) {
    if (g.spieler !== gegner.id) continue;
    // Ein sturmreifes Kontor können Schiffe nicht weiter beschädigen
    if (g.typ === 'kontor' && g.hp <= g.maxHp * KRIEG.sturmreif + 0.5) continue;
    const def = GEBAEUDE[g.typ];
    const reichweite = KRIEG.schussweite - 0.05;
    let anker = null, ankerD = 1e9;
    for (let y = g.y - 4; y < g.y + def.h + 4; y++) for (let x = g.x - 4; x < g.x + def.w + 4; x++) {
      if (x < 0 || y < 0 || x >= N || y >= N || !erreichbar[y * N + x]) continue;
      if (abstandZumGrundriss(g, x + 0.5, y + 0.5) > reichweite) continue;
      const dist = Math.hypot(x + 0.5 - flotte.x, y + 0.5 - flotte.y);
      if (dist < ankerD) { ankerD = dist; anker = { x, y }; }
    }
    if (!anker) continue;
    let gefahr = 0;
    for (const tu of tuerme) {
      const tz = zentrum(tu);
      if (Math.hypot(tz.x - (anker.x + 0.5), tz.y - (anker.y + 0.5)) <= wirkRadius(tu)) gefahr++;
    }
    let wert = g.typ === 'kontor' ? (landungGeplant ? 90 : 30) : g.typ === 'werft' ? 70 : g.typ === 'fischer' ? 45
             : g.typ === 'wachturm' ? 20 : g.typ === 'wohnhaus' ? 35 + (g.stufe || 0) * 5 : 40;
    wert -= gefahr * (stark ? 12 : 60);
    wert -= ankerD * 0.25;
    wert += Math.random() * 10;
    if (wert > besterWert) { besterWert = wert; bestes = { geb: g, anker }; }
  }
  return bestes;
}

// Nimmt eine KI ein Friedensangebot an bzw. sucht sie selbst den Frieden?
function kiWillFrieden(ki, gegnerId) {
  const dauer = state.spielzeit - kriegMatrix[ki.id][gegnerId];
  if (dauer < 150) return false;                         // erst einmal wird gekämpft
  if (dauer > kiWesen(ki).muede) return true;            // kriegsmüde
  if (wehrkraft(ki.id) < wehrkraft(gegnerId) * 0.6) return true;   // klar unterlegen
  if (ki.res.gold < 400) return true;                    // die Kasse ist leer
  return false;
}

// 1. Rüstung: Wehrbauten, Flotte, Heer – je nach Lage und Wesen
function kiRuesten(sp, wesen, bedroht, imKrieg) {
  const R = sp.res;
  const zahl = typ => gebaeude.reduce((n, g) => n + (g.typ === typ && g.spieler === sp.id ? 1 : 0), 0);
  const ruesten = bedroht || sp.aggression >= 1.05;
  sp.ruestet = ruesten && sp.maxStufe >= 2;      // dann kauft der Handel auch Waffen

  const wunsch = [];
  if (sp.maxStufe >= 1 && zahl('wachturm') < (imKrieg ? 2 : 1)) wunsch.push('wachturm');
  if (ruesten && sp.maxStufe >= 1 && !zahl('waffenschmiede')) wunsch.push('waffenschmiede');
  if (ruesten && sp.maxStufe >= 2 && !zahl('werft')) wunsch.push('werft');
  if (ruesten && sp.maxStufe >= 2 && !zahl('kaserne')) wunsch.push('kaserne');
  for (const typ of wunsch) {
    if (!kostenReichen(typ, sp.id) || R.gold < (GEBAEUDE[typ].kosten.gold || 0) + 600) continue;
    const platz = kiBauplatz(sp, typ);
    if (platz && platziere(typ, platz.x, platz.y, sp.id)) return;
  }

  // Flotte: im Frieden eine kleine Schutzflotte, bei Gefahr und im Krieg mehr
  const werft = gebaeude.find(g => g.typ === 'werft' && g.spieler === sp.id);
  const schiffe = kiFlotten(sp).reduce((n, f) => n + f.schiffe, 0);
  const soll = wesen.schiffe + (bedroht ? 1 : 0) + (imKrieg ? 2 : 0);
  if (werft && schiffe < soll && R.gold > SCHIFF_KOSTEN.gold + (imKrieg ? 1500 : 2500))
    schiffBauen(werft);

  // Heer: nur wenn es ernst wird – Soldaten kosten Einwohner
  const kaserne = gebaeude.find(g => g.typ === 'kaserne' && g.spieler === sp.id);
  if (imKrieg && kaserne && (kaserne.ausbau || 1) < 2 && R.gold > 5000) ausbauen(kaserne);
  const sollMann = imKrieg ? 50 : bedroht ? 20 : 0;
  if (kaserne && sp.einwohner > 90 && R.gold > 2500 &&
      soldatenAktuell(sp.id) < Math.min(sollMann, soldatenKapazitaet(sp.id)))
    ausheben(kaserne);
}

// 2. Verteidigung: fremde Kriegstruppen vor der eigenen Küste stellen
function kiVerteidigen(sp) {
  let gehandelt = false;
  for (const feind of truppen) {
    if (feind.spieler === sp.id || !imKriegMit(sp.id, feind.spieler)) continue;
    let nah = false;
    for (const g of gebaeude) {
      if (g.typ !== 'kontor' || g.spieler !== sp.id) continue;
      const z = zentrum(g);
      if (Math.hypot(z.x - feind.x, z.y - feind.y) <= 13) { nah = true; break; }
    }
    if (!nah) continue;
    for (const t of truppen) {
      if (t.spieler !== sp.id || t.art !== feind.art || t.kampf || t.verfolgt === feind.id) continue;
      if (Math.hypot(t.x - feind.x, t.y - feind.y) > 26) continue;
      if (staerke(t) < staerke(feind) * 0.7) continue;   // aussichtslos: im Schutz der Türme bleiben
      const weg = truppWeg(t, Math.floor(feind.x), Math.floor(feind.y));
      if (!weg) continue;
      t.pfad = weg; t.verfolgt = feind.id; t.landen = null;
      gehandelt = true;
    }
  }
  return gehandelt;
}

// 3. Angriff: Flotten fahren in Wellen auf Kaperfahrt. Dauert der Krieg
//    länger und steht ein großes Heer bereit, folgt die Landung.
function kiKriegFuehren(sp, gegner, wesen) {
  const heim = kiHeimat(sp);
  const jetzt = state.spielzeit;
  const kriegsdauer = jetzt - kriegMatrix[sp.id][gegner.id];
  // Wer eigentlich Frieden will, greift nicht mehr an – er hält nur noch die Stellung
  const muede = kiWillFrieden(sp, gegner.id);
  const flotten = kiFlotten(sp);
  const sollSchiffe = wesen.schiffe + 3;
  const inselVon = t => inselMarke[Math.floor(t.y) * N + Math.floor(t.x)];

  // Landung geplant? Dafür braucht es Zeit, einen Hafen und ein Heer, das
  // den Verteidigern gewachsen ist: je Wachturm beim Kontor 35 Mann mehr.
  const zk = zentrum(gegner.kontor);
  const tuerme = gebaeude.filter(g => g.typ === 'wachturm' && g.spieler === gegner.id &&
                                      Math.hypot(g.x + 0.5 - zk.x, g.y + 0.5 - zk.y) <= wirkRadius(g) + 2).length;
  const noetig = KRIEG.invasionMann + 35 * tuerme;
  const heerDaheim = kiHeere(sp).find(h => h.mann >= noetig && kontorAufInsel(sp.id, inselVon(h)));
  const landung = !muede && kriegsdauer >= KRIEG.invasionAb && !!heerDaheim && !!heim;

  for (const f of flotten) {
    if (f.kampf) continue;
    const zuHause = heim && Math.hypot(f.x - heim.x, f.y - heim.y) <= 9;
    // Rückzug: stark dezimiert, lange genug draußen oder kriegsmüde
    const angeschlagen = f.kiStart && f.schiffe < Math.max(1.2, f.kiStart * 0.45);
    const zuLange = f.kiAb && jetzt - f.kiAb > KRIEG.welle;
    if (!zuHause && heim && (angeschlagen || zuLange || muede) && !(f.fracht >= 10 && !muede)) {
      if (!f.pfad.length || f.kiStart) {
        const weg = truppWeg(f, Math.floor(heim.x), Math.floor(heim.y));
        if (weg) { f.pfad = weg; f.verfolgt = 0; f.landen = null; }
      }
      f.kiStart = 0; f.kiAb = 0;
      continue;
    }
    if (f.pfad.length) continue;                        // unterwegs

    if (zuHause) {
      // Verstreute Verbände im Hafen zusammenlegen
      if (eigeneNahe(f, 'flotte', LADE_ABSTAND)) { truppAktion(f, 'vereinigen'); continue; }
      if (muede) continue;
      // Landung: auf das Heer warten, bis es an Bord ist
      if (landung && f.fracht < 10 && f.schiffe >= 2) {
        if (Math.hypot(heerDaheim.x - f.x, heerDaheim.y - f.y) <= 12 && !heerDaheim.anBord && !heerDaheim.pfad.length)
          truppAktion(heerDaheim, 'einschiffen');
        continue;
      }
      if (f.fracht < 10) {
        if (jetzt < (sp.welleAb || 0)) continue;                          // Atempause zwischen den Wellen
        if (f.schiffe < Math.max(2, Math.ceil(sollSchiffe * 0.5))) continue;   // erst sammeln
      }
    }

    // Soldaten an Bord? Dann beim feindlichen Kontor an Land gehen.
    if (f.fracht >= 10) {
      const z = zentrum(gegner.kontor);
      const strand = freiesFeldNeben(z.x, z.y, landFrei);
      const plan = strand ? befehlPlanen(f, Math.floor(strand.x), Math.floor(strand.y), sp.id) : null;
      if (plan && plan.ok) {
        befehlAusfuehren({ truppe: f, plan });
        if (zuHause) {
          f.kiStart = f.schiffe; f.kiAb = jetzt;
          sp.welleAb = jetzt + KRIEG.wellenPause;
          if (gegner.id === ICH)
            depesche(`⚠️ ${sp.name} setzt zur Landung an!`,
              `Schiffe mit ${Math.round(f.fracht)} Soldaten nehmen Kurs auf dein Kontor. Wachtürme am Kontor und ein eigenes Heer halten sie auf.`);
        }
        continue;
      }
    }

    const ziel = kiAngriffsziel(gegner, f, landung);
    if (!ziel) {                                        // nichts mehr zu holen: heim
      if (!zuHause && heim) {
        const weg = truppWeg(f, Math.floor(heim.x), Math.floor(heim.y));
        if (weg) f.pfad = weg;
        f.kiStart = 0; f.kiAb = 0;
      }
      continue;
    }
    const weg = truppWeg(f, ziel.anker.x, ziel.anker.y);
    if (!weg) continue;
    f.pfad = weg; f.verfolgt = 0;
    if (zuHause) {
      f.kiStart = f.schiffe; f.kiAb = jetzt;
      sp.welleAb = jetzt + KRIEG.wellenPause;
      if (gegner.id === ICH)
        melden(`⚠️ ${sp.name} schickt ${Math.round(f.schiffe)} Kriegsschiffe gegen dich!`, 'ki-welle-' + sp.id, 30000);
    }
  }

  for (const h of kiHeere(sp)) {
    if (h.pfad.length || h.kampf || h.anBord) continue;
    const insel = inselVon(h);
    if (kontorAufInsel(sp.id, insel)) {
      // Daheim: für die Landung zum Hafen marschieren (an Bord holt die Flotte)
      if (landung && h === heerDaheim && Math.hypot(h.x - heim.x, h.y - heim.y) > 9) {
        const ufer = freiesFeldNeben(heim.x, heim.y, landFrei);
        const weg = ufer ? truppWeg(h, Math.floor(ufer.x), Math.floor(ufer.y)) : null;
        if (weg && weg.length) h.pfad = weg;
      }
      continue;
    }
    // Auf fremdem Boden: das Kontor stürmen, sonst das nächste Gebäude
    let weg = null;
    const kontor = gebaeude.find(g => g.typ === 'kontor' && g.spieler === gegner.id &&
                                      inselMarke[g.y * N + g.x] === insel);
    if (kontor) weg = truppWeg(h, kontor.x, kontor.y);
    if (!weg) {
      let naechstes = null, naechsteD = 1e9;
      for (const g of gebaeude) {
        if (g.spieler !== gegner.id || inselMarke[g.y * N + g.x] !== insel) continue;
        const dist = Math.hypot(g.x - h.x, g.y - h.y);
        if (dist < naechsteD) { naechsteD = dist; naechstes = g; }
      }
      if (naechstes) weg = truppWeg(h, naechstes.x, naechstes.y);
    }
    if (weg && weg.length) h.pfad = weg;
  }

  // Kriegsmüde oder unterlegen? Dann bietet die KI von sich aus Frieden an –
  // aber nicht alle paar Sekunden.
  if (muede && jetzt >= (sp.angebotAb || 0)) {
    sp.angebotAb = jetzt + KRIEG.angebotPause;
    friedensAngebot[sp.id][gegner.id] = jetzt + KRIEG.angebotPause - 10;   // gilt bis kurz vor dem nächsten
    if (gegner.ki) { if (kiWillFrieden(gegner, sp.id)) friedenSchliessen(sp.id, gegner.id); }
    else if (gegner.id === ICH)
      depesche(`🕊️ ${sp.name} bietet Frieden an`,
               'Ihre Schiffe bleiben vorerst im Hafen. Tippe links auf die grüne Marke, um anzunehmen.', true);
  }
}

// 4. Vor dem Krieg: Warnungen, Sanktionen, Ultimatum, Kriegserklärung
function kiDiplomatie(sp, gegner, wesen) {
  const R = sp.res, jetzt = state.spielzeit;
  const spannung = feindschaft[sp.id][gegner.id];
  const anDich = gegner.id === ICH;

  // Stimmungswechsel ansagen – jede Stufe nur einmal beim Hochgehen
  const stufe = spannung >= 84 ? 3 : spannung >= 64 ? 2 : spannung >= 42 ? 1 : 0;
  if (stufe > sp.gemeldet[gegner.id] && anDich) {
    if (stufe === 1) melden(`⚡ ${sp.name} beobachtet deinen Aufstieg mit Argwohn – ein Geschenk würde helfen`);
    else if (stufe === 2) melden(`⚖️ ${sp.name} ist dir feindlich gesinnt – rechne mit Sanktionen`);
    else melden(`🔥 Die Lage mit ${sp.name} ist zum Zerreißen gespannt!`);
  }
  sp.gemeldet[gegner.id] = stufe;

  const ruhe = jetzt < waffenruhe[sp.id][gegner.id];

  // Wirtschaftskrieg: höchstens eine Maßnahme alle zwei bis drei Minuten
  if (!ruhe && spannung >= wesen.wirtschaft && spannung < wesen.krieg + 6 && jetzt >= sp.aktAb) {
    const bestichtSchon = diploEffekte.some(e => e.art === 'bestechung' && e.von === sp.id && e.gegen === gegner.id);
    if (!bestichtSchon && R.gold > 5000) {
      R.gold -= DIPLO.bestechen.gold;
      diploEffekte.push({ art: 'bestechung', von: sp.id, gegen: gegner.id,
                          wert: DIPLO.bestechen.malus, bis: jetzt + DIPLO.bestechen.dauer });
      feindAendern(sp.id, gegner.id, DIPLO.bestechen.feind / 2);
      if (anDich) melden(`💼 ${sp.name} besticht die Händler gegen dich – dein Handelskontingent sinkt!`);
      sp.aktAb = jetzt + 240 + Math.random() * 180;
    } else if (R.gold > 8000 && gegner.einwohner >= PIRATEN.abEw &&
               !piraten.some(p => p.ziel === gegner.id) && piratenAnheuern(sp.id, gegner.id)) {
      // heimlich – du erfährst es nur, wenn es auffliegt
      sp.aktAb = jetzt + 240 + Math.random() * 180;
    } else if (!sp.embargo[gegner.id] && R.gold > 9000) {
      sp.embargo[gegner.id] = true;
      feindAendern(sp.id, gegner.id, DIPLO.embargo.feind / 2);
      if (anDich) melden(`⛔ ${sp.name} verhängt ein Embargo gegen dich!`);
      sp.aktAb = jetzt + 240 + Math.random() * 180;
    }
  }
  // Ein Embargo ist teuer: endet, wenn sich die Lage beruhigt oder das Gold knapp wird
  if (sp.embargo[gegner.id] && (spannung < wesen.wirtschaft - 12 || R.gold < 1500)) {
    sp.embargo[gegner.id] = false;
    if (anDich) melden(`${sp.name} hebt das Embargo gegen dich auf`);
  }

  // Ultimatum und Kriegserklärung
  const kriegsreif = !ruhe && spannung >= wesen.krieg && jetzt >= KRIEG.kiFriede;
  if (!kriegsreif) {
    if (sp.ultimatum && sp.ultimatum.gegen === gegner.id && spannung < wesen.krieg - 4) {
      sp.ultimatum = null;
      if (anDich) depesche(`🕊️ ${sp.name} lenkt ein`, 'Das Ultimatum ist vom Tisch – vorerst.', true);
    }
    return;
  }
  // Wer schon mit jemandem im Krieg liegt, wird nicht auch noch überrannt:
  // Es gibt immer nur EINEN Krieg zur Zeit gegen dasselbe Ziel.
  if (spieler.some(x => x.id !== sp.id && x.id !== gegner.id && imKriegMit(gegner.id, x.id))) return;
  // Ohne Flotte keine Kriegserklärung – erst wird fertig gerüstet
  if (kiFlotten(sp).reduce((n, f) => n + f.schiffe, 0) < 2) return;

  if (!sp.ultimatum || sp.ultimatum.gegen !== gegner.id) {
    sp.ultimatum = { gegen: gegner.id, ab: jetzt + KRIEG.ultimatum };
    if (anDich)
      depesche(`🔥 Ultimatum von ${sp.name}!`,
        `„Noch ein Schritt, und es gibt Krieg." Besänftige sie im Kontor unter „Diplomatie" mit einem ` +
        `Geschenk – sonst folgt in gut einer Minute die Kriegserklärung.`);
    else melden(`🔥 ${sp.name} stellt ${gegner.name} ein Ultimatum`, 'ki-ultimatum');
  } else if (jetzt >= sp.ultimatum.ab) {
    sp.ultimatum = null;
    kriegBeginnen(sp.id, gegner.id);
    kriegMelden(sp.id, gegner.id, false);
    sp.welleAb = jetzt + 20;
  }
}

// Piraten vor dem eigenen Kontor: mit der Flotte verjagen, wenn sie
// stark genug ist – sonst nach einer Weile Schutzgeld zahlen
function kiPiratenAbwehr(sp, imKrieg) {
  const p = piraten.find(x => x.ziel === sp.id && x.lauert && !x.geht);
  if (!p || state.spielzeit - p.seit < 25) return;
  if (!imKrieg) {
    const f = kiFlotten(sp).find(t => !t.pfad.length && !t.kampf && !t.jagtPirat &&
      staerke(t) > p.schiffe * KRIEG.schiffWert * 1.15);
    if (f) { piratJagen(f, p); return; }
  }
  if (sp.res.gold > 2500 && Math.random() < 0.25) schutzgeldZahlen(sp.id, p.id);
}

function kiKrieg(sp) {
  if (!sp.kontor) return;
  const wesen = kiWesen(sp);
  const feinde = spieler.filter(g => g.id !== sp.id && g.kontor && imKriegMit(sp.id, g.id));
  const imKrieg = feinde.length > 0;

  // Feindbild: der Kriegsgegner – sonst der, mit dem die Stimmung am schlechtesten ist
  let gegner = feinde[0] || null;
  if (!gegner) {
    for (const g of spieler) {
      if (g.id === sp.id || !g.kontor) continue;
      if (!gegner || feindschaft[sp.id][g.id] > feindschaft[sp.id][gegner.id]) gegner = g;
    }
  }
  if (!gegner) return;
  const bedroht = imKrieg || feindschaft[sp.id][gegner.id] >= wesen.wirtschaft;

  kiRuesten(sp, wesen, bedroht, imKrieg);
  kiPiratenAbwehr(sp, imKrieg);

  // Heere, die nach einem Friedensschluss noch auf fremdem Boden stehen,
  // kehren heim (die Soldaten werden wieder Einwohner)
  for (const h of kiHeere(sp)) {
    const insel = inselMarke[Math.floor(h.y) * N + Math.floor(h.x)];
    if (kontorAufInsel(sp.id, insel)) continue;
    const besitzer = gebaeude.find(g => g.typ === 'kontor' && inselMarke[g.y * N + g.x] === insel);
    if (!besitzer || !imKriegMit(sp.id, besitzer.spieler)) truppAktion(h, 'aufloesen');
  }
  if (kiVerteidigen(sp)) return;
  if (imKrieg) kiKriegFuehren(sp, gegner, wesen);
  else kiDiplomatie(sp, gegner, wesen);
}

// Ein KI-Zug alle 5 Spielsekunden: Diplomatie und Krieg, Handel – und
// im eigenen Bautakt das dringendste Bauvorhaben
function kiTick(sp, dt) {
  sp.timer += dt;
  if (sp.timer < 5) return;
  sp.timer = 0;

  // Noch keine Insel? Zur Startzeit besiedeln. Wer sein letztes Kontor
  // im Krieg verloren hat, ist aus dem Rennen und siedelt nicht neu.
  if (!sp.kontor) {
    if (!sp.besiegt && state.spielzeit >= sp.start) kiSiedeln(sp);
    return;
  }
  kiKrieg(sp);                               // läuft in jedem Zug mit
  if (sp.res.gold < 0) { kiNotlage(sp); return; }

  const L = kiLage(sp);
  kiExpedition(sp, L);
  kiHandel(sp, L);
  if (state.spielzeit < (sp.bauAb || 0)) return;
  if (kiBauen(sp, L)) {
    sp.bauAb = state.spielzeit + kiTakt(sp);
    // Wer im Geld schwimmt, lässt es arbeiten: zusätzlich wird ein Gebäude ausgebaut
    if (sp.res.gold > 12000) {
      const ziel = kiAusbauZiel(sp, L);
      if (ziel) ausbauen(ziel);
    }
  }
}


/* ---------- 5b2. DIPLOMATIE UND WIRTSCHAFTSKRIEG --------------- */
// Vor dem Schwert kommt der Handel: Mit Geschenken, Bestechung,
// Embargos und Privilegien lässt sich ein Gegner ruinieren, ohne
// einen einzigen Soldaten auszuheben.

function diploAktion(art, gegen, sid = ICH) {
  if (istGast() && sid === ICH) return befehlSenden({ art: 'diplo', aktion: art, gegen });
  const a = DIPLO[art], ich = spieler[sid], ziel = spieler[gegen];
  const mir = text => { if (sid === ICH) melden(text); };   // Meldung nur an den Handelnden
  if (art !== 'privileg' && (!ziel || gegen === sid)) return false;   // (das Privileg hat keinen Gegner)

  if (art === 'embargo') {            // Umschalter mit laufenden Kosten
    ich.embargo[gegen] = !ich.embargo[gegen];
    if (ich.embargo[gegen]) {
      feindAendern(sid, gegen, a.feind);
      mir(`⛔ Embargo gegen ${ziel.name} verhängt – kostet ${a.proSekunde * 60} 💰/min`);
      if (gegen === ICH) melden(`⛔ ${ich.name} verhängt ein Embargo gegen dich!`);
    } else mir(`Embargo gegen ${ziel.name} aufgehoben`);
    if (sid === ICH) panelZeigen();
    return true;
  }

  if (art === 'krieg') {
    if (imKriegMit(sid, gegen)) { mir('Ihr seid bereits im Krieg'); return false; }
    if (state.spielzeit < waffenruhe[sid][gegen]) {
      mir(`🕊️ Mit ${ziel.name} gilt noch ${Math.ceil(waffenruhe[sid][gegen] - state.spielzeit)} s Waffenruhe`);
      return false;
    }
    kriegBeginnen(sid, gegen);
    kriegMelden(sid, gegen, false);
    if (sid === ICH) panelZeigen();
    return true;
  }

  if (art === 'piraten') {            // heimlich: kostet kein Ansehen, solange es nicht auffliegt
    const ok = piratenAnheuern(sid, gegen);
    if (sid === ICH) panelZeigen();
    return ok;
  }

  // Frieden anbieten: kostet nichts – aber der Gegner muss wollen
  if (art === 'angebot') {
    if (!imKriegMit(sid, gegen)) return false;
    if (friedensAngebot[gegen][sid] > state.spielzeit) {   // Gegenseite hat schon angeboten
      friedenSchliessen(sid, gegen);
      return true;
    }
    friedensAngebot[sid][gegen] = state.spielzeit + 120;
    if (ziel.ki) {
      if (kiWillFrieden(ziel, sid)) friedenSchliessen(sid, gegen);
      else {
        friedensAngebot[sid][gegen] = state.spielzeit + 45;   // so lange nicht erneut fragen
        mir(`${ziel.name} lehnt ab – sie sieht sich im Vorteil. Schwäche ihre Flotte oder erkaufe den Frieden.`);
      }
    } else {
      mir(`🕊️ Friedensangebot an ${ziel.name} gesendet`);
      if (gegen === ICH) depesche(`🕊️ ${ich.name} bietet Frieden an`,
        'Tippe links auf die grüne Marke, um anzunehmen.', true);
    }
    if (sid === ICH) panelZeigen();
    return true;
  }

  if (a && a.gold && ich.res.gold < a.gold) {
    mir(`Dafür fehlen ${Math.ceil(a.gold - ich.res.gold)} 💰`);
    return false;
  }

  if (art === 'frieden') {            // Tribut: der Gegner bekommt das Gold und gibt Ruhe
    if (!imKriegMit(sid, gegen)) return false;
    ich.res.gold -= a.gold;
    ziel.res.gold += a.gold;
    friedenSchliessen(sid, gegen, true);
    return true;
  }
  if (!a) return false;
  if (a.gold) ich.res.gold -= a.gold;

  if (art === 'geschenk') {
    feindAendern(sid, gegen, a.feind);
    ziel.res.gold += Math.round(a.gold / 2);       // die Hälfte kommt wirklich an
    mir(`🎁 Geschenk an ${ziel.name} – die Beziehung entspannt sich`);
    if (gegen === ICH) melden(`🎁 ${ich.name} schickt dir ein Geschenk`);
  } else if (art === 'bestechen') {
    diploEffekte.push({ art: 'bestechung', von: sid, gegen, wert: a.malus,
                        bis: state.spielzeit + a.dauer });
    feindAendern(sid, gegen, a.feind);
    mir(`💼 Die Händler meiden ${ziel.name} – sein Kontingent sinkt`);
    if (gegen === ICH) melden(`💼 ${ich.name} besticht die Händler gegen dich!`);
  } else if (art === 'privileg') {
    diploEffekte.push({ art: 'privileg', von: sid, gegen: -1, wert: a.bonus,
                        bis: state.spielzeit + a.dauer });
    for (const sp of spieler) if (sp.id !== sid) feindAendern(sid, sp.id, a.feindAlle);
    mir('📜 Handelsprivileg erworben – dein Kontingent steigt deutlich');
  }
  if (sid === ICH) panelZeigen();
  return true;
}

// Frieden: Waffenruhe, Sanktionen enden, Angriffe werden abgebrochen
function friedenSchliessen(a, b, tribut) {
  if (!imKriegMit(a, b)) return;
  kriegBeenden(a, b);
  if (a === ICH || b === ICH) {
    const anderer = spieler[a === ICH ? b : a];
    depesche(`🕊️ Frieden mit ${anderer.name}`,
      (tribut ? 'Der Tribut ist bezahlt. ' : '') +
      `Die Waffen schweigen – ${Math.round(STIMMUNG.waffenruhe / 60)} Minuten Waffenruhe sind vereinbart.`, true);
    if (state.auswahl) panelZeigen();
  } else melden(`🕊️ ${spieler[a].name} und ${spieler[b].name} schließen Frieden`, 'frieden');
}

// Kriegsbeginn bekannt machen – wen es betrifft, der bekommt eine Depesche
function kriegMelden(angreifer, opfer, ueberfall) {
  const A = spieler[angreifer], O = spieler[opfer];
  if (opfer === ICH)
    depesche(ueberfall ? `⚔️ ${A.name} überfällt dich!` : `⚔️ ${A.name} erklärt dir den Krieg!`,
      'Rechne mit Kriegsschiffen vor deiner Küste. Wachtürme am Ufer schützen – und eine eigene Flotte hält die Angreifer fern.');
  else if (angreifer === ICH)
    depesche(ueberfall ? `⚔️ Überfall auf ${O.name}!` : `⚔️ Du erklärst ${O.name} den Krieg`,
      ueberfall ? 'Ohne Kriegserklärung – alle Nachbarn sind empört.'
                : 'Jetzt sind Angriffe erlaubt. Frieden kannst du im Kontor unter „Diplomatie" anbieten.');
  else melden(`⚔️ ${A.name} ${ueberfall ? 'überfällt' : 'erklärt'} ${O.name}${ueberfall ? '' : ' den Krieg'}`, 'ki-krieg');
}

// Ein Angriff ohne vorherige Kriegserklärung ist ein Überfall:
// Er bringt den Überfallenen und alle Nachbarn gegen den Angreifer auf.
function kriegshandlung(angreifer, opfer) {
  if (angreifer === opfer || imKriegMit(angreifer, opfer)) return;
  kriegBeginnen(angreifer, opfer);
  feindschaft[angreifer][opfer] = feindschaft[opfer][angreifer] = Math.max(92, feindschaft[angreifer][opfer]);
  for (const sp of spieler)
    if (sp.id !== angreifer && sp.id !== opfer) feindAendern(angreifer, sp.id, 25);
  kriegMelden(angreifer, opfer, true);
}

// Militärische Stärke eines Spielers (für die Entscheidungen der KI)
function wehrkraft(sid) {
  let s = 0;
  for (const t of truppen) {
    if (t.spieler !== sid) continue;
    s += t.art === 'flotte'
      ? t.schiffe * KRIEG.schiffWert * (1 + KANONEN_SEEBONUS * (t.kanonen || 0)) + t.fracht
      : t.mann;
  }
  return s;
}

// Punkte im Wettlauf – daran misst sich der Neid
function wettlaufPunkte(sp) { return sp.siedlerEw * 2 + sp.einwohner; }

// Wirtschaftliche Wirkungen je Simulationsschritt neu berechnen
function diploSchritt(dt, unterhaltJe) {
  diploEffekte = diploEffekte.filter(e => e.bis > state.spielzeit);
  for (const sp of spieler) { sp.handelsMalus = 0; sp.handelsBonus = 0; }

  for (const e of diploEffekte) {
    if (e.art === 'bestechung') spieler[e.gegen].handelsMalus += e.wert;
    else if (e.art === 'privileg') {
      spieler[e.von].handelsBonus += e.wert;
      for (const sp of spieler) if (sp.id !== e.von) sp.handelsMalus += 0.1;
    }
  }
  // Laufende Embargos: kosten den Verhänger Gold und kürzen das Ziel
  for (const sp of spieler) {
    for (let b = 0; b < spieler.length; b++) {
      if (!sp.embargo[b]) continue;
      spieler[b].handelsMalus += DIPLO.embargo.malus;
      unterhaltJe[sp.id] += DIPLO.embargo.proSekunde * dt;
    }
  }

  // Piraten: Wer sie vor dem Kontor liegen hat, handelt schlechter
  for (const sp of spieler) sp.piratenDa = false;
  for (const p of piraten) {
    if (!p.lauert || spieler[p.ziel].piratenDa) continue;
    spieler[p.ziel].piratenDa = true;
    spieler[p.ziel].handelsMalus += PIRATEN.malus;
  }

  // Seeblockade: Liegt im Krieg eine feindliche Flotte vor einem Kontor,
  // trauen sich die Händler kaum noch hinein. Das macht Flotten auch
  // ohne Beschuss zu einer Waffe – und den Krieg im Geldbeutel spürbar.
  for (const sp of spieler) sp.blockiert = false;
  for (const t of truppen) {
    if (t.art !== 'flotte') continue;
    for (const g of gebaeude) {
      if (g.typ !== 'kontor' || g.spieler === t.spieler) continue;
      if (spieler[g.spieler].blockiert || !imKriegMit(t.spieler, g.spieler)) continue;
      const z = zentrum(g);
      if (Math.hypot(z.x - t.x, z.y - t.y) <= STIMMUNG.blockadeNah) {
        spieler[g.spieler].blockiert = true;
        spieler[g.spieler].handelsMalus += STIMMUNG.blockade;
      }
    }
  }

  // Alles zusammen darf den Handel nicht völlig abwürgen
  for (const sp of spieler) sp.handelsMalus = Math.min(HANDEL.malusMax, sp.handelsMalus);

  // Kontingent: wächst mit Einwohnern und Kontoren, erholt sich laufend
  for (const sp of spieler) {
    const kontore = gebaeude.reduce((n, g) =>
      n + (g.typ === 'kontor' && g.spieler === sp.id ? 1 : 0), 0);
    const basis = HANDEL.basis + sp.einwohner * HANDEL.jeEinwohner + kontore * HANDEL.jeKontor;
    sp.kontingentMax = Math.max(40, Math.round(
      basis * sp.boni.kontingent * (1 + sp.handelsBonus - sp.handelsMalus)));
    sp.kontingent = Math.min(sp.kontingentMax,
      sp.kontingent + sp.kontingentMax / HANDEL.erholung * dt);
  }

  // Stimmung: Jede Beziehung pendelt langsam zur Ruhelage zurück. Nur
  // der Neid der KI auf einen klar Führenden treibt sie nach oben – und
  // auch das nur bis zu einer Grenze, die vom Wesen der KI abhängt.
  // Krieg entsteht daraus nie von selbst: dazu braucht es eine Erklärung.
  for (let a = 0; a < spieler.length; a++)
    for (let b = a + 1; b < spieler.length; b++) {
      if (imKriegMit(a, b)) continue;                 // im Krieg ändert sich nichts von selbst
      const w = feindschaft[a][b];
      if (w > STIMMUNG.ruhe) feindAendern(a, b, -STIMMUNG.heilung * dt);
      else if (w < STIMMUNG.ruhe) feindAendern(a, b, STIMMUNG.heilung * 0.5 * dt);

      const pa = wettlaufPunkte(spieler[a]), pb = wettlaufPunkte(spieler[b]);
      const vorn = pa >= pb ? spieler[a] : spieler[b];
      const hinten = pa >= pb ? spieler[b] : spieler[a];
      if (!hinten.ki || !vorn.kontor || !hinten.kontor) continue;
      if (vorn.einwohner < STIMMUNG.neidAbEw) continue;
      if (Math.max(pa, pb) < Math.min(pa, pb) * STIMMUNG.neidVorsprung) continue;
      if (state.spielzeit < waffenruhe[a][b]) continue;
      // Groll: Bleibt einer lange klar vorn, hebt das die Grenze langsam an.
      // So folgt auf Argwohn irgendwann verlässlich das Ultimatum – bei
      // Giovanna nach rund 20 Minuten, bei Wilhelm deutlich später, bei
      // Isabella nie. Geschenke drücken die Stimmung und kaufen Zeit.
      const wesen = kiWesen(hinten);
      hinten.neidZeit[vorn.id] = (hinten.neidZeit[vorn.id] || 0) + dt;
      const groll = Math.min(wesen.grollMax,
        Math.max(0, hinten.neidZeit[vorn.id] - STIMMUNG.grollAb) / 60 * STIMMUNG.grollJeMin);
      if (w < wesen.neidBis + groll) feindAendern(a, b, STIMMUNG.neid * dt);
    }
}

/* ---------- 5c. KRIEG: HEERE UND FLOTTEN ----------------------- */
// Truppen sind – anders als Gebäude – nicht kachelgebunden, sondern
// bewegen sich frei über die Karte (wie das Startschiff). Jede Truppe
// ist EIN Stapel: ein Heer mit "mann" Soldaten oder eine Flotte mit
// "schiffe" Kriegsschiffen, die zusätzlich Soldaten an Bord nehmen kann.

let truppen = [];

function neueTruppe(sid, art, x, y) {
  const t = {
    id: naechsteId++, spieler: sid, art,   // 'heer' oder 'flotte'
    mann: 0, schiffe: 0, fracht: 0,        // fracht = Soldaten an Bord
    kanonen: 0,                            // Ausbaustufe der Schiffsgeschütze
    moral: 1, x, y, pfad: [], kampf: false,
    verfolgt: 0,     // Kennung einer feindlichen Truppe, der nachgesetzt wird
    landen: null,    // {x, y}: dort setzt die Flotte bei Ankunft ihre Truppen ab
    anBord: 0,       // Kennung der Flotte, auf die das Heer bei Ankunft geht
    jagtPirat: 0,    // Kennung eines Piratenverbands, dem die Flotte nachsetzt
  };
  truppen.push(t);
  return t;
}

// Nachschub: Je weiter eine Truppe von eigenen Märkten und Kontoren
// entfernt kämpft, desto schwächer ist sie. Dadurch ist Angreifen
// deutlich teurer als Verteidigen – das Herz der Kriegstaktik.
function nachschub(t) {
  let d = Infinity;
  for (const g of gebaeude) {
    if (g.spieler !== t.spieler) continue;
    if (g.typ !== 'kontor' && g.typ !== 'marktplatz') continue;
    const z = zentrum(g);
    d = Math.min(d, Math.hypot(z.x - t.x, z.y - t.y));
  }
  if (!isFinite(d)) return 0.5;
  return d <= 10 ? 1 : d <= 18 ? 0.82 : d <= 28 ? 0.68 : 0.55;
}

// Kampfkraft eines Stapels: Flotten rechnen in Schiffen, Heere in Mann
function staerke(t) {
  const kanonen = t.art === 'flotte' ? 1 + KANONEN_SEEBONUS * (t.kanonen || 0) : 1;
  const roh = t.art === 'flotte' ? t.schiffe * KRIEG.schiffWert : t.mann;
  return roh * kanonen * t.moral * nachschub(t);
}

// Eigene Werft in Reichweite einer Flotte (zum Nachrüsten nötig)
function werftNahe(t) {
  for (const g of gebaeude) {
    if (g.typ !== 'werft' || g.spieler !== t.spieler) continue;
    const z = zentrum(g);
    if (Math.hypot(z.x - t.x, z.y - t.y) <= 6) return g;
  }
  return null;
}

// Kanonen einer Flotte nachrüsten – nur direkt bei der eigenen Werft
function kanonenNachruesten(t) {
  if (!t || t.art !== 'flotte' || t.spieler !== ICH) return false;
  if (istGast()) return befehlSenden({ art: 'kanonen', id: t.id });
  if ((t.kanonen || 0) >= KANONEN_MAX) { melden('Die Flotte ist voll bestückt'); return false; }
  if (!werftNahe(t)) { melden('🛠️ Zum Nachrüsten muss die Flotte bei deiner Werft liegen'); return false; }
  for (const [ware, menge] of Object.entries(KANONEN_KOSTEN))
    if (res[ware] < menge) {
      melden(`Kanonen: es fehlt ${WAREN_EMOJI[ware]} ${Math.ceil(menge - res[ware])}`);
      return false;
    }
  for (const [ware, menge] of Object.entries(KANONEN_KOSTEN)) res[ware] -= menge;
  t.kanonen = (t.kanonen || 0) + 1;
  melden(`🔫 Kanonen auf Stufe ${t.kanonen} – die Flotte schlägt härter zu`);
  panelZeigen();
  return true;
}
function truppGroesse(t) { return t.art === 'flotte' ? t.schiffe : t.mann; }

// Truppe an einer Kachel finden (für die Auswahl per Fingertipp)
function truppeBei(x, y, sid = null) {
  let beste = null, besteD = 1.1;
  for (const t of truppen) {
    if (sid !== null && t.spieler !== sid) continue;
    const d = Math.hypot(t.x - (x + 0.5), t.y - (y + 0.5));
    if (d < besteD) { beste = t; besteD = d; }
  }
  return beste;
}

// Abstand eines Punkts zum Grundriss eines Gebäudes (0 = steht darauf)
function abstandZumGrundriss(geb, px, py) {
  const def = GEBAEUDE[geb.typ];
  const dx = Math.max(geb.x - px, 0, px - (geb.x + def.w));
  const dy = Math.max(geb.y - py, 0, py - (geb.y + def.h));
  return Math.hypot(dx, dy);
}

// Geht ein Stapel in einem anderen auf, wandert die eigene Auswahl mit
function auswahlUmhaengen(alt, neu) {
  if (state.truppAuswahl === alt) state.truppAuswahl = neu;
}

// So nah müssen Schiff und Ufer beieinander liegen, damit Soldaten
// an Bord gehen oder an Land gesetzt werden können (in Kacheln)
const LADE_ABSTAND = 2.9;

// Freies Land in Reichweite einer Flotte: am liebsten nah am Wunschziel
// (wx, wy), sonst einfach das nächstgelegene.
function landeplatzNahe(f, wx, wy) {
  let beste = null, besteD = 1e9;
  const fx = Math.floor(f.x), fy = Math.floor(f.y);
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
    const x = fx + dx, y = fy + dy;
    if (x < 0 || y < 0 || x >= N || y >= N) continue;
    const i = y * N + x;
    if (!landFrei(i) || belegt[i]) continue;
    const zurFlotte = Math.hypot(f.x - (x + 0.5), f.y - (y + 0.5));
    if (zurFlotte > LADE_ABSTAND) continue;
    const dist = wx === undefined ? zurFlotte : Math.hypot(wx - x, wy - y);
    if (dist < besteD) { besteD = dist; beste = { x: x + 0.5, y: y + 0.5 }; }
  }
  return beste;
}

// Soldaten einer Flotte an Land setzen
function anlanden(f, wx, wy) {
  if (f.art !== 'flotte' || f.fracht < 1) return false;
  const platz = landeplatzNahe(f, wx, wy);
  if (!platz) {
    if (f.spieler === ICH) melden('🏖️ Hier kann niemand an Land – näher an einen freien Strand segeln');
    return false;
  }
  const neu = neueTruppe(f.spieler, 'heer', platz.x, platz.y);
  neu.mann = f.fracht;
  neu.moral = f.moral;
  f.fracht = 0;
  auswahlUmhaengen(f, neu);            // weiter geht es mit dem gelandeten Heer
  if (f.spieler === ICH) melden('🏖️ Truppen sind gelandet!');
  return true;
}

// Ein Heer geht an Bord einer eigenen Flotte, die am Ufer liegt
function einschiffen(h, f) {
  if (h.art !== 'heer' || f.art !== 'flotte' || h.spieler !== f.spieler) return false;
  if (Math.hypot(h.x - f.x, h.y - f.y) > LADE_ABSTAND) {
    if (h.spieler === ICH) melden('⚓ Die Flotte ist zu weit weg – sie muss direkt am Ufer liegen');
    return false;
  }
  f.fracht += h.mann;
  truppen = truppen.filter(x => x !== h);
  auswahlUmhaengen(h, f);
  if (h.spieler === ICH) melden('⚓ Truppen an Bord – tippe jetzt auf die Küste, an der sie landen sollen');
  return true;
}

// Nächste eigene Truppe einer Art im Umkreis (ohne die Truppe selbst)
function eigeneNahe(t, art, radius) {
  let beste = null, besteD = radius;
  for (const z of truppen) {
    if (z === t || z.spieler !== t.spieler || z.art !== art) continue;
    const dist = Math.hypot(z.x - t.x, z.y - t.y);
    if (dist <= besteD) { beste = z; besteD = dist; }
  }
  return beste;
}

// Welche besonderen Befehle bietet die Lage gerade an? (Knöpfe der
// Auswahlleiste – sie erscheinen nur, wenn sie auch etwas bewirken)
function truppAktionen(t) {
  const liste = [];
  if (t.art === 'heer') {
    const f = eigeneNahe(t, 'flotte', 12);
    if (f) liste.push(Math.hypot(f.x - t.x, f.y - t.y) <= LADE_ABSTAND
      ? { art: 'einschiffen', text: '⚓ An Bord', tipp: 'Das Heer geht auf die Flotte am Ufer' }
      : { art: 'einschiffen', text: '⚓ Zur Flotte', tipp: 'Zum Ufer bei der Flotte marschieren und an Bord gehen' });
  } else if (t.fracht >= 1 && landeplatzNahe(t)) {
    liste.push({ art: 'anlanden', text: '🏖️ An Land', tipp: 'Die Soldaten an Bord hier absetzen' });
  }
  if (eigeneNahe(t, t.art, LADE_ABSTAND))
    liste.push({ art: 'vereinigen', text: '🔗 Vereinen', tipp: 'Mit der Truppe nebenan zusammenlegen' });
  return liste;
}
