  const ueberfall = '<br><span class="grund">⚠️ Ohne Kriegserklärung ist das ein Überfall – ' +
                    'er bringt alle Nachbarn gegen dich auf!</span>';

  // Feindliche Truppe: ausdrücklich angetippt oder auf der Zielkachel
  let gegner = zielTruppe && zielTruppe.spieler !== sid ? zielTruppe : null;
  if (!gegner) {
    const dort = truppeBei(tx, ty);
    if (dort && dort.spieler !== sid) gegner = dort;
  }

  // 1. Angriff auf eine feindliche Truppe gleicher Art
  if (gegner && gegner.art === t.art) {
    const weg = truppWeg(t, Math.floor(gegner.x), Math.floor(gegner.y));
    if (!weg) return { ok: false, text: 'Dorthin führt kein Weg' };
    const chance = staerke(t) / Math.max(0.01, staerke(t) + staerke(gegner));
    const urteil = chance > 0.65 ? 'gute Aussichten'
                 : chance > 0.45 ? 'offener Ausgang' : '⚠️ unterlegen!';
    const krieg = imKriegMit(sid, gegner.spieler);
    const satz = `${flotte ? '🌊 Seeschlacht' : '⚔️ Angriff'} gegen ${spieler[gegner.spieler].name}: ` +
                 `${Math.round(staerke(t))} gegen ${Math.round(staerke(gegner))} – ${urteil}`;
    return { ok: true, aktion: 'marsch', weg, gegen: gegner.spieler, verfolgt: gegner.id,
             rueckfrage: !krieg, kurz: satz, text: satz + (krieg ? '' : ueberfall) };
  }

  // 2. Angriff auf ein feindliches Gebäude
  if (geb && geb.spieler !== sid) {
    let weg;
    if (flotte) {
      weg = ankerplatzWeg(t, geb);
      if (!weg) return { ok: false, text: 'Dorthin reichen keine Schiffsgeschütze – such ein Ziel näher am Wasser' };
    } else {
      weg = truppWeg(t, tx, ty);
      if (!weg) {
        const f = freiesFeldNeben(tx, ty, landFrei);
        if (f) weg = truppWeg(t, Math.floor(f.x), Math.floor(f.y));
      }
      if (!weg) return { ok: false, text: 'Dorthin führt kein Landweg (Berg oder Fluss ohne Brücke?)' };
    }
    const krieg = imKriegMit(sid, geb.spieler);
    const satz = `${flotte ? '💥 Beschuss' : '⚔️ Sturm'}: ` +
                 `${geb.typ === 'kontor' ? '🚩 Kontor' : GEBAEUDE[geb.typ].name} von ${spieler[geb.spieler].name}` +
                 (geb.typ !== 'kontor' ? ''
                   : flotte ? ' – Schiffe schießen es nur sturmreif, erobern müssen Soldaten'
                            : ' – fällt es, fällt die ganze Insel!');
    return { ok: true, aktion: 'marsch', weg, gegen: geb.spieler,
             rueckfrage: !krieg, kurz: satz, text: satz + (krieg ? '' : ueberfall) };
  }

  // 3. Flotte aufs Land getippt: vor diese Küste segeln. Sind Soldaten
  //    an Bord, werden sie dort gleich abgesetzt.
  if (flotte && k.typ !== 'wasser') {
    const ziel = { x: tx, y: ty };
    if (t.fracht >= 1 && Math.hypot(t.x - (tx + 0.5), t.y - (ty + 0.5)) <= LADE_ABSTAND)
      return { ok: true, aktion: 'marsch', weg: [], landen: ziel };
    const weg = kuestenWeg(t, tx, ty);
    if (!weg) return { ok: false, text: 'Vor diese Küste führt kein Seeweg (zu weit im Landesinneren?)' };
    return t.fracht >= 1
      ? { ok: true, aktion: 'marsch', weg, landen: ziel,
          kurz: '🏖️ Die Flotte steuert die Küste an und setzt dort die Truppen ab' }
      : { ok: true, aktion: 'marsch', weg, kurz: '🚢 Kurs auf diese Küste' };
  }

  // 4. Heer aufs Wasser getippt
  if (!flotte && k.typ === 'wasser')
    return { ok: false, text: '⚔️ Heere kommen nicht übers Wasser – mit ⚓ auf eine eigene Flotte am Ufer gehen' };

  // 5. Einfache Fahrt bzw. einfacher Marsch
  const weg = truppWeg(t, tx, ty);
  if (!weg) return { ok: false, text: flotte
    ? 'Dorthin führt kein Seeweg' : 'Dorthin führt kein Landweg (Berg oder Fluss ohne Brücke?)' };
  return { ok: true, aktion: 'marsch', weg };
}

function befehlAusfuehren(v) {
  const t = v.truppe, plan = v.plan;
  if (!truppen.includes(t) || !plan.ok) return;
  if (istGast() && t.spieler === ICH)
    return befehlSenden({ art: 'truppe', id: t.id, tx: v.tx, ty: v.ty, ziel: v.zielId || 0 });
  // Ein bewusster Angriffsbefehl ohne Kriegserklärung ist ein Überfall
  // (die Leiste hat vorher gewarnt) – damit beginnt der Krieg
  if (plan.gegen !== undefined && !imKriegMit(t.spieler, plan.gegen))
    kriegshandlung(t.spieler, plan.gegen);
  t.pfad = plan.weg;
  t.verfolgt = plan.verfolgt || 0;
  t.landen = plan.landen || null;
  t.anBord = 0;
  t.jagtPirat = 0;
}

// Tastatur: Pfeile/WASD verschieben, Leertaste pausiert, 1–3 Tempo, Esc Zeiger
window.addEventListener('keydown', e => {
  const schritt = 90 / kamera.zoom;
  switch (e.key) {
    case 'ArrowLeft':  case 'a': kamera.x -= schritt; kameraBegrenzen(); e.preventDefault(); break;
    case 'ArrowRight': case 'd': kamera.x += schritt; kameraBegrenzen(); e.preventDefault(); break;
    case 'ArrowUp':    case 'w': kamera.y -= schritt; kameraBegrenzen(); e.preventDefault(); break;
    case 'ArrowDown':  case 's': kamera.y += schritt; kameraBegrenzen(); e.preventDefault(); break;
    case ' ': pauseUmschalten(); e.preventDefault(); break;
    case '1': tempoSetzen(1); break;
    case '2': tempoSetzen(2); break;
    case '3': tempoSetzen(3); break;
    case 'Escape':
      werkzeugWaehlen('zeiger');
      state.auswahl = null; truppAbwaehlen();
      break;
  }
});

/* ---------- 9. BENUTZEROBERFLÄCHE ------------------------------ */

const $ = id => document.getElementById(id);

// Baumenü aus dem Gebäudekatalog erzeugen
function menueBauen() {
  const menue = $('baumenue');
  menue.innerHTML = '';

  // Zeiger-Werkzeug (Auswählen)
  menue.appendChild(bauKnopf('zeiger', '👆', 'Auswählen', 'Gebäude anklicken für Details'));

  for (const gruppe of MENUE_GRUPPEN) {
    const kasten = document.createElement('div');
    kasten.className = 'bau-gruppe';
    kasten.innerHTML = `<span class="gruppe-titel">${gruppe.titel}</span>`;
    const reihe = document.createElement('div');
    reihe.className = 'gruppe-knoepfe';
    for (const typ of gruppe.typen) {
      const def = GEBAEUDE[typ];
      // Weitere Kontore besiedeln neue Inseln – gegen Ausbaugebühr
      const kostenText = Object.entries(gebKosten(typ, 0))
        .map(([ware, menge]) => `${WAREN_EMOJI[ware]}${menge}`).join(' ') || 'gratis';
      const knopf = bauKnopf(typ, def.emoji, def.name, def.beschr + ' – Kosten: ' + kostenText);
      knopf.dataset.kosten = kostenText;
      knopf.querySelector('.kosten').textContent = kostenText;
      reihe.appendChild(knopf);
    }
    kasten.appendChild(reihe);
    menue.appendChild(kasten);
  }

  // Abriss-Werkzeug
  menue.appendChild(bauKnopf('abriss', '🧨', 'Abreißen', 'Gebäude entfernen (halbe Kosten zurück)'));
  menueAktualisieren();
}

function bauKnopf(werkzeug, symbol, name, tipp) {
  const b = document.createElement('button');
  b.className = 'bau-knopf';
  b.dataset.werkzeug = werkzeug;
  b.title = tipp;
  b.innerHTML = `<span class="symbol">${symbol}</span><span class="name">${name}</span><span class="kosten"></span>`;
  b.addEventListener('click', () => bauKnopfKlick(werkzeug));
  return b;
}

// Klick auf einen Bauknopf: Wenn das Gebäude (noch) nicht gebaut werden
// kann, wird der Grund als Meldung angezeigt – wichtig auf dem Handy,
// wo es keine Maus-Tooltips gibt.
function bauKnopfKlick(werkzeug) {
  const def = GEBAEUDE[werkzeug];
  if (def) {
    if (!state.kontorGebaut && werkzeug !== 'kontor') {
      melden('⚓ Baue zuerst dein Kontor an der Küste!');
      return;
    }
    if (spieler[ICH].maxStufe < def.abStufe) {
      melden(`🔒 ${def.name}: wird erst freigeschaltet, wenn ein Haus zu ${STUFEN[def.abStufe].name}n aufgestiegen ist`);
      return;
    }
    if (!kostenReichen(werkzeug)) {
      const fehlt = Object.entries(gebKosten(werkzeug, 0))
        .filter(([ware, menge]) => res[ware] < menge)
        .map(([ware, menge]) => `${WAREN_EMOJI[ware]} ${Math.ceil(menge - res[ware])}`)
        .join(', ');
      melden(`${def.name}: es fehlt ${fehlt} – produzieren oder im Kontor kaufen`);
      return;
    }
  }
  werkzeugWaehlen(werkzeug);
}

function werkzeugWaehlen(werkzeug) {
  // Vor dem Kontor kann nur das Kontor gebaut werden
  if (!state.kontorGebaut && werkzeug !== 'kontor' && werkzeug !== 'zeiger') {
    melden('Baue zuerst dein Kontor an der Küste!');
    return;
  }
  state.werkzeug = werkzeug;
  state.vorschau = null;             // offene Bestätigung verwerfen
  if (werkzeug !== 'zeiger') {       // beim Bauen ist nichts ausgewählt
    state.auswahl = null; state.truppAuswahl = null; state.truppInfo = false;
    panelZeigen();
  }
  bestaetigungZeigen();
  leinwand.classList.toggle('bauen', werkzeug !== 'zeiger');
  menueAktualisieren();
}

// --- Bestätigungsleiste: erst antippen, dann mit ✓ bauen/abreißen ---
function bestaetigungZeigen() {
  truppWahlZeigen();     // die Auswahlleiste weicht einer offenen Rückfrage
  const leiste = $('bestaetigung');
  const v = state.vorschau;
  if (!v) { leiste.style.display = 'none'; return; }
  leiste.style.display = 'flex';

  if (v.modus === 'befehl') {
    $('bestaetigung-text').innerHTML = v.plan.text;
    $('b-ok').textContent = '✓ Angreifen';
    $('b-ok').disabled = !v.plan.ok;
    return;
  }
  if (v.modus === 'pirat') {
    if (!piraten.includes(v.pirat) || v.pirat.geht) { state.vorschau = null; leiste.style.display = 'none'; return; }
    $('bestaetigung-text').innerHTML = `🏴‍☠️ <b>Piraten</b> vergraulen deine Händler (Handel −${Math.round(PIRATEN.malus * 100)} %). ` +
      `Schutzgeld zahlen? (${PIRATEN.schutzgeld} 💰)<br><small style="color:var(--text-leise)">Oder: Kriegsflotte auswählen und die Piraten antippen.</small>`;
    $('b-ok').textContent = '✓ Zahlen';
    $('b-ok').disabled = res.gold < PIRATEN.schutzgeld;
    return;
  }
  if (v.modus === 'abriss') {
    const def = GEBAEUDE[v.geb.typ];
    $('bestaetigung-text').innerHTML = `${def.emoji} <b>${def.name}</b> wirklich abreißen? (50 % zurück)`;
    $('b-ok').textContent = '✓ Abreißen';
    $('b-ok').disabled = false;
  } else {
    const def = GEBAEUDE[v.typ];
    const a = ankerVon(v.typ, v.tx, v.ty);
    const pruefung = platzOK(v.typ, a.x, a.y);
    const bezahlbar = kostenReichen(v.typ);
    const kostenText = Object.entries(gebKosten(v.typ, 0))
      .map(([ware, menge]) => `${WAREN_EMOJI[ware]}${menge}`).join(' ') || 'gratis';
    const eff = effVorschau(v.typ, a.x, a.y);
    const effText = eff !== null ? ` – Auslastung <b>${Math.round(eff * 100)} %</b>` : '';
    if (!pruefung.ok)
      $('bestaetigung-text').innerHTML = `${def.emoji} <span class="grund">${pruefung.grund}</span>`;
    else if (!bezahlbar)
      $('bestaetigung-text').innerHTML = `${def.emoji} <span class="grund">Zu wenig Rohstoffe</span> (${kostenText})`;
    else
      $('bestaetigung-text').innerHTML = `${def.emoji} <b>${def.name}</b> hier bauen? (${kostenText})${effText}`;
    $('b-ok').textContent = '✓ Bauen';
    $('b-ok').disabled = !(pruefung.ok && bezahlbar);
  }
}

$('b-ok').addEventListener('click', () => {
  const v = state.vorschau;
  if (!v) return;
  if (v.modus === 'befehl') {
    befehlAusfuehren(v);
    if (v.plan.kurz) melden(v.plan.kurz);
    state.vorschau = null;
  } else if (v.modus === 'pirat') {
    schutzgeldZahlen(ICH, v.pirat.id);
    state.vorschau = null;
  } else if (v.modus === 'abriss') {
    abreissen(v.geb);
    state.vorschau = null;
  } else if (platziere(v.typ, v.tx, v.ty)) {
    state.vorschau = null;   // Werkzeug bleibt aktiv fürs nächste Gebäude
  }
  bestaetigungZeigen();
});
$('b-nein').addEventListener('click', () => {
  state.vorschau = null;
  bestaetigungZeigen();
});

// --- Handel am Kontor: Waren gegen Gold kaufen und verkaufen ---
function handel(ware, menge) {
  if (!PREISE[ware]) return;
  if (istGast()) { befehlSenden({ art: 'handel', ware, menge }); return; }
  if (!handelAusfuehren(spieler[ICH], ware, menge)) melden(handelFehler);
  uiAktualisieren();
}

function menueAktualisieren() {
  for (const b of document.querySelectorAll('.bau-knopf')) {
    const w = b.dataset.werkzeug;
    b.classList.toggle('aktiv', w === state.werkzeug);
    if (GEBAEUDE[w]) {
      // Nicht baubar = ausgegraut, aber weiterhin antippbar (der Klick
      // erklärt dann den Grund – siehe bauKnopfKlick)
      const gesperrt = spieler[ICH].maxStufe < GEBAEUDE[w].abStufe;
      const inaktiv = state.kontorGebaut ? (gesperrt || !kostenReichen(w))
                                         : (w !== 'kontor');
      b.classList.toggle('gesperrt', inaktiv);
      const kostenFeld = b.querySelector('.kosten');
      if (kostenFeld) kostenFeld.textContent = gesperrt
        ? '🔒 ab ' + STUFEN[GEBAEUDE[w].abStufe].name
        : (b.dataset.kosten || '');
    }
  }
}

// Ressourcenleiste und Panel auffrischen (ein paar Mal pro Sekunde)
function uiAktualisieren() {
  $('r-gold').textContent = Math.floor(res.gold).toLocaleString('de-DE');
  $('r-gold').parentElement.classList.toggle('warnung', res.gold < 0);
  const rate = state.goldRate;
  $('r-gold-rate').textContent = (rate >= 0 ? '+' : '') + rate.toFixed(1) + '/s';
  $('r-holz').textContent = Math.floor(res.holz);
  $('r-werkzeuge').textContent = Math.floor(res.werkzeuge);
  $('r-nahrung').textContent = Math.floor(res.nahrung);
  $('r-nahrung').parentElement.classList.toggle('warnung', state.hunger);
  $('r-ziegel').textContent = Math.floor(res.ziegel);
  $('r-stoffe').textContent = Math.floor(res.stoffe);
  $('r-alkohol').textContent = Math.floor(res.alkohol);

  // Punktestand des Wettrennens (nach Siedlern sortiert)
  const rangliste = [...spieler].sort((a, b) =>
    (b.siedlerEw - a.siedlerEw) || (b.einwohner - a.einwohner));
  // Hinter jedem Namen steht, wie du mit ihm stehst (ab „Spannungen")
  const beziehung = sp => {
    if (sp.id === ICH || !sp.kontor || !spieler[ICH].kontor) return '';
    const st = feindStufe(ICH, sp.id);
    return (st === KRIEG_STUFE || feindschaft[ICH][sp.id] >= 42) ? ' ' + st.emoji : '';
  };
  setzeHtml($('punkte'), '<b>🏁 Wettlauf auf ' + SIM.zielSiedler + ' Siedler</b>' +
    rangliste.map(sp => `<div class="punkte-zeile${imKriegMit(ICH, sp.id) ? ' krieg' : ''}">` +
      `<span><span style="color:${sp.farbe}">●</span> ${sp.name}${beziehung(sp)}</span>` +
      `<span>${sp.besiegt ? '🏳️' : sp.kontor ? STUFEN[sp.maxStufe].emoji + ' ' + sp.siedlerEw : '⛵ …'}</span></div>`).join(''));
  lageZeigen();
  $('r-gunst').textContent = spieler[ICH].gunst || 0;
  $('r-einwohner').textContent = state.einwohner || 0;
  $('r-siedler').textContent = state.siedlerEw || 0;
  $('ziel-balken').firstElementChild.style.width =
    Math.min(100, (state.siedlerEw || 0) / SIM.zielSiedler * 100) + '%';

  // Bankrott-Warnung mit Countdown
  const warnung = $('bankrott-warnung');
  const pleite = res.gold < 0 && !state.vorbei;
  if (pleite) {
    warnung.style.display = 'block';
    warnung.textContent = '⚠️ Kasse leer! Bankrott in ' +
      Math.ceil(SIM.pleiteDauer - state.pleiteZeit) + ' s – Unterhalt senken oder Steuern steigern!';
  } else warnung.style.display = 'none';

  // Netz-Hinweis: meldet sich der Gastgeber noch?
  const netz = $('netz-warnung');
  if (istGast() && MP.hostPuls && Date.now() - MP.hostPuls > 9000) {
    netz.style.display = 'block';
    netz.textContent = '📴 Der Gastgeber ist gerade nicht erreichbar …';
  } else netz.style.display = 'none';

  // Dürre-Hinweis (eigene Insel betroffen?)
  const duerreLeiste = $('duerre-warnung');
  const eigeneDuerre = duerre.insel >= 0 && state.spielzeit < duerre.bis &&
    gebaeude.some(g => g.spieler === ICH && inselMarke &&
      inselMarke[g.y * N + g.x] === duerre.insel);
  if (eigeneDuerre) {
    duerreLeiste.style.display = 'block';
    duerreLeiste.textContent = '🌵 Dürre – deine Felder bringen nur die Hälfte (noch ' +
      Math.ceil(duerre.bis - state.spielzeit) + ' s)';
  } else duerreLeiste.style.display = 'none';

  // Pulsierende Mangel-Warnung: welche Waren fehlen den Einwohnern?
  const mangelWaren = Object.keys(state.mangel || {});
  const mangelLeiste = $('mangel-warnung');
  if (mangelWaren.length && (state.einwohner || 0) > 0 && !pleite) {
    mangelLeiste.style.display = 'block';
    mangelLeiste.innerHTML = '🚨 Mangel an ' +
      mangelWaren.map(w => `${WAREN_EMOJI[w]} ${WAREN_NAME[w]}`).join(', ') +
      '! Produktion ausbauen oder im Kontor zukaufen.';
  } else mangelLeiste.style.display = 'none';

  menueAktualisieren();
  truppenLeisteZeigen();
  truppWahlZeigen();
  if (state.auswahl || (state.truppAuswahl && state.truppInfo)) panelZeigen();
}

// Schreibt HTML nur dann neu, wenn es sich geändert hat. So bleiben die
// Knöpfe stehen, während man sie antippt – sonst ginge mancher Tipp
// verloren, weil die Anzeige mehrmals je Sekunde aufgefrischt wird.
function setzeHtml(el, html) {
  if (el._html === html) return;
  el.innerHTML = html;
  el._html = html;
}

/* --- Truppenleiste (linke Spalte): alle eigenen Heere und Flotten --- */
// Jede Truppe ist eine Marke. Antippen wählt sie aus und holt sie in
// die Bildmitte – so findet man seine Schiffe auch auf einer großen Karte.
function truppenLeisteZeigen() {
  const leiste = $('truppen-leiste');
  let html = '';
  for (const t of truppen) {
    if (t.spieler !== ICH) continue;
    const flotte = t.art === 'flotte';
    html += `<button class="trupp-marke${state.truppAuswahl === t ? ' gewaehlt' : ''}${t.kampf ? ' kampf' : ''}" ` +
            `data-id="${t.id}" title="${flotte ? 'Flotte' : 'Heer'} auswählen">` +
            `${flotte ? '🚢' : '⚔️'} ${Math.round(truppGroesse(t))}` +
            (t.fracht >= 1 ? `<small>+${Math.round(t.fracht)}⚔️</small>` : '') +
            (t.kampf ? '<small>💥</small>' : t.pfad.length ? '<small>➤</small>' : '') +
            `</button>`;
  }
  setzeHtml(leiste, html);
  leiste.style.display = html ? 'flex' : 'none';
}
$('truppen-leiste').addEventListener('click', e => {
  const knopf = e.target.closest('.trupp-marke');
  if (!knopf) return;
  const t = truppen.find(x => x.id === Number(knopf.dataset.id));
  if (t) truppWaehlen(t, true);
});

// Truppe auswählen; mit „springen" rückt sie in die Bildmitte
function truppWaehlen(t, springen) {
  if (state.werkzeug !== 'zeiger') werkzeugWaehlen('zeiger');
  state.truppAuswahl = t;
  state.truppInfo = false;
  state.auswahl = null;
  state.vorschau = null;
  bestaetigungZeigen();
  panelZeigen();
  truppenLeisteZeigen();
  if (springen) kameraAuf(t.x, t.y);
}

/* --- Auswahlleiste: die gewählte Truppe in einer schmalen Zeile --- */
// Statt eines großen Fensters: Stärke, die gerade möglichen Befehle,
// ℹ️ für alle Einzelheiten und ✕ zum Beenden der Auswahl.
function truppWahlZeigen() {
  const leiste = $('trupp-wahl');
  const t = state.truppAuswahl;
  if (t && !truppen.includes(t)) { state.truppAuswahl = null; state.truppInfo = false; }
  const rueckfrage = state.vorschau && state.vorschau.modus === 'befehl';
  if (!state.truppAuswahl || rueckfrage) { leiste.style.display = 'none'; return; }

  const flotte = t.art === 'flotte';
  const zahl = Math.round(truppGroesse(t));
  let text = `${flotte ? '🚢' : '⚔️'} <b>${zahl}</b> ${flotte ? (zahl === 1 ? 'Schiff' : 'Schiffe') : 'Mann'}`;
  if (flotte && t.fracht >= 1) text += ` <small>+${Math.round(t.fracht)} ⚔️ an Bord</small>`;
  if (t.kampf) text += ' <small class="rot">im Gefecht</small>';
  else if (t.pfad.length) text += ' <small>unterwegs</small>';

  let knoepfe = '';
  for (const a of truppAktionen(t))
    knoepfe += `<button class="aktion" data-akt="${a.art}" title="${a.tipp}">${a.text}</button>`;
  if (t.pfad.length) knoepfe += `<button data-akt="halt" title="Anhalten">✋</button>`;
  knoepfe += `<button data-akt="info" class="${state.truppInfo ? 'an' : ''}" title="Einzelheiten zeigen">ℹ️</button>`;
  knoepfe += `<button data-akt="zu" class="zu" title="Auswahl beenden">✕</button>`;

  setzeHtml(leiste, `<span class="tw-text">${text}</span>${knoepfe}`);
  leiste.style.display = 'flex';
}
$('trupp-wahl').addEventListener('click', e => {
  const knopf = e.target.closest('button');
  const t = state.truppAuswahl;
  if (!knopf || !t) return;
  const akt = knopf.dataset.akt;
  if (akt === 'zu') truppAbwaehlen();
  else if (akt === 'info') { state.truppInfo = !state.truppInfo; panelZeigen(); }
  else truppAktion(t, akt);
  truppWahlZeigen();
  truppenLeisteZeigen();
});

/* --- Depesche: eine Nachricht, die nicht übersehen werden darf --- */
// Erscheint groß am oberen Rand und bleibt einige Sekunden stehen
// (Antippen schließt sie sofort). Für Kriegserklärung, Ultimatum, Frieden.
let depescheTimer = null;
function depesche(titel, text, gut) {
  const el = $('depesche');
  el.innerHTML = `<b>${titel}</b>${text || ''}`;
  el.classList.toggle('gut', !!gut);
  el.style.display = 'block';
  clearTimeout(depescheTimer);
  depescheTimer = setTimeout(() => { el.style.display = 'none'; }, 10000);
}
$('depesche').addEventListener('click', () => { $('depesche').style.display = 'none'; });

/* --- Lage-Marken (linke Spalte): was gerade brennt --- */
// Angriff auf die eigene Siedlung, feindliche Truppen in Sicht, laufende
// Kriege, Friedensangebote, Seeblockade. Antippen führt zum Ort bzw.
// zur Diplomatie.
function feindInSicht() {
  let naechster = null, naechsteD = 16;
  for (const t of truppen) {
    if (t.spieler === ICH || !imKriegMit(ICH, t.spieler)) continue;
    for (const g of gebaeude) {
      if (g.typ !== 'kontor' || g.spieler !== ICH) continue;
      const z = zentrum(g);
      const dist = Math.hypot(z.x - t.x, z.y - t.y);
      if (dist < naechsteD) { naechsteD = dist; naechster = t; }
    }
  }
  return naechster;
}
function lageZeigen() {
  let html = '';
  if (state.alarm && state.alarm.bis > state.spielzeit)
    html += `<button class="lage-marke alarm" data-akt="alarm">🚨 Angriff!</button>`;
  const feind = feindInSicht();
  if (feind)
    html += `<button class="lage-marke alarm" data-akt="feind">⚠️ ${feind.art === 'flotte' ? 'Flotte' : 'Heer'} ` +
            `von ${spieler[feind.spieler].name} in Sicht</button>`;
  if (spieler[ICH].blockiert)
    html += `<button class="lage-marke" data-akt="feind">⚓ Blockade: Handel −${Math.round(STIMMUNG.blockade * 100)} %</button>`;
  if (piraten.some(p => p.ziel === ICH && p.lauert))
    html += `<button class="lage-marke grau" data-akt="pirat">🏴‍☠️ Piraten: Handel −${Math.round(PIRATEN.malus * 100)} %</button>`;
  for (const g of spieler) {
    if (g.id === ICH) continue;
    if (friedensAngebot[g.id][ICH] > state.spielzeit && imKriegMit(ICH, g.id))
      html += `<button class="lage-marke ruhig" data-akt="frieden" data-id="${g.id}">🕊️ Frieden mit ${g.name} annehmen</button>`;
    else if (imKriegMit(ICH, g.id))
      html += `<button class="lage-marke" data-akt="diplo">⚔️ Krieg: ${g.name}</button>`;
    else if (g.ki && g.ultimatum && g.ultimatum.gegen === ICH)
      html += `<button class="lage-marke alarm" data-akt="diplo">🔥 Ultimatum von ${g.name} ` +
              `(${Math.max(0, Math.ceil(g.ultimatum.ab - state.spielzeit))} s)</button>`;
  }
  setzeHtml($('lage'), html);
}
$('lage').addEventListener('click', e => {
  const knopf = e.target.closest('.lage-marke');
  if (!knopf) return;
  const akt = knopf.dataset.akt;
  if (akt === 'alarm' && state.alarm) kameraAuf(state.alarm.x, state.alarm.y);
  else if (akt === 'feind') { const f = feindInSicht(); if (f) kameraAuf(f.x, f.y); }
  else if (akt === 'pirat') {
    const p = piraten.find(x => x.ziel === ICH && x.lauert);
    if (p) { kameraAuf(p.x, p.y); if (!state.truppAuswahl) piratAngetippt(p); }
  }
  else if (akt === 'frieden') diploAktion('angebot', Number(knopf.dataset.id));
  else if (akt === 'diplo') diplomatieOeffnen();
});

// Krieg erklärt man nicht aus Versehen: erst das zweite Antippen zählt
function kriegErklaerenKnopf(id) {
  const jetzt = performance.now();
  if (state.kriegFrage === id && jetzt < state.kriegFrageBis) {
    state.kriegFrage = null;
    diploAktion('krieg', id);
  } else {
    state.kriegFrage = id;
    state.kriegFrageBis = jetzt + 5000;
    panelZeigen();
  }
}

// Der Punktestand ist zugleich die Tür zur Diplomatie
function diplomatieOeffnen() {
  const kontor = spieler[ICH].kontor;
  if (!kontor) { melden('Erst mit einem eigenen Kontor kannst du verhandeln'); return; }
  if (state.werkzeug !== 'zeiger') werkzeugWaehlen('zeiger');
  state.truppAuswahl = null; state.truppInfo = false;
  state.auswahl = kontor;
  state.kontorTab = 'diplomatie';
  panelZeigen();
  truppWahlZeigen();
}
$('punkte').addEventListener('click', diplomatieOeffnen);

// Voraussichtliche Auslastung eines Gebäudes an einem Bauplatz
// (wird an der Bau-Vorschau und in der Bestätigung angezeigt)
function effVorschau(typ, ax, ay) {
  const def = GEBAEUDE[typ];
  const cx = ax + def.w / 2, cy = ay + def.h / 2;
  if (FELD_FARMEN.has(typ)) return Math.min(1, feldPlaetze(typ, ax, ay).length / 6);
  switch (typ) {
    case 'fischer':     return Math.min(1, wasserImUmkreis(cx, cy, def.radius) / 6);
    case 'jagd':        return Math.min(1, baeumeImUmkreis(cx, cy, def.radius) / 5);
    case 'holzfaeller': return Math.min(1, baeumeImUmkreis(cx, cy, def.radius) / 4);
    case 'ziegelei':  return steinKachelImUmkreis(cx, cy, def.radius) ? 1 : 0;
    case 'eisenmine': return eisenKachelImUmkreis(cx, cy, def.radius) ? 1 : 0;
    case 'goldmine':  return goldKachelImUmkreis(cx, cy, def.radius) ? 1 : 0;
    case 'goldschmiede':
      return goldKachelImUmkreis(cx, cy, def.radius) ? 1 : 0;
    default: return null;
  }
}

// Eingangswaren der Verarbeitungs-Betriebe (für die Auslastungs-Erklärung)
const VERARBEITER_REIN = { weberei: 'wolle', brennerei: 'zuckerrohr',
  muehle: 'getreide', baeckerei: 'mehl', tabakladen: 'tabakblaetter',
  schneiderei: 'stoffe' };

// Erklärt in Worten, woraus sich die Auslastung eines Betriebs ergibt
function auslastungGrund(geb) {
  const def = GEBAEUDE[geb.typ];
  const z = zentrum(geb);
  const lager = spieler[geb.spieler].res;
  switch (geb.typ) {
    case 'fischer':
      return `${wasserImUmkreis(z.x, z.y, def.radius)} von 6 nötigen Wasser-/Flussfeldern im Umkreis`;
    case 'jagd':
      return `Waldbestand im Umkreis: ${baeumeImUmkreis(z.x, z.y, def.radius).toFixed(1)} von 5 nötig`;
    case 'holzfaeller':
      return `Waldbestand im Umkreis: ${baeumeImUmkreis(z.x, z.y, def.radius).toFixed(1)} von 4 nötig (Bäume wachsen langsam nach)`;
    case 'schaffarm': case 'getreidefarm': case 'zuckerrohr':
    case 'tabakplantage': case 'gewuerzplantage': case 'rinderfarm': {
      const insel = inselMarke ? inselMarke[geb.y * N + geb.x] : -1;
      const bf = bodenFaktor(insel, geb.typ);
      const trocken = duerre.insel === insel && state.spielzeit < duerre.bis;
      return `${(geb.felder || []).length} von 6 eigenen Feldern (3×3) angelegt · ` +
             `Boden: ×${bf.toFixed(2).replace('.', ',')} (${bodenText(bf)})` +
             (trocken ? ' · <b style="color:var(--rot)">🌵 Dürre: nur die Hälfte</b>' : '');
    }
    case 'ziegelei':
      return steinKachelImUmkreis(z.x, z.y, def.radius)
        ? 'Gesteinsvorkommen in Reichweite – volle Leistung'
        : 'Kein Gestein mehr in Reichweite – Produktion steht!';
    case 'goldschmiede':
      return goldKachelImUmkreis(z.x, z.y, def.radius)
        ? '🪙 Goldvorkommen in Reichweite – volle Leistung'
        : 'Kein Golderz mehr in Reichweite – Produktion steht!';
    case 'eisenmine': {
      const erz = eisenKachelImUmkreis(z.x, z.y, def.radius);
      return erz ? `Eisenvorkommen in Reichweite (noch ${erz.eisen} Erz)`
                 : 'Kein Eisen mehr in Reichweite – Förderung steht!';
    }
    case 'goldmine': {
      const ader = goldKachelImUmkreis(z.x, z.y, def.radius);
      return ader ? `Goldader in Reichweite (noch ${ader.golderz})`
                  : 'Die Goldader ist erschöpft!';
    }
    default: {
      const rein = VERARBEITER_REIN[geb.typ];
      if (rein) return `Läuft nur, solange ${WAREN_EMOJI[rein]} ${WAREN_NAME[rein]} im Lager ist (${Math.floor(lager[rein])} vorrätig)`;
      return '';
    }
  }
}

// Die Diplomatie-Ansicht des eigenen Kontors: für jeden Gegner Stimmung,
// Wesen und die Knöpfe, die gerade etwas bewirken
function diplomatieHtml() {
  let html = '';

  html += `<div class="beschr" style="margin:2px 0 6px">Krieg gibt es nur nach einer Kriegserklärung. 🎁 Geschenke bessern die Stimmung; 💼 Bestechung, ⛔ Embargo und heimlich angeheuerte 🏴‍☠️ Piraten kürzen den Handel des Gegners.</div>`;
  html += `<div class="diplo-knoepfe"><button class="gut" onclick="diploAktion('privileg',-1)">` +
          `📜 Handelsprivileg (${DIPLO.privileg.gold}💰) +${Math.round(DIPLO.privileg.bonus * 100)} %</button></div>`;
  if (!spieler.some(g => g.id !== ICH && g.kontor))
    html += `<div class="beschr" style="margin-top:8px">Noch ist keine Konkurrenz gelandet. Sobald jemand eine Insel besiedelt, kannst du hier verhandeln, sanktionieren – oder den Krieg erklären.</div>`;
  for (const geg of spieler) {
    if (geg.id === ICH || !geg.kontor) continue;
    const w = feindschaft[ICH][geg.id], st = feindStufe(ICH, geg.id);
    const krieg = imKriegMit(ICH, geg.id);
    html += `<div class="diplo-kopf"><span style="color:${geg.farbe}">● ${geg.name}</span>` +
            `<span style="color:${st.farbe}">${st.emoji} ${st.name}</span></div>`;
    if (geg.ki) html += `<div class="beschr" style="margin:0">${kiWesen(geg).art}</div>`;
    html += `<div class="diplo-balken"><div style="width:${krieg ? 100 : w}%;background:${st.farbe}"></div></div>`;
    if (krieg) {
      const angebot = friedensAngebot[geg.id][ICH] > state.spielzeit;
      const gefragt = friedensAngebot[ICH][geg.id] > state.spielzeit;
      html += `<div class="diplo-knoepfe">` +
        (angebot
          ? `<button class="gut" onclick="diploAktion('angebot',${geg.id})">🕊️ Friedensangebot annehmen</button>`
          : `<button class="gut" ${gefragt ? 'disabled style="opacity:.5"' : ''} onclick="diploAktion('angebot',${geg.id})">🕊️ Frieden anbieten</button>`) +
        `<button onclick="diploAktion('frieden',${geg.id})">💰 Frieden erkaufen ${DIPLO.frieden.gold}</button>` +
        `</div>`;
    } else {
      const ruhe = waffenruhe[ICH][geg.id] - state.spielzeit;
      const fragt = state.kriegFrage === geg.id && performance.now() < state.kriegFrageBis;
      html += `<div class="diplo-knoepfe">` +
        `<button class="gut" onclick="diploAktion('geschenk',${geg.id})">🎁 ${DIPLO.geschenk.gold}💰</button>` +
        `<button onclick="diploAktion('bestechen',${geg.id})">💼 Bestechen ${DIPLO.bestechen.gold}💰</button>` +
        `<button class="${spieler[ICH].embargo[geg.id] ? 'an' : ''}" onclick="diploAktion('embargo',${geg.id})">` +
          `⛔ Embargo${spieler[ICH].embargo[geg.id] ? ' läuft' : ''}</button>` +
        `<button onclick="diploAktion('piraten',${geg.id})" title="Heimlich: kostet kein Ansehen – außer es fliegt auf">` +
          `🏴‍☠️ Piraten ${PIRATEN.anheuern}💰</button>` +
        (ruhe > 0
          ? `<button disabled style="opacity:.5">🕊️ Waffenruhe ${Math.ceil(ruhe)} s</button>`
          : `<button class="${fragt ? 'an' : 'boese'}" onclick="kriegErklaerenKnopf(${geg.id})">` +
            `${fragt ? '⚔️ Wirklich? Nochmal tippen' : '⚔️ Krieg erklären'}</button>`) +
        `</div>`;
    }
  }

  return html;
}

// Info-Fenster ein- oder ausblenden. Die Klasse am <body> sagt dem
// Layout, dass das Fenster gerade Platz braucht (siehe CSS).
function panelSichtbar(an) {
  $('info-panel').style.display = an ? 'block' : 'none';
  document.body.classList.toggle('panel-offen', an);
}

// Info-Panel für das ausgewählte Gebäude
function panelZeigen() {
  // Einzelheiten zur ausgewählten Truppe – nur, wenn sie mit ℹ️ in der
  // Auswahlleiste aufgeklappt wurden (sonst bleibt die Karte frei)
  const tr = state.truppAuswahl;
  if (tr && truppen.includes(tr) && state.truppInfo) {
    panelSichtbar(true);
    const istFlotte = tr.art === 'flotte';
    let h = `<h2><span>${istFlotte ? '🚢' : '⚔️'}</span> ${istFlotte ? 'Flotte' : 'Heer'}</h2>`;
    h += `<div class="beschr">` +
         (istFlotte
           ? 'Aufs Wasser tippen: die Flotte segelt sofort los. Feindliches Schiff oder Gebäude antippen: Angriff. Mit Soldaten an Bord aufs Land tippen: dort wird gelandet.'
           : 'Aufs Land tippen: das Heer marschiert sofort los. Feindliches Heer oder Gebäude antippen: Angriff. Über „⚓" geht es an Bord einer eigenen Flotte am Ufer.') +
         `</div>`;
    h += `<div class="zeile"><span>${istFlotte ? 'Kriegsschiffe' : 'Soldaten'}</span>` +
         `<span>${Math.round(truppGroesse(tr))}</span></div>`;
    if (istFlotte) {
      h += `<div class="zeile"><span>Truppen an Bord</span><span>${Math.round(tr.fracht)}</span></div>`;
      const k = tr.kanonen || 0;
      h += `<div class="zeile"><span>Kanonen</span><span>` +
           '🔫'.repeat(k) + '·'.repeat(KANONEN_MAX - k) +
           (k ? ` (+${Math.round(KANONEN_SEEBONUS * k * 100)} % See)` : '') + `</span></div>`;
    }
    h += `<div class="zeile"><span>Kampfkraft</span><span>${Math.round(staerke(tr))}</span></div>`;
    h += `<div class="zeile"><span>Moral</span><span>${Math.round(tr.moral * 100)} %</span></div>`;
    h += `<div class="auslast-balken"><div style="width:${Math.round(tr.moral * 100)}%"></div></div>`;
    // Nachschub erklärt, warum eine Truppe fern der Heimat schwächer ist
    const nach = Math.round(nachschub(tr) * 100);
    h += `<div class="zeile" style="margin-top:6px"><span>Nachschub</span>` +
         `<span style="color:${nach >= 100 ? 'var(--accent-dunkel)' : nach >= 80 ? 'var(--text)' : 'var(--rot)'}">${nach} %</span></div>`;
    if (nach < 100)
      h += `<div class="beschr">Weit weg von eigenen Kontoren und Märkten kämpft es sich schlechter.</div>`;
    h += `<div class="zeile"><span>Sold</span><span>` +
         `${((tr.mann + tr.fracht) * KRIEG.sold * 60 + tr.schiffe * KRIEG.soldSchiff * 60).toFixed(0)} 💰/min</span></div>`;

    if (istFlotte && (tr.kanonen || 0) < KANONEN_MAX) {
      const kk = Object.entries(KANONEN_KOSTEN)
        .map(([ware, menge]) => `${WAREN_EMOJI[ware]}${menge}`).join(' ');
      const beiWerft = !!werftNahe(tr);
      h += `<button class="abriss-knopf" style="background:${beiWerft ? '#eef2ff' : '#f3f4f6'};color:${beiWerft ? '#4338ca' : 'var(--text-leise)'}" ` +
           `onclick="kanonenNachruesten(state.truppAuswahl)">🔫 Kanonen nachrüsten (${kk})` +
           (beiWerft ? '' : ' – bei der Werft') + `</button>`;
    }
    h += `<button class="abriss-knopf" onclick="truppAufloesen()">🏳️ Truppe auflösen</button>`;
    setzeHtml($('panel-inhalt'), h);
    return;
  }

  const geb = state.auswahl;
  if (!geb) { panelSichtbar(false); return; }
  panelSichtbar(true);

  const def = GEBAEUDE[geb.typ];
  const info = GEB_INFO[geb.typ] || {};
  const kopfEmoji = geb.typ === 'wohnhaus' ? STUFEN[geb.stufe].emoji : def.emoji;
  const besitzer = spieler[geb.spieler];
  let html = `<h2><span>${kopfEmoji}</span> ${def.name}</h2>`;

  // Am eigenen Kontor zeigt der Reiter „Diplomatie" nur die Diplomatie –
  // ohne die Gebäude-Angaben, damit auf dem Handy nichts weggescrollt werden muss
  if (geb.typ === 'kontor' && geb.spieler === ICH && state.kontorTab === 'diplomatie') {
    html += `<div class="tab-leiste">` +
      `<button onclick="kontorTab('handel')">⚖️ Handel</button>` +
      `<button class="aktiv" onclick="kontorTab('diplomatie')">🏛️ Diplomatie</button>` +
      `</div>` + diplomatieHtml();
    setzeHtml($('panel-inhalt'), html);
    return;
  }

  html += `<div class="beschr">${def.beschr}</div>`;
  if (geb.spieler !== ICH)
    html += `<div class="zeile"><span>Besitzer</span>` +
            `<span style="color:${besitzer.farbe}">● ${besitzer.name}</span></div>`;

  // Was das Gebäude produziert, verbraucht und wo es wirkt
  if (info.produziert) html += `<div class="zeile"><span>Produziert</span><span>${info.produziert}</span></div>`;
  if (info.verbraucht) html += `<div class="zeile"><span>Verbraucht</span><span>${info.verbraucht}</span></div>`;
  if (info.standort)   html += `<div class="zeile"><span>Standort</span><span>${info.standort}</span></div>`;

  if (geb.typ === 'wohnhaus') {
    const z = zentrum(geb);
    const st = STUFEN[geb.stufe];
    const naechste = STUFEN[geb.stufe + 1];
    html += `<div class="zeile"><span>Stufe</span><span>${st.emoji} ${st.name}</span></div>`;
    html += `<div class="zeile"><span>Einwohner</span><span>${geb.ew} / ${geb.maxEw}</span></div>`;
    html += `<div class="zeile"><span>Stimmung</span><span>${geb.zufrieden ? '😊 zufrieden' : '😠 unzufrieden'}</span></div>`;
    html += '<hr><b style="font-size:12px">Bedürfnisse</b>';
    html += beduerfnis('Marktanbindung', marktAnbindung(z.x, z.y, geb.spieler));
    html += beduerfnis('🍞 Nahrung', !besitzer.hunger);
    for (const ware of Object.keys(st.brauch))
      html += beduerfnis(`${WAREN_EMOJI[ware]} ${WAREN_NAME[ware]}`, !besitzer.mangel[ware]);
    if (naechste) {
      html += `<hr><b style="font-size:12px">Für den Aufstieg zu ${st.dativ}</b>`;
      for (const ware of Object.keys(naechste.brauch))
        html += beduerfnis(`${WAREN_EMOJI[ware]} ${WAREN_NAME[ware]} im Lager`, besitzer.res[ware] > 0.5);
      if (naechste.material)
        for (const [ware, menge] of Object.entries(naechste.material))
          html += beduerfnis(`${WAREN_EMOJI[ware]} ${menge} ${WAREN_NAME[ware]} (Baumaterial)`,
                             besitzer.res[ware] >= menge);
      if (naechste.gebaeudeNah)
        html += beduerfnis(`${GEBAEUDE[naechste.gebaeudeNah].emoji} ${GEBAEUDE[naechste.gebaeudeNah].name} in Reichweite`,
                           gebaeudeInReichweite(naechste.gebaeudeNah, z.x, z.y, geb.spieler));
      html += beduerfnis(`Gut gefülltes Haus (ab ${Math.ceil(st.maxEw * 0.75)} Ew.)`,
                         geb.ew >= Math.ceil(st.maxEw * 0.75));
    }
  } else if (def.dauer) {
    const prozent = Math.round(geb.eff * 100);
    html += `<div class="zeile"><span>Auslastung</span><span>${prozent} %</span></div>`;
    html += `<div class="auslast-balken"><div style="width:${prozent}%"></div></div>`;
    const grund = auslastungGrund(geb);
    if (grund) html += `<div class="beschr" style="margin-top:5px">${grund}</div>`;
    html += `<div class="zeile" style="margin-top:6px"><span>Produktionstakt</span><span>alle ${def.dauer} s</span></div>`;
    html += `<div class="zeile"><span>Unterhalt</span><span>${(def.unterhalt * 60).toFixed(0)} 💰/min</span></div>`;
  } else {
    // Tatsächlicher Radius – wächst mit der Ausbaustufe
    if (def.marktRadius) html += `<div class="zeile"><span>Versorgungsradius</span><span>${wirkRadius(geb)} Felder</span></div>`;
    if (def.radius) html += `<div class="zeile"><span>Wirkungsradius</span><span>${wirkRadius(geb)} Felder</span></div>`;
    if (def.unterhalt) html += `<div class="zeile"><span>Unterhalt</span><span>${(def.unterhalt * 60).toFixed(0)} 💰/min</span></div>`;
  }

  // Reiter-Umschalter am eigenen Kontor
  if (geb.typ === 'kontor' && geb.spieler === ICH) {
    html += `<div class="tab-leiste">` +
      `<button class="${state.kontorTab === 'handel' ? 'aktiv' : ''}" onclick="kontorTab('handel')">⚖️ Handel</button>` +
      `<button class="${state.kontorTab === 'diplomatie' ? 'aktiv' : ''}" onclick="kontorTab('diplomatie')">🏛️ Diplomatie</button>` +
      `</div>`;
  }

  // Handel: nur am eigenen Kontor – kaufen ist teurer als verkaufen
  if (geb.typ === 'kontor' && geb.spieler === ICH && state.kontorTab === 'handel') {
    // Handelskontingent: der Markt ist endlich
    const ich = spieler[ICH];
    const anteil = Math.round(ich.kontingent / Math.max(1, ich.kontingentMax) * 100);
    html += `<hr><div class="zeile"><span>📦 Handelskontingent</span>` +
            `<span>${Math.floor(ich.kontingent)} / ${ich.kontingentMax}</span></div>`;
    html += `<div class="auslast-balken"><div style="width:${anteil}%"></div></div>`;
    html += `<div class="beschr" style="margin-top:4px">Wächst mit deiner Bevölkerung und jedem Kontor. ` +
            (ich.handelsMalus > 0 ? `<b style="color:var(--rot)">Sanktionen: −${Math.round(ich.handelsMalus * 100)} %</b> ` : '') +
            (ich.handelsBonus > 0 ? `<b style="color:var(--accent-dunkel)">Privileg: +${Math.round(ich.handelsBonus * 100)} %</b>` : '') +
            `</div>`;

    html += '<hr><b style="font-size:12px">⚖️ Handel</b>' +
      '<div class="beschr" style="margin:2px 0 4px">Preise je Stück (Kauf/Verkauf) folgen der Nachfrage und können bis auf das Sechsfache steigen – auch die Konkurrenz kauft hier ein! ▲ teuer · ▼ günstig. Mit den 🔄-Knöpfen handelt dein Kontor automatisch.</div>';
    for (const ware of Object.keys(PREISE)) {
      const f = markt[ware];
      const trend = f > 1.15 ? ' <span style="color:#dc2626">▲</span>'
                  : f < 0.87 ? ' <span style="color:#2563eb">▼</span>' : '';
      html += `<div class="handel-zeile">
        <span>${WAREN_EMOJI[ware]} <b>${Math.floor(res[ware])}</b>${trend}
          <small style="color:var(--text-leise)">${kaufpreis(ware)}/${verkaufspreis(ware)}💰</small></span>
        <span>
          <button class="handel-verkauf" title="200 verkaufen (+${verkaufspreis(ware) * 200}💰)" onclick="handel('${ware}',-200)">−200</button>
          <button class="handel-verkauf" title="50 verkaufen (+${verkaufspreis(ware) * 50}💰)" onclick="handel('${ware}',-50)">−50</button>
          <button class="handel-verkauf" title="10 verkaufen (+${verkaufspreis(ware) * 10}💰)" onclick="handel('${ware}',-10)">−10</button>
          <button class="handel-kauf" title="10 kaufen (−${kaufpreis(ware) * 10}💰)" onclick="handel('${ware}',10)">+10</button>
          <button class="handel-kauf" title="50 kaufen (−${kaufpreis(ware) * 50}💰)" onclick="handel('${ware}',50)">+50</button>
          <button class="handel-kauf" title="200 kaufen (−${kaufpreis(ware) * 200}💰)" onclick="handel('${ware}',200)">+200</button>
        </span></div>`;
      const regel = autoHandel[ware];
      html += `<div class="auto-zeile">
        <button class="${regel.kauf !== null ? 'auto-an' : ''}" onclick="autoKaufWechseln('${ware}')"
          title="Kauft automatisch nach, sobald der Bestand unter diese Grenze fällt">
          🔄 Nachkaufen: ${regel.kauf !== null ? 'unter ' + regel.kauf : 'aus'}</button>
        <button class="${regel.verkauf !== null ? 'auto-an' : ''}" onclick="autoVerkaufWechseln('${ware}')"
          title="Verkauft automatisch, sobald der Bestand über dieser Grenze liegt">
          🔄 Verkaufen: ${regel.verkauf !== null ? 'über ' + regel.verkauf : 'aus'}</button>
      </div>`;
    }
  }

  // Ausbaustufe und Ausbau-Knopf
  const stufeJetzt = geb.ausbau || 1;
  html += `<div class="zeile"><span>Ausbaustufe</span><span>` +
          '★'.repeat(stufeJetzt) + '☆'.repeat(AUSBAU_MAX - stufeJetzt) + `</span></div>`;
  html += `<div class="zeile"><span>Wirkung</span><span>${ausbauWirkung(geb, stufeJetzt)}</span></div>`;
  if (geb.spieler === ICH && stufeJetzt < AUSBAU_MAX) {
    const k = Object.entries(ausbauKosten(geb))
      .map(([ware, menge]) => `${WAREN_EMOJI[ware]}${menge}`).join(' ');
    html += `<div class="beschr" style="margin-top:4px">Stufe ${stufeJetzt + 1} bringt: ` +
            `<b>${ausbauWirkung(geb, stufeJetzt + 1)}</b>` +
            (GEBAEUDE[geb.typ].unterhalt ? ` – dafür ${(GEBAEUDE[geb.typ].unterhalt * (stufeJetzt + 1) * 60).toFixed(0)} 💰/min Unterhalt` : '') +
            `</div>`;
    html += `<button class="abriss-knopf" style="background:#eef2ff;color:#4338ca" ` +
            `onclick="ausbauen(state.auswahl)">⬆️ Auf Stufe ${stufeJetzt + 1} ausbauen (${k})</button>`;
  }

  // Zustand des Gebäudes, sobald es beschädigt ist
  if (geb.hp < geb.maxHp)
    html += `<div class="zeile"><span>Zustand</span><span style="color:var(--rot)">` +
            `${Math.max(0, Math.round(geb.hp))} / ${geb.maxHp} 🛡️</span></div>`;

  // Militärgebäude: Truppen ausheben bzw. Schiffe bauen
  if (geb.spieler === ICH && geb.typ === 'kaserne') {
    const kap = soldatenKapazitaet(ICH), jetzt = soldatenAktuell(ICH);
    html += `<div class="zeile"><span>Soldaten</span><span>${jetzt} / ${kap}</span></div>`;
    html += `<div class="auslast-balken"><div style="width:${Math.min(100, kap ? jetzt / kap * 100 : 0)}%"></div></div>`;
    html += `<div class="beschr" style="margin-top:4px">Jede Ausbaustufe schafft Platz für ${KASERNE_KAPAZITAET} weitere Soldaten.</div>`;
    const k = Object.entries(TRUPP_KOSTEN).map(([w, m]) => `${WAREN_EMOJI[w]}${m}`).join(' ');
    html += `<button class="abriss-knopf" style="background:#f0fdf4;color:var(--accent-dunkel)" ` +
            `onclick="ausheben(state.auswahl); panelZeigen()">⚔️ ${TRUPP_MANN} Mann ausheben (${k} + 👥${TRUPP_EINWOHNER})</button>`;
  }
  if (geb.spieler === ICH && geb.typ === 'werft') {
    const k = Object.entries(SCHIFF_KOSTEN).map(([w, m]) => `${WAREN_EMOJI[w]}${m}`).join(' ');
    html += `<button class="abriss-knopf" style="background:#f0fdf4;color:var(--accent-dunkel)" ` +
            `onclick="schiffBauen(state.auswahl); panelZeigen()">🚢 Kriegsschiff bauen (${k})</button>`;
  }

  if (geb.spieler === ICH)
    html += `<button class="abriss-knopf" onclick="abreissenAuswahl()">🧨 Abreißen</button>`;
  setzeHtml($('panel-inhalt'), html);
}

// Kurze Meldung am unteren Rand; gleiche Meldungen werden gedrosselt
let toastTimer = null;
const meldungZuletzt = {};
function melden(text, schluessel, sperre = 8000) {
  const jetzt = performance.now();
  if (schluessel) {
    if (meldungZuletzt[schluessel] && jetzt - meldungZuletzt[schluessel] < sperre) return;
    meldungZuletzt[schluessel] = jetzt;
  }
  const toast = $('toast');
  toast.textContent = text;
  toast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = 0; }, 2600);
}

/* ---------- 10. MUSIK (Web Audio API) ------------------------- */
// Ein sehr ruhiger, generativer Klangteppich: alle paar Sekunden ein
// weicher Akkord aus Sinustönen – ganz ohne Audiodateien.

const musik = { an: false, ctx: null, timer: null, takt: 0 };
const AKKORDE = [                       // sanfte Folge in C-Dur
  [130.8, 261.6, 329.6, 392.0],         // C
  [110.0, 220.0, 261.6, 329.6],         // Am
  [87.3, 174.6, 220.0, 261.6],          // F
  [98.0, 196.0, 246.9, 293.7],          // G
];

function akkordSpielen() {
  const ac = musik.ctx, t = ac.currentTime;
  const noten = AKKORDE[musik.takt++ % AKKORDE.length];
  for (let i = 0; i < noten.length; i++) {
    const osc = ac.createOscillator();
    const laut = ac.createGain();
    osc.type = i === 0 ? 'triangle' : 'sine';   // Bass etwas wärmer
    osc.frequency.value = noten[i];
    // Weich ein- und ausblenden, damit nichts knackt
    laut.gain.setValueAtTime(0, t);
    laut.gain.linearRampToValueAtTime(i === 0 ? 0.035 : 0.028, t + 1.4);
    laut.gain.linearRampToValueAtTime(0, t + 4.2);
    osc.connect(laut).connect(ac.destination);
    osc.start(t);
    osc.stop(t + 4.3);
  }
}

function musikUmschalten() {
  if (!musik.an) {
    if (!musik.ctx) musik.ctx = new (window.AudioContext || window.webkitAudioContext)();
    musik.ctx.resume();
    musik.an = true;
    akkordSpielen();
    musik.timer = setInterval(akkordSpielen, 4400);
  } else {
    musik.an = false;
    clearInterval(musik.timer);
  }
  $('k-musik').classList.toggle('aktiv', musik.an);
}
$('k-musik').addEventListener('click', musikUmschalten);

/* ---------- 11. HAUPTSCHLEIFE --------------------------------- */

// Die Kamera auf eine Kachel ausrichten (Kachelmitte in die Bildmitte)
function kameraAuf(tx, ty) {
  kamera.x = isoX(tx, ty) - leinwand.clientWidth / (2 * kamera.zoom);
  kamera.y = isoY(tx, ty) - leinwand.clientHeight / (2 * kamera.zoom);
  kameraBegrenzen();
}

function kameraStart() {
  // Start: Blick aufs Schiff, so weit herausgezoomt, dass man das Meer
  // und die nächsten Inseln gut sieht (auf ca. 30 Kacheln Sichtweite)
  const wunsch = Math.min(leinwand.clientWidth, leinwand.clientHeight) / (26 * KH);
  kamera.zoom = Math.min(1.1, Math.max(0.3, wunsch));
  kameraAuf(schiff.x, schiff.y);
}

// 🧭-Knopf: Kamera zurück zum Kontor (oder zum Schiff)
function zentrieren() {
  const kontor = spieler[ICH].kontor;          // das EIGENE Kontor, nicht irgendeines
  const ziel = kontor ? zentrum(kontor) : { x: schiff.x, y: schiff.y };
  kameraAuf(ziel.x, ziel.y);
}
$('k-mitte').addEventListener('click', zentrieren);
$('k-speichern').addEventListener('click', () => spielSpeichern(false));
$('k-netz').addEventListener('click', mpFensterZeigen);
$('k-laden').addEventListener('click', () => spielLaden(false));

// Alle 30 Sekunden und beim Verlassen automatisch sichern
setInterval(() => { if (state.kontorGebaut && !state.vorbei && !istGast()) spielSpeichern(true); }, 30000);
window.addEventListener('pagehide', () => { if (state.kontorGebaut && !istGast()) spielSpeichern(true); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && state.kontorGebaut && !istGast()) spielSpeichern(true);
});

let zuletzt = performance.now();
let uiTakt = 0;

function schleife(jetzt) {
  let dt = (jetzt - zuletzt) / 1000;
  zuletzt = jetzt;
  dt = Math.min(dt, 0.1);   // große Sprünge (Tab im Hintergrund) abfangen

  const laeuft = !state.pause && !state.vorbei && (!state.gewonnen || state.weiterspielen);
  if (laeuft) {
    if (istGast()) {
      // Der Gast rechnet nichts – er zeichnet nur, was der Gastgeber meldet
      truppenGlaetten(dt);
    } else {
      schiffUpdate(dt * state.tempo);
      kiSchiffeUpdate(dt * state.tempo);
      simSchritt(dt * state.tempo);
      mpSenden(dt);
    }
  }

  zeichnen();

  uiTakt += dt;
  if (uiTakt >= 0.25) { uiTakt = 0; uiAktualisieren(); }

  requestAnimationFrame(schleife);
}

// --- Als App: Service Worker anmelden, damit das Spiel auch
//     ohne Internet startet. Scheitert still, wenn die Datei
//     lokal (file://) geöffnet wird – dann läuft es trotzdem.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// --- Los geht's ---
for (const ware of Object.keys(PREISE)) {
  markt[ware] = 1;
  autoHandel[ware] = { kauf: null, verkauf: null };
}
// Alle starten im Frieden (leichte Grundspannung zwischen Konkurrenten)
feindschaft = spieler.map((_, a) => spieler.map((_, b) => (a === b ? 0 : 25)));
weltErzeugen();
schiffStart();
// Jede Partei bekommt ihr eigenes Schiff – alle liegen am selben Punkt
for (const sp of spieler) sp.schiff = { x: schiff.x, y: schiff.y, pfad: [] };
schiff = spieler[ICH].schiff;
menueBauen();
kameraStart();
leinwand.classList.add('bauen');   // Start-Werkzeug ist das Kontor
uiAktualisieren();
requestAnimationFrame(schleife);

// Liegt ein Spielstand vor? Dann fragen, ob fortgesetzt werden soll.
if (standVorhanden()) {
  $('overlay').style.display = 'flex';
  $('overlay-box').innerHTML = `
    <div class="gross">💾</div>
    <h1>Weiterspielen?</h1>
    <p>Es liegt ein gespeicherter Spielstand vor.<br>
       Du kannst ihn fortsetzen oder eine neue Welt beginnen.</p>
    <button class="knopf-gruen" onclick="spielFortsetzen()">Fortsetzen</button>
    <button class="knopf-grau" onclick="neueWelt()">Neue Welt</button>`;
}
function spielFortsetzen() {
  if (!spielLaden(true)) { $('overlay').style.display = 'none'; return; }
  melden('📂 Weiter geht\'s!');
}
function neueWelt() {
  standLoeschen();
  $('overlay').style.display = 'none';
}
