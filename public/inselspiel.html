// Ein Klick (kein Ziehen) auf die Karte
function klickAufKarte(sx, sy) {
  if (state.vorbei) return;
  const t = bildschirmZuKachel(sx, sy);

  // Tipp aufs Wasser: das Schiff segelt dorthin. Mit dem Zeiger-Werkzeug
  // geht das jederzeit, vor dem Kontor-Bau sogar mit jedem Werkzeug.
  if (t && kachel(t.x, t.y).typ === 'wasser' &&
      (state.werkzeug === 'zeiger' || !state.kontorGebaut)) {
    const weg = segelWeg(t.x, t.y);
    if (weg) {
      schiff.pfad = weg;
      if (!state.kontorGebaut) melden('⛵ Leinen los!', 'segeln');
    } else melden('Dorthin führt kein Seeweg');
    state.auswahl = null; panelZeigen();
    return;
  }

  if (state.werkzeug === 'zeiger') {
    state.auswahl = t ? belegtAuf(t.x, t.y) : null;
    panelZeigen();
  } else if (state.werkzeug === 'abriss') {
    // Nicht sofort abreißen – erst die Bestätigung einholen
    const geb = t && belegtAuf(t.x, t.y);
    if (geb && geb.spieler !== 0) {
      melden(`Das gehört ${spieler[geb.spieler].name}!`);
      state.vorschau = null;
    } else {
      state.vorschau = geb ? { modus: 'abriss', geb } : null;
    }
    bestaetigungZeigen();
  } else if (t) {
    // Nicht sofort bauen – die Vorschau wartet auf den ✓-Knopf.
    // Erneutes Tippen an anderer Stelle verschiebt die Vorschau.
    state.vorschau = { modus: 'bau', typ: state.werkzeug, tx: t.x, ty: t.y };
    bestaetigungZeigen();
  }
}

// Tastatur: Pfeile/WASD verschieben, Leertaste pausiert, 1–3 Tempo, Esc Zeiger
window.addEventListener('keydown', e => {
  const schritt = 90 / kamera.zoom;
  switch (e.key) {
    case 'ArrowLeft':  case 'a': kamera.x -= schritt; kameraBegrenzen(); e.preventDefault(); break;
    case 'ArrowRight': case 'd': kamera.x += schritt; kameraBegrenzen(); e.preventDefault(); break;
    case 'ArrowUp':    case 'w': kamera.y -= schritt; kameraBegrenzen(); e.preventDefault(); break;
    case 'ArrowDown':  case 's': kamera.y += schritt; kameraBegrenzen(); e.preventDefault(); break;
    case ' ': pauseUmschalten(); e.preventDefault(); break;
    case '1': tempoSetzen(1); break;
    case '2': tempoSetzen(2); break;
    case '3': tempoSetzen(3); break;
    case 'Escape':
      werkzeugWaehlen('zeiger');
      state.auswahl = null; panelZeigen();
      break;
  }
});

/* ---------- 9. BENUTZEROBERFLÄCHE ------------------------------ */

const $ = id => document.getElementById(id);

// Baumenü aus dem Gebäudekatalog erzeugen
function menueBauen() {
  const menue = $('baumenue');
  menue.innerHTML = '';

  // Zeiger-Werkzeug (Auswählen)
  menue.appendChild(bauKnopf('zeiger', '👆', 'Auswählen', 'Gebäude anklicken für Details'));

  for (const gruppe of MENUE_GRUPPEN) {
    const kasten = document.createElement('div');
    kasten.className = 'bau-gruppe';
    kasten.innerHTML = `<span class="gruppe-titel">${gruppe.titel}</span>`;
    const reihe = document.createElement('div');
    reihe.className = 'gruppe-knoepfe';
    for (const typ of gruppe.typen) {
      // Das Kontor gibt es nur einmal – danach verschwindet der Knopf
      if (typ === 'kontor' && state.kontorGebaut) continue;
      const def = GEBAEUDE[typ];
      const kostenText = Object.entries(def.kosten)
        .map(([ware, menge]) => `${WAREN_EMOJI[ware]}${menge}`).join(' ') || 'gratis';
      const knopf = bauKnopf(typ, def.emoji, def.name, def.beschr + ' – Kosten: ' + kostenText);
      knopf.dataset.kosten = kostenText;
      knopf.querySelector('.kosten').textContent = kostenText;
      reihe.appendChild(knopf);
    }
    kasten.appendChild(reihe);
    menue.appendChild(kasten);
  }

  // Abriss-Werkzeug
  menue.appendChild(bauKnopf('abriss', '🧨', 'Abreißen', 'Gebäude entfernen (halbe Kosten zurück)'));
  menueAktualisieren();
}

function bauKnopf(werkzeug, symbol, name, tipp) {
  const b = document.createElement('button');
  b.className = 'bau-knopf';
  b.dataset.werkzeug = werkzeug;
  b.title = tipp;
  b.innerHTML = `<span class="symbol">${symbol}</span><span class="name">${name}</span><span class="kosten"></span>`;
  b.addEventListener('click', () => bauKnopfKlick(werkzeug));
  return b;
}

// Klick auf einen Bauknopf: Wenn das Gebäude (noch) nicht gebaut werden
// kann, wird der Grund als Meldung angezeigt – wichtig auf dem Handy,
// wo es keine Maus-Tooltips gibt.
function bauKnopfKlick(werkzeug) {
  const def = GEBAEUDE[werkzeug];
  if (def) {
    if (!state.kontorGebaut && werkzeug !== 'kontor') {
      melden('⚓ Baue zuerst dein Kontor an der Küste!');
      return;
    }
    if (spieler[0].maxStufe < def.abStufe) {
      melden(`🔒 ${def.name}: wird erst freigeschaltet, wenn ein Haus zu ${STUFEN[def.abStufe].name}n aufgestiegen ist`);
      return;
    }
    if (!kostenReichen(werkzeug)) {
      const fehlt = Object.entries(def.kosten)
        .filter(([ware, menge]) => res[ware] < menge)
        .map(([ware, menge]) => `${WAREN_EMOJI[ware]} ${Math.ceil(menge - res[ware])}`)
        .join(', ');
      melden(`${def.name}: es fehlt ${fehlt} – produzieren oder im Kontor kaufen`);
      return;
    }
  }
  werkzeugWaehlen(werkzeug);
}

function werkzeugWaehlen(werkzeug) {
  // Vor dem Kontor kann nur das Kontor gebaut werden
  if (!state.kontorGebaut && werkzeug !== 'kontor' && werkzeug !== 'zeiger') {
    melden('Baue zuerst dein Kontor an der Küste!');
    return;
  }
  state.werkzeug = werkzeug;
  state.vorschau = null;             // offene Bestätigung verwerfen
  bestaetigungZeigen();
  if (werkzeug !== 'zeiger') { state.auswahl = null; panelZeigen(); }
  leinwand.classList.toggle('bauen', werkzeug !== 'zeiger');
  menueAktualisieren();
}

// --- Bestätigungsleiste: erst antippen, dann mit ✓ bauen/abreißen ---
function bestaetigungZeigen() {
  const leiste = $('bestaetigung');
  const v = state.vorschau;
  if (!v) { leiste.style.display = 'none'; return; }
  leiste.style.display = 'flex';

  if (v.modus === 'abriss') {
    const def = GEBAEUDE[v.geb.typ];
    $('bestaetigung-text').innerHTML = `${def.emoji} <b>${def.name}</b> wirklich abreißen? (50 % zurück)`;
    $('b-ok').textContent = '✓ Abreißen';
    $('b-ok').disabled = false;
  } else {
    const def = GEBAEUDE[v.typ];
    const a = ankerVon(v.typ, v.tx, v.ty);
    const pruefung = platzOK(v.typ, a.x, a.y);
    const bezahlbar = kostenReichen(v.typ);
    const k = def.kosten;
    const kostenText = [k.gold ? `💰${k.gold}` : '', k.holz ? `🪵${k.holz}` : '',
      k.werkzeuge ? `⚒️${k.werkzeuge}` : ''].filter(Boolean).join(' ') || 'gratis';
    if (!pruefung.ok)
      $('bestaetigung-text').innerHTML = `${def.emoji} <span class="grund">${pruefung.grund}</span>`;
    else if (!bezahlbar)
      $('bestaetigung-text').innerHTML = `${def.emoji} <span class="grund">Zu wenig Rohstoffe</span> (${kostenText})`;
    else
      $('bestaetigung-text').innerHTML = `${def.emoji} <b>${def.name}</b> hier bauen? (${kostenText})`;
    $('b-ok').textContent = '✓ Bauen';
    $('b-ok').disabled = !(pruefung.ok && bezahlbar);
  }
}

$('b-ok').addEventListener('click', () => {
  const v = state.vorschau;
  if (!v) return;
  if (v.modus === 'abriss') {
    abreissen(v.geb);
    state.vorschau = null;
  } else if (platziere(v.typ, v.tx, v.ty)) {
    state.vorschau = null;   // Werkzeug bleibt aktiv fürs nächste Gebäude
  }
  bestaetigungZeigen();
});
$('b-nein').addEventListener('click', () => {
  state.vorschau = null;
  bestaetigungZeigen();
});

// --- Handel am Kontor: Waren gegen Gold kaufen und verkaufen ---
function handel(ware, menge) {
  if (!PREISE[ware]) return;
  if (!handelAusfuehren(spieler[0], ware, menge))
    melden(menge > 0 ? 'Zu wenig Gold zum Kaufen' : 'Nichts zum Verkaufen da');
  uiAktualisieren();
}

function menueAktualisieren() {
  for (const b of document.querySelectorAll('.bau-knopf')) {
    const w = b.dataset.werkzeug;
    b.classList.toggle('aktiv', w === state.werkzeug);
    if (GEBAEUDE[w]) {
      // Nicht baubar = ausgegraut, aber weiterhin antippbar (der Klick
      // erklärt dann den Grund – siehe bauKnopfKlick)
      const gesperrt = spieler[0].maxStufe < GEBAEUDE[w].abStufe;
      const inaktiv = state.kontorGebaut ? (gesperrt || !kostenReichen(w))
                                         : (w !== 'kontor');
      b.classList.toggle('gesperrt', inaktiv);
      const kostenFeld = b.querySelector('.kosten');
      if (kostenFeld) kostenFeld.textContent = gesperrt
        ? '🔒 ab ' + STUFEN[GEBAEUDE[w].abStufe].name
        : (b.dataset.kosten || '');
    }
  }
}

// Ressourcenleiste und Panel auffrischen (ein paar Mal pro Sekunde)
function uiAktualisieren() {
  $('r-gold').textContent = Math.floor(res.gold).toLocaleString('de-DE');
  $('r-gold').parentElement.classList.toggle('warnung', res.gold < 0);
  const rate = state.goldRate;
  $('r-gold-rate').textContent = (rate >= 0 ? '+' : '') + rate.toFixed(1) + '/s';
  $('r-holz').textContent = Math.floor(res.holz);
  $('r-werkzeuge').textContent = Math.floor(res.werkzeuge);
  $('r-nahrung').textContent = Math.floor(res.nahrung);
  $('r-nahrung').parentElement.classList.toggle('warnung', state.hunger);
  $('r-ziegel').textContent = Math.floor(res.ziegel);
  $('r-stoffe').textContent = Math.floor(res.stoffe);
  $('r-alkohol').textContent = Math.floor(res.alkohol);

  // Punktestand des Wettrennens (nach Siedlern sortiert)
  const rangliste = [...spieler].sort((a, b) =>
    (b.siedlerEw - a.siedlerEw) || (b.einwohner - a.einwohner));
  $('punkte').innerHTML = '<b>🏁 Wettlauf auf ' + SIM.zielSiedler + ' Siedler</b>' +
    rangliste.map(sp => `<div class="punkte-zeile">` +
      `<span><span style="color:${sp.farbe}">●</span> ${sp.name}</span>` +
      `<span>${sp.kontor ? STUFEN[sp.maxStufe].emoji + ' ' + sp.siedlerEw : '⛵ …'}</span></div>`).join('');
  $('r-einwohner').textContent = state.einwohner || 0;
  $('r-siedler').textContent = state.siedlerEw || 0;
  $('ziel-balken').firstElementChild.style.width =
    Math.min(100, (state.siedlerEw || 0) / SIM.zielSiedler * 100) + '%';

  // Bankrott-Warnung mit Countdown
  const warnung = $('bankrott-warnung');
  const pleite = res.gold < 0 && !state.vorbei;
  if (pleite) {
    warnung.style.display = 'block';
    warnung.textContent = '⚠️ Kasse leer! Bankrott in ' +
      Math.ceil(SIM.pleiteDauer - state.pleiteZeit) + ' s – Unterhalt senken oder Steuern steigern!';
  } else warnung.style.display = 'none';

  // Pulsierende Mangel-Warnung: welche Waren fehlen den Einwohnern?
  const mangelWaren = Object.keys(state.mangel || {});
  const mangelLeiste = $('mangel-warnung');
  if (mangelWaren.length && (state.einwohner || 0) > 0 && !pleite) {
    mangelLeiste.style.display = 'block';
    mangelLeiste.innerHTML = '🚨 Mangel an ' +
      mangelWaren.map(w => `${WAREN_EMOJI[w]} ${WAREN_NAME[w]}`).join(', ') +
      '! Produktion ausbauen oder im Kontor zukaufen.';
  } else mangelLeiste.style.display = 'none';

  menueAktualisieren();
  if (state.auswahl) panelZeigen();
}

// Eingangswaren der Verarbeitungs-Betriebe (für die Auslastungs-Erklärung)
const VERARBEITER_REIN = { weberei: 'wolle', brennerei: 'zuckerrohr',
  muehle: 'getreide', baeckerei: 'mehl', tabakladen: 'tabakblaetter',
  schneiderei: 'stoffe' };

// Erklärt in Worten, woraus sich die Auslastung eines Betriebs ergibt
function auslastungGrund(geb) {
  const def = GEBAEUDE[geb.typ];
  const z = zentrum(geb);
  const lager = spieler[geb.spieler].res;
  switch (geb.typ) {
    case 'fischer':
      return `${wasserImUmkreis(z.x, z.y, def.radius)} von 6 nötigen Wasserfeldern im Umkreis`;
    case 'jagd':
      return `Waldbestand im Umkreis: ${baeumeImUmkreis(z.x, z.y, def.radius).toFixed(1)} von 5 nötig`;
    case 'holzfaeller':
      return `Waldbestand im Umkreis: ${baeumeImUmkreis(z.x, z.y, def.radius).toFixed(1)} von 4 nötig (Bäume wachsen langsam nach)`;
    case 'schaffarm': case 'getreidefarm': case 'zuckerrohr':
    case 'tabakplantage': case 'gewuerzplantage': case 'rinderfarm':
      return `${weideImUmkreis(z.x, z.y, def.radius)} von 10 nötigen freien Feldern im Umkreis (bebaute Felder zählen nicht)`;
    case 'ziegelei': case 'goldschmiede':
      return steinKachelImUmkreis(z.x, z.y, def.radius)
        ? 'Gesteinsvorkommen in Reichweite – volle Leistung'
        : 'Kein Gestein mehr in Reichweite – Produktion steht!';
    case 'schmiede':
      return (steinKachelImUmkreis(z.x, z.y, def.radius) ? 'Gestein vorhanden' : 'Kein Gestein in Reichweite!') +
             `, Holz im Lager: ${Math.floor(lager.holz)}`;
    default: {
      const rein = VERARBEITER_REIN[geb.typ];
      if (rein) return `Läuft nur, solange ${WAREN_EMOJI[rein]} ${WAREN_NAME[rein]} im Lager ist (${Math.floor(lager[rein])} vorrätig)`;
      return '';
    }
  }
}

// Info-Panel für das ausgewählte Gebäude
function panelZeigen() {
  const panel = $('info-panel');
  const geb = state.auswahl;
  if (!geb) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';

  const def = GEBAEUDE[geb.typ];
  const info = GEB_INFO[geb.typ] || {};
  const kopfEmoji = geb.typ === 'wohnhaus' ? STUFEN[geb.stufe].emoji : def.emoji;
  const besitzer = spieler[geb.spieler];
  let html = `<h2><span>${kopfEmoji}</span> ${def.name}</h2>`;
  html += `<div class="beschr">${def.beschr}</div>`;
  if (geb.spieler !== 0)
    html += `<div class="zeile"><span>Besitzer</span>` +
            `<span style="color:${besitzer.farbe}">● ${besitzer.name}</span></div>`;

  // Was das Gebäude produziert, verbraucht und wo es wirkt
  if (info.produziert) html += `<div class="zeile"><span>Produziert</span><span>${info.produziert}</span></div>`;
  if (info.verbraucht) html += `<div class="zeile"><span>Verbraucht</span><span>${info.verbraucht}</span></div>`;
  if (info.standort)   html += `<div class="zeile"><span>Standort</span><span>${info.standort}</span></div>`;

  if (geb.typ === 'wohnhaus') {
    const z = zentrum(geb);
    const st = STUFEN[geb.stufe];
    const naechste = STUFEN[geb.stufe + 1];
    html += `<div class="zeile"><span>Stufe</span><span>${st.emoji} ${st.name}</span></div>`;
    html += `<div class="zeile"><span>Einwohner</span><span>${geb.ew} / ${geb.maxEw}</span></div>`;
    html += `<div class="zeile"><span>Stimmung</span><span>${geb.zufrieden ? '😊 zufrieden' : '😠 unzufrieden'}</span></div>`;
    html += '<hr><b style="font-size:12px">Bedürfnisse</b>';
    html += beduerfnis('Marktanbindung', marktAnbindung(z.x, z.y, geb.spieler));
    html += beduerfnis('🍞 Nahrung', !besitzer.hunger);
    for (const ware of Object.keys(st.brauch))
      html += beduerfnis(`${WAREN_EMOJI[ware]} ${WAREN_NAME[ware]}`, !besitzer.mangel[ware]);
    if (naechste) {
      html += `<hr><b style="font-size:12px">Für den Aufstieg zu ${st.dativ}</b>`;
      for (const ware of Object.keys(naechste.brauch))
        html += beduerfnis(`${WAREN_EMOJI[ware]} ${WAREN_NAME[ware]} im Lager`, besitzer.res[ware] > 0.5);
      if (naechste.material)
        for (const [ware, menge] of Object.entries(naechste.material))
          html += beduerfnis(`${WAREN_EMOJI[ware]} ${menge} ${WAREN_NAME[ware]} (Baumaterial)`,
                             besitzer.res[ware] >= menge);
      if (naechste.gebaeudeNah)
        html += beduerfnis(`${GEBAEUDE[naechste.gebaeudeNah].emoji} ${GEBAEUDE[naechste.gebaeudeNah].name} in Reichweite`,
                           gebaeudeInReichweite(naechste.gebaeudeNah, z.x, z.y, geb.spieler));
      html += beduerfnis(`Gut gefülltes Haus (ab ${Math.ceil(st.maxEw * 0.75)} Ew.)`,
                         geb.ew >= Math.ceil(st.maxEw * 0.75));
    }
  } else if (def.dauer) {
    const prozent = Math.round(geb.eff * 100);
    html += `<div class="zeile"><span>Auslastung</span><span>${prozent} %</span></div>`;
    html += `<div class="auslast-balken"><div style="width:${prozent}%"></div></div>`;
    const grund = auslastungGrund(geb);
    if (grund) html += `<div class="beschr" style="margin-top:5px">${grund}</div>`;
    html += `<div class="zeile" style="margin-top:6px"><span>Produktionstakt</span><span>alle ${def.dauer} s</span></div>`;
    html += `<div class="zeile"><span>Unterhalt</span><span>${(def.unterhalt * 60).toFixed(0)} 💰/min</span></div>`;
  } else {
    if (def.marktRadius) html += `<div class="zeile"><span>Versorgungsradius</span><span>${def.marktRadius} Felder</span></div>`;
    if (def.radius) html += `<div class="zeile"><span>Wirkungsradius</span><span>${def.radius} Felder</span></div>`;
    if (def.unterhalt) html += `<div class="zeile"><span>Unterhalt</span><span>${(def.unterhalt * 60).toFixed(0)} 💰/min</span></div>`;
  }

  // Handel: nur am eigenen Kontor – kaufen ist teurer als verkaufen
  if (geb.typ === 'kontor' && geb.spieler === 0) {
    html += '<hr><b style="font-size:12px">⚖️ Handel</b>' +
      '<div class="beschr" style="margin:2px 0 4px">Preise je Stück (Kauf/Verkauf) folgen der Nachfrage – auch die Konkurrenz kauft hier ein! ▲ teuer · ▼ günstig</div>';
    for (const ware of Object.keys(PREISE)) {
      const f = markt[ware];
      const trend = f > 1.15 ? ' <span style="color:#dc2626">▲</span>'
                  : f < 0.87 ? ' <span style="color:#2563eb">▼</span>' : '';
      html += `<div class="handel-zeile">
        <span>${WAREN_EMOJI[ware]} <b>${Math.floor(res[ware])}</b>${trend}
          <small style="color:var(--text-leise)">${kaufpreis(ware)}/${verkaufspreis(ware)}💰</small></span>
        <span>
          <button class="handel-verkauf" title="50 verkaufen (+${verkaufspreis(ware) * 50}💰)" onclick="handel('${ware}',-50)">−50</button>
          <button class="handel-verkauf" title="10 verkaufen (+${verkaufspreis(ware) * 10}💰)" onclick="handel('${ware}',-10)">−10</button>
          <button class="handel-kauf" title="10 kaufen (−${kaufpreis(ware) * 10}💰)" onclick="handel('${ware}',10)">+10</button>
          <button class="handel-kauf" title="50 kaufen (−${kaufpreis(ware) * 50}💰)" onclick="handel('${ware}',50)">+50</button>
        </span></div>`;
    }
  }

  if (geb.spieler === 0)
    html += `<button class="abriss-knopf" onclick="abreissenAuswahl()">🧨 Abreißen</button>`;
  $('panel-inhalt').innerHTML = html;
}
function beduerfnis(name, erfuellt) {
  return `<div class="beduerfnis"><span>${name}</span>` +
         `<span class="${erfuellt ? 'ok' : 'fehlt'}">${erfuellt ? '✓' : '✗'}</span></div>`;
}
function abreissenAuswahl() { if (state.auswahl && state.auswahl.spieler === 0) abreissen(state.auswahl); }
$('panel-zu').addEventListener('click', () => { state.auswahl = null; panelZeigen(); });

// Kurze Meldung am unteren Rand; gleiche Meldungen werden gedrosselt
let toastTimer = null;
const meldungZuletzt = {};
function melden(text, schluessel) {
  const jetzt = performance.now();
  if (schluessel) {
    if (meldungZuletzt[schluessel] && jetzt - meldungZuletzt[schluessel] < 8000) return;
    meldungZuletzt[schluessel] = jetzt;
  }
  const toast = $('toast');
  toast.textContent = text;
  toast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = 0; }, 2600);
}

// Pause & Geschwindigkeit
function pauseUmschalten() {
  state.pause = !state.pause;

  for (const n of [1, 2, 3]) $('k-tempo' + n).classList.toggle('aktiv', n === t);
}

/* ---------- 10. MUSIK (Web Audio API) ------------------------- */
// Ein sehr ruhiger, generativer Klangteppich: alle paar Sekunden ein
// weicher Akkord aus Sinustönen – ganz ohne Audiodateien.

const musik = { an: false, ctx: null, timer: null, takt: 0 };
const AKKORDE = [                       // sanfte Folge in C-Dur
  [130.8, 261.6, 329.6, 392.0],         // C
  [110.0, 220.0, 261.6, 329.6],         // Am
  [87.3, 174.6, 220.0, 261.6],          // F
  [98.0, 196.0, 246.9, 293.7],          // G
];

function akkordSpielen() {
  const ac = musik.ctx, t = ac.currentTime;
  const noten = AKKORDE[musik.takt++ % AKKORDE.length];
  for (let i = 0; i < noten.length; i++) {
    const osc = ac.createOscillator();
    const laut = ac.createGain();
    osc.type = i === 0 ? 'triangle' : 'sine';   // Bass etwas wärmer
    osc.frequency.value = noten[i];
    // Weich ein- und ausblenden, damit nichts knackt
    laut.gain.setValueAtTime(0, t);
    laut.gain.linearRampToValueAtTime(i === 0 ? 0.035 : 0.028, t + 1.4);
    laut.gain.linearRampToValueAtTime(0, t + 4.2);
    osc.connect(laut).connect(ac.destination);
    osc.start(t);
    osc.stop(t + 4.3);
  }
}

function musikUmschalten() {
  if (!musik.an) {
    if (!musik.ctx) musik.ctx = new (window.AudioContext || window.webkitAudioContext)();
    musik.ctx.resume();
    musik.an = true;
    akkordSpielen();
    musik.timer = setInterval(akkordSpielen, 4400);
  } else {
    musik.an = false;
    clearInterval(musik.timer);
  }
  $('k-musik').classList.toggle('aktiv', musik.an);
}
$('k-musik').addEventListener('click', musikUmschalten);

/* ---------- 11. HAUPTSCHLEIFE --------------------------------- */

function kameraStart() {
  // Start: Blick aufs Schiff, so weit herausgezoomt, dass man das Meer
  // und die nächsten Inseln gut sieht (auf ca. 30 Kacheln Sichtweite)
  const wunsch = Math.min(leinwand.clientWidth, leinwand.clientHeight) / (30 * T);
  kamera.zoom = Math.min(1.1, Math.max(0.3, wunsch));
  kamera.x = schiff.x * T - leinwand.clientWidth / (2 * kamera.zoom);
  kamera.y = schiff.y * T - leinwand.clientHeight / (2 * kamera.zoom);
  kameraBegrenzen();
}

// 🧭-Knopf: Kamera zurück zum Kontor (oder zum Schiff)
function zentrieren() {
  const kontor = gebaeude.find(g => g.typ === 'kontor');
  const ziel = kontor ? zentrum(kontor) : { x: schiff.x, y: schiff.y };
  kamera.x = ziel.x * T - leinwand.clientWidth / (2 * kamera.zoom);
  kamera.y = ziel.y * T - leinwand.clientHeight / (2 * kamera.zoom);
  kameraBegrenzen();
}
$('k-mitte').addEventListener('click', zentrieren);

let zuletzt = performance.now();
let uiTakt = 0;

function schleife(jetzt) {
  let dt = (jetzt - zuletzt) / 1000;
  zuletzt = jetzt;
  dt = Math.min(dt, 0.1);   // große Sprünge (Tab im Hintergrund) abfangen

  const laeuft = !state.pause && !state.vorbei && (!state.gewonnen || state.weiterspielen);
  if (laeuft) {
    schiffUpdate(dt * state.tempo);
    simSchritt(dt * state.tempo);
  }

  zeichnen();

  uiTakt += dt;
  if (uiTakt >= 0.25) { uiTakt = 0; uiAktualisieren(); }

  requestAnimationFrame(schleife);
}

requestAnimationFrame(schleife);
