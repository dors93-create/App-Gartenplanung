// Führt einen Befehl der Auswahlleiste aus – auch für den Mitspieler
function truppAktion(t, art) {
  if (!t || !truppen.includes(t)) return false;
  if (istGast() && t.spieler === ICH) return befehlSenden({ art: 'truppakt', id: t.id, akt: art });
  const ich = t.spieler === ICH;

  if (art === 'halt') {
    t.pfad = []; t.verfolgt = 0; t.landen = null; t.anBord = 0; t.jagtPirat = 0;
    if (ich) melden('✋ Truppe hält an');
    return true;
  }
  if (art === 'anlanden') return anlanden(t);

  if (art === 'einschiffen') {
    const f = eigeneNahe(t, 'flotte', 12);
    if (!f) { if (ich) melden('Keine eigene Flotte in der Nähe'); return false; }
    if (Math.hypot(f.x - t.x, f.y - t.y) <= LADE_ABSTAND) return einschiffen(t, f);
    // Zu weit weg: erst ans Ufer bei der Flotte marschieren. Probiert
    // werden alle freien Landfelder in Reichweite des Schiffs.
    let besterWeg = null;
    const fx = Math.floor(f.x), fy = Math.floor(f.y);
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      const x = fx + dx, y = fy + dy;
      if (x < 0 || y < 0 || x >= N || y >= N || !landFrei(y * N + x)) continue;
      if (Math.hypot(f.x - (x + 0.5), f.y - (y + 0.5)) > LADE_ABSTAND - 0.3) continue;
      const weg = truppWeg(t, x, y);
      if (weg && (!besterWeg || weg.length < besterWeg.length)) besterWeg = weg;
    }
    if (!besterWeg) { if (ich) melden('Zur Flotte führt kein Landweg – sie muss an diese Insel kommen'); return false; }
    t.pfad = besterWeg; t.anBord = f.id; t.verfolgt = 0;
    if (ich) melden('⚓ Das Heer marschiert zur Flotte und geht dort an Bord');
    return true;
  }

  if (art === 'vereinigen') {
    const z = eigeneNahe(t, t.art, LADE_ABSTAND);
    if (!z) return false;
    const gA = truppGroesse(t) + t.fracht, gZ = truppGroesse(z) + z.fracht;
    t.moral = (t.moral * gA + z.moral * gZ) / Math.max(1, gA + gZ);
    if (t.art === 'flotte') {
      t.kanonen = Math.round(((t.kanonen || 0) * t.schiffe + (z.kanonen || 0) * z.schiffe) /
                             Math.max(1, t.schiffe + z.schiffe));
      t.schiffe += z.schiffe; t.fracht += z.fracht;
    } else t.mann += z.mann;
    truppen = truppen.filter(x => x !== z);
    auswahlUmhaengen(z, t);
    if (ich) melden('🔗 Truppen vereinigt');
    return true;
  }

  if (art === 'aufloesen') {
    // Soldaten kehren als Einwohner zurück – Schiffe werden abgewrackt
    let rest = Math.round(t.mann + t.fracht);
    for (const g of gebaeude) {
      if (rest <= 0) break;
      if (g.typ !== 'wohnhaus' || g.spieler !== t.spieler) continue;
      const platz = Math.min(g.maxEw - g.ew, rest);
      if (platz > 0) { g.ew += platz; rest -= platz; }
    }
    if (t.art === 'flotte') spieler[t.spieler].res.holz += Math.floor(t.schiffe * 4);
    truppen = truppen.filter(x => x !== t);
    if (state.truppAuswahl === t) truppAbwaehlen();
    if (ich) melden('Truppe aufgelöst – die Leute kehren heim');
    return true;
  }
  return false;
}

// --- Wegfindung: eine Breitensuche für Land und See ---
function wegSuche(sx, sy, zx, zy, passierbar) {
  const si = sy * N + sx, zi = zy * N + zx;
  if (!passierbar(zi)) return null;
  if (si === zi) return [];
  const vorher = new Int32Array(N * N).fill(-1);
  vorher[si] = si;
  const schlange = [si];
  for (let kopf = 0; kopf < schlange.length; kopf++) {
    const j = schlange[kopf];
    if (j === zi) break;
    const x = j % N, y = (j / N) | 0;
    for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + ax, ny = y + ay;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const ni = ny * N + nx;
      if (vorher[ni] !== -1 || !passierbar(ni)) continue;
      vorher[ni] = j;
      schlange.push(ni);
    }
  }
  if (vorher[zi] === -1) return null;
  const weg = [];
  for (let j = zi; j !== si; j = vorher[j])
    weg.push({ x: (j % N) + 0.5, y: ((j / N) | 0) + 0.5 });
  weg.reverse();
  return weg;
}

// Heere laufen über Land – Flüsse nur über Brücken, Berge gar nicht.
// Dadurch werden Brücken zu Engstellen, die man verteidigen kann.
function landFrei(i) {
  const k = karte[i];
  if (k.typ === 'wasser' || k.typ === 'berg') return false;
  if (k.typ === 'fluss') {
    const b = belegt[i];
    return !!(b && b.typ === 'bruecke');
  }
  return true;
}
function seeFrei(i) { return karte[i].typ === 'wasser'; }

function truppWeg(t, zx, zy) {
  const sx = Math.floor(t.x), sy = Math.floor(t.y);
  return wegSuche(sx, sy, zx, zy, t.art === 'flotte' ? seeFrei : landFrei);
}

// --- Aushebung in der Kaserne und Schiffbau in der Werft ---
// Soldaten kommen aus den Wohnhäusern: Krieg kostet dich Einwohner
// und damit Punkte im Wettlauf.
function einwohnerAbziehen(sid, anzahl) {
  let rest = anzahl;
  for (const g of gebaeude) {
    if (rest <= 0) break;
    if (g.typ !== 'wohnhaus' || g.spieler !== sid) continue;
    const nimm = Math.min(g.ew - 1, rest);
    if (nimm > 0) { g.ew -= nimm; rest -= nimm; }
  }
  return anzahl - rest;   // tatsächlich eingezogene Einwohner
}

// Wie viele Soldaten darf ein Spieler unterhalten? Jede Ausbaustufe
// jeder Kaserne schafft Platz für weitere Mannschaften.
function soldatenKapazitaet(sid) {
  let k = 0;
  for (const g of gebaeude)
    if (g.typ === 'kaserne' && g.spieler === sid) k += KASERNE_KAPAZITAET * (g.ausbau || 1);
  return k;
}
function soldatenAktuell(sid) {
  let n = 0;
  for (const t of truppen)
    if (t.spieler === sid) n += t.mann + t.fracht;
  return Math.round(n);
}

function ausheben(kaserne) {
  if (istGast() && kaserne.spieler === ICH)
    return befehlSenden({ art: 'ausheben', id: kaserne.id });
  const sp = spieler[kaserne.spieler], R = sp.res;
  // Kapazität der Kasernen beachten
  const kap = soldatenKapazitaet(sp.id);
  if (soldatenAktuell(sp.id) + TRUPP_MANN > kap) {
    if (sp.id === ICH)
      melden(`⚔️ Deine Kasernen fassen nur ${kap} Soldaten – Kaserne ausbauen oder eine zweite bauen`);
    return false;
  }
  for (const [ware, menge] of Object.entries(TRUPP_KOSTEN))
    if (R[ware] < menge) {
      if (sp.id === ICH) melden(`Aushebung: es fehlt ${WAREN_EMOJI[ware]} ${WAREN_NAME[ware] || 'Gold'}`);
      return false;
    }
  if (sp.einwohner < TRUPP_EINWOHNER + 5) {
    if (sp.id === ICH) melden('Zu wenig Einwohner für eine Aushebung');
    return false;
  }
  const gezogen = einwohnerAbziehen(sp.id, TRUPP_EINWOHNER);
  if (gezogen <= 0) return false;
  for (const [ware, menge] of Object.entries(TRUPP_KOSTEN)) R[ware] -= menge;

  // An das nächstgelegene eigene Heer in der Nähe anschließen …
  const z = zentrum(kaserne);
  const naheTruppe = truppeNahe(sp.id, 'heer', z.x, z.y, 8);
  if (naheTruppe) {
    naheTruppe.mann += gezogen;
    if (sp.id === ICH) melden(`⚔️ ${gezogen} Mann ausgehoben – Heer jetzt ${Math.round(naheTruppe.mann)} Mann`);
    return true;
  }
  // … sonst ein neues Heer neben der Kaserne aufstellen
  const platz = freiesFeldNeben(z.x, z.y, landFrei);
  if (!platz) { if (sp.id === ICH) melden('Kein Platz für das Heer neben der Kaserne'); return false; }
  const t = neueTruppe(sp.id, 'heer', platz.x, platz.y);
  t.mann = gezogen;
  if (sp.id === ICH) melden(`⚔️ Neues Heer mit ${gezogen} Mann ausgehoben`);
  return true;
}

function schiffBauen(werft) {
  if (istGast() && werft.spieler === ICH)
    return befehlSenden({ art: 'schiffbau', id: werft.id });
  const sp = spieler[werft.spieler], R = sp.res;
  for (const [ware, menge] of Object.entries(SCHIFF_KOSTEN))
    if (R[ware] < menge) {
      if (sp.id === ICH) melden(`Schiffbau: es fehlt ${WAREN_EMOJI[ware]} ${WAREN_NAME[ware] || 'Gold'}`);
      return false;
    }
  const z = zentrum(werft);
  const platz = freiesFeldNeben(z.x, z.y, seeFrei);
  if (!platz) { if (sp.id === ICH) melden('Kein freies Wasser neben der Werft'); return false; }
  for (const [ware, menge] of Object.entries(SCHIFF_KOSTEN)) R[ware] -= menge;

  const naheFlotte = truppeNahe(sp.id, 'flotte', z.x, z.y, 10);
  if (naheFlotte) {
    naheFlotte.schiffe += 1;
    if (sp.id === ICH) melden(`🚢 Kriegsschiff vom Stapel – Flotte jetzt ${naheFlotte.schiffe} Schiffe`);
    return true;
  }
  const t = neueTruppe(sp.id, 'flotte', platz.x, platz.y);
  t.schiffe = 1;
  if (sp.id === ICH) melden('🚢 Erstes Kriegsschiff deiner neuen Flotte');
  return true;
}

// Nächstgelegenen eigenen Stapel einer Art im Umkreis finden –
// so wächst der Nachschub, statt viele Einzelstapel zu erzeugen.
function truppeNahe(sid, art, cx, cy, radius) {
  let beste = null, besteD = radius;
  for (const t of truppen) {
    if (t.spieler !== sid || t.art !== art) continue;
    const d = Math.hypot(t.x - cx, t.y - cy);
    if (d < besteD) { beste = t; besteD = d; }
  }
  return beste;
}

// Freies Feld in der Nähe suchen (für neu aufgestellte Truppen)
function freiesFeldNeben(cx, cy, frei) {
  for (let r = 1; r <= 6; r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const x = Math.floor(cx) + dx, y = Math.floor(cy) + dy;
      if (x < 0 || y < 0 || x >= N || y >= N) continue;
      if (frei(y * N + x) && !belegt[y * N + x]) return { x: x + 0.5, y: y + 0.5 };
    }
  }
  return null;
}

// --- Bewegung: Truppen laufen ihren Weg Punkt für Punkt ab ---
function truppenUpdate(dt) {
  // Einmal je Sekunde richten Verfolger ihren Weg neu auf das Ziel aus –
  // sonst liefe ein Angriff ins Leere, sobald sich der Gegner bewegt.
  state.jagdTakt = (state.jagdTakt || 0) + dt;
  if (state.jagdTakt >= 1) {
    state.jagdTakt = 0;
    for (const t of truppen) {
      if (t.jagtPirat) {                                // Piratenjagd
        const p = piraten.find(x => x.id === t.jagtPirat);
        if (!p) t.jagtPirat = 0;
        else if (Math.hypot(p.x - t.x, p.y - t.y) > 1) {
          const weg = truppWeg(t, Math.floor(p.x), Math.floor(p.y));
          if (weg) t.pfad = weg; else t.jagtPirat = 0;
        }
        continue;
      }
      if (!t.verfolgt) continue;
      const ziel = truppen.find(z => z.id === t.verfolgt);
      if (!ziel || ziel.art !== t.art) { t.verfolgt = 0; continue; }
      if (Math.hypot(ziel.x - t.x, ziel.y - t.y) <= 1) continue;   // schon dran
      const weg = truppWeg(t, Math.floor(ziel.x), Math.floor(ziel.y));
      if (weg) t.pfad = weg; else t.verfolgt = 0;
    }
  }

  const angekommen = [];
  for (const t of truppen) {
    if (!t.pfad.length) {
      if (t.landen || t.anBord) angekommen.push(t);
      continue;
    }
    // Im Gefecht geht es nur halb so schnell voran – Rückzug ist
    // möglich, aber teuer. (Früher stand die Truppe ganz still und
    // ließ sich nicht mehr wegbewegen.)
    const tempo = (t.art === 'flotte' ? KRIEG.tempoFlotte : KRIEG.tempoHeer)
                * (t.kampf ? 0.5 : 1);
    let strecke = tempo * dt;
    while (strecke > 0 && t.pfad.length) {
      const ziel = t.pfad[0];
      const dx = ziel.x - t.x, dy = ziel.y - t.y;
      const d = Math.hypot(dx, dy);
      if (d <= strecke) {
        t.x = ziel.x; t.y = ziel.y; t.pfad.shift(); strecke -= d;
      } else {
        t.x += dx / d * strecke; t.y += dy / d * strecke; strecke = 0;
      }
    }
    if (!t.pfad.length && (t.landen || t.anBord)) angekommen.push(t);
  }

  // Am Ziel: vorgemerkte Landung bzw. Einschiffung ausführen
  for (const t of angekommen) {
    if (!truppen.includes(t)) continue;
    if (t.landen) {
      const z = t.landen; t.landen = null;
      anlanden(t, z.x, z.y);
    } else if (t.anBord) {
      const f = truppen.find(x => x.id === t.anBord);
      t.anBord = 0;
      if (f) einschiffen(t, f);
    }
  }
}

// Verteidigungsbonus durch Gelände und eigene Wachtürme
function gelaendeBonus(t) {
  let bonus = 1;
  if (t.art === 'heer') {
    const k = kachel(Math.floor(t.x), Math.floor(t.y));
    if (k && (k.typ === 'wald' || k.baum > 0.1)) bonus *= KRIEG.gelaendeBonus;
  }
  for (const g of gebaeude) {
    if (g.typ !== 'wachturm' || g.spieler !== t.spieler) continue;
    const z = zentrum(g);
    if (Math.hypot(z.x - t.x, z.y - t.y) <= wirkRadius(g)) {
      bonus *= KRIEG.turmBonus;
      break;
    }
  }
  return bonus;
}

// Gebäude beschädigen; bei 0 Lebenspunkten fällt es
function gebaeudeSchaden(geb, schaden, angreifer, vonSee) {
  geb.hp -= schaden;
  // Ein Kontor fällt nur im Sturm: Schiffe schießen es bloß sturmreif
  // (auf ein Viertel) – erobern müssen es Soldaten an Land.
  if (vonSee && geb.typ === 'kontor') geb.hp = Math.max(geb.hp, geb.maxHp * KRIEG.sturmreif);
  geb.treffer = state.spielzeit;            // die Reparatur wartet, solange geschossen wird
  if (geb.spieler === ICH) {                // Alarm: Marke links führt zum Tatort
    const z = zentrum(geb);
    state.alarm = { x: z.x, y: z.y, bis: state.spielzeit + 12 };
    melden(`🚨 ${spieler[angreifer].name} greift an: ${GEBAEUDE[geb.typ].name} unter Beschuss!`, 'alarm', 25000);
  }
  if (geb.hp > 0) return;
  const def = GEBAEUDE[geb.typ];
  if (geb.typ === 'kontor') {
    inselErobern(geb, angreifer);
  } else {
    if (geb.spieler === ICH)
      melden(`💥 ${def.name} zerstört – Angriff von ${spieler[angreifer].name}!`, 'zerstoert');
    else if (angreifer === ICH)
      melden(`💥 ${def.name} von ${spieler[geb.spieler].name} zerstört!`, 'zerstoert');
    abreissenStill(geb);
  }
}

// Abriss ohne Rückerstattung und ohne Meldung (Kriegsverlust)
function abreissenStill(geb) {
  const def = GEBAEUDE[geb.typ];
  for (let y = geb.y; y < geb.y + def.h; y++)
    for (let x = geb.x; x < geb.x + def.w; x++)
      belegt[y * N + x] = null;
  if (geb.felder) for (const idx of geb.felder) belegt[idx] = null;
  gebaeude = gebaeude.filter(g => g !== geb);
  bauStand++;
  if (state.auswahl === geb) { state.auswahl = null; panelZeigen(); }
}

// Kapitulation: Wer sein LETZTES Kontor verliert, wird nicht ausgelöscht.
// Er ergibt sich, der Sieger nimmt einen Teil von Gold und Waren als
// Beute, und es herrscht für längere Zeit Frieden. Diese Gnadenregel
// schützt dich – und sie gilt auch unter den Computergegnern, damit
// keiner von ihnen früh aus dem Rennen fällt. Nur DU kannst einen
// Gegner endgültig besiegen.
function kapitulation(verlierer, sieger, kontor) {
  const V = spieler[verlierer], S = spieler[sieger];
  let gold = 0;
  for (const ware of Object.keys(V.res)) {
    if (V.res[ware] <= 0) continue;
    const teil = Math.floor(V.res[ware] * KRIEG.beute);
    V.res[ware] -= teil; S.res[ware] += teil;
    if (ware === 'gold') gold = teil;
  }
  kontor.hp = kontor.maxHp * 0.5;
  kriegBeenden(verlierer, sieger);
  // Schonfrist: Niemand fällt über den Geschlagenen her – die Waffenruhe
  // gilt gegenüber ALLEN, und aller Groll gegen ihn ist erst einmal verraucht
  for (const sp of spieler) {
    if (sp.id === verlierer) continue;
    waffenruhe[verlierer][sp.id] = waffenruhe[sp.id][verlierer] = state.spielzeit + KRIEG.kapitulationsRuhe;
    sp.neidZeit[verlierer] = 0;
    if (sp.ultimatum && sp.ultimatum.gegen === verlierer) sp.ultimatum = null;
    if (!imKriegMit(sp.id, verlierer))
      feindschaft[sp.id][verlierer] = feindschaft[verlierer][sp.id] = Math.min(feindschaft[sp.id][verlierer], STIMMUNG.nachFrieden);
  }
  if (verlierer === ICH)
    depesche('🏳️ Dein Kontor ist gefallen – du kapitulierst',
      `${S.name} nimmt ${gold.toLocaleString('de-DE')} 💰 und knapp ein Drittel deiner Waren als Beute. ` +
      `Dafür herrscht jetzt ${Math.round(KRIEG.kapitulationsRuhe / 60)} Minuten Frieden. Nutze sie für Wachtürme am Kontor.`);
  else if (sieger === ICH)
    depesche(`🏳️ ${V.name} kapituliert!`, `Du erbeutest ${gold.toLocaleString('de-DE')} 💰 und einen Teil der Waren.`, true);
  else melden(`🏳️ ${V.name} kapituliert vor ${S.name}`, 'kapitulation');
}

// Fällt ein Kontor, wechselt die ganze Insel den Besitzer
function inselErobern(kontor, sieger) {
  const verlierer = kontor.spieler;
  const letztes = gebaeude.filter(g => g.typ === 'kontor' && g.spieler === verlierer).length <= 1;
  if (letztes && (!spieler[verlierer].ki || spieler[sieger].ki)) {
    kapitulation(verlierer, sieger, kontor);
    return;
  }
  const insel = inselMarke ? inselMarke[kontor.y * N + kontor.x] : -1;
  let uebernommen = 0;
  bauStand++;
  for (const g of gebaeude) {
    if (g.spieler !== verlierer) continue;
    if (insel >= 0 && inselMarke[g.y * N + g.x] !== insel) continue;
    g.spieler = sieger;
    g.hp = g.maxHp;                       // der neue Herr baut auf
    if (g.typ === 'wohnhaus') {           // Plünderung: halbe Einwohner, eine Stufe tiefer
      g.ew = Math.max(1, Math.floor(g.ew / 2));
      if (g.stufe > 0) { g.stufe--; g.maxEw = hausMaxEw(g); }
    }
    uebernommen++;
  }
  // Kontor-Verweise der Beteiligten auffrischen
  for (const sp of spieler)
    sp.kontor = gebaeude.find(g => g.typ === 'kontor' && g.spieler === sp.id) || null;
  state.kontorGebaut = !!spieler[ICH].kontor;

  // Ohne Kontor ist der Verlierer aus dem Rennen: seine Kriege enden,
  // seine verbliebenen Truppen lösen sich auf
  if (!spieler[verlierer].kontor) {
    spieler[verlierer].besiegt = true;
    for (const sp of spieler) if (sp.id !== verlierer && imKriegMit(sp.id, verlierer)) kriegBeenden(sp.id, verlierer);
    truppen = truppen.filter(t => t.spieler !== verlierer);
  }

  const text = `${spieler[sieger].name} hat die Insel von ${spieler[verlierer].name} erobert (${uebernommen} Gebäude)`;
  if (sieger === ICH || verlierer === ICH) depesche('🚩 Insel erobert!', text + '.', sieger === ICH);
  else melden('🚩 ' + text + '!');
  if (verlierer === ICH && !spieler[ICH].kontor && !state.vorbei) niederlageErobert(spieler[sieger]);
  menueBauen();
}

/* --- Das Gefecht: beide Seiten verlieren gleichzeitig Kräfte --- */
function kriegSchritt(dt) {
  if (!truppen.length) return;

  for (const t of truppen) t.kampf = false;

  // 1. Feindberührung: gleiche Art, weniger als eine Kachel Abstand
  for (let i = 0; i < truppen.length; i++) {
    const a = truppen[i];
    for (let j = i + 1; j < truppen.length; j++) {
      const b = truppen[j];
      if (a.spieler === b.spieler || a.art !== b.art) continue;
      // Ohne Kriegserklärung wird nicht gekämpft – man zieht
      // friedlich aneinander vorbei
      if (!imKriegMit(a.spieler, b.spieler)) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) > 1.2) continue;

      // Abrieb mit kleinem Zufallsanteil – kein Würfeln, sondern
      // stetiger Verlust, passend zur laufenden Simulation
      const sA = staerke(a) * gelaendeBonus(a) * (0.9 + Math.random() * 0.2);
      const sB = staerke(b) * gelaendeBonus(b) * (0.9 + Math.random() * 0.2);
      const fA = a.art === 'flotte' ? KRIEG.schiffWert : 1;
      const fB = b.art === 'flotte' ? KRIEG.schiffWert : 1;
      const verlustA = sB * KRIEG.verlustRate * dt / fA;
      const verlustB = sA * KRIEG.verlustRate * dt / fB;
      if (a.art === 'flotte') { a.schiffe -= verlustA; b.schiffe -= verlustB; }
      else                    { a.mann    -= verlustA; b.mann    -= verlustB; }
      a.moral = Math.max(0.45, a.moral - KRIEG.moralVerlust * dt);
      b.moral = Math.max(0.45, b.moral - KRIEG.moralVerlust * dt);
      a.kampf = b.kampf = true;
      if (a.spieler === ICH || b.spieler === ICH)
        melden(a.art === 'flotte' ? '🌊 Seeschlacht!' : '⚔️ Schlacht!', 'schlacht');
    }
  }

  // 2. Belagerung und Bombardement feindlicher Gebäude
  for (const t of truppen) {
    if (t.kampf) continue;
    let ziel = null, besteD = 1e9;
    for (const g of gebaeude) {
      if (g.spieler === t.spieler) continue;
      if (!imKriegMit(t.spieler, g.spieler)) continue;   // kein Krieg, kein Beschuss
      const d = abstandZumGrundriss(g, t.x, t.y);
      if (d > (t.art === 'flotte' ? KRIEG.schussweite : KRIEG.sturmweite)) continue;
      // Ein sturmreifes Kontor ist für Schiffe kein Ziel mehr
      if (t.art === 'flotte' && g.typ === 'kontor' && g.hp <= g.maxHp * KRIEG.sturmreif + 0.5) continue;
      // Wehrbauten zuerst, dann das Kontor, dann der Rest
      const rang = g.typ === 'wachturm' || g.typ === 'kaserne' ? 0
                 : g.typ === 'kontor' ? 1 : 2;
      const wert = rang * 100 + d;
      if (wert < besteD) { ziel = g; besteD = wert; }
    }
    if (!ziel) continue;
    const schaden = t.art === 'flotte'
      ? t.schiffe * KRIEG.bombardement * (1 + KANONEN_BESCHUSS * (t.kanonen || 0)) * dt
      : (t.mann / 10) * KRIEG.belagerung * (ziel.typ === 'kontor' ? KRIEG.kontorSturm : 1) * dt;
    t.kampf = true;
    gebaeudeSchaden(ziel, schaden, t.spieler, t.art === 'flotte');
  }

  // 3. Wachtürme beschießen feindliche Truppen in Reichweite. Auch jedes
  //    Kontor wehrt sich: seine Miliz schießt schwächer und nicht so weit.
  for (const g of gebaeude) {
    if (g.typ !== 'wachturm' && g.typ !== 'kontor') continue;
    const z = zentrum(g);
    const turm = g.typ === 'wachturm';
    const radius = turm ? wirkRadius(g) : KRIEG.milizRadius;
    const wucht = KRIEG.turmSchaden * (turm ? 1 : KRIEG.milizSchaden) * dt;
    for (const t of truppen) {
      if (t.spieler === g.spieler) continue;
      if (!imKriegMit(t.spieler, g.spieler)) continue;   // nur im Krieg
      if (Math.hypot(z.x - t.x, z.y - t.y) > radius) continue;
      if (t.art === 'flotte') t.schiffe -= wucht * KRIEG.turmGegenSchiff / KRIEG.schiffWert;
      else                    t.mann    -= wucht;
      t.kampf = true;
    }
  }

  // 4. Aufgeriebene Stapel entfernen (eine sinkende Flotte reißt ihre Fracht mit)
  truppen = truppen.filter(t => {
    if (truppGroesse(t) > 0.5) return true;
    if (t.spieler === ICH)
      melden(t.art === 'flotte'
        ? '🌊 Deine Flotte ist versenkt!' : '💀 Dein Heer ist aufgerieben!');
    else if (t.art === 'flotte' && t.fracht > 0)
      melden(`🌊 Flotte von ${spieler[t.spieler].name} versenkt – die Truppen an Bord ertrinken!`, 'versenkt');
    if (state.truppAuswahl === t) state.truppAuswahl = null;
    return false;
  });

  // 5. Moral erholt sich außerhalb des Gefechts
  for (const t of truppen)
    if (!t.kampf) t.moral = Math.min(1, t.moral + 0.03 * dt);
}

// Sold: Soldaten und Schiffe kosten laufend Gold
function soldJeSpieler(sid) {
  let kosten = 0;
  for (const t of truppen) {
    if (t.spieler !== sid) continue;
    kosten += (t.mann + t.fracht) * KRIEG.sold + t.schiffe * KRIEG.soldSchiff;
  }
  return kosten;
}

/* ---------- 5d. PIRATEN ---------------------------------------- */
// Von Zeit zu Zeit taucht ein Piratenverband auf, legt sich vor das
// Kontor eines Spielers und vergrault dort die Händler: Solange er
// lauert, ist das Handelskontingent des Opfers gekürzt. Loswerden kann
// man ihn mit Schutzgeld, mit eigenen Kriegsschiffen oder mit einem
// Wachturm in Reichweite – oder man sitzt ihn aus.
// Piraten lassen sich auch ANHEUERN: gegen einen Gegner geschickt,
// wirken sie wie ein Handelsembargo, nur unauffällig. Es kostet kein
// Ansehen – außer der Auftrag fliegt auf.
const PIRATEN = {
  erste:       480,          // frühestens nach so vielen Sekunden
  pause:       [420, 720],   // Sekunden zwischen zwei freien Raubzügen
  dauer:       [150, 220],   // so lange lauern sie vor einem Kontor
  malus:       0.35,         // Handelseinbuße des Opfers
  nah:         8,            // so nah am Kontor müssen sie dafür liegen
  schutzgeld:  800,          // dafür ziehen sie sofort ab …
  schonzeit:   420,          // … und meiden den Zahler so lange
  anheuern:    3000,         // Preis, um sie einem Gegner auf den Hals zu schicken
  auffliegen:  0.25,         // Wahrscheinlichkeit, dass der Auftraggeber bekannt wird
  auffliegenFeind: 20,       // … das kostet dann so viel Ansehen beim Opfer
  beute:       [400, 800],   // Gold für den, der sie versenkt
  tempo:       2.2,          // Kacheln je Sekunde
  abEw:        80,           // erst Siedlungen ab dieser Größe sind lohnende Ziele
};
let piraten = [];
let piratenZeit = { naechste: PIRATEN.erste + 120, gesehen: false };

// Zufälliges Wasserfeld am Kartenrand (von dort kommen und dorthin verschwinden sie)
function piratenRand() {
  for (let probe = 0; probe < 200; probe++) {
    const s = (Math.random() * (N - 6)) | 0, seite = (Math.random() * 4) | 0;
    const x = seite === 0 ? 2 : seite === 1 ? N - 3 : 3 + s;
    const y = seite === 2 ? 2 : seite === 3 ? N - 3 : 3 + s;
    if (seeFrei(y * N + x)) return { x, y };
  }
  return null;
}

// Lauerplatz: Wasser ein paar Felder vor dem Kontor, vom Start aus erreichbar
function piratenLauerplatz(kontor, start) {
  const z = zentrum(kontor);
  const kandidaten = [];
  for (let dy = -7; dy <= 7; dy++) for (let dx = -7; dx <= 7; dx++) {
    const x = Math.floor(z.x) + dx, y = Math.floor(z.y) + dy;
    if (x < 1 || y < 1 || x >= N - 1 || y >= N - 1 || !seeFrei(y * N + x)) continue;
    const dist = Math.hypot(dx, dy);
    if (dist < 4 || dist > 6.5) continue;
    kandidaten.push({ x, y, r: Math.random() });
  }
  kandidaten.sort((a, b) => a.r - b.r);
  for (const k of kandidaten.slice(0, 6)) {
    const weg = wegSuche(start.x, start.y, k.x, k.y, seeFrei);
    if (weg) return weg;
  }
  return null;
}

// Einen Piratenverband losschicken. von = Auftraggeber (oder -1 für freie Piraten)
function piratenSchicken(zielId, von) {
  const ziel = spieler[zielId];
  if (!ziel || !ziel.kontor) return null;
  const start = piratenRand();
  if (!start) return null;
  const weg = piratenLauerplatz(ziel.kontor, start);
  if (!weg) return null;
  const schiffe = Math.min(4, 2 + Math.floor(state.spielzeit / 1500));
  const p = { id: naechsteId++, x: start.x + 0.5, y: start.y + 0.5, pfad: weg,
              schiffe, start: schiffe, ziel: zielId, von, lauert: false, geht: false,
              bis: 0, kampf: false, entdeckt: false, seit: 0 };
  piraten.push(p);
  return p;
}

// Die Piraten ziehen ab (zum Kartenrand) und verschwinden dort
function piratenAbzug(p) {
  if (p.geht) return;
  p.geht = true; p.lauert = false;
  const rand = piratenRand();
  const weg = rand ? wegSuche(Math.floor(p.x), Math.floor(p.y), rand.x, rand.y, seeFrei) : null;
  p.pfad = weg || [];
  if (!weg) p.schiffe = 0;          // kein Weg hinaus: einfach verschwinden
}

// Schutzgeld zahlen: Die Piraten ziehen ab und lassen den Zahler eine Weile in Ruhe
function schutzgeldZahlen(sid, piratId) {
  if (istGast() && sid === ICH) return befehlSenden({ art: 'schutzgeld', id: piratId });
  const p = piraten.find(x => x.id === piratId), sp = spieler[sid];
  if (!p || p.geht || p.ziel !== sid) return false;
  if (sp.res.gold < PIRATEN.schutzgeld) {
    if (sid === ICH) melden(`Für das Schutzgeld fehlen ${Math.ceil(PIRATEN.schutzgeld - sp.res.gold)} 💰`);
    return false;
  }
  sp.res.gold -= PIRATEN.schutzgeld;
  sp.piratenSchonBis = state.spielzeit + PIRATEN.schonzeit;
  piratenAbzug(p);
  if (sid === ICH) melden('🏴‍☠️ Schutzgeld gezahlt – die Piraten ziehen ab und lassen dich eine Weile in Ruhe');
  return true;
}

// Piraten anheuern und einem Gegner schicken (heimliche Sanktion)
function piratenAnheuern(sid, gegen) {
  const sp = spieler[sid], ziel = spieler[gegen];
  const mir = text => { if (sid === ICH) melden(text); };
  if (!ziel || !ziel.kontor || gegen === sid) return false;
  if (piraten.some(p => p.von === sid && p.ziel === gegen && !p.geht)) { mir('Deine Piraten sind schon unterwegs'); return false; }
  if (sp.res.gold < PIRATEN.anheuern) { mir(`Dafür fehlen ${Math.ceil(PIRATEN.anheuern - sp.res.gold)} 💰`); return false; }
  const p = piratenSchicken(gegen, sid);
  if (!p) { mir('Die Piraten finden keinen Weg dorthin'); return false; }
  sp.res.gold -= PIRATEN.anheuern;
  mir(`🏴‍☠️ Die Piraten sind bezahlt und nehmen Kurs auf ${ziel.name} – niemand weiß, von wem`);
  return true;
}

// Eine Flotte auf einen Piratenverband ansetzen
function piratJagen(t, p) {
  if (!t || t.art !== 'flotte' || !p) return false;
  if (istGast() && t.spieler === ICH) return befehlSenden({ art: 'piratjagd', id: t.id, pirat: p.id });
  const weg = truppWeg(t, Math.floor(p.x), Math.floor(p.y));
  if (!weg) { if (t.spieler === ICH) melden('Zu den Piraten führt kein Seeweg'); return false; }
  t.pfad = weg; t.jagtPirat = p.id; t.verfolgt = 0; t.landen = null;
  if (t.spieler === ICH)
    melden(`🏴‍☠️ Auf die Piraten! ${Math.round(staerke(t))} gegen ${Math.round(p.schiffe * KRIEG.schiffWert * 0.9)}`);
  return true;
}

function piratenSchritt(dt) {
  const jetzt = state.spielzeit;

  // 1. Von Zeit zu Zeit ein freier Raubzug gegen eine lohnende Siedlung
  if (jetzt >= piratenZeit.naechste) {
    piratenZeit.naechste = jetzt + PIRATEN.pause[0] + Math.random() * (PIRATEN.pause[1] - PIRATEN.pause[0]);
    const opfer = spieler.filter(sp => sp.kontor && sp.einwohner >= PIRATEN.abEw &&
      jetzt >= (sp.piratenSchonBis || 0) && !piraten.some(p => p.ziel === sp.id));
    if (opfer.length && !piraten.some(p => p.von < 0)) {
      const ziel = opfer[(Math.random() * opfer.length) | 0];
      piratenSchicken(ziel.id, -1);
    }
  }
  if (!piraten.length) return;

  for (const p of piraten) {
    // 2. Fahrt
    let strecke = PIRATEN.tempo * (p.kampf ? 0.5 : 1) * dt;
    while (strecke > 0 && p.pfad.length) {
      const zielP = p.pfad[0];
      const dx = zielP.x - p.x, dy = zielP.y - p.y, dist = Math.hypot(dx, dy);
      if (dist <= strecke) { p.x = zielP.x; p.y = zielP.y; p.pfad.shift(); strecke -= dist; }
      else { p.x += dx / dist * strecke; p.y += dy / dist * strecke; strecke = 0; }
    }
    const ziel = spieler[p.ziel];
    if (!p.pfad.length && p.geht) { p.schiffe = 0; continue; }       // am Kartenrand: weg
    if (!ziel.kontor) { piratenAbzug(p); continue; }

    // 3. Ankunft: ab jetzt lauern sie und kürzen den Handel
    if (!p.pfad.length && !p.lauert && !p.geht) {
      p.lauert = true; p.seit = jetzt;
      p.bis = jetzt + PIRATEN.dauer[0] + Math.random() * (PIRATEN.dauer[1] - PIRATEN.dauer[0]);
      if (p.ziel === ICH) {
        const text = `Sie lauern vor deinem Kontor und vergraulen die Händler: Handel −${Math.round(PIRATEN.malus * 100)} %. ` +
          `Tippe sie an, um Schutzgeld zu zahlen (${PIRATEN.schutzgeld} 💰) – oder vertreibe sie mit Kriegsschiffen oder einem Wachturm.`;
        if (!piratenZeit.gesehen) { piratenZeit.gesehen = true; depesche('🏴‍☠️ Piraten!', text); }
        else melden('🏴‍☠️ Piraten lauern wieder vor deinem Kontor – dein Handel leidet');
      }
      // Fliegt der Auftraggeber auf?
      if (p.von >= 0 && Math.random() < PIRATEN.auffliegen) {
        p.entdeckt = true;
        feindAendern(p.von, p.ziel, PIRATEN.auffliegenFeind);
        if (p.ziel === ICH) depesche('🏴‍☠️ Die Piraten prahlen im Hafen',
          `${spieler[p.von].name} hat sie bezahlt, um deinen Handel zu stören!`);
        else if (p.von === ICH) melden(`🏴‍☠️ Aufgeflogen! ${ziel.name} weiß, dass du die Piraten bezahlt hast`);
      }
    }
    if (p.lauert && jetzt >= p.bis) piratenAbzug(p);

    // 4. Gefecht: gegen Flotten, die sie jagen, und gegen die des Opfers
    p.kampf = false;
    for (const t of truppen) {
      if (t.art !== 'flotte') continue;
      if (!(t.jagtPirat === p.id || t.spieler === p.ziel)) continue;
      if (Math.hypot(t.x - p.x, t.y - p.y) > 1.5) continue;
      const sT = staerke(t) * (0.9 + Math.random() * 0.2);
      const sP = p.schiffe * KRIEG.schiffWert * 0.9 * (0.9 + Math.random() * 0.2);
      t.schiffe -= sP * KRIEG.verlustRate * dt / KRIEG.schiffWert;
      p.schiffe -= sT * KRIEG.verlustRate * dt / KRIEG.schiffWert;
      t.kampf = true; p.kampf = true; p.sieger = t.spieler;
    }
    // Wachtürme des Opfers schießen mit
    if (!p.geht) for (const g of gebaeude) {
      if (g.typ !== 'wachturm' || g.spieler !== p.ziel) continue;
      const z = zentrum(g);
      if (Math.hypot(z.x - p.x, z.y - p.y) > wirkRadius(g)) continue;
      p.schiffe -= KRIEG.turmSchaden * KRIEG.turmGegenSchiff * dt / KRIEG.schiffWert;
      p.kampf = true; p.sieger = p.ziel;
    }
    // Angeschlagen suchen sie das Weite
    if (!p.geht && p.schiffe > 0.3 && p.schiffe < p.start * 0.5) {
      spieler[p.ziel].piratenSchonBis = jetzt + PIRATEN.schonzeit;
      if (p.ziel === ICH) melden('🏴‍☠️ Die Piraten haben genug und suchen das Weite!');
      piratenAbzug(p);
    }
  }

  // 5. Versenkte Verbände: Beute für den Sieger
  piraten = piraten.filter(p => {
    if (p.schiffe > 0.3) return true;
    if (!p.geht || p.kampf) {
      const sieger = p.sieger;
      if (sieger !== undefined && p.kampf) {
        const beute = Math.round(PIRATEN.beute[0] + Math.random() * (PIRATEN.beute[1] - PIRATEN.beute[0]));
        spieler[sieger].res.gold += beute;
        spieler[p.ziel].piratenSchonBis = state.spielzeit + PIRATEN.schonzeit;
        if (sieger === ICH) melden(`🏴‍☠️ Piraten versenkt! Du erbeutest ${beute} 💰`);
        else if (p.ziel === ICH) melden('🏴‍☠️ Die Piraten vor deinem Kontor sind versenkt');
      }
    }
    for (const t of truppen) if (t.jagtPirat === p.id) t.jagtPirat = 0;
    return false;
  });
}

/* ---------- 6. SIMULATION ------------------------------------- */

function simSchritt(dt) {
  state.spielzeit += dt;

  // --- Bevölkerung zählen und den Warenbedarf JE SPIELER sammeln ---
  for (const sp of spieler) {
    sp.einwohner = 0; sp.siedlerEw = 0;
    sp._bedarf = { nahrung: 0 };   // Ware → Verbrauch je Sekunde
  }
  for (const g of gebaeude) {
    if (g.typ !== 'wohnhaus') continue;
    const sp = spieler[g.spieler];
    sp.einwohner += g.ew;
    if (g.stufe >= 1) sp.siedlerEw += g.ew;
    sp._bedarf.nahrung += g.ew * SIM.nahrungJeEinwohner;
    for (const [ware, satz] of Object.entries(STUFEN[g.stufe].brauch))
      sp._bedarf[ware] = (sp._bedarf[ware] || 0) + g.ew * satz;
  }

  // --- Verbrauch vom Lager abbuchen; leere Lager als Mangel vermerken ---
  for (const sp of spieler) {
    sp.mangel = {};
    for (const [ware, proSek] of Object.entries(sp._bedarf)) {
      sp.res[ware] = Math.max(0, sp.res[ware] - proSek * dt);
      if (proSek > 0 && sp.res[ware] <= 0.001) sp.mangel[ware] = true;
    }
    sp.hunger = sp.einwohner > 0 && !!sp.mangel.nahrung;
  }

  const steuernJe = spieler.map(() => 0);
  const unterhaltJe = spieler.map(() => 0);

  // --- Bäume wachsen langsam nach ---
  state.baumTimer = (state.baumTimer || 0) + dt;
  while (state.baumTimer >= 1) {
    state.baumTimer -= 1;
    for (let i = 0; i < 25; i++) {  // 25 Zufallsproben je Sekunde
      const idx = (Math.random() * N * N) | 0;
      const k = karte[idx];
      if (k.typ === 'wald' && k.baum < 1 && !belegt[idx]) {
        k.baum = Math.min(1, k.baum + SIM.baumNachwuchs);
        kachelSchmutzig(idx % N, (idx / N) | 0);
      }
    }
  }

  // --- Alle Gebäude durchgehen (jedes wirtschaftet für seinen Besitzer) ---
  for (const geb of gebaeude) {
    const def = GEBAEUDE[geb.typ];
    const sp = spieler[geb.spieler];
    const R = sp.res;
    unterhaltJe[geb.spieler] += def.unterhalt * (geb.ausbau || 1) * dt;
    const z = zentrum(geb);

    // Beschädigte Gebäude werden von selbst ausgebessert, sobald Ruhe ist
    if (geb.hp < geb.maxHp && state.spielzeit - (geb.treffer || -999) > KRIEG.reparaturAb)
      geb.hp = Math.min(geb.maxHp, geb.hp + geb.maxHp * KRIEG.reparatur * dt);

    // Kleine Helfer für die zwei Produktions-Bauarten:
    // Sammler ernten aus der Umgebung, Verarbeiter wandeln eine Ware um.
    // Liefert true, wenn in diesem Schritt eine Einheit fertig wurde.
    // Boden und Wetter wirken auf alle Feldbetriebe
    const insel = inselMarke ? inselMarke[geb.y * N + geb.x] : -1;
    const wetter = (duerre.insel === insel && state.spielzeit < duerre.bis) ? DUERRE.ertrag : 1;
    const boden = BODEN_FRUECHTE.includes(geb.typ)
      ? bodenFaktor(insel, geb.typ) * wetter : 1;

    const sammler = (eff, ware, menge = 1) => {
      geb.eff = eff;
      geb.fortschritt += dt * eff;
      if (geb.fortschritt >= def.dauer) {
        geb.fortschritt -= def.dauer;
        R[ware] += menge * ausbauFaktor(geb) * boden;
        return true;
      }
      return false;
    };
    const verarbeiter = (rein, raus, menge = 1) => {
      if (R[rein] >= 1) {
        geb.eff = Math.min(1, geb.eff + dt);
        geb.fortschritt += dt;
        if (geb.fortschritt >= def.dauer) {
          geb.fortschritt -= def.dauer;
          R[rein] -= 1; R[raus] += menge * ausbauFaktor(geb);
        }
      } else geb.eff = Math.max(0, geb.eff - dt);
    };

    switch (geb.typ) {
      // --- Sammler: ernten aus dem Umkreis ---
      case 'fischer':
        sammler(Math.min(1, wasserImUmkreis(z.x, z.y, def.radius) / 6), 'nahrung');
        break;
      case 'jagd':
        sammler(Math.min(1, baeumeImUmkreis(z.x, z.y, def.radius) / 5), 'nahrung');
        break;
      case 'holzfaeller': {
        const geerntet = sammler(Math.min(1, baeumeImUmkreis(z.x, z.y, def.radius) / 4), 'holz');
        if (geerntet) {               // gerade geerntet → Wald etwas lichten
          let beste = null, bx = 0, by = 0;
          imUmkreis(z.x, z.y, def.radius, (k, x, y) => {
            if (k.baum > 0 && (!beste || k.baum > beste.baum)) { beste = k; bx = x; by = y; }
          });
          if (beste) { beste.baum = Math.max(0, beste.baum - 0.12); kachelSchmutzig(bx, by); }
        }
        break;
      }
      // Farmen ernten von ihren EIGENEN Feldern: 6 Felder = volle Leistung
      case 'schaffarm':
        sammler(Math.min(1, (geb.felder || []).length / 6), 'wolle');
        break;
      case 'getreidefarm':
        sammler(Math.min(1, (geb.felder || []).length / 6), 'getreide');
        break;
      case 'zuckerrohr':
        sammler(Math.min(1, (geb.felder || []).length / 6), 'zuckerrohr');
        break;
      case 'tabakplantage':
        sammler(Math.min(1, (geb.felder || []).length / 6), 'tabakblaetter');
        break;
      case 'gewuerzplantage':
        sammler(Math.min(1, (geb.felder || []).length / 6), 'gewuerze');
        break;
      case 'rinderfarm':
        sammler(Math.min(1, (geb.felder || []).length / 6), 'nahrung', 2);
        break;

      // --- Verarbeiter: wandeln eine Ware in eine andere um ---
      case 'weberei':     verarbeiter('wolle', 'stoffe'); break;
      case 'brennerei':   verarbeiter('zuckerrohr', 'alkohol'); break;
      case 'muehle':      verarbeiter('getreide', 'mehl'); break;
      case 'baeckerei':   verarbeiter('mehl', 'nahrung', 2); break;
      case 'tabakladen':  verarbeiter('tabakblaetter', 'tabak'); break;
      case 'schneiderei': verarbeiter('stoffe', 'kleidung'); break;
      case 'waffenschmiede': verarbeiter('eisenerz', 'waffen'); break;

      // --- Betriebe am Gestein ---
      case 'ziegelei': {
        const stein = steinKachelImUmkreis(z.x, z.y, def.radius);
        if (stein) {
          geb.eff = Math.min(1, geb.eff + dt);
          geb.fortschritt += dt;
          if (geb.fortschritt >= def.dauer) { geb.fortschritt -= def.dauer; R.ziegel += ausbauFaktor(geb); stein.stein -= 1; }
        } else geb.eff = Math.max(0, geb.eff - dt);
        break;
      }
      case 'schmiede': verarbeiter('eisenerz', 'werkzeuge'); break;

      case 'eisenmine': {
        const erz = eisenKachelImUmkreis(z.x, z.y, def.radius);
        if (erz) {
          geb.eff = Math.min(1, geb.eff + dt);
          geb.fortschritt += dt;
          if (geb.fortschritt >= def.dauer) {
            geb.fortschritt -= def.dauer;
            R.eisenerz += ausbauFaktor(geb);
            erz.eisen -= 1;
          }
        } else geb.eff = Math.max(0, geb.eff - dt);
        break;
      }

      case 'goldmine': {
        const ader = goldKachelImUmkreis(z.x, z.y, def.radius);
        if (ader) {
          geb.eff = Math.min(1, geb.eff + dt);
          geb.fortschritt += dt;
          if (geb.fortschritt >= def.dauer) {
            geb.fortschritt -= def.dauer;
            R.gold += 25 * ausbauFaktor(geb);
            ader.golderz -= 1;
          }
        } else geb.eff = Math.max(0, geb.eff - dt);
        break;
      }
      case 'goldschmiede': {
        const erz = goldKachelImUmkreis(z.x, z.y, def.radius);
        if (erz) {
          geb.eff = Math.min(1, geb.eff + dt);
          geb.fortschritt += dt;
          if (geb.fortschritt >= def.dauer) { geb.fortschritt -= def.dauer; R.schmuck += ausbauFaktor(geb); erz.golderz -= 1; }
        } else geb.eff = Math.max(0, geb.eff - dt);
        break;
      }

      // --- Wohnhäuser: Zufriedenheit, Steuern, Wachstum, Aufstieg ---
      case 'wohnhaus': {
        const st = STUFEN[geb.stufe];
        // Die Marktanbindung wird gemerkt und nur neu geprüft, wenn sich
        // am Gebäudebestand etwas geändert hat – das spart viel Rechenzeit
        if (geb._marktStand !== bauStand) {
          geb._markt = marktAnbindung(z.x, z.y, geb.spieler);
          geb._marktStand = bauStand;
        }
        const markt = geb._markt;
        // Zufrieden = Markt + satt + alle Waren der eigenen Stufe vorrätig
        let warenOK = !sp.hunger;
        for (const ware of Object.keys(st.brauch))
          if (sp.mangel[ware]) warenOK = false;
        geb.zufrieden = markt && warenOK;

        // Steuern: Unzufriedene zahlen nur die Hälfte
        steuernJe[geb.spieler] += geb.ew * st.steuer * mietFaktor(geb) *
          sp.boni.steuern * (geb.zufrieden ? 1 : 0.5) * dt;

        // Hunger: nach einer Weile ziehen Leute weg
        if (sp.hunger) {
          geb.hungerZeit += dt;
          if (geb.hungerZeit >= SIM.hungerBisWegzug) {
            geb.hungerZeit = 0;
            if (geb.ew > 1) geb.ew -= 1;
          }
        } else geb.hungerZeit = Math.max(0, geb.hungerZeit - dt);

        // Wachstum bei Zufriedenheit
        if (geb.zufrieden && geb.ew < geb.maxEw) {
          geb.wachsZeit += dt;
          if (geb.wachsZeit >= SIM.wachstumsDauer / sp.boni.wachstum) {
            geb.wachsZeit = 0; geb.ew += 1;
          }
        } else geb.wachsZeit = 0;

        // Aufstieg zur nächsten Stufe: Haus gut gefüllt, die Waren der
        // nächsten Stufe im Lager, ihr Gebäude in Reichweite und
        // Baumaterial (Holz/Ziegel) vorhanden
        const naechste = STUFEN[geb.stufe + 1];
        if (naechste) {
          let bereit = geb.zufrieden && geb.ew >= Math.ceil(st.maxEw * 0.75);
          for (const ware of Object.keys(naechste.brauch))
            if (R[ware] < 0.5) bereit = false;
          if (naechste.material)
            for (const [ware, menge] of Object.entries(naechste.material))
              if (R[ware] < menge) bereit = false;
          if (naechste.gebaeudeNah &&
              !gebaeudeInReichweite(naechste.gebaeudeNah, z.x, z.y, geb.spieler))
            bereit = false;
          if (bereit) {
            geb.aufstiegZeit += dt;
            if (geb.aufstiegZeit >= SIM.aufstiegsDauer) {
              if (naechste.material)   // Baumaterial wird verbaut
                for (const [ware, menge] of Object.entries(naechste.material))
                  R[ware] -= menge;
              geb.stufe++; geb.aufstiegZeit = 0;
              geb.maxEw = hausMaxEw(geb);
              const warNeu = geb.stufe > sp.maxStufe;
              sp.maxStufe = Math.max(sp.maxStufe, geb.stufe);
              if (geb.spieler === ICH) {
                melden(`🎉 Ein Haus ist zu ${st.dativ} aufgestiegen!`, 'aufstieg');
                if (warNeu) menueBauen();   // neue Gebäude freigeschaltet
              }
            }
          } else geb.aufstiegZeit = 0;
        }
        break;
      }
    }
  }

  // --- Gunst: wer seine Bürger dauerhaft zufrieden hält, wird belohnt ---
  for (const sp of spieler) {
    const haeuser = gebaeude.filter(g => g.typ === 'wohnhaus' && g.spieler === sp.id);
    const alleFroh = haeuser.length >= 3 && haeuser.every(h => h.zufrieden);
    if (alleFroh) {
      sp.zufriedenZeit += dt;
      if (sp.zufriedenZeit >= 90) {
        sp.zufriedenZeit = 0;
        sp.gunst++;
        if (sp.id === ICH)
          melden('🏅 Deine Bürger sind rundum zufrieden – du erhältst eine Gunst! Baue ein Denkmal.');
      }
    } else sp.zufriedenZeit = Math.max(0, sp.zufriedenZeit - dt * 0.5);

    // Denkmals-Boni neu zusammenrechnen
    sp.boni = { steuern: 1, kontingent: 1, wachstum: 1 };
    for (const g of gebaeude) {
      if (g.spieler !== sp.id) continue;
      const def = GEBAEUDE[g.typ];
      if (def.bonus) sp.boni[def.bonus] += def.bonusWert;
    }
  }

  // --- Wetter: selten trocknet eine Insel aus ---
  if (state.spielzeit > duerre.naechste && inselGroessen.length) {
    // Nur bewohnte Inseln trifft es – sonst merkt es niemand. Und nie
    // dieselbe Insel zweimal hintereinander.
    let bewohnt = [...new Set(gebaeude.map(g => inselMarke[g.y * N + g.x]))].filter(i => i >= 0);
    if (bewohnt.length > 1) bewohnt = bewohnt.filter(i => i !== duerre.zuletzt);
    if (bewohnt.length) {
      duerre.insel = duerre.zuletzt = bewohnt[(Math.random() * bewohnt.length) | 0];
      duerre.bis = state.spielzeit + DUERRE.dauer[0] + Math.random() * (DUERRE.dauer[1] - DUERRE.dauer[0]);
      const meine = gebaeude.some(g => g.spieler === ICH &&
        inselMarke[g.y * N + g.x] === duerre.insel);
      if (meine) melden('🌵 Dürre auf deiner Insel! Die Felder bringen eine Weile nur die Hälfte.');
    }
    duerre.naechste = state.spielzeit + DUERRE.pause[0] + Math.random() * (DUERRE.pause[1] - DUERRE.pause[0]);
  }
  if (duerre.insel >= 0 && state.spielzeit >= duerre.bis) duerre.insel = -1;

  // --- Wirtschaftskrieg: Sanktionen, Kontingente, Stimmung ---
  diploSchritt(dt, unterhaltJe);

  // --- Krieg: Sold zahlen, marschieren, kämpfen ---
  for (const sp of spieler) unterhaltJe[sp.id] += soldJeSpieler(sp.id) * dt;
  truppenUpdate(dt);
  kriegSchritt(dt);
  piratenSchritt(dt);

  // --- Goldbilanz je Spieler ---
  for (const sp of spieler) {
    sp.res.gold += steuernJe[sp.id] - unterhaltJe[sp.id];
    if (dt > 0) sp.bilanz = (sp.bilanz || 0) * 0.98 + (steuernJe[sp.id] - unterhaltJe[sp.id]) / dt * 0.02;
  }
  const rate = dt > 0 ? (steuernJe[0] - unterhaltJe[0]) / dt : 0;
  state.goldRate = state.goldRate * 0.95 + rate * 0.05;

  // --- Marktpreise pendeln langsam zum Normalwert zurück ---
  for (const ware of Object.keys(markt))
    markt[ware] += (1 - markt[ware]) * 0.005 * dt;

  // --- Auto-Handel: dein Lager nach deinen Regeln auffüllen/leeren ---
  state.autoTimer = (state.autoTimer || 0) + dt;
  while (state.autoTimer >= 2) {
    state.autoTimer -= 2;
    for (const [ware, regel] of Object.entries(autoHandel)) {
      // Nachkaufen in 10er-Paketen, solange Gold-Polster bleibt
      if (regel.kauf !== null && res[ware] < regel.kauf &&
          res.gold > kaufpreis(ware) * 10 + 200)
        handelAusfuehren(spieler[ICH], ware, 10);
      // Überschuss in 10er-Paketen verkaufen
      if (regel.verkauf !== null && res[ware] > regel.verkauf)
        handelAusfuehren(spieler[ICH], ware, -10);
    }
  }

  // --- Die KI-Spieler ziehen ---
  for (const sp of spieler) if (sp.ki) kiTick(sp, dt);

  // --- Bankrott-Uhr (gilt nur für dich) ---
  if (res.gold < 0) {
    state.pleiteZeit += dt;
    if (state.pleiteZeit >= SIM.pleiteDauer && !state.vorbei) spielVorbei();
  } else state.pleiteZeit = 0;

  // --- Wettrennen: Wer erreicht zuerst das Siedler-Ziel? ---
  if (!state.rennenVorbei) {
    if (spieler[ICH].siedlerEw >= SIM.zielSiedler) {
      state.rennenVorbei = true; state.gewonnen = true;
      gewonnenAnzeigen();
    } else {
      for (const sp of spieler) {
        if (sp.ki && sp.siedlerEw >= SIM.zielSiedler) {
          state.rennenVorbei = true;
          verlorenAnzeigen(sp);
          break;
        }
      }
    }
  }

  // Werte für die Anzeige merken (deine Sicht)
  state.einwohner = spieler[ICH].einwohner;
  state.siedlerEw = spieler[ICH].siedlerEw;
  state.hunger = spieler[ICH].hunger;
  state.mangel = spieler[ICH].mangel;
}

/* ---------- 7. ZEICHNEN --------------------------------------- */

const leinwand = document.getElementById('karte');
let ctx = leinwand.getContext('2d');   // umschaltbar: siehe uebersichtBauen()
let dpr = 1;

/* ---------- Isometrische Projektion ---------------------------
   Die Karte wird nicht senkrecht von oben gezeigt, sondern schräg:
   jede Kachel ist eine Raute (doppelt so breit wie hoch). Dadurch
   sieht man von jedem Bauwerk zwei Wandseiten und das Dach.

   Kachelgitter -> Weltpixel:
     x = (tx - ty) * KW/2 + XV        (XV, damit x nie negativ wird)
     y = (tx + ty) * KH/2
   Die Funktionen nehmen GITTERPUNKTE, nicht Kachelmitten: isoX(3,4)
   ist die Nordecke der Kachel (3,4), isoX(4,5) ihre Südecke.
   --------------------------------------------------------------- */
const KW = 64;                  // Breite einer Kachelraute
const KH = 40;                  // Höhe einer Kachelraute. Bei 32 wäre es das
                                // klassische 2:1-Schrägbild; 40 schaut steiler
                                // von oben, die Karte wirkt weniger gestaucht.
const HE = 30;                  // Höheneinheit für alles Aufrechte (Wände, Türme,
                                // Bäume). Bewusst unabhängig von KH: je steiler
                                // der Blick, desto kürzer erscheinen Wände.
const XV = N * KW / 2;          // Nullpunktverschiebung
const WELT_B = N * KW;          // Weltbreite in Pixeln
const WELT_H = N * KH;          // Welthöhe in Pixeln

// Wie hoch liegt Land über dem Meeresspiegel (in Bildschirmpixeln)?
const H_STRAND = 5;
const H_LAND = 9;
const BERG_TEIL = 3;            // jede Bergkachel wird in 3×3 Felder unterteilt –
                                // so entstehen runde Hänge statt einer Pyramide je Kachel
const BERG_MAX = 190;           // höher wird kein Gipfel

function isoX(tx, ty) { return (tx - ty) * (KW / 2) + XV; }
function isoY(tx, ty) { return (tx + ty) * (KH / 2); }

// Umkehrung: Weltpunkt -> (gebrochene) Kachelkoordinate
function kachelVonWelt(wx, wy) {
  const u = (wx - XV) / (KW / 2);     // = tx - ty
  const v = wy / (KH / 2);            // = tx + ty
  return { x: (v + u) / 2, y: (v - u) / 2 };
}

// Höhe einer Kachel. Wasser liegt auf 0, Land auf einem Plateau,
// Berge ragen darüber hinaus – daraus entstehen Steilkanten am Ufer.
function kachelHoehe(k) {
  if (!k || k.typ === 'wasser') return 0;
  if (k.typ === 'strand') return H_STRAND;
  return H_LAND;      // auch für Berge: ihr FUSS steht auf dem Plateau,
}                     // das Gebirge selbst wird als eigene Fläche gezeichnet
function hoeheBei(x, y) {
  if (x < 0 || y < 0 || x >= N || y >= N) return 0;
  if (cacheKarte !== karte || !hoehCache) geländeCacheBauen();
  return hoehCache[y * N + x];
}

// Mittelpunkt einer Kachel auf dem Bildschirm (mit Höhe)
function kachelMitte(x, y) {
  return { x: isoX(x + 0.5, y + 0.5), y: isoY(x + 0.5, y + 0.5) - hoeheBei(x, y) };
}

// Die Raute einer Kachel als Pfad (oben = Nordecke)
function rautePfad(x, y, hoch, wachs) {
  const w = wachs || 0;
  ctx.beginPath();
  ctx.moveTo(isoX(x, y), isoY(x, y) - hoch - w);
  ctx.lineTo(isoX(x + 1, y), isoY(x + 1, y) - hoch);
  ctx.lineTo(isoX(x + 1, y + 1), isoY(x + 1, y + 1) - hoch + w);
  ctx.lineTo(isoX(x, y + 1), isoY(x, y + 1) - hoch);
  ctx.closePath();
}

// ---------- Farbwelt ----------------------------------------
// Warme, erdige Töne wie in den klassischen Aufbauspielen.
const PALETTE = {
  tiefsee:    [26, 71, 100],
  see:        [42, 99, 134],
  flach:      [76, 146, 173],
  fluss:      [78, 148, 186],
  sand:       [231, 211, 160],
  sandDunkel: [196, 173, 120],
  gras:       [124, 162, 82],
  grasHell:   [150, 184, 104],
  grasDunkel: [98, 132, 64],
  wald:       [82, 122, 56],
  waldDunkel: [58, 92, 42],
  berg:       [146, 138, 126],
  bergHell:   [184, 176, 162],
  bergDunkel: [96, 89, 80],
  erde:       [150, 118, 78],
  erdeDunkel: [112, 86, 56],
};

function ton(c, v = 0) {
  return `rgb(${Math.round(c[0] + v)},${Math.round(c[1] + v)},${Math.round(c[2] + v)})`;
}
function mischen(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t];
}
function istWasser(x, y) {
  const k = kachel(x, y);
  return !k || k.typ === 'wasser';
}

// Tiefenfeld des Meeres: für jede Wasserkachel der Abstand zum Land.
// Wird einmal beim Kartenaufbau gerechnet und danach weichgezeichnet,
// damit der Farbverlauf nicht in groben Stufen zerfällt.
let tiefenFeld = null;
function tiefenFeldRechnen() {
  const MAX = 9;
  const f = new Float32Array(N * N).fill(-1);
  const schlange = new Int32Array(N * N);
  let kopf = 0, ende = 0;
  for (let i = 0; i < N * N; i++)
    if (karte[i].typ !== 'wasser') { f[i] = 0; schlange[ende++] = i; }

  while (kopf < ende) {
    const j = schlange[kopf++];
    if (f[j] >= MAX) continue;
    const x = j % N, y = (j / N) | 0;
    for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + ax, ny = y + ay;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const ni = ny * N + nx;
      if (f[ni] === -1) { f[ni] = f[j] + 1; schlange[ende++] = ni; }
    }
  }
  for (let i = 0; i < N * N; i++) if (f[i] === -1) f[i] = MAX;

  for (let durchgang = 0; durchgang < 4; durchgang++) {
    const g = Float32Array.from(f);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let summe = 0, anzahl = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        summe += g[ny * N + nx]; anzahl++;
      }
      f[y * N + x] = summe / anzahl;
    }
  }
  tiefenFeld = f;
}

// Meeresfarbe zu einem Tiefenwert (0 = Ufer, 5,5 = offenes Meer)
function meerFarbe(wert) {
  const t = Math.max(0, Math.min(1, wert / 5.5));
  return t < 0.5 ? mischen(PALETTE.flach, PALETTE.see, t * 2)
                 : mischen(PALETTE.see, PALETTE.tiefsee, (t - 0.5) * 2);
}

// Deckfarben und Höhen ändern sich nur, wenn sich die Karte ändert.
// Darum werden sie einmal berechnet und gemerkt – das spart in jedem
// Bild tausende Farbrechnungen.
let hoehCache = null;
let cacheKarte = null;    // für welche Karte gilt der Cache? Wird die Welt
                          // ausgetauscht (neues Spiel, Laden, Mehrspieler-
                          // Beitritt), ist „karte" ein anderes Feld – dann
                          // wird alles neu berechnet, ganz ohne Merker.
let farbListe = null;     // alle vorkommenden Deckfarben – erst Wasser, dann
                          // Strand, dann Land (das ist auch die Malreihenfolge)
let farbNummer = null;    // je Kachel: welche Farbe aus der Liste
let istBerg = null;       // je Kachel: 1 = Gebirge
let bergGitter = null;    // Höhe jedes Punkts im feinen Gebirgsgitter (Drittelkachel-Raster)
let bergNetz = null;      // je Bergkachel die fertig berechneten Hangdreiecke:
                          // { p: Bildpunkte (6 Zahlen je Dreieck), f: Farben, erz: Punkte für Erzadern }

// Fester Zufallswert 0…1 aus zwei Zahlen – immer derselbe für dieselbe
// Stelle, damit das Gebirge nicht bei jedem Bild anders aussieht.
function zufallAus(a, b) {
  const w = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return w - Math.floor(w);
}

// Stimmt der Cache noch? Sonst neu aufbauen. Billig genug, um es vor
// jedem Zugriff zu fragen.
function gelaendeBereit() {
  if (cacheKarte !== karte || !hoehCache || !farbListe) geländeCacheBauen();
}

function geländeCacheBauen() {
  tiefenFeldRechnen();                   // Meerestiefen gehören zur Karte dazu
  cacheKarte = karte;
  uebersichtAlt = true;                  // das Übersichtsbild ist damit überholt
  hoehCache = new Float32Array(N * N);
  const NACHBARN4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  // --- Höhen der Deckflächen ---
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, k = karte[i];
    let hoch = kachelHoehe(k);
    if (k.typ === 'fluss') {
      // Läuft der Fluss über den Strand, liegt er auf Strandhöhe
      let strand = 0, land = 0;
      for (const [dx, dy] of NACHBARN4) {
        const n = kachel(x + dx, y + dy);
        if (!n || n.typ === 'wasser' || n.typ === 'strand') strand++;
        else if (n.typ !== 'fluss') land++;
      }
      if (strand > 0 && land === 0) hoch = H_STRAND;
    }
    hoehCache[i] = hoch;
  }

  // --- Gebirge ---
  gebirgeBauen();

  // --- Deckfarben (brauchen die fertigen Höhen) ---
  // Jede Farbe kommt nur einmal in die Liste; die Kacheln merken sich
  // ihre Nummer. So lassen sich später alle Kacheln einer Farbe in
  // einem einzigen Rutsch füllen statt jede einzeln.
  const nummern = new Map();
  farbListe = [];
  farbNummer = new Uint16Array(N * N);
  for (const stufe of [0, H_STRAND, H_LAND]) {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      if (hoehCache[i] !== stufe) continue;
      const farbe = deckFarbe(karte[i], x, y);
      let nr = nummern.get(farbe);
      if (nr === undefined) { nr = farbListe.length; farbListe.push(farbe); nummern.set(farbe, nr); }
      farbNummer[i] = nr;
    }
  }
}

/* ---------- Gebirge als Höhenfeld -------------------------------
   Alle zusammenhängenden Bergkacheln bilden EIN Massiv. Für jeden Punkt
   eines feinen Gitters (Drittel-Kachelschritte) wird gemessen, wie weit
   er vom Rand des Gebirges entfernt liegt – je weiter, desto höher.
   Ein einzelner Fels bleibt ein Hügel, ein breites Massiv türmt sich
   zu einem richtigen Berg mit Schneekappe auf. Sanftes Rauschen sorgt
   für Gipfel und Sättel, damit kein Massiv wie das andere aussieht.
   --------------------------------------------------------------- */

// Weiches Rauschen 0…1 (zwei Wellenlängen überlagert), fest je Ort
function bergRauschen(px, py) {
  const welle = (x, y) => {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const tx = x - x0, ty = y - y0;
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const oben  = zufallAus(x0, y0) * (1 - sx) + zufallAus(x0 + 1, y0) * sx;
    const unten = zufallAus(x0, y0 + 1) * (1 - sx) + zufallAus(x0 + 1, y0 + 1) * sx;
    return oben * (1 - sy) + unten * sy;
  };
  return 0.65 * welle(px / 2.7 + 11.3, py / 2.7 + 4.1) + 0.35 * welle(px / 1.15 + 3.7, py / 1.15 + 8.9);
}

// Abstand eines Punkts zum nächsten Nicht-Berg (in Kacheln, höchstens 7)
function bergRandAbstand(px, py) {
  const bx = Math.floor(px), by = Math.floor(py);
  let best = 7;
  for (let r = 0; r <= 7; r++) {
    if (r - 1 >= best) break;                 // weiter außen kann nichts Näheres mehr liegen
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;     // nur der Ring
      const x = bx + dx, y = by + dy;
      if (x >= 0 && y >= 0 && x < N && y < N && istBerg[y * N + x]) continue;
      // Abstand des Punkts zum Quadrat dieser Kachel
      const ax = Math.max(x - px, 0, px - x - 1), ay = Math.max(y - py, 0, py - y - 1);
      const dist = Math.hypot(ax, ay);
      if (dist < best) best = dist;
    }
  }
  return best;
}

function gebirgeBauen() {
  const T = BERG_TEIL, G = N * T + 1;
  istBerg = new Uint8Array(N * N);
  let irgendeins = false;
  for (let i = 0; i < N * N; i++) if (karte[i].typ === 'berg') { istBerg[i] = 1; irgendeins = true; }
  bergGitter = new Float32Array(G * G).fill(H_LAND);
  bergNetz = new Array(N * N).fill(null);
  if (!irgendeins) return;

  // Dünne Stellen – einzelne Felsen und schmale Grate, in deren Nähe keine
  // Kachel ganz von Gebirge umgeben ist – bekämen kaum Höhe. Damit man
  // sie trotzdem als Fels erkennt, erhalten sie eine kleine Kuppe.
  const mitteAbstand = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (istBerg[y * N + x]) mitteAbstand[y * N + x] = bergRandAbstand(x + 0.5, y + 0.5);
  const duenn = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!istBerg[y * N + x]) continue;
    let tief = false;
    for (let dy = -1; dy <= 1 && !tief; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < N && ny < N && mitteAbstand[ny * N + nx] > 0.6) { tief = true; break; }
    }
    duenn[y * N + x] = tief ? 0 : 1;
  }

  // 1. Höhen aller Gitterpunkte, die zu einer Bergkachel gehören
  const erledigt = new Uint8Array(G * G);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!istBerg[y * N + x]) continue;
    for (let j = 0; j <= T; j++) for (let i = 0; i <= T; i++) {
      const gi = (y * T + j) * G + x * T + i;
      if (erledigt[gi]) continue;
      erledigt[gi] = 1;
      const px = x + i / T, py = y + j / T;
      const rand = bergRandAbstand(px, py);
      if (rand <= 0.001) continue;                           // am Gebirgsrand: ebenerdig
      // Höhe: am Rand sanft ansteigend (der Hang wächst weich aus der
      // Wiese), innen steil, zuletzt immer flacher bis zur Obergrenze
      const innen = i > 0 && i < T && j > 0 && j < T;        // Punkt gehört nur dieser Kachel
      const kuppe = innen && duenn[y * N + x] ? 15 * (0.8 + 0.4 * zufallAus(px * 5.3, py * 4.1)) : 0;
      const roh = 74 * Math.pow(rand, 1.35) + kuppe;
      const decke = BERG_MAX - H_LAND - 6;
      // Das Rauschen wirkt erst NACH der Begrenzung – so behalten auch die
      // höchsten Massive Gipfel und Sättel, statt zur Kuppel zu verflachen
      bergGitter[gi] = H_LAND + decke * Math.tanh(roh / decke) * (0.64 + 0.36 * bergRauschen(px, py));
    }
  }

  // 2. Je Kachel die Hangdreiecke: Bildpunkte und Farben fertig berechnen
  const S = 40;                              // so viele Pixel Höhe zählen wie eine Kachelbreite
  const hoch = (gx, gy) => (gx < 0 || gy < 0 || gx >= G || gy >= G) ? H_LAND : bergGitter[gy * G + gx];
  // Neigung an einem Gitterpunkt (aus den Nachbarhöhen) → Helligkeit und Flachheit
  const neigung = (gx, gy) => {
    const nx = -(hoch(gx + 1, gy) - hoch(gx - 1, gy)) * T / (2 * S);
    const ny = -(hoch(gx, gy + 1) - hoch(gx, gy - 1)) * T / (2 * S);
    const laenge = Math.hypot(nx, ny, 1);
    return { licht: (nx * -0.5 + ny * 0.45 + 0.74) / laenge, flach: 1 / laenge };
  };
  const WIESE = PALETTE.gras, MATTE = [128, 136, 96], FELS = [150, 141, 128],
        SCHATTENFELS = [116, 108, 100], SCHNEE = [244, 246, 250];
  const klemme = v => Math.max(0, Math.min(1, v));

  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const ki = y * N + x;
    if (!istBerg[ki]) continue;
    const punkte = [], farben = [];
    const zufall = zufallAus(x * 3.1, y * 1.7);

    const dreieck = (a, b, c) => {            // a, b, c: [gx, gy]
      const h = [a, b, c].map(v => hoch(v[0], v[1]));
      const X = [a, b, c].map(v => isoX(v[0] / T, v[1] / T));
      const Y = [a, b, c].map((v, n) => isoY(v[0] / T, v[1] / T) - h[n]);
      // Dem Betrachter abgewandte Flächen sieht man nie – weglassen
      const kreuz = (X[1] - X[0]) * (Y[2] - Y[0]) - (Y[1] - Y[0]) * (X[2] - X[0]);
      if (kreuz <= 0.5) return;
      const nA = neigung(a[0], a[1]), nB = neigung(b[0], b[1]), nC = neigung(c[0], c[1]);
      const licht = (nA.licht + nB.licht + nC.licht) / 3, flach = (nA.flach + nB.flach + nC.flach) / 3;
      const ueber = (h[0] + h[1] + h[2]) / 3 - H_LAND;       // Höhe über der Ebene
      // Farbton nach der Höhe: Wiese → karge Matte → Fels → Schnee
      const t = klemme((ueber - 7) / 28);
      let farbe = t < 0.5 ? mischen(WIESE, MATTE, t * 2) : mischen(MATTE, FELS, (t - 0.5) * 2);
      farbe = mischen(farbe, SCHATTENFELS, klemme((0.8 - flach) / 0.35) * 0.4 * t);      // Steilwände dunkler
      farbe = mischen(farbe, SCHNEE, klemme((ueber - 104) / 30) * klemme((flach - 0.42) / 0.3) * 0.94);
      // Helligkeit: ebener Boden bleibt, wie er ist; Lichthänge heller,
      // Schattenhänge dunkler. Am Bergfuß nur verhalten – dort soll der
      // Hang weich aus der Wiese wachsen und keine harte Kante zeigen.
      const kraft = klemme((ueber - 3) / 30);
      const hell = Math.max(0.7, Math.min(1.22, 1 + 0.7 * kraft * (licht - 0.74) + (zufall - 0.5) * 0.04));
      const kanal = n => Math.min(255, Math.round(farbe[n] * hell / 4) * 4);
      // Um einen halben Pixel nach außen dehnen – sonst blitzen zwischen
      // den Flächen haarfeine Fugen auf
      const mx = (X[0] + X[1] + X[2]) / 3, my = (Y[0] + Y[1] + Y[2]) / 3;
      for (let n = 0; n < 3; n++) {
        const lx = X[n] - mx, ly = Y[n] - my, l = Math.hypot(lx, ly) || 1;
        punkte.push(X[n] + lx / l * 0.6, Y[n] + ly / l * 0.6);
      }
      farben.push(`rgb(${kanal(0)},${kanal(1)},${kanal(2)})`);
    };

    for (let j = 0; j < T; j++) for (let i = 0; i < T; i++) {
      const gx = x * T + i, gy = y * T + j;
      const n = [gx, gy], o = [gx + 1, gy], s = [gx + 1, gy + 1], w = [gx, gy + 1];
      // Das Viereck entlang der „ruhigeren" Diagonale teilen
      if (Math.abs(hoch(gx, gy) - hoch(gx + 1, gy + 1)) <= Math.abs(hoch(gx + 1, gy) - hoch(gx, gy + 1))) {
        dreieck(n, o, s); dreieck(n, s, w);          // Naht Nord–Süd
      } else {
        dreieck(n, o, w); dreieck(o, s, w);          // Naht Ost–West: erst hinten, dann vorn
      }
    }

    // Erzadern: ein paar feste Punkte auf dem vorderen Teil der Kachel
    const erz = [];
    const k = karte[ki];
    if (k.golderz > 0 || k.eisen > 0) {
      for (let n = 0; n < (k.golderz > 0 ? 3 : 2); n++) {
        const fx = x + 0.3 + 0.55 * zufallAus(ki + n, 1.3), fy = y + 0.35 + 0.55 * zufallAus(ki + n, 2.9);
        erz.push(isoX(fx, fy), isoY(fx, fy) - bergHoeheBei(fx, fy));
      }
    }
    bergNetz[ki] = { p: Float32Array.from(punkte), f: farben, erz };
  }
}

// Höhe des Gebirges an beliebiger Stelle (gebrochene Kachelkoordinaten) –
// genau so zwischen den Gitterpunkten gemittelt, wie die Hänge gezeichnet sind
function bergHoeheBei(fx, fy) {
  const T = BERG_TEIL, G = N * T + 1;
  const gx = Math.min(N * T - 1, Math.max(0, Math.floor(fx * T)));
  const gy = Math.min(N * T - 1, Math.max(0, Math.floor(fy * T)));
  const u = fx * T - gx, v = fy * T - gy;
  const hN = bergGitter[gy * G + gx],       hO = bergGitter[gy * G + gx + 1];
  const hW = bergGitter[(gy + 1) * G + gx], hS = bergGitter[(gy + 1) * G + gx + 1];
  if (Math.abs(hN - hS) <= Math.abs(hO - hW)) {              // Naht Nord–Süd
    return u >= v ? hN + u * (hO - hN) + v * (hS - hO)
                  : hN + v * (hW - hN) + u * (hS - hW);
  }
  return u + v <= 1 ? hN + u * (hO - hN) + v * (hW - hN)     // Naht Ost–West
                    : hS + (1 - u) * (hW - hS) + (1 - v) * (hO - hS);
}

// Grundfarbe der Deckfläche einer Kachel
function deckFarbe(k, x, y) {
  // drei Helligkeitsstufen je Geländeart, das Meer in feinen Tiefenstufen
  const v = (Math.round(k.var * 2) - 1) * 2.5;
  switch (k.typ) {
    case 'wasser': return ton(meerFarbe(
                     Math.round((tiefenFeld ? tiefenFeld[y * N + x] : 5.5) * 4) / 4), 0);
    case 'strand': return ton(PALETTE.sand, v);
    // Flusskacheln sind Uferwiese bzw. Strand – das Wasser selbst
    // wird als durchgehendes Band darübergelegt (siehe flussZeichnen)
    case 'fluss':  return hoehCache && hoehCache[y * N + x] === H_STRAND
                     ? ton(PALETTE.sand, v) : ton(PALETTE.gras, v - 6);
    case 'wald':   return ton(PALETTE.wald, v * 0.6);
    case 'berg':   return ton(PALETTE.gras, v - 3);     // der Bergfuß ist begrünt
    default:       return ton(PALETTE.gras, v);
  }
}

// Farben der Steilkanten: je Bodenart erst die dunkle rechte, dann
// die helle linke Flanke (Fels, Sand, Erde)
const KANTEN_FARBEN = [
  ton(PALETTE.berg, -26), ton(PALETTE.berg, 0),
  ton(PALETTE.sandDunkel, -26), ton(PALETTE.sandDunkel, 0),
  ton(PALETTE.erde, -26), ton(PALETTE.erde, 0),
];

/* ---------- Sichtbarer Ausschnitt ------------------------------ */
// Welche Kacheln liegen überhaupt im Bild? Alles andere wird
// übersprungen – sonst müssten jedes Bild 19.600 Rauten gemalt werden.
const VOR_RAND = Math.ceil(BERG_MAX / KH) + 2;   // Kacheln Zugabe nach vorn
function sichtBereich() {
  const b = leinwand.clientWidth / kamera.zoom;
  const h = leinwand.clientHeight / kamera.zoom;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const [wx, wy] of [[kamera.x, kamera.y], [kamera.x + b, kamera.y],
                          [kamera.x, kamera.y + h], [kamera.x + b, kamera.y + h]]) {
    const t = kachelVonWelt(wx, wy);
    x0 = Math.min(x0, t.x); x1 = Math.max(x1, t.x);
    y0 = Math.min(y0, t.y); y1 = Math.max(y1, t.y);
  }
  return {
    // (nach vorn großzügig: hohe Berge unterhalb des Bildrands ragen ins Bild)
    x0: Math.max(0, Math.floor(x0) - 1), x1: Math.min(N - 1, Math.ceil(x1) + VOR_RAND),
    y0: Math.max(0, Math.floor(y0) - 1), y1: Math.min(N - 1, Math.ceil(y1) + VOR_RAND),
    links: kamera.x - KW, rechts: kamera.x + b + KW,
    oben: kamera.y - KH * 2, unten: kamera.y + h + BERG_MAX + KH,
  };
}

// Liegt die Kachel im Bild? (grobe, billige Prüfung)
function imBild(s, x, y) {
  const mx = isoX(x + 0.5, y + 0.5), my = isoY(x + 0.5, y + 0.5);
  return mx > s.links && mx < s.rechts && my > s.oben && my < s.unten;
}

/* ---------- Der Boden ------------------------------------------ */
// Erst alle Deckflächen, dann alle Steilkanten: so verdeckt keine
// später gezeichnete Kachel die Kante ihres Nachbarn.
function bodenZeichnen(s, fein) {
  gelaendeBereit();

  // 1. Deckflächen: alle Kacheln derselben Farbe wandern in einen
  //    gemeinsamen Pfad und werden zusammen gefüllt. Das sind statt
  //    tausender Füllungen nur ein paar Dutzend je Bild.
  //    Gebündelt wird je Kachelreihe: riesige Pfade über das ganze Bild
  //    wären für den Browser wieder langsamer als viele kleine.
  const pfade = new Array(farbListe.length);
  const benutzt = [];
  const wachs = 0.6;                                // hauchdünn überlappen
  for (let y = s.y0; y <= s.y1; y++) {
    benutzt.length = 0;
    for (let x = s.x0; x <= s.x1; x++) {
      if (!imBild(s, x, y)) continue;
      const i = y * N + x, nr = farbNummer[i];
      const nx = (x - y) * (KW / 2) + XV, ny = (x + y) * (KH / 2) - hoehCache[i];
      let p = pfade[nr];
      if (!p) { p = pfade[nr] = new Path2D(); benutzt.push(nr); }
      p.moveTo(nx, ny - wachs);
      p.lineTo(nx + KW / 2 + wachs, ny + KH / 2);
      p.lineTo(nx, ny + KH + wachs);
      p.lineTo(nx - KW / 2 - wachs, ny + KH / 2);
      p.closePath();
    }
    // Reihe abschließen – in Listenreihenfolge (Wasser, Strand, Land),
    // weil höher liegende Kacheln ihre Nachbarn leicht überdecken
    benutzt.sort((a, b) => a - b);
    for (const nr of benutzt) {
      ctx.fillStyle = farbListe[nr];
      ctx.fill(pfade[nr]);
      pfade[nr] = null;
    }
  }

  // 1b. Flüsse als durchgehendes Band über den Uferkacheln
  const faelle = flussZeichnen(s, fein);

  // 2. Struktur: alle Striche in EINEM Pfad, das ist deutlich schneller
  if (fein) {
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let y = s.y0; y <= s.y1; y++) for (let x = s.x0; x <= s.x1; x++) {
      const k = karte[y * N + x];
      if (k.typ !== 'wasser' || k.var < 0.84 || !imBild(s, x, y)) continue;
      const mx = isoX(x + 0.5, y + 0.5), my = isoY(x + 0.5, y + 0.5);
      ctx.moveTo(mx - KW * 0.16, my);
      ctx.quadraticCurveTo(mx, my - KH * 0.12, mx + KW * 0.16, my);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(96,126,62,0.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let y = s.y0; y <= s.y1; y++) for (let x = s.x0; x <= s.x1; x++) {
      const k = karte[y * N + x];
      if ((k.typ !== 'gras' && k.typ !== 'wald') || k.var < 0.35) continue;
      if (!imBild(s, x, y)) continue;
      const mx = isoX(x + 0.5, y + 0.5), my = isoY(x + 0.5, y + 0.5) - hoehCache[y * N + x];
      for (let i = 0; i < 3; i++) {
        const ox = ((k.var * 13 + i * 3.7) % 1 - 0.5) * KW * 0.52;
        const oy = ((k.var * 29 + i * 6.1) % 1 - 0.5) * KH * 0.52;
        ctx.moveTo(mx + ox, my + oy + 2);
        ctx.lineTo(mx + ox + 1.5, my + oy - 1);
      }
    }
    ctx.stroke();
  }

  // 3. Steilkanten nach Südosten und Südwesten – ebenfalls gebündelt:
  //    je Bodenart (Fels, Sand, Erde) eine dunkle und eine helle Flanke
  const kanten = [null, null, null, null, null, null];
  for (let y = s.y0; y <= s.y1; y++) {
    for (let x = s.x0; x <= s.x1; x++) {
      const i = y * N + x;
      const hoch = hoehCache[i];
      if (hoch <= 0) continue;
      const hO = hoeheBei(x + 1, y);      // Nachbar nach rechts/unten (Ost)
      const hS = hoeheBei(x, y + 1);      // Nachbar nach links/unten (Süd)
      if (hO >= hoch && hS >= hoch) continue;
      if (!imBild(s, x, y)) continue;
      const k = karte[i];
      const art = k.typ === 'berg' ? 0 : (hoch === H_STRAND ? 2 : 4);
      const nx = (x - y) * (KW / 2) + XV, ny = (x + y) * (KH / 2);
      if (hO < hoch) {                    // rechte Flanke: Ostecke -> Südecke
        const p = kanten[art] || (kanten[art] = new Path2D());
        p.moveTo(nx + KW / 2, ny + KH / 2 - hoch); p.lineTo(nx, ny + KH - hoch);
        p.lineTo(nx, ny + KH - hO); p.lineTo(nx + KW / 2, ny + KH / 2 - hO);
        p.closePath();
      }
      if (hS < hoch) {                    // linke Flanke: Südecke -> Westecke
        const p = kanten[art + 1] || (kanten[art + 1] = new Path2D());
        p.moveTo(nx, ny + KH - hoch); p.lineTo(nx - KW / 2, ny + KH / 2 - hoch);
        p.lineTo(nx - KW / 2, ny + KH / 2 - hS); p.lineTo(nx, ny + KH - hS);
        p.closePath();
      }
    }
  }
  for (let f = 0; f < 6; f++) {
    if (!kanten[f]) continue;
    ctx.fillStyle = KANTEN_FARBEN[f];
    ctx.fill(kanten[f]);
  }

  // 4. Mündungen: das Flusswasser stürzt über die Uferkante ins Meer
  for (let i = 0; i < faelle.length; i += 3) {
    const px = faelle[i], py = faelle[i + 1], hoch = faelle[i + 2];
    ctx.fillStyle = ton(PALETTE.fluss, 18);
    ctx.fillRect(px - KH * 0.17, py - 1, KH * 0.34, hoch + 1);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.ellipse(px, py + hoch, KH * 0.26, KH * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Ein Fluss ist kein Kachelmuster, sondern ein durchgehendes Band:
// jede Flusskachel wird mit ihren Nachbarn verbunden, Biegungen werden
// rund ausgefahren. An der Quelle kommt das Band aus dem Berg heraus,
// an der Mündung läuft es bis an die Uferkante.
// Je Richtung: Nachbar (dx, dy) und Mitte der gemeinsamen Kante (ex, ey).
const FLUSS_RICHTUNGEN = [[1, 0, 1, 0.5], [-1, 0, 0, 0.5], [0, 1, 0.5, 1], [0, -1, 0.5, 0]];
function flussZeichnen(s, fein) {
  const faelle = [];
  let etwas = false;
  ctx.beginPath();
  for (let y = s.y0; y <= s.y1; y++) for (let x = s.x0; x <= s.x1; x++) {
    if (karte[y * N + x].typ !== 'fluss' || !imBild(s, x, y)) continue;
    etwas = true;
    const hoch = hoehCache[y * N + x];
    const mx = isoX(x + 0.5, y + 0.5), my = isoY(x + 0.5, y + 0.5) - hoch;
    const an = [];            // Anschlusspunkte, paarweise x, y
    let berg = null;
    for (const [dx, dy, ex, ey] of FLUSS_RICHTUNGEN) {
      const n = kachel(x + dx, y + dy);
      if (!n) continue;
      // Der Übergang zur Nachbarkachel liegt nicht stur in der Kanten-
      // mitte, sondern ein Stück daneben. Beide Kacheln rechnen aus
      // der Kante denselben Versatz – so schlängelt sich der Lauf.
      const kx = x + (dx > 0 ? 1 : 0), ky = y + (dy > 0 ? 1 : 0);
      const versatz = (zufallAus(kx * 1.7 + (dx ? 0.31 : 0.77), ky * 2.3) - 0.5) * 0.5;
      const gx = x + ex + (dy ? versatz : 0), gy = y + ey + (dx ? versatz : 0);
      const px = isoX(gx, gy), py = isoY(gx, gy) - hoch;
      if (n.typ === 'fluss' || n.typ === 'wasser') {
        an.push(px, py);
        // Mündung an einer sichtbaren (vorderen) Uferkante: Wasserfall
        if (n.typ === 'wasser' && (dx > 0 || dy > 0)) faelle.push(px, py, hoch);
      } else if (n.typ === 'berg' && !berg) berg = [px, py];
    }
    // Quelle: nur ein Anschluss, daneben ein Berg – das Wasser kommt
    // sichtbar aus dem Bergfuß
    if (an.length === 2 && berg) an.push(berg[0], berg[1]);

    if (an.length === 4) {                // zwei Anschlüsse: runde Biegung
      // auch der Scheitel der Biegung sitzt leicht neben der Kachelmitte
      const sx = mx + (zufallAus(x * 2.1, y * 3.3) - 0.5) * KW * 0.2;
      const sy = my + (zufallAus(x * 3.7, y * 1.9) - 0.5) * KH * 0.2;
      ctx.moveTo(an[0], an[1]);
      ctx.quadraticCurveTo(sx, sy, an[2], an[3]);
    } else if (an.length) {               // Ende oder Zusammenfluss
      for (let i = 0; i < an.length; i += 2) { ctx.moveTo(mx, my); ctx.lineTo(an[i], an[i + 1]); }
    } else {                              // einzelner Tümpel
      ctx.moveTo(mx - 1, my); ctx.lineTo(mx + 1, my);
    }
  }
  if (!etwas) return faelle;

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(70,92,74,0.5)';         // feuchte Uferböschung
  ctx.lineWidth = KH * 0.56;
  ctx.stroke();
  ctx.strokeStyle = ton(PALETTE.fluss, 0);        // das Wasser
  ctx.lineWidth = KH * 0.4;
  ctx.stroke();
  if (fein) {                                     // wandernde Lichtstreifen
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([7, 13]);
    ctx.lineDashOffset = -((performance.now() / 55) % 20);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  return faelle;
}

// Höhe der Geländeoberfläche an einer beliebigen Stelle (gebrochene
// Kachelkoordinaten). Auf ebenem Land ist das die Plateauhöhe, im
// Gebirge wird zwischen Kachelmitte und den zwei nächsten Ecken
// gemittelt – genau so, wie die Hänge gezeichnet werden.
function oberflaeche(fx, fy) {
  const x = Math.floor(fx), y = Math.floor(fy);
  if (x < 0 || y < 0 || x >= N || y >= N) return -999;   // außerhalb der Karte: nie ein Treffer
  const i = y * N + x;
  return istBerg[i] ? bergHoeheBei(fx, fy) : hoehCache[i];
}

/* ---------- Gebirge zeichnen ----------------------------------- */
// Die Hangdreiecke einer Bergkachel liegen fertig berechnet vor (siehe
// gebirgeBauen). Weil die Kacheln von hinten nach vorn an die Reihe
// kommen, verdeckt der vordere Hang den hinteren ganz von selbst.
// Aufeinanderfolgende Dreiecke gleicher Farbe wandern in EINEN Pfad.
function bergKachel(x, y, fein) {
  const netz = bergNetz[y * N + x];
  if (!netz) return;
  const p = netz.p, f = netz.f;
  let offen = null;
  for (let n = 0; n < f.length; n++) {
    if (f[n] !== offen) {
      if (offen !== null) ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = offen = f[n];
    }
    const q = n * 6;
    ctx.moveTo(p[q], p[q + 1]);
    ctx.lineTo(p[q + 2], p[q + 3]);
    ctx.lineTo(p[q + 4], p[q + 5]);
    ctx.closePath();
  }
  if (offen !== null) ctx.fill();

  if (fein && kamera.zoom > 0.7 && netz.erz.length) {
    // Erzadern als Einsprengsel: Gold funkelt deutlich, Eisen schimmert nur
    const gold = karte[y * N + x].golderz > 0;
    ctx.fillStyle = gold ? '#f2c744' : '#7f93a8';
    ctx.beginPath();
    for (let n = 0; n < netz.erz.length; n += 2) {
      ctx.moveTo(netz.erz[n] + 2.3, netz.erz[n + 1]);
      ctx.arc(netz.erz[n], netz.erz[n + 1], gold ? 2.3 : 1.6, 0, Math.PI * 2);
    }
    ctx.fill();
  }
}

/* ---------- Bäume ---------------------------------------------- */
// Ein Wald besteht aus hunderten Bäumen. Jeden einzeln zu füllen wäre
// zu langsam – darum werden die Bäume einer Kachelreihe gesammelt
// (alle Schatten in einen Pfad, alle Stämme, alle Kronen …) und dann
// mit wenigen Füllungen auf einmal gemalt. Steht ein Gebäude in der
// Reihe, wird vorher gemalt, damit die Verdeckung stimmt.
const BAUM_FARBEN = {
  schatten: 'rgba(40,50,28,0.22)', stamm: '#6b4a2c',
  dunkel: ton(PALETTE.waldDunkel, 0),
  hell: [ton([104, 148, 70], -8), ton([112, 158, 76], 8)],
  glanz: ton([136, 178, 94], 0),
};
const baumStapel = { da: false, schatten: null, stamm: null, dunkel: null, hell: [null, null], glanz: null };

// So viele Bäume stehen sichtbar auf einer Kachel
function baumZahl(k) { return k.baum > 0.02 ? Math.max(1, Math.round(k.baum * 3)) : 0; }

function baeumeSammeln(x, y, k, fein, nah) {
  const st = baumStapel;
  if (!st.da) {
    st.da = true;
    st.schatten = new Path2D(); st.stamm = new Path2D(); st.dunkel = new Path2D();
