<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Inselgründer – Aufbauspiel</title>

<!-- Als App auf dem Handy installierbar (PWA):
     "Zum Home-Bildschirm hinzufügen" legt ein Symbol an, das Spiel
     startet dann im Vollbild und läuft auch ohne Internet. -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1a4764">
<meta name="description" content="Ein entspanntes Insel-Aufbauspiel: Inseln besiedeln, Produktionsketten aufbauen und sich gegen drei Konkurrenten durchsetzen.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inselgründer">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
  /* ============================================================
     Inselgründer – ein entspanntes Insel-Aufbauspiel
     Gestaltung: hell & ruhig, eine grüne Akzentfarbe, sanfte
     Schatten – passend zu den Konventionen des Projekts.
     ============================================================ */
  :root {
    --accent: #16a34a;
    --accent-dunkel: #15803d;
    --rot: #dc2626;
    --text: #1f2937;
    --text-leise: #6b7280;
    --flaeche: rgba(255, 255, 255, 0.92);
    --schatten: 0 4px 18px rgba(0, 0, 0, 0.16);
    --radius: 12px;
    /* Freiraum für Notch und Home-Leiste, wenn das Spiel als App
       im Vollbild läuft. Im Browser sind die Werte 0. */
    --rand-oben: env(safe-area-inset-top, 0px);
    --rand-unten: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: #1a4764; /* Tiefes Meer hinter der Karte */
    -webkit-user-select: none; user-select: none;
  }

  /* Die Spielfläche füllt das ganze Fenster */
  #karte {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    touch-action: none; /* Wir übernehmen Wischen/Zoomen selbst */
    cursor: grab;
  }
  #karte.bauen  { cursor: crosshair; }
  #karte.ziehen { cursor: grabbing; }

  /* ---------- Ressourcenleiste oben ---------- */
  #leiste-oben {
    position: absolute; top: calc(10px + var(--rand-oben)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px;
    background: var(--flaeche); border-radius: var(--radius);
    box-shadow: var(--schatten);
    padding: 6px 10px;
    max-width: calc(100vw - 16px);
    overflow-x: auto; scrollbar-width: none;
    white-space: nowrap; z-index: 10;
    font-size: 14px;
  }
  #leiste-oben::-webkit-scrollbar { display: none; }
  .res {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 8px;
  }
  .res b { font-variant-numeric: tabular-nums; }
  .res small { color: var(--text-leise); font-size: 11px; }
  .res.warnung b { color: var(--rot); }
  .trenner { width: 1px; height: 20px; background: #e5e7eb; margin: 0 2px; flex: none; }

  /* Ziel-Fortschritt (500 Siedler) */
  #ziel {
    display: inline-flex; flex-direction: column; gap: 2px; padding: 2px 8px;
  }
  #ziel-balken {
    width: 90px; height: 5px; border-radius: 3px; background: #e5e7eb; overflow: hidden;
  }
  #ziel-balken > div { height: 100%; width: 0%; background: var(--accent); transition: width .4s; }

  /* Tempo-/Pause-/Musik-Knöpfe */
  .knopf {
    border: none; background: #f3f4f6; color: var(--text);
    border-radius: 8px; padding: 5px 9px; font-size: 13px; font-weight: 600;
    cursor: pointer; flex: none;
  }
  .knopf:hover { background: #e5e7eb; }
  .knopf.aktiv { background: var(--accent); color: #fff; }

  /* ---------- Baumenü unten ---------- */
  #baumenue {
    position: absolute; bottom: calc(10px + var(--rand-unten)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: stretch;
    background: var(--flaeche); border-radius: var(--radius);
    box-shadow: var(--schatten); padding: 8px;
    max-width: calc(100vw - 16px);
    overflow-x: auto; scrollbar-width: none;
    z-index: 10;
  }
  #baumenue::-webkit-scrollbar { display: none; }
  .bau-knopf {
    border: 2px solid transparent; background: #f9fafb; border-radius: 10px;
    padding: 6px 8px 5px; cursor: pointer; text-align: center;
    min-width: 66px; flex: none;
    display: flex; flex-direction: column; gap: 1px; align-items: center;
    font-family: inherit;
  }
  .bau-gruppe {
    display: flex; flex-direction: column; gap: 2px; flex: none;
    padding-left: 8px; margin-left: 2px; border-left: 1px solid #e5e7eb;
  }
  .gruppe-titel {
    font-size: 9.5px; font-weight: 700; color: var(--text-leise);
    text-transform: uppercase; letter-spacing: 0.5px; padding-left: 2px;
  }
  .gruppe-knoepfe { display: flex; gap: 6px; }
  .bau-knopf:hover { background: #f3f4f6; }
  .bau-knopf.aktiv { border-color: var(--accent); background: #f0fdf4; }
  .bau-knopf:disabled { opacity: 0.42; cursor: not-allowed; }
  .bau-knopf.gesperrt { opacity: 0.42; }
  .bau-knopf .symbol { font-size: 22px; line-height: 1.15; }
  .bau-knopf .name   { font-size: 10.5px; font-weight: 600; }
  .bau-knopf .kosten { font-size: 9.5px; color: var(--text-leise); }

  /* ---------- Info-Panel (Klick auf ein Gebäude) ---------- */
  #info-panel {
    position: absolute; top: calc(64px + var(--rand-oben)); right: 10px; width: 248px;
    background: var(--flaeche); border-radius: var(--radius);
    box-shadow: var(--schatten); padding: 14px;
    z-index: 11; display: none; font-size: 13px;
    max-height: calc(100vh - 180px - var(--rand-oben) - var(--rand-unten)); overflow-y: auto;
  }
  #info-panel h2 { font-size: 15px; margin-bottom: 2px; display: flex; align-items: center; gap: 7px; }
  #info-panel .beschr { color: var(--text-leise); font-size: 12px; margin-bottom: 9px; }
  #info-panel .zeile { display: flex; justify-content: space-between; gap: 12px; padding: 2.5px 0; }
  #info-panel .zeile span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  #info-panel .beduerfnis { display: flex; justify-content: space-between; padding: 2px 0; }
  #info-panel .ok   { color: var(--accent-dunkel); font-weight: 600; }
  #info-panel .fehlt{ color: var(--rot); font-weight: 600; }
  #info-panel hr { border: none; border-top: 1px solid #e5e7eb; margin: 8px 0; }
  #info-panel .abriss-knopf {
    width: 100%; margin-top: 10px; border: none; border-radius: 8px;
    background: #fef2f2; color: var(--rot); font-weight: 600;
    padding: 8px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  #info-panel .abriss-knopf:hover { background: #fee2e2; }
  #panel-zu {
    position: absolute; top: 8px; right: 10px; border: none; background: none;
    font-size: 15px; color: var(--text-leise); cursor: pointer;
  }

  /* Auslastungs-Balken im Panel */
  .auslast-balken { height: 6px; border-radius: 3px; background: #e5e7eb; overflow: hidden; margin-top: 3px; }
  .auslast-balken > div { height: 100%; background: var(--accent); }

  /* ---------- Zoom-Knöpfe ---------- */
  #zoom-knoepfe {
    position: absolute; left: 10px; bottom: calc(118px + var(--rand-unten)); z-index: 9;
    display: flex; flex-direction: column; gap: 8px;
  }
  #zoom-knoepfe button {
    width: 44px; height: 44px; border: none; border-radius: 12px;
    background: var(--flaeche); box-shadow: var(--schatten);
    font-size: 22px; font-weight: 700; color: var(--text);
    cursor: pointer; line-height: 1;
  }
  #zoom-knoepfe button:active { background: #e5e7eb; }

  /* ---------- Bau-/Abriss-Bestätigung ---------- */
  #bestaetigung {
    position: absolute; bottom: calc(96px + var(--rand-unten)); left: 50%; transform: translateX(-50%);
    background: var(--flaeche); border-radius: 12px; box-shadow: var(--schatten);
    padding: 10px 12px; z-index: 15; display: none;
    align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    font-size: 13px; max-width: calc(100vw - 16px); text-align: center;
  }
  #bestaetigung button {
    border: none; border-radius: 8px; padding: 9px 16px;
    font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  #bestaetigung button:disabled { opacity: 0.45; cursor: not-allowed; }
  #bestaetigung .grund { color: var(--rot); font-weight: 600; }

  /* Handel im Kontor-Panel */
  .handel-zeile {
    display: flex; align-items: center; justify-content: space-between;
    gap: 4px; padding: 2px 0; font-size: 12px;
  }
  .handel-zeile > span:last-child { display: flex; gap: 4px; flex: none; }
  .handel-zeile button {
    border: none; border-radius: 5px; padding: 4px 4px; cursor: pointer;
    font-family: inherit; font-size: 9.5px; font-weight: 700; white-space: nowrap;
  }
  .handel-kauf    { background: #eef7f0; color: var(--accent-dunkel); }
  .handel-verkauf { background: #f3f4f6; color: var(--text); }
  .auto-zeile { display: flex; gap: 4px; padding: 0 0 7px 2px; }
  .auto-zeile button {
    border: none; border-radius: 6px; padding: 3px 7px; cursor: pointer;
    font-family: inherit; font-size: 10px; font-weight: 600;
    background: #f3f4f6; color: var(--text-leise);
  }
  .auto-zeile button.auto-an { background: #f0fdf4; color: var(--accent-dunkel); }

  /* Reiter im Kontor-Panel */
  .tab-leiste { display: flex; gap: 4px; margin: 8px 0 4px; }
  .tab-leiste button {
    flex: 1; border: none; border-radius: 8px; padding: 6px;
    font-family: inherit; font-size: 12px; font-weight: 700;
    background: #f3f4f6; color: var(--text-leise); cursor: pointer;
  }
  .tab-leiste button.aktiv { background: var(--accent); color: #fff; }

  /* Diplomatie */
  .diplo-kopf { display: flex; justify-content: space-between; align-items: center;
                margin-top: 9px; font-size: 12.5px; font-weight: 700; }
  .diplo-balken { height: 6px; border-radius: 3px; background: #e5e7eb;
                  overflow: hidden; margin: 3px 0 5px; }
  .diplo-balken > div { height: 100%; }
  .diplo-knoepfe { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .diplo-knoepfe button {
    border: none; border-radius: 6px; padding: 4px 7px; cursor: pointer;
    font-family: inherit; font-size: 10.5px; font-weight: 600;
    background: #f3f4f6; color: var(--text); flex: 1 1 auto;
  }
  .diplo-knoepfe button.gut   { background: #f0fdf4; color: var(--accent-dunkel); }
  .diplo-knoepfe button.boese { background: #fef2f2; color: var(--rot); }
  .diplo-knoepfe button.an    { background: var(--rot); color: #fff; }

  /* ---------- Meldungen (Toast) & Hinweise ---------- */
  #toast {
    position: absolute; bottom: calc(210px + var(--rand-unten)); left: 50%; transform: translateX(-50%);
    background: rgba(31, 41, 55, 0.92); color: #fff;
    border-radius: 10px; padding: 8px 16px; font-size: 13px;
    z-index: 20; pointer-events: none; opacity: 0; transition: opacity .25s;
    max-width: 90vw; text-align: center;
  }
  #hinweis {
    position: absolute; top: calc(62px + var(--rand-oben)); left: 50%; transform: translateX(-50%);
    background: var(--flaeche); border-radius: 10px; box-shadow: var(--schatten);
    padding: 8px 16px; font-size: 13.5px; font-weight: 600; z-index: 9;
    color: var(--accent-dunkel);
    max-width: calc(100vw - 24px); width: max-content; text-align: center;
  }
  #punkte {
    position: absolute; top: calc(62px + var(--rand-oben)); left: 10px; z-index: 8;
    background: var(--flaeche); border-radius: 10px; box-shadow: var(--schatten);
    padding: 7px 10px; font-size: 11.5px; min-width: 132px;
  }
  #punkte b { font-size: 11px; }
  .punkte-zeile { display: flex; justify-content: space-between; gap: 10px; padding: 1.5px 0; }
  .punkte-zeile span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }

  #bankrott-warnung {
    position: absolute; top: calc(62px + var(--rand-oben)); left: 50%; transform: translateX(-50%);
    background: #fef2f2; color: var(--rot); border-radius: 10px;
    box-shadow: var(--schatten); padding: 8px 16px;
    font-size: 13.5px; font-weight: 700; z-index: 12; display: none;
  }
  #duerre-warnung {
    position: absolute; top: calc(104px + var(--rand-oben)); left: 50%;
    transform: translateX(-50%);
    background: #fffbeb; color: #b45309; border-radius: 10px;
    box-shadow: var(--schatten); padding: 7px 14px;
    font-size: 13px; font-weight: 700; z-index: 11; display: none;
    max-width: calc(100vw - 24px); text-align: center;
  }

  /* Pulsierende Warnung, wenn den Einwohnern etwas fehlt */
  #mangel-warnung {
    position: absolute; top: calc(62px + var(--rand-oben)); left: 50%; transform: translateX(-50%);
    background: #fef2f2; color: var(--rot); border-radius: 10px;
    padding: 8px 16px; font-size: 13.5px; font-weight: 700;
    z-index: 11; display: none; text-align: center;
    max-width: calc(100vw - 24px);
    animation: mangel-puls 1.2s ease-in-out infinite;
  }
  @keyframes mangel-puls {
    0%, 100% { box-shadow: 0 4px 18px rgba(220, 38, 38, 0.25); }
    50%      { box-shadow: 0 0 0 7px rgba(220, 38, 38, 0.22); }
  }

  /* ---------- Großes Overlay (Sieg / Niederlage) ---------- */
  #overlay {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
  }
  #overlay .box {
    background: #fff; border-radius: 16px; box-shadow: var(--schatten);
    padding: 34px 40px; text-align: center; max-width: 420px; margin: 16px;
  }
  #mp-fenster {
    position: absolute; inset: 0; z-index: 31;
    background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
  }
  #mp-fenster .box {
    background: #fff; border-radius: 16px; box-shadow: var(--schatten);
    padding: 28px 30px; text-align: center; max-width: 400px; margin: 16px;
  }
  #mp-fenster .box .gross { font-size: 40px; margin-bottom: 6px; }
  #mp-fenster .box h1 { font-size: 20px; margin-bottom: 8px; }
  #mp-fenster .box p { color: var(--text-leise); font-size: 13.5px; margin-bottom: 16px; line-height: 1.5; }
  #mp-fenster .box button {
    border: none; border-radius: 10px; padding: 10px 18px; margin: 0 4px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  #netz-warnung {
    position: absolute; top: calc(104px + var(--rand-oben)); left: 50%;
    transform: translateX(-50%);
    background: #fef2f2; color: var(--rot); border-radius: 10px;
    box-shadow: var(--schatten); padding: 7px 14px;
    font-size: 13px; font-weight: 700; z-index: 12; display: none;
  }

  #overlay .box .gross { font-size: 44px; margin-bottom: 8px; }
  #overlay .box h1 { font-size: 22px; margin-bottom: 8px; }
  #overlay .box p { color: var(--text-leise); font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
  #overlay .box button {
    border: none; border-radius: 10px; padding: 10px 20px; margin: 0 5px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .knopf-gruen { background: var(--accent); color: #fff; }
  .knopf-grau  { background: #f3f4f6; color: var(--text); }
</style>
</head>
<body>

<canvas id="karte"></canvas>

<!-- Ressourcenleiste + Spielsteuerung -->
<div id="leiste-oben">
  <span class="res" title="Gold – Steuern minus Unterhalt">💰 <b id="r-gold">0</b> <small id="r-gold-rate"></small></span>
  <span class="res" title="Holz – Baustoff, wird vom Holzfäller geschlagen">🪵 <b id="r-holz">0</b></span>
  <span class="res" title="Werkzeuge – nötig für viele Gebäude, aus der Schmiede">⚒️ <b id="r-werkzeuge">0</b></span>
  <span class="res" title="Nahrung – von Fischern und Jägern, wird laufend gegessen">🍞 <b id="r-nahrung">0</b></span>
  <span class="res" title="Ziegel – aus der Ziegelei, Baumaterial für höhere Stufen">🧱 <b id="r-ziegel">0</b></span>
  <span class="res" title="Stoffe – aus der Weberei, Bedürfnis ab Siedlern">🧵 <b id="r-stoffe">0</b></span>
  <span class="res" title="Alkohol – aus der Brennerei, Bedürfnis ab Siedlern (alle weiteren Waren: Kontor anklicken)">🥃 <b id="r-alkohol">0</b></span>
  <span class="trenner"></span>
  <span class="res" title="Gunst – verdient durch dauerhaft zufriedene Bürger, nötig für Denkmäler">🏅 <b id="r-gunst">0</b></span>
  <span class="res" title="Einwohner (Pioniere + Siedler)">👥 <b id="r-einwohner">0</b></span>
  <span id="ziel" title="Ziel: 500 Siedler erreichen">
    <small style="color:var(--text-leise);font-size:10.5px">🎯 <b id="r-siedler">0</b>/500 Siedler</small>
    <span id="ziel-balken"><div></div></span>
  </span>
  <span class="trenner"></span>
  <button class="knopf" id="k-pause" title="Pause (Leertaste)">⏸</button>
  <button class="knopf aktiv" id="k-tempo1" title="Normale Geschwindigkeit (Taste 1)">1×</button>
  <button class="knopf" id="k-tempo2" title="Doppelte Geschwindigkeit (Taste 2)">2×</button>
  <button class="knopf" id="k-tempo3" title="Dreifache Geschwindigkeit (Taste 3)">3×</button>
  <button class="knopf" id="k-musik" title="Musik ein/aus">🎵</button>
  <button class="knopf" id="k-mitte" title="Zum Kontor bzw. Schiff springen">🧭</button>
  <button class="knopf" id="k-speichern" title="Spielstand speichern">💾</button>
  <button class="knopf" id="k-laden" title="Gespeicherten Spielstand laden">📂</button>
  <button class="knopf" id="k-netz" title="Zu zweit spielen">🌐</button>
</div>

<!-- Punktestand des Wettrennens -->
<div id="punkte"></div>

<!-- Hinweis zu Spielbeginn -->
<div id="hinweis">⛵ Tippe aufs Wasser, um zu segeln. Such dir eine Insel aus und baue dort dein Kontor an der Küste!</div>
<div id="bankrott-warnung"></div>
<div id="mangel-warnung"></div>
<div id="duerre-warnung"></div>

<!-- Baumenü (wird per JavaScript gefüllt) -->
<div id="baumenue"></div>

<!-- Zoom-Knöpfe (praktisch auf dem Handy) -->
<div id="zoom-knoepfe">
  <button id="k-plus" title="Hineinzoomen">＋</button>
  <button id="k-minus" title="Herauszoomen">−</button>
</div>

<!-- Bestätigung vor dem Bauen/Abreißen (gegen Vertipper) -->
<div id="bestaetigung">
  <span id="bestaetigung-text"></span>
  <button id="b-ok" class="knopf-gruen">✓ Bauen</button>
  <button id="b-nein" class="knopf-grau">✕ Abbrechen</button>
</div>

<!-- Info-Panel für angeklickte Gebäude -->
<div id="info-panel">
  <button id="panel-zu">✕</button>
  <div id="panel-inhalt"></div>
</div>

<div id="toast"></div>

<!-- Sieg / Niederlage -->
<div id="overlay"><div class="box" id="overlay-box"></div></div>

<!-- Mehrspieler-Fenster -->
<div id="mp-fenster"><div class="box" id="mp-box"></div></div>
<div id="netz-warnung"></div>

<script>
'use strict';
/* ==============================================================
   INSELGRÜNDER
   Ein browserbasiertes Aufbau-Strategiespiel im Stil klassischer
   Insel-Aufbauspiele der 90er. Eine einzelne Datei, HTML5 Canvas,
   reines JavaScript – lauffähig ohne Server.

   Gliederung dieses Skripts:
     1. Konstanten & Gebäude-Definitionen
     2. Spielzustand
     3. Weltgenerierung (prozedurale Insel)
     4. Hilfsfunktionen (Umkreis, Küste, Marktanbindung …)
     5. Bauen & Abreißen
     6. Simulation (Produktion, Bevölkerung, Steuern)
     7. Zeichnen (Terrain-Cache + Gebäude + Overlays)
     8. Kamera & Eingabe (Maus, Touch, Tastatur)
     9. Benutzeroberfläche (Leisten, Panel, Meldungen)
    10. Musik (Web Audio API)
    11. Hauptschleife
   ============================================================== */

/* ---------- 1. KONSTANTEN ------------------------------------ */

const N = 140;  // Kacheln je Seite (140×140-Weltkarte mit vielen Inseln)
const T = 40;   // Weltpixel je Kachel (interne Zeichengröße)
const TP = 26;  // Pixel je Kachel im Terrain-Puffer (kleiner als T, damit
                // der Puffer auch auf iPhones unter dem Canvas-Limit bleibt)

// Wirtschafts-Stellschrauben – alle Werte "pro Sekunde" bei 1×-Tempo.
const SIM = {
  nahrungJeEinwohner: 0.004,   // Nahrung, die jede:r Einwohner:in isst
  // (Steuern und weiterer Verbrauch stehen je Bevölkerungsstufe in STUFEN)
  wachstumsDauer:     11,      // Sekunden bis +1 Einwohner (bei Zufriedenheit)
  aufstiegsDauer:     15,      // Sekunden erfüllte Bedürfnisse bis zum Aufstieg

// Dynamischer Markt: jeder Kauf treibt den Preis einer Ware nach oben,
// jeder Verkauf drückt ihn – und zwar für ALLE Spieler. Wer dieselben
// Waren braucht wie die Konkurrenz, zahlt also drauf. Mit der Zeit
// pendeln die Preise langsam zum Normalwert zurück.
const markt = {};   // Preisfaktor je Ware (1 = Normalpreis)

function kaufpreis(ware)     { return Math.max(1, Math.round(PREISE[ware].kauf * markt[ware])); }
function verkaufspreis(ware) { return Math.max(1, Math.round(PREISE[ware].verkauf * markt[ware])); }

// Führt einen Handel für einen beliebigen Spieler aus (auch die KI).
// menge > 0 = kaufen, menge < 0 = verkaufen. Liefert false bei Geldmangel.
let handelFehler = '';   // Grund des letzten gescheiterten Handels
function handelAusfuehren(sp, ware, menge) {
  const R = sp.res;
  handelFehler = '';
  // Jeder Handel verbraucht Kontingent – der Markt ist endlich
  if (sp.kontingent < Math.abs(menge) - 0.001) {
    handelFehler = 'Handelskontingent erschöpft – es erholt sich laufend';
    return false;
  }
  if (menge > 0) {
    const kosten = kaufpreis(ware) * menge;
    if (R.gold < kosten) { handelFehler = 'Zu wenig Gold zum Kaufen'; return false; }
    R.gold -= kosten;
    R[ware] += menge;
    sp.kontingent -= menge;
    markt[ware] = Math.min(6, markt[ware] * (1 + 0.009 * menge));    // Nachfrage → teurer
  } else {
    const anzahl = Math.min(-menge, Math.floor(R[ware]));
    if (anzahl <= 0) { handelFehler = 'Nichts zum Verkaufen da'; return false; }
    R[ware] -= anzahl;
    R.gold += verkaufspreis(ware) * anzahl;
    sp.kontingent -= anzahl;
    markt[ware] = Math.max(0.4, markt[ware] * (1 - 0.005 * anzahl)); // Überangebot → billiger
  }
  return true;
}

const AUTOVERKAUF_STUFEN = [null, 50, 100, 200, 400];

function autoKaufWechseln(ware) {
  const i = AUTOKAUF_STUFEN.indexOf(autoHandel[ware].kauf);

  panelZeigen();

function autoVerkaufWechseln(ware) {

}

// Feindschaft zwischen je zwei Spielern (symmetrische Matrix)
let feindschaft = [];
function feindStufe(a, b) {
  const w = feindschaft[a][b];
  let st = DIPLO_STUFEN[0];
  for (const s of DIPLO_STUFEN) if (w >= s.ab) st = s;
  return st;
}
function imKriegMit(a, b) { return feindschaft[a][b] >= KRIEG_AB; }
function feindAendern(a, b, delta) {
  if (a === b) return;
  const neu = Math.max(0, Math.min(100, feindschaft[a][b] + delta));
  feindschaft[a][b] = feindschaft[b][a] = neu;
}

// --- Ausbaustufen ---------------------------------------------
// Jedes Gebäude lässt sich zweimal ausbauen: mehr Ertrag bzw.
// größerer Wirkradius, dafür höhere Kosten und mehr Unterhalt.
const AUSBAU_MAX = 6;
// Produktion: Stufe 1 → ×1, Stufe 6 → ×5
function ausbauFaktor(geb) { return 1 + 0.8 * ((geb.ausbau || 1) - 1); }

// Wohnhäuser: Jede Ausbaustufe schafft 30 % mehr Wohnraum …
function hausMaxEw(geb) {
  return Math.round(STUFEN[geb.stufe].maxEw * (1 + 0.3 * ((geb.ausbau || 1) - 1)));
}
// … und bringt 25 % mehr Miete je Einwohner (Stufe 6 = 2,25-fach)
function mietFaktor(geb) { return 1 + 0.25 * ((geb.ausbau || 1) - 1); }

// Was bringt eine bestimmte Ausbaustufe bei diesem Gebäude?
function ausbauWirkung(geb, stufe) {
  const def = GEBAEUDE[geb.typ];
  if (geb.typ === 'wohnhaus') {
    const ew = Math.round(STUFEN[geb.stufe].maxEw * (1 + 0.3 * (stufe - 1)));
    const miete = (1 + 0.25 * (stufe - 1)).toFixed(2).replace('.', ',');
    return `${ew} Einwohner · Miete ×${miete}`;
  }
  if (geb.typ === 'kaserne') return `${KASERNE_KAPAZITAET * stufe} Soldaten`;
  if (def.dauer) return `Ertrag ×${(1 + 0.8 * (stufe - 1)).toFixed(1).replace('.', ',')}`;
  const basis = def.marktRadius || def.radius;
  if (basis) return `Radius ${basis + (stufe - 1) * 2} Felder`;
  return 'stabiler im Krieg';
}
function wirkRadius(geb) {
  const def = GEBAEUDE[geb.typ];
  const basis = def.marktRadius || def.radius || 0;
  return basis + ((geb.ausbau || 1) - 1) * 2;
}
function ausbauKosten(geb) {
  const stufe = geb.ausbau || 1;
  // Das Kontor wird gratis gegründet – für seinen Ausbau gilt die
  // Gebühr eines Zweitkontors als Grundlage.
  let basis = GEBAEUDE[geb.typ].kosten;
  if (!Object.keys(basis).length) basis = KONTOR_AUSBAU;
  const kosten = {};
  for (const [ware, menge] of Object.entries(basis))
    kosten[ware] = Math.round(menge * stufe * 1.6);
  return kosten;
}
function ausbauen(geb) {
  if (!geb) return false;
  if (istGast() && geb.spieler === ICH) return befehlSenden({ art: 'ausbau', id: geb.id });
  const R = spieler[geb.spieler].res;
  const ich = geb.spieler === ICH;   // nur für dich gibt es Meldungen
  if ((geb.ausbau || 1) >= AUSBAU_MAX) {
    if (ich) melden('Höchste Ausbaustufe erreicht');
    return false;
  }
  const kosten = ausbauKosten(geb);
  for (const [ware, menge] of Object.entries(kosten))
    if (R[ware] < menge) {
      if (ich) melden(`Ausbau: es fehlt ${WAREN_EMOJI[ware]} ${Math.ceil(menge - R[ware])}`);
      return false;
    }
  for (const [ware, menge] of Object.entries(kosten)) R[ware] -= menge;
  geb.ausbau = (geb.ausbau || 1) + 1;
  if (geb.typ === 'wohnhaus') geb.maxEw = hausMaxEw(geb);
  geb.maxHp = Math.round(geb.maxHp * 1.35);
  geb.hp = geb.maxHp;
  if (ich) {
    melden(`⬆️ ${GEBAEUDE[geb.typ].name} auf Stufe ${geb.ausbau} ausgebaut`);
    panelZeigen();
  }
  return true;
}

// Einfacher, wiederholbarer Zufallszahlengenerator
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Wertrauschen: grobes Zufallsgitter, weich interpoliert → sanfte Formen
function wertRauschen(rnd, gitter) {
  const g = [];
  for (let i = 0; i < (gitter + 1) * (gitter + 1); i++) g.push(rnd());
  const glatt = t => t * t * (3 - 2 * t);
  return function (u, v) {   // u, v in 0..1
    const fx = u * gitter, fy = v * gitter;
    const x0 = Math.min(Math.floor(fx), gitter - 1);
    const y0 = Math.min(Math.floor(fy), gitter - 1);
    const tx = glatt(fx - x0), ty = glatt(fy - y0);
    const w = (x, y) => g[y * (gitter + 1) + x];
    const oben  = w(x0, y0)     * (1 - tx) + w(x0 + 1, y0)     * tx;
    const unten = w(x0, y0 + 1) * (1 - tx) + w(x0 + 1, y0 + 1) * tx;
    return oben * (1 - ty) + unten * ty;
  };
}

// Erzeugt die Weltkarte: ein offenes Meer mit mehreren Inseln.
// Es wird so lange gewürfelt, bis eine Welt mit einer ordentlichen
// Hauptinsel (genug Platz, Wald und Gestein) herauskommt.
let weltSaat = 0;   // Startwert der aktuellen Welt (für den Mehrspieler-Modus)

function weltErzeugen(vorgabe) {
  for (let versuch = 0; versuch < 80; versuch++) {
    const saat = vorgabe !== undefined ? vorgabe : (Math.random() * 1e9) | 0;
    const rnd = mulberry32(saat);
    const grob = wertRauschen(rnd, 8);    // große Landformen
    const fein = wertRauschen(rnd, 18);   // Details der Küstenlinien
    const waldR = wertRauschen(rnd, 12);  // wo Wald wächst

    // 8–10 Inseln auswürfeln: Mittelpunkt + Radius, mit Wasser dazwischen
    const inseln = [];
    const anzahl = 8 + Math.floor(rnd() * 3);
    for (let i = 0; i < anzahl; i++) {
      for (let probe = 0; probe < 40; probe++) {
        // Die erste Insel ist immer groß – ein guter Startplatz
        const r = i === 0 ? 21 + rnd() * 5 : 8 + rnd() * 9;
        const cx = r + 3 + rnd() * (N - 2 * r - 6);
        const cy = r + 3 + rnd() * (N - 2 * r - 6);
        // Genug Abstand zu den anderen Inseln (freie Seewege)
        let passt = true;
        for (const ins of inseln) {
          if (Math.hypot(ins.cx - cx, ins.cy - cy) < ins.r + r + 6) { passt = false; break; }
        }
        if (passt) { inseln.push({ cx, cy, r }); break; }
      }
    }

    karte = []; belegt = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        // Landfaktor: 1 am Inselmittelpunkt, 0 am Inselrand und auf See
        let f = 0;
        for (const ins of inseln) {
          f = Math.max(f, 1 - Math.hypot(x - ins.cx, y - ins.cy) / ins.r);
        }
        const u = x / (N - 1), v = y / (N - 1);
        const rausch = 0.62 * grob(u, v) + 0.38 * fein(u, v);
        const hoehe = f * (0.30 + 0.70 * rausch);

        let typ;
        if      (hoehe < 0.16) typ = 'wasser';
        else if (hoehe < 0.22) typ = 'strand';
        else if (hoehe < 0.62) typ = 'gras';
        else                   typ = 'berg';

        const k = { typ, baum: 0, stein: 0, golderz: 0, eisen: 0, var: rnd() };
        if (typ === 'berg') k.stein = 200 + Math.round(rnd() * 300);
        karte.push(k);
        belegt.push(null);
      }
    }

    // Strand-Saum: Land direkt am Wasser wird zu Strand
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const k = kachel(x, y);
      if (k.typ === 'gras') {
        for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const n = kachel(x + ax, y + ay);
          if (n && n.typ === 'wasser') { k.typ = 'strand'; break; }
        }
      }
    }

    // Wald auf Grasflächen verteilen (dichte Kerne, lockere Ränder)
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const k = kachel(x, y);
      if (k.typ === 'gras') {
        const w = waldR(x / (N - 1), y / (N - 1));
        if (w > 0.56) { k.typ = 'wald'; k.baum = Math.min(1, 0.4 + (w - 0.56) * 3); }
      }
    }

    // --- Flüsse: schlängeln sich vom Inselinneren hinab zum Meer ---
    // Zuerst für jede Kachel die Entfernung zum Meer bestimmen
    const seeDist = new Int16Array(N * N).fill(32767);
    {
      const schlange = [];
      for (let i = 0; i < N * N; i++)
        if (karte[i].typ === 'wasser') { seeDist[i] = 0; schlange.push(i); }
      for (let kopf = 0; kopf < schlange.length; kopf++) {
        const j = schlange[kopf], x = j % N, y = (j / N) | 0;
        for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx = x + ax, ny = y + ay;
          if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          const ni = ny * N + nx;
          if (seeDist[ni] > seeDist[j] + 1) { seeDist[ni] = seeDist[j] + 1; schlange.push(ni); }
        }
      }
    }
    // 3–5 Quellen tief im Landesinneren; jeder Lauf fließt bergab zum Meer
    const flussZahl = 3 + Math.floor(rnd() * 3);
    for (let f = 0; f < flussZahl; f++) {
      let quelle = -1;
      for (let probe = 0; probe < 400; probe++) {
        const i = (rnd() * N * N) | 0;
        if (karte[i].typ !== 'wasser' && karte[i].typ !== 'berg' && seeDist[i] >= 6) { quelle = i; break; }
      }
      if (quelle < 0) continue;
      let j = quelle;
      for (let schritt = 0; schritt < 150; schritt++) {
        const k = karte[j];
        if (k.typ === 'wasser') break;   // Mündung erreicht
        if (k.typ !== 'berg') { k.typ = 'fluss'; k.baum = 0; }
        const x = j % N, y = (j / N) | 0;
        let best = -1, bestD = seeDist[j];
        for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx = x + ax, ny = y + ay;
          if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          const ni = ny * N + nx;
          if (karte[ni].typ === 'fluss') continue;   // nicht zurückfließen
          if (seeDist[ni] < bestD || (seeDist[ni] === bestD && rnd() < 0.4)) {
            bestD = seeDist[ni]; best = ni;
          }
        }
        if (best < 0) break;
        j = best;
      }
    }

    // Qualitätsprüfung: zusammenhängende Landflächen vermessen (Breitensuche).
    // Die größte Insel muss Platz, Wald und Gestein für eine Stadt bieten.
    const marke = new Int16Array(N * N).fill(-1);
    const flaechen = [];
    for (let start = 0; start < N * N; start++) {
      if (karte[start].typ === 'wasser' || marke[start] !== -1) continue;
      const stapel = [start];
      marke[start] = flaechen.length;
      let groesse = 0, berg = 0, wald = 0;
      while (stapel.length) {
        const j = stapel.pop();
        groesse++;
        if (karte[j].typ === 'berg') berg++;
        if (karte[j].baum > 0) wald++;
        const x = j % N, y = (j / N) | 0;
        for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx = x + ax, ny = y + ay;
          if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          const ni = ny * N + nx;
          if (karte[ni].typ !== 'wasser' && marke[ni] === -1) {
            marke[ni] = flaechen.length;
            stapel.push(ni);
          }
        }
      }
      flaechen.push({ groesse, berg, wald });
    }
    const land = flaechen.reduce((s, f) => s + f.groesse, 0);
    let hauptIdx = 0;
    for (let i = 1; i < flaechen.length; i++)
      if (flaechen[i].groesse > flaechen[hauptIdx].groesse) hauptIdx = i;
    const haupt = flaechen[hauptIdx];
    // Kandidaten für die Goldinsel: NICHT die Hauptinsel, aber mit Bergen
    const goldKandidaten = [];
    flaechen.forEach((f, i) => { if (i !== hauptIdx && f.berg >= 3) goldKandidaten.push(i); });
    const taugt = !(flaechen.length < 5 || haupt.groesse < 600 || haupt.berg < 4 ||
        haupt.wald < 50 || land / (N * N) > 0.42 || goldKandidaten.length < 1);
    // Bei vorgegebenem Startwert (Mehrspieler) wird die Welt so
    // übernommen, wie sie ist – der Gastgeber hat sie schon geprüft.
    if (!taugt && vorgabe === undefined) continue;

    // Genau EINE Insel trägt Golderz – wer Schmuck will, muss dorthin!
    const goldInsel = goldKandidaten[(rnd() * goldKandidaten.length) | 0];
    for (let i = 0; i < N * N; i++)
      if (marke[i] === goldInsel && karte[i].typ === 'berg')
        karte[i].golderz = 120 + Math.round(rnd() * 180);

    // Eisen liegt breiter gestreut: gut zwei Drittel aller übrigen Berge
    // führen Erz – aber eben nur Berge, und die hat nicht jede Insel.
    for (let i = 0; i < N * N; i++)
      if (karte[i].typ === 'berg' && !karte[i].golderz && rnd() < 0.68)
        karte[i].eisen = 200 + Math.round(rnd() * 300);

    // Insel-Kennzeichnung für die KI-Besiedlung aufheben
    inselMarke = marke;
    inselGroessen = flaechen.map(f => f.groesse);
    boedenWuerfeln(rnd);
    weltSaat = saat;
    return; // Welt angenommen
  }
  // Notnagel (praktisch nie nötig): letzte gewürfelte Welt behalten
}

/* ---------- 3b. DAS SCHIFF ------------------------------------ */
// Zu Spielbeginn treibt dein Segelschiff auf dem Meer. Tippe aufs
// Wasser, um es zu einer Insel deiner Wahl zu steuern – erst wenn es
// nahe der Küste ankert, kann dort das Kontor gebaut werden.

let schiff = { x: 0, y: 0, pfad: [] };    // Schiff des lokalen Spielers

// Startplatz: eine Wasserkachel mit etwas Abstand zum Land
function schiffStart() {
  for (let probe = 0; probe < 5000; probe++) {
    const x = 2 + ((Math.random() * (N - 4)) | 0);
    const y = 2 + ((Math.random() * (N - 4)) | 0);
    let frei = true;
    for (let dy = -2; dy <= 2 && frei; dy++) for (let dx = -2; dx <= 2; dx++) {
      const k = kachel(x + dx, y + dy);
      if (!k || k.typ !== 'wasser') { frei = false; break; }
    }
    if (frei) { schiff.x = x + 0.5; schiff.y = y + 0.5; return; }
  }
  schiff.x = 2.5; schiff.y = 2.5; // Notnagel: Kartenecke ist praktisch immer Wasser
}

// Seeweg vom Schiff zu einer Zielkachel suchen (Breitensuche über Wasser).
// Liefert die Wegpunkte oder null, wenn kein Wasserweg existiert.
function segelWeg(zx, zy) {
  const ziel = kachel(zx, zy);
  if (!ziel || ziel.typ !== 'wasser') return null;
  const sx = Math.floor(schiff.x), sy = Math.floor(schiff.y);
  const si = sy * N + sx, zi = zy * N + zx;
  if (si === zi) return [];
  const vorher = new Int32Array(N * N).fill(-1);
  vorher[si] = si;
  const schlange = [si];
  for (let kopf = 0; kopf < schlange.length; kopf++) {
    const j = schlange[kopf];
    if (j === zi) break;
    const x = j % N, y = (j / N) | 0;
    for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + ax, ny = y + ay;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const ni = ny * N + nx;
      if (vorher[ni] !== -1 || karte[ni].typ !== 'wasser') continue;
      vorher[ni] = j;
      schlange.push(ni);
    }
  }
  if (vorher[zi] === -1) return null;
  // Weg vom Ziel rückwärts einsammeln und umdrehen
  const weg = [];
  for (let j = zi; j !== si; j = vorher[j]) {
    weg.push({ x: (j % N) + 0.5, y: ((j / N) | 0) + 0.5 });
  }
  weg.reverse();
  return weg;
}

// Das Schiff fährt seinen Weg Punkt für Punkt ab
// Bewegt die Schiffe der Gegner (deines steuert schiffUpdate)
function kiSchiffeUpdate(dt) {
  for (const sp of spieler) {
    const s = sp.schiff;
    if (sp.id === ICH || !s || !s.pfad.length) continue;
    let strecke = SIM.schiffTempo * dt;
    while (strecke > 0 && s.pfad.length) {
      const ziel = s.pfad[0];
      const dx = ziel.x - s.x, dy = ziel.y - s.y;
      const d = Math.hypot(dx, dy);
      if (d <= strecke) { s.x = ziel.x; s.y = ziel.y; s.pfad.shift(); strecke -= d; }
      else { s.x += dx / d * strecke; s.y += dy / d * strecke; strecke = 0; }
    }
  }
}

function schiffUpdate(dt) {
  let strecke = SIM.schiffTempo * dt;
  while (strecke > 0 && schiff.pfad.length) {
    const zielP = schiff.pfad[0];
    const dx = zielP.x - schiff.x, dy = zielP.y - schiff.y;
    const d = Math.hypot(dx, dy);
    if (d <= strecke) {
      schiff.x = zielP.x; schiff.y = zielP.y;
      schiff.pfad.shift();
      strecke -= d;
      if (!schiff.pfad.length && !state.kontorGebaut)
        melden('⚓ Angekommen! Baue jetzt dein Kontor an der Küste.', 'angekommen');
    } else {
      schiff.x += dx / d * strecke;
      schiff.y += dy / d * strecke;
      strecke = 0;
    }
  }
}

function kachel(x, y) {
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  return karte[y * N + x];
}
function belegtAuf(x, y) {
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  return belegt[y * N + x];
}


/* ---------- 3c. SPIELSTAND SPEICHERN UND LADEN ---------------- */
// Der Stand liegt im Browser (localStorage) – ohne Server, ohne Konto.
// Die Karte wird platzsparend als Zahlenfelder abgelegt, damit der
// Stand auch bei 140×140 Kacheln bequem hineinpasst.

const STAND_SCHLUESSEL = 'inselgruender-stand-v1';
const STAND_FASSUNG = 2;   // bei Regeländerungen erhöhen
const KACHEL_TYPEN = ['wasser', 'strand', 'gras', 'wald', 'berg', 'fluss'];

// Inseln neu durchnummerieren (nach dem Laden nötig)
function inselnMarkieren() {
  const marke = new Int16Array(N * N).fill(-1);
  const groessen = [];
  for (let start = 0; start < N * N; start++) {
    if (karte[start].typ === 'wasser' || marke[start] !== -1) continue;
    const stapel = [start];
    marke[start] = groessen.length;
    let groesse = 0;
    while (stapel.length) {
      const j = stapel.pop();
      groesse++;
      const x = j % N, y = (j / N) | 0;
      for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + ax, ny = y + ay;
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        const ni = ny * N + nx;
        if (karte[ni].typ !== 'wasser' && marke[ni] === -1) {
          marke[ni] = groessen.length;
          stapel.push(ni);
        }
      }
    }
    groessen.push(groesse);
  }
  inselMarke = marke;
  inselGroessen = groessen;
}

function standSammeln() {
  // Karte als vier kompakte Zahlenfelder
  const typen = [], baeume = [], steine = [], erze = [], eisen = [], varianten = [];
  for (const k of karte) {
    typen.push(KACHEL_TYPEN.indexOf(k.typ));
    baeume.push(Math.round(k.baum * 100));
    steine.push(k.stein | 0);
    erze.push(k.golderz | 0);
    eisen.push(k.eisen | 0);
    varianten.push(Math.round(k.var * 255));
  }
  return {
    fassung: STAND_FASSUNG,
    zeit: Date.now(),
    spielzeit: state.spielzeit,
    karte: { typen, baeume, steine, erze, eisen, varianten },
    gebaeude: gebaeude.map(g => ({
      typ: g.typ, x: g.x, y: g.y, spieler: g.spieler,
      hp: g.hp, maxHp: g.maxHp, ausbau: g.ausbau,
      eff: g.eff, fortschritt: g.fortschritt,
      stufe: g.stufe, ew: g.ew, maxEw: g.maxEw,
      zufrieden: g.zufrieden, hungerZeit: g.hungerZeit,
      wachsZeit: g.wachsZeit, aufstiegZeit: g.aufstiegZeit,
      felder: g.felder,
    })),
    truppen: truppen.map(t => ({
      spieler: t.spieler, art: t.art, mann: t.mann, schiffe: t.schiffe,
      fracht: t.fracht, kanonen: t.kanonen, moral: t.moral,
      x: t.x, y: t.y, pfad: t.pfad,
    })),
    spieler: spieler.map(sp => ({
      res: sp.res, maxStufe: sp.maxStufe, planIdx: sp.planIdx, extra: sp.extra,
      kontingent: sp.kontingent, kontingentMax: sp.kontingentMax,
      embargo: sp.embargo, aggression: sp.aggression, timer: sp.timer,
      gunst: sp.gunst, zufriedenZeit: sp.zufriedenZeit, zielInsel: sp.zielInsel,
      schiff: sp.schiff ? { x: sp.schiff.x, y: sp.schiff.y, pfad: sp.schiff.pfad } : null,
    })),
    feindschaft, diploEffekte, markt, autoHandel, inselBoden, duerre,
    schiff: { x: schiff.x, y: schiff.y, pfad: schiff.pfad },
    kontorGebaut: state.kontorGebaut,
    gewonnen: state.gewonnen, rennenVorbei: state.rennenVorbei,
  };
}

function spielSpeichern(still) {
  try {
    localStorage.setItem(STAND_SCHLUESSEL, JSON.stringify(standSammeln()));
    if (!still) melden('💾 Spielstand gespeichert');
    return true;
  } catch (e) {
    if (!still) melden('Speichern fehlgeschlagen – Speicher voll?');
    return false;
  }
}

function standVorhanden() {
  try {
    const roh = localStorage.getItem(STAND_SCHLUESSEL);
    if (!roh) return false;
    return JSON.parse(roh).fassung === STAND_FASSUNG;
  } catch (e) { return false; }
}

function spielLaden(still) {
  let d;
  try { d = JSON.parse(localStorage.getItem(STAND_SCHLUESSEL)); } catch (e) { d = null; }
  if (!d || d.fassung !== STAND_FASSUNG) {
    if (!still) melden('Der gespeicherte Stand stammt aus einer älteren Fassung');
    return false;
  }

  // Karte zurückbauen
  karte = [];
  belegt = new Array(N * N).fill(null);
  for (let i = 0; i < N * N; i++) {
    karte.push({
      typ: KACHEL_TYPEN[d.karte.typen[i]] || 'wasser',
      baum: d.karte.baeume[i] / 100,
      stein: d.karte.steine[i],
      golderz: d.karte.erze[i],
      eisen: d.karte.eisen ? d.karte.eisen[i] : 0,
      var: d.karte.varianten[i] / 255,
    });
  }
  inselnMarkieren();

  // Gebäude
  gebaeude = [];
  naechsteId = 1;
  for (const g of d.gebaeude) {
    const def = GEBAEUDE[g.typ];
    if (!def) continue;
    const neu = Object.assign({}, g, { id: naechsteId++ });
    gebaeude.push(neu);
    for (let y = neu.y; y < neu.y + def.h; y++)
      for (let x = neu.x; x < neu.x + def.w; x++)
        if (x >= 0 && y >= 0 && x < N && y < N) belegt[y * N + x] = neu;
    if (neu.felder) for (const idx of neu.felder) belegt[idx] = neu;
  }

  // Truppen
  truppen = [];
  for (const t of d.truppen)
    truppen.push(Object.assign({ id: naechsteId++, kampf: false }, t));

  // Spieler
  d.spieler.forEach((gesp, i) => {
    if (!spieler[i]) return;
    Object.assign(spieler[i].res, gesp.res);
    Object.assign(spieler[i], {
      maxStufe: gesp.maxStufe, planIdx: gesp.planIdx, extra: gesp.extra,
      kontingent: gesp.kontingent, kontingentMax: gesp.kontingentMax,
      embargo: gesp.embargo, aggression: gesp.aggression, timer: gesp.timer,
      gunst: gesp.gunst || 0, zufriedenZeit: gesp.zufriedenZeit || 0,
      zielInsel: gesp.zielInsel === undefined ? -1 : gesp.zielInsel,
      schiff: gesp.schiff ? { x: gesp.schiff.x, y: gesp.schiff.y, pfad: gesp.schiff.pfad || [] }
                          : { x: schiff.x, y: schiff.y, pfad: [] },
    });
    spieler[i].kontor = gebaeude.find(g => g.typ === 'kontor' && g.spieler === i) || null;
  });

  feindschaft = d.feindschaft;
  diploEffekte = d.diploEffekte || [];
  if (d.inselBoden) inselBoden = d.inselBoden; else boedenWuerfeln();
  if (d.duerre) Object.assign(duerre, d.duerre);
  Object.assign(markt, d.markt);
  Object.assign(autoHandel, d.autoHandel);
  schiff.x = d.schiff.x; schiff.y = d.schiff.y; schiff.pfad = d.schiff.pfad || [];

  state.spielzeit = d.spielzeit || 0;
  state.kontorGebaut = !!d.kontorGebaut;
  state.gewonnen = !!d.gewonnen;
  state.rennenVorbei = !!d.rennenVorbei;
  state.vorbei = false;
  state.auswahl = null; state.truppAuswahl = null; state.vorschau = null;
  state.terrainAlt = true;

  $('overlay').style.display = 'none';
  $('hinweis').style.display = state.kontorGebaut ? 'none' : 'block';
  bestaetigungZeigen();
  menueBauen();
  werkzeugWaehlen(state.kontorGebaut ? 'zeiger' : 'kontor');
  zentrieren();
  uiAktualisieren();
  if (!still) melden('📂 Spielstand geladen');
  return true;
}

function standLoeschen() {
  try { localStorage.removeItem(STAND_SCHLUESSEL); } catch (e) {}
}


/* ---------- 3d. MEHRSPIELER ÜBER FIREBASE --------------------- */
// Einer eröffnet eine Partie und bekommt einen Code, der andere tritt
// damit bei. Das Gerät des Gastgebers rechnet die gesamte Simulation
// und veröffentlicht den Stand; der Gast zeichnet nur und schickt
// seine Befehle zurück. Die Welt selbst wird NICHT übertragen –
// beide erzeugen sie aus demselben Startwert.

const MP_KONFIG = {
  databaseURL: 'https://kegeltour-45451-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'kegeltour-45451',
};
const MP_FASSUNGEN = ['10.13.2', '11.0.2', '10.12.5'];

const MP = {
  an: false, rolle: null, code: null,
  fb: null, db: null, pfad: null,
  taktZeit: 0, bautenZeit: 0, pulsZeit: 0, ausgang: null,
  hostPuls: 0, gastDa: false, fehler: '',
};
function istGast()      { return MP.an && MP.rolle === 'gast'; }
function istGastgeber() { return MP.an && MP.rolle === 'gastgeber'; }

// Reihenfolge der Gebäudetypen – für die kompakte Übertragung
const TYP_LISTE = Object.keys(GEBAEUDE);

async function firebaseLaden() {
  let letzter = null;
  for (const fassung of MP_FASSUNGEN) {
    try {
      const p = 'https://www.gstatic.com/firebasejs/' + fassung + '/';
      const [app, db] = await Promise.all([
        import(p + 'firebase-app.js'), import(p + 'firebase-database.js')]);
      return { ...app, ...db };
    } catch (e) { letzter = e; }
  }
  throw letzter || new Error('Firebase nicht erreichbar');
}

async function mpVerbinden() {
  if (MP.db) return true;
  const fb = await firebaseLaden();
  MP.fb = fb;
  const app = fb.initializeApp(MP_KONFIG, 'inselspiel');
  MP.db = fb.getDatabase(app);
  return true;
}

function mpCodeErzeugen() {
  const zeichen = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 5; i++) c += zeichen[(Math.random() * zeichen.length) | 0];
  return c;
}

/* --- Der Gastgeber eröffnet --- */
async function partieEroeffnen() {
  mpStatus('Verbinde …');
  try {
    await mpVerbinden();
    const fb = MP.fb;
    MP.code = mpCodeErzeugen();
    MP.pfad = 'inselspiel/' + MP.code;
    await fb.set(fb.ref(MP.db, MP.pfad), {
      welt: { saat: weltSaat, erstellt: Date.now() },
      meta: { puls: Date.now(), gast: false },
    });
    MP.an = true; MP.rolle = 'gastgeber';
    // Platz 2 wird frei für den Mitspieler
    spieler[1].ki = false;
    spieler[1].name = 'Gast (wartet)';
    // Auf den Beitritt und auf Befehle horchen
    fb.onValue(fb.ref(MP.db, MP.pfad + '/meta/gast'), schnapp => {
      if (schnapp.val() && !MP.gastDa) {
        MP.gastDa = true;
        spieler[1].name = 'Mitspieler';
        melden('🎉 Dein Mitspieler ist der Partie beigetreten!');
      }
    });
    fb.onChildAdded(fb.ref(MP.db, MP.pfad + '/befehle'), schnapp => {
      befehlAnnehmen(schnapp.val());
      fb.remove(schnapp.ref);
    });
    mpStatus('');
    mpFensterZeigen();
    melden('🌐 Partie eröffnet – gib deinem Mitspieler den Code ' + MP.code);
  } catch (e) {
    MP.fehler = String(e && e.message || e);
    mpStatus('Verbindung fehlgeschlagen: ' + MP.fehler);
  }
}

/* --- Der Gast tritt bei --- */
async function partieBeitreten(code) {
  code = (code || '').trim().toUpperCase();
  if (code.length < 4) { mpStatus('Bitte den Code eingeben'); return; }
  mpStatus('Suche Partie …');
  try {
    await mpVerbinden();
    const fb = MP.fb;
    MP.pfad = 'inselspiel/' + code;
    const welt = (await fb.get(fb.ref(MP.db, MP.pfad + '/welt'))).val();
    if (!welt) { mpStatus('Keine Partie mit diesem Code gefunden'); return; }

    // Dieselbe Welt aus demselben Startwert aufbauen
    weltErzeugen(welt.saat);
    gebaeude = []; truppen = [];
    belegt = new Array(N * N).fill(null);
    MP.an = true; MP.rolle = 'gast'; MP.code = code;
    spieler[1].ki = false;
    spieler[1].name = 'Du';
    spieler[0].name = 'Gastgeber';
    rolleSetzen(1);
    state.kontorGebaut = false;
    state.terrainAlt = true;

    await fb.set(fb.ref(MP.db, MP.pfad + '/meta/gast'), true);
    fb.onValue(fb.ref(MP.db, MP.pfad + '/stand/takt'), sn => standAnwenden(sn.val()));
    fb.onValue(fb.ref(MP.db, MP.pfad + '/stand/bauten'), sn => bautenAnwenden(sn.val()));
    fb.onValue(fb.ref(MP.db, MP.pfad + '/meta/puls'), sn => { MP.hostPuls = sn.val() || 0; });
    MP.ausgang = paket => fb.push(fb.ref(MP.db, MP.pfad + '/befehle'), paket)
      .catch(() => melden('Befehl konnte nicht gesendet werden'));

    menueBauen();
    werkzeugWaehlen('kontor');
    mpStatus('');
    mpFensterSchliessen();
    melden('🌐 Verbunden! Such dir eine Insel und baue dein Kontor.');
  } catch (e) {
    MP.fehler = String(e && e.message || e);
    mpStatus('Beitritt fehlgeschlagen: ' + MP.fehler);
  }
}

/* --- Gastgeber veröffentlicht den Stand --- */
function mpSenden(dt) {
  // Ohne bestehende Verbindung wird nichts gesendet (und nichts kaputt)
  if (!istGastgeber() || !MP.fb || !MP.db || !MP.pfad) return;
  const fb = MP.fb;
  MP.taktZeit += dt; MP.bautenZeit += dt; MP.pulsZeit += dt;

  if (MP.taktZeit >= 0.35) {
    MP.taktZeit = 0;
    fb.set(fb.ref(MP.db, MP.pfad + '/stand/takt'), taktPaket()).catch(() => {});
  }

  if (MP.bautenZeit >= 1.5) {
    MP.bautenZeit = 0;
    fb.set(fb.ref(MP.db, MP.pfad + '/stand/bauten'), bautenPaket()).catch(() => {});
  }

  if (MP.pulsZeit >= 2) {
    MP.pulsZeit = 0;
    fb.set(fb.ref(MP.db, MP.pfad + '/meta/puls'), Date.now()).catch(() => {});
  }
}

// Der laufende Stand, kompakt als Zahlen
function taktPaket() {
  return {
      t: Math.round(state.spielzeit),
      sp: spieler.map(sp => ({
        r: Object.keys(PREISE).concat('gold').map(w => Math.round(sp.res[w] * 10) / 10),
        s: sp.maxStufe, g: sp.gunst, k: Math.round(sp.kontingent),
        km: sp.kontingentMax, e: sp.einwohner, sd: sp.siedlerEw,
        sx: Math.round(sp.schiff.x * 10), sy: Math.round(sp.schiff.y * 10),
        kt: !!sp.kontor,
      })),
      tr: truppen.map(t => [t.id, t.spieler, t.art === 'flotte' ? 1 : 0,
        Math.round(t.mann * 10) / 10, Math.round(t.schiffe * 10) / 10,
        Math.round(t.fracht), t.kanonen || 0, Math.round(t.moral * 100),
        Math.round(t.x * 10), Math.round(t.y * 10), t.kampf ? 1 : 0]),
      fs: feindschaft.map(z => z.map(w => Math.round(w))),
      mk: Object.keys(PREISE).map(w => Math.round(markt[w] * 100)),
      du: [duerre.insel, Math.round(duerre.bis)],
  };
}

// Die Gebäudeliste, ebenfalls kompakt
function bautenPaket() {
  return gebaeude.map(g => [g.id, TYP_LISTE.indexOf(g.typ), g.x, g.y, g.spieler,
    g.ausbau || 1, Math.round(g.hp), g.ew || 0, g.stufe || 0,
    Math.round(g.eff * 100), g.felder ? g.felder.join(',') : '']);
}

/* --- Gast übernimmt den Stand --- */
function standAnwenden(d) {
  if (!d || !istGast()) return;
  state.spielzeit = d.t || 0;
  const waren = Object.keys(PREISE).concat('gold');
  (d.sp || []).forEach((g, i) => {
    const sp = spieler[i];
    if (!sp || !g) return;
    waren.forEach((w, j) => { sp.res[w] = g.r[j]; });
    sp.maxStufe = g.s; sp.gunst = g.g;
    sp.kontingent = g.k; sp.kontingentMax = g.km;
    sp.einwohner = g.e; sp.siedlerEw = g.sd;
    sp.schiff.x = g.sx / 10; sp.schiff.y = g.sy / 10;
    sp._hatKontor = g.kt;
  });
  // Truppen abgleichen (Ziele setzen, dazwischen wird weich bewegt)
  const bekannt = new Map(truppen.map(t => [t.id, t]));
  const neu = [];
  for (const a of (d.tr || [])) {
    let t = bekannt.get(a[0]);
    if (!t) {
      t = { id: a[0], spieler: a[1], art: a[2] ? 'flotte' : 'heer',
            x: a[8] / 10, y: a[9] / 10, pfad: [] };
    }
    t.spieler = a[1]; t.art = a[2] ? 'flotte' : 'heer';
    t.mann = a[3]; t.schiffe = a[4]; t.fracht = a[5];
    t.kanonen = a[6]; t.moral = a[7] / 100;
    t._zx = a[8] / 10; t._zy = a[9] / 10; t.kampf = !!a[10];
    neu.push(t);
  }
  truppen = neu;
  if (state.truppAuswahl && !truppen.includes(state.truppAuswahl))
    state.truppAuswahl = truppen.find(t => t.id === state.truppAuswahl.id) || null;
  if (d.fs) feindschaft = d.fs;
  if (d.mk) Object.keys(PREISE).forEach((w, j) => { markt[w] = d.mk[j] / 100; });
  if (d.du) { duerre.insel = d.du[0]; duerre.bis = d.du[1]; }
}

function bautenAnwenden(liste) {
  if (!liste || !istGast()) return;
  const alt = new Map(gebaeude.map(g => [g.id, g]));
  belegt = new Array(N * N).fill(null);
  gebaeude = [];
  for (const a of liste) {
    const typ = TYP_LISTE[a[1]];
    if (!typ) continue;
    const def = GEBAEUDE[typ];
    const g = alt.get(a[0]) || { id: a[0], typ, fortschritt: 0 };
    Object.assign(g, { typ, x: a[2], y: a[3], spieler: a[4], ausbau: a[5],
      hp: a[6], maxHp: Math.max(a[6], def.hp || 100), ew: a[7], stufe: a[8],
      eff: a[9] / 100, zufrieden: true,
      felder: a[10] ? String(a[10]).split(',').filter(Boolean).map(Number) : undefined });
    gebaeude.push(g);
    for (let y = g.y; y < g.y + def.h; y++)
      for (let x = g.x; x < g.x + def.w; x++)
        if (x >= 0 && y >= 0 && x < N && y < N) belegt[y * N + x] = g;
    if (g.felder) for (const idx of g.felder) belegt[idx] = g;
  }
  for (const sp of spieler)
    sp.kontor = gebaeude.find(g => g.typ === 'kontor' && g.spieler === sp.id) || null;
  state.kontorGebaut = !!spieler[ICH].kontor;
  if (state.auswahl) state.auswahl = gebaeude.find(g => g.id === state.auswahl.id) || null;
}

// Weiche Bewegung beim Gast zwischen zwei Netzmeldungen
function truppenGlaetten(dt) {
  for (const t of truppen) {
    if (t._zx === undefined) continue;
    const f = Math.min(1, dt * 7);
    t.x += (t._zx - t.x) * f;
    t.y += (t._zy - t.y) * f;
  }
}

/* --- Befehle des Gastes --- */
function befehlSenden(daten) {
  if (!istGast()) return false;
  const paket = { ...daten, zeit: Date.now() };
  if (!MP.ausgang) return false;
  MP.ausgang(paket);
  return true;
}

function befehlAnnehmen(b) {
  if (!b || !istGastgeber()) return;
  const sid = 1;                         // nur der Gast schickt Befehle
  const finde = id => gebaeude.find(g => g.id === id);
  switch (b.art) {
    case 'bau':      platziere(b.typ, b.tx, b.ty, sid); break;
    case 'abriss':   { const g = finde(b.id); if (g && g.spieler === sid) abreissen(g); break; }
    case 'ausbau':   { const g = finde(b.id); if (g && g.spieler === sid) ausbauen(g); break; }
    case 'handel':   handelAusfuehren(spieler[sid], b.ware, b.menge); break;
    case 'diplo':    diploAktion(b.aktion, b.gegen, sid); break;
    case 'ausheben': { const g = finde(b.id); if (g && g.spieler === sid) ausheben(g); break; }
    case 'schiffbau':{ const g = finde(b.id); if (g && g.spieler === sid) schiffBauen(g); break; }
    case 'kanonen':  { const t = truppen.find(t => t.id === b.id);
                       if (t && t.spieler === sid) kanonenNachruesten(t); break; }
    case 'truppe':   { const t = truppen.find(t => t.id === b.id);
                       if (t && t.spieler === sid) {
                         const plan = befehlPlanen(t, b.tx, b.ty, sid);
                         if (plan.ok) befehlAusfuehren({ truppe: t, plan });
                       }
                       break; }
    case 'halt':     { const t = truppen.find(t => t.id === b.id);
                       if (t && t.spieler === sid) t.pfad = []; break; }
    case 'schiff':   { const weg = wegSuche(Math.floor(spieler[sid].schiff.x),
                                            Math.floor(spieler[sid].schiff.y),
                                            b.tx, b.ty, seeFrei);
                       if (weg) spieler[sid].schiff.pfad = weg; break; }
  }
}

/* ---------- 4. HILFSFUNKTIONEN ------------------------------- */

// Mittelpunkt eines Gebäudes in Kachel-Koordinaten
function zentrum(geb) {
  const def = GEBAEUDE[geb.typ];
  return { x: geb.x + def.w / 2, y: geb.y + def.h / 2 };
}
function abstandGebaeude(a, b) {
  const za = zentrum(a), zb = zentrum(b);
  return Math.hypot(za.x - zb.x, za.y - zb.y);
}

// Alle Kacheln im Umkreis (Kreis, nicht Quadrat) um einen Punkt besuchen
function imUmkreis(cx, cy, radius, fn) {
  const r = Math.ceil(radius);
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) {
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
      const k = kachel(x, y);
      if (!k) continue;
      if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy) <= radius) fn(k, x, y);
    }
  }
}

// Liegt Wasser (optional auch ein Fluss) höchstens 2 Kacheln entfernt?
function kuesteNah(ax, ay, def, auchFluss = false) {
  for (let y = ay - 2; y < ay + def.h + 2; y++) {
    for (let x = ax - 2; x < ax + def.w + 2; x++) {
      const k = kachel(x, y);
      if (k && (k.typ === 'wasser' || (auchFluss && k.typ === 'fluss'))) return true;
    }
  }
  return false;
}

// Baumdichte im Umkreis (Summe der Bestände)
function baeumeImUmkreis(cx, cy, radius) {
  let summe = 0;
  imUmkreis(cx, cy, radius, k => { summe += k.baum; });
  return summe;
}

// Freie Graskacheln im Umkreis (Weideland für die Schaffarm)
function weideImUmkreis(cx, cy, radius) {
  let n = 0;
  imUmkreis(cx, cy, radius, (k, x, y) => {
    if ((k.typ === 'gras' || k.typ === 'wald') && !belegtAuf(x, y)) n++;
  });
  return n;
}

// Wasserkacheln im Umkreis (Fanggründe des Fischers)
function wasserImUmkreis(cx, cy, radius) {
  let n = 0;
  imUmkreis(cx, cy, radius, k => { if (k.typ === 'wasser' || k.typ === 'fluss') n++; });
  return n;
}

// Gesteinsvorkommen mit Restbestand im Umkreis finden
function steinKachelImUmkreis(cx, cy, radius) {
  let fund = null;
  imUmkreis(cx, cy, radius, (k) => {
    if (k.typ === 'berg' && k.stein > 0 && !fund) fund = k;
  });
  return fund;
}

// Eisenvorkommen mit Restbestand im Umkreis finden
function eisenKachelImUmkreis(cx, cy, radius) {
  let fund = null;
  imUmkreis(cx, cy, radius, (k) => { if (k.eisen > 0 && !fund) fund = k; });
  return fund;
}

// Goldvorkommen mit Restbestand im Umkreis finden (nur auf der Goldinsel)
function goldKachelImUmkreis(cx, cy, radius) {
  let fund = null;
  imUmkreis(cx, cy, radius, (k) => {
    if (k.golderz > 0 && !fund) fund = k;
  });
  return fund;
}

// Verläuft zwischen zwei Punkten ein Fluss ohne Brücke? (Sichtlinie)
function flussDazwischen(ax, ay, bx, by) {
  const schritte = Math.ceil(Math.hypot(bx - ax, by - ay) * 2);
  for (let i = 1; i < schritte; i++) {
    const x = Math.floor(ax + (bx - ax) * i / schritte);
    const y = Math.floor(ay + (by - ay) * i / schritte);
    const k = kachel(x, y);
    if (k && k.typ === 'fluss') {
      const b = belegtAuf(x, y);
      if (!b || b.typ !== 'bruecke') return true;
    }
  }
  return false;
}

// Hat dieser Spieler ein Kontor auf der angegebenen Insel?
function kontorAufInsel(sid, insel) {
  if (insel < 0) return false;
  for (const g of gebaeude)
    if (g.typ === 'kontor' && g.spieler === sid &&
        inselMarke[g.y * N + g.x] === insel) return true;
  return false;
}

// Ist ein Punkt an einen EIGENEN Marktplatz bzw. das Kontor angebunden?
function marktAnbindung(cx, cy, sid = ICH) {
  for (const g of gebaeude) {
    const def = GEBAEUDE[g.typ];
    if (!def.marktRadius || g.spieler !== sid) continue;
    const z = zentrum(g);
    if (Math.hypot(z.x - cx, z.y - cy) > wirkRadius(g)) continue;
    // Ein Fluss ohne Brücke unterbricht die Versorgung
    if (flussDazwischen(z.x, z.y, cx, cy)) continue;
    return true;
  }
  return false;
}

// Steht ein Gebäude dieses Typs (Kapelle, Schule, Theater …) in Reichweite?
function gebaeudeInReichweite(typ, cx, cy, sid = ICH) {
  for (const g of gebaeude) {
    if (g.typ !== typ || g.spieler !== sid) continue;
    const z = zentrum(g);
    if (Math.hypot(z.x - cx, z.y - cy) <= wirkRadius(g)) return true;
  }
  return false;
}

/* ---------- 5. BAUEN & ABREISSEN ------------------------------ */

// Diese Betriebe legen ihre Felder selbst an: rund um das Gebäude
// (3×3) werden freie Grasfelder zum Acker bzw. zur Weide.
// 6 eigene Felder = volle Leistung.
const FELD_FARMEN = new Set(['schaffarm', 'getreidefarm', 'zuckerrohr',
  'tabakplantage', 'gewuerzplantage', 'rinderfarm']);
const FELD_DEKO = {   // Farbe + Symbol der Felder je Farm
  schaffarm:       ['rgba(226,238,208,0.85)', '🐑'],
  getreidefarm:    ['rgba(238,222,150,0.85)', '🌾'],
  zuckerrohr:      ['rgba(210,232,176,0.85)', '🎋'],
  tabakplantage:   ['rgba(222,204,160,0.85)', '🍂'],
  gewuerzplantage: ['rgba(230,196,174,0.85)', '🌶️'],
  rinderfarm:      ['rgba(224,216,190,0.85)', '🐄'],
};

// Freie Grasfelder im 3×3 rund um den Bauplatz (als Kachel-Indizes)
function feldPlaetze(typ, ax, ay) {
  const liste = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const x = ax + dx, y = ay + dy;
    const k = kachel(x, y);
    if (k && k.typ === 'gras' && !belegtAuf(x, y)) liste.push(y * N + x);
  }
  return liste;
}

// Bei zweitem und weiteren Kontoren fällt eine Ausbaugebühr an
const KONTOR_AUSBAU = { gold: 1500, holz: 30, werkzeuge: 10 };
function gebKosten(typ, sid = ICH) {
  if (typ === 'kontor' && spieler[sid].kontor) return KONTOR_AUSBAU;
  return GEBAEUDE[typ].kosten;
}

// Der Anker (linke obere Ecke) liegt so, dass der Mauszeiger
// ungefähr in der Gebäudemitte ist.
function ankerVon(typ, tx, ty) {
  const def = GEBAEUDE[typ];
  return { x: tx - Math.floor((def.w - 1) / 2), y: ty - Math.floor((def.h - 1) / 2) };
}

// Prüft, ob ein Gebäude an dieser Stelle stehen darf.
function platzOK(typ, ax, ay, sid = ICH) {
  const def = GEBAEUDE[typ];
  if (spieler[sid].maxStufe < def.abStufe)
    return { ok: false, grund: 'Erst ab ' + STUFEN[def.abStufe].name + 'n verfügbar' };
  if (def.einmalig && gebaeude.some(g => g.typ === typ && g.spieler === sid))
    return { ok: false, grund: `${def.name}: gibt es nur einmal je Siedlung` };
  if (def.gunst && spieler[sid].gunst < def.gunst)
    return { ok: false, grund: `Dafür brauchst du ${def.gunst} 🏅 Gunst (du hast ${spieler[sid].gunst}) – halte deine Bürger zufrieden` };
  if (ax < 0 || ay < 0 || ax + def.w > N || ay + def.h > N)
    return { ok: false, grund: 'Außerhalb der Karte' };

  for (let y = ay; y < ay + def.h; y++) for (let x = ax; x < ax + def.w; x++) {
    const k = kachel(x, y);
    if (typ === 'bruecke') {
      if (k.typ !== 'fluss') return { ok: false, grund: 'Brücken stehen auf Flüssen' };
    } else {
      if (k.typ === 'wasser') return { ok: false, grund: 'Im Wasser kann nicht gebaut werden' };
      if (k.typ === 'fluss')  return { ok: false, grund: 'Auf Flüssen kann nur eine Brücke stehen' };
      if (k.typ === 'berg')   return { ok: false, grund: 'Auf Bergen kann nicht gebaut werden' };
    }
    if (belegtAuf(x, y)) return { ok: false, grund: 'Hier steht bereits ein Gebäude' };
  }

  // Ohne eigenes Kontor auf der Insel wird dort nicht gebaut
  if (typ !== 'kontor' && inselMarke) {
    const insel = inselMarke[ay * N + ax];
    if (!kontorAufInsel(sid, insel))
      return { ok: false, grund: 'Kein eigenes Kontor auf dieser Insel – zuerst besiedeln' };
  }
  if (def.brauchtKueste && !kuesteNah(ax, ay, def, typ === 'fischer'))
    return { ok: false, grund: typ === 'fischer'
      ? 'Muss an Küste oder Fluss liegen' : 'Muss an der Küste liegen' };
  if (FELD_FARMEN.has(typ) && feldPlaetze(typ, ax, ay).length === 0)
    return { ok: false, grund: 'Braucht freies Grasland rundherum für die Felder (3×3)' };

  const cx = ax + def.w / 2, cy = ay + def.h / 2;
  if (typ === 'kontor' && sid === ICH &&
      Math.hypot(schiff.x - cx, schiff.y - cy) > SIM.schiffBauRadius)
    return { ok: false, grund: 'Zu weit vom Schiff – segle zuerst vor diese Küste' };
  if (typ === 'holzfaeller' && baeumeImUmkreis(cx, cy, def.radius) < 0.5)
    return { ok: false, grund: 'Kein Wald in Reichweite' };
  if (typ === 'jagd' && baeumeImUmkreis(cx, cy, def.radius) < 0.5)
    return { ok: false, grund: 'Kein Wald in Reichweite' };
  if (typ === 'ziegelei' && !steinKachelImUmkreis(cx, cy, def.radius))
    return { ok: false, grund: 'Kein Gesteinsvorkommen (Berge) in der Nähe' };
  if (typ === 'eisenmine' && !eisenKachelImUmkreis(cx, cy, def.radius))
    return { ok: false, grund: 'Kein Eisenvorkommen 🔩 in der Nähe – such einen Berg' };
  if (typ === 'goldmine' && !goldKachelImUmkreis(cx, cy, def.radius))
    return { ok: false, grund: 'Kein Goldvorkommen 🪙 – das gibt es nur auf der Goldinsel!' };
  if (typ === 'goldschmiede' && !goldKachelImUmkreis(cx, cy, def.radius))
    return { ok: false, grund: 'Kein Goldvorkommen 🪙 – das gibt es nur auf der Goldinsel!' };
  if (typ === 'wohnhaus' && !marktAnbindung(cx, cy, sid))
    return { ok: false, grund: 'Außerhalb der Reichweite von Marktplatz/Kontor' };

  return { ok: true };
}

function kostenReichen(typ, sid = ICH) {
  const R = spieler[sid].res;
  for (const [ware, menge] of Object.entries(gebKosten(typ, sid)))
    if (R[ware] < menge) return false;
  return true;
}

function platziere(typ, tx, ty, sid = ICH) {
  // Als Gast wird nicht selbst gebaut, sondern der Wunsch gesendet
  if (istGast() && sid === ICH) return befehlSenden({ art: 'bau', typ, tx, ty });
  const { x: ax, y: ay } = ankerVon(typ, tx, ty);
  const pruefung = platzOK(typ, ax, ay, sid);
  if (!pruefung.ok) { if (sid === ICH) melden(pruefung.grund); return false; }
  if (!kostenReichen(typ, sid)) {
    if (sid === ICH) melden('Zu wenig Rohstoffe für dieses Gebäude');
    return false;
  }

  const def = GEBAEUDE[typ];
  const R = spieler[sid].res;
  for (const [ware, menge] of Object.entries(gebKosten(typ, sid))) R[ware] -= menge;
  if (def.gunst) spieler[sid].gunst -= def.gunst;

  const geb = {
    id: naechsteId++, typ, x: ax, y: ay, spieler: sid,
    hp: def.hp || 100, maxHp: def.hp || 100,   // für Belagerungen
    ausbau: 1,                                 // Ausbaustufe 1–3
    fortschritt: 0,   // Produktionsfortschritt in Sekunden
    eff: 0,           // Auslastung 0..1 (für das Info-Panel)
  };
  if (typ === 'wohnhaus') {
    Object.assign(geb, {
      stufe: 0,  // Index in STUFEN: 0 = Pioniere
      ew: 2, maxEw: STUFEN[0].maxEw,
      zufrieden: true, hungerZeit: 0, wachsZeit: 0, aufstiegZeit: 0,
    });
  }
  gebaeude.push(geb);

  // Kacheln belegen; Bäume auf dem Baufeld werden gerodet
  for (let y = ay; y < ay + def.h; y++) for (let x = ax; x < ax + def.w; x++) {
    belegt[y * N + x] = geb;
    const k = kachel(x, y);
    if (k.baum > 0) { k.baum = 0; kachelSchmutzig(x, y); }
  }

  // Farmen legen ihre Felder im 3×3 rundherum an (wie im klassischen Vorbild)
  if (FELD_FARMEN.has(typ)) {
    geb.felder = feldPlaetze(typ, ax, ay);
    for (const idx of geb.felder) belegt[idx] = geb;
  }

  // Ein Kontor auf einer bereits besiedelten Insel sorgt für Ärger
  if (typ === 'kontor' && inselMarke) {
    const insel = inselMarke[ay * N + ax];
    if (insel >= 0) for (const andere of spieler) {
      if (andere.id === sid) continue;
      const wohntDort = gebaeude.some(g => g.typ === 'kontor' && g.spieler === andere.id &&
                                           inselMarke[g.y * N + g.x] === insel);
      if (!wohntDort) continue;
      feindAendern(sid, andere.id, 22);
      if (sid === ICH)
        melden(`⚡ ${andere.name} duldet dein Kontor auf seiner Insel nur widerwillig – die Spannungen steigen`);
      else if (andere.id === ICH)
        melden(`⚡ ${spieler[sid].name} setzt sich auf deine Insel – das sorgt für Spannungen`);
    }
  }

  if (typ === 'kontor' && !spieler[sid].kontor) spieler[sid].kontor = geb;
  if (typ === 'kontor' && sid === ICH) {
    state.kontorGebaut = true;
    werkzeugWaehlen('zeiger');   // zurück zum Auswahl-Werkzeug (auch Cursor)
    document.getElementById('hinweis').style.display = 'none';
    melden('Kontor errichtet – jetzt Wohnhäuser und Betriebe bauen!');
    menueBauen(); // Menü neu aufbauen (Kontor zeigt jetzt die Ausbaugebühr)
  }
  return true;
}

function abreissen(geb) {
  if (istGast() && geb.spieler === ICH) return befehlSenden({ art: 'abriss', id: geb.id });
  const def = GEBAEUDE[geb.typ];
  // Kacheln freigeben
  for (let y = geb.y; y < geb.y + def.h; y++)
    for (let x = geb.x; x < geb.x + def.w; x++)
      belegt[y * N + x] = null;
  if (geb.felder) for (const idx of geb.felder) belegt[idx] = null;
  gebaeude = gebaeude.filter(g => g !== geb);

  // Die Hälfte der Kosten gibt es zurück
  const R = spieler[geb.spieler].res;
  for (const [ware, menge] of Object.entries(def.kosten))
    R[ware] += Math.floor(menge / 2);

  if (geb.typ === 'kontor' && geb.spieler === ICH) { state.kontorGebaut = false; menueBauen(); }
  if (state.auswahl === geb) { state.auswahl = null; panelZeigen(); }
  melden(def.name + ' abgerissen');
}

/* ---------- 5b. DIE KI-KONKURRENTEN ---------------------------- */
// Drei Computer-Spieler besiedeln nacheinander eigene Inseln, bauen
// nach einem festen Plan, kaufen fehlende Waren im Handel ein und
// nehmen am Wettrennen auf 500 Siedler teil.

// Größte noch unbesiedelte Insel suchen und dort das Kontor errichten
function kiSiedeln(sp) {
  const s = sp.schiff;
  if (!s || s.pfad.length) return;      // noch auf See

  // Noch kein Ziel? Die größte freie Insel ansteuern.
  if (sp.zielInsel < 0) {
    const besetzt = new Set();
    for (const g of gebaeude)
      if (g.typ === 'kontor') besetzt.add(inselMarke[g.y * N + g.x]);
    for (const andere of spieler)
      if (andere !== sp && andere.zielInsel >= 0) besetzt.add(andere.zielInsel);
    let insel = -1, groesse = 0;
    for (let i = 0; i < inselGroessen.length; i++)
      if (!besetzt.has(i) && inselGroessen[i] > groesse) { insel = i; groesse = inselGroessen[i]; }
    if (insel < 0) return;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (inselMarke[y * N + x] !== insel) continue;
      const hafen = freiesFeldNeben(x + 0.5, y + 0.5, seeFrei);
      if (!hafen) continue;
      const weg = wegSuche(Math.floor(s.x), Math.floor(s.y),
                           Math.floor(hafen.x), Math.floor(hafen.y), seeFrei);
      if (!weg) continue;
      sp.zielInsel = insel;
      s.pfad = weg;
      melden(`⛵ ${sp.name} sticht in See!`, 'ki-start-' + sp.id);
      return;
    }
    return;
  }

  // Angekommen: Kontor in Ufernähe errichten
  for (let r = 1; r <= 10; r++)
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const x = Math.floor(s.x) + dx, y = Math.floor(s.y) + dy;
      if (x < 0 || y < 0 || x >= N || y >= N) continue;
      if (inselMarke[y * N + x] !== sp.zielInsel) continue;
      const a = ankerVon('kontor', x, y);
      if (platzOK('kontor', a.x, a.y, sp.id).ok && platziere('kontor', x, y, sp.id)) {
        melden(`⚓ ${sp.name} hat eine Insel besiedelt!`, 'ki-siedeln');
        return;
      }
    }
  sp.zielInsel = -1;   // dort ging nichts – neues Ziel suchen
}

// Bauplatz möglichst nah am eigenen Kontor suchen
function kiBauplatz(sp, typ) {
  const kz = zentrum(sp.kontor);
  let beste = null, besteD = 1e9;
  const R = 16;
  for (let y = Math.max(0, Math.floor(kz.y - R)); y < Math.min(N, kz.y + R); y++) {
    for (let x = Math.max(0, Math.floor(kz.x - R)); x < Math.min(N, kz.x + R); x++) {
      const d = Math.hypot(x - kz.x, y - kz.y);
      if (d >= besteD) continue;
      const a = ankerVon(typ, x, y);
      if (platzOK(typ, a.x, a.y, sp.id).ok) { beste = { x, y }; besteD = d; }
    }
  }
  return beste;
}

// Die KI baut ihre Gebäude aus, sobald sie Gold übrig hat –
// bevorzugt Produktionsstätten und Wohnhäuser, dort wirkt es am meisten.
function kiAusbauen(sp) {
  if (sp.res.gold < 15000) return false;
  let ziel = null, bester = 1e9;
  for (const g of gebaeude) {
    if (g.spieler !== sp.id) continue;
    const stufe = g.ausbau || 1;
    if (stufe >= AUSBAU_MAX) continue;
    // Niedrige Stufen zuerst; Produktion und Wohnraum vor dem Rest
    const rang = (GEBAEUDE[g.typ].dauer || g.typ === 'wohnhaus') ? 0 : 1;
    const wert = stufe * 10 + rang;
    if (wert < bester) { bester = wert; ziel = g; }
  }
  return ziel ? ausbauen(ziel) : false;
}

// --- Kriegsführung der KI ---
// Die KI rüstet erst spät auf und greift dann über See an: Kontore
// stehen immer an der Küste, also sind sie von Flotten erreichbar.
function kiFlotte(sp) {
  return truppen.find(t => t.spieler === sp.id && t.art === 'flotte');
}
function kiHeer(sp) {
  return truppen.find(t => t.spieler === sp.id && t.art === 'heer');
}

// Wasserfeld in der Nähe eines Gebäudes (Ankerplatz zum Bombardieren)
function wasserFeldNeben(geb) {
  const z = zentrum(geb);
  return freiesFeldNeben(z.x, z.y, seeFrei);
}

function kiKrieg(sp) {
  if (!sp.kontor) return;
  const R = sp.res;
  const eigene = typ => gebaeude.some(g => g.typ === typ && g.spieler === sp.id);

  // 1. Aufrüsten: erst Waffen und Verteidigung, dann Werft und Kaserne
  const wunsch = [];
  if (!eigene('waffenschmiede')) wunsch.push('waffenschmiede');
  if (!eigene('wachturm')) wunsch.push('wachturm');
  if (sp.maxStufe >= 2 && !eigene('werft')) wunsch.push('werft');
  if (sp.maxStufe >= 2 && !eigene('kaserne')) wunsch.push('kaserne');
  for (const typ of wunsch) {
    if (sp.maxStufe < GEBAEUDE[typ].abStufe || !kostenReichen(typ, sp.id)) continue;
    const platz = kiBauplatz(sp, typ);
    if (platz && platziere(typ, platz.x, platz.y, sp.id)) return;
  }

  // 2. Heimatschutz: ein Heer in der Nähe des Kontors halten
  const kaserne = gebaeude.find(g => g.typ === 'kaserne' && g.spieler === sp.id);
  const heer = kiHeer(sp);
  if (kaserne && R.gold > 2500 &&
      soldatenAktuell(sp.id) < soldatenKapazitaet(sp.id) &&
      (!heer || heer.mann < 20 * sp.aggression))
    ausheben(kaserne);

  // 3. Flotte bauen
  const werft = gebaeude.find(g => g.typ === 'werft' && g.spieler === sp.id);
  const flotte = kiFlotte(sp);
  const sollSchiffe = 3 + Math.round(3 * sp.aggression);
  if (werft && R.gold > 3000 && (!flotte || flotte.schiffe < sollSchiffe))
    schiffBauen(werft);

  // 4. Ziel bestimmen: der Führende im Wettlauf (hält das Rennen offen)
  let ziel = null, bestPunkte = -1;
  for (const geg of spieler) {
    if (geg.id === sp.id || !geg.kontor) continue;
    const punkte = geg.siedlerEw * 2 + geg.einwohner;
    if (punkte > bestPunkte) { bestPunkte = punkte; ziel = geg; }
  }
  if (!ziel) return;
  const spannung = feindschaft[sp.id][ziel.id];

  // 5. Wirtschaftskrieg: ab der Handelskriegs-Stufe wird sanktioniert
  if (spannung >= 64 && R.gold > 9000 && Math.random() < 0.35) {
    R.gold -= DIPLO.bestechen.gold;
    diploEffekte.push({ art: 'bestechung', von: sp.id, gegen: ziel.id,
                        wert: DIPLO.bestechen.malus, bis: state.spielzeit + DIPLO.bestechen.dauer });
    if (ziel.id === ICH) melden(`💼 ${sp.name} besticht die Händler gegen dich!`, 'ki-bestech' + sp.id);
    return;
  }
  if (spannung >= 70 && !sp.embargo[ziel.id] && R.gold > 15000) {
    sp.embargo[ziel.id] = true;
    feindAendern(sp.id, ziel.id, DIPLO.embargo.feind);
    if (ziel.id === ICH) melden(`⛔ ${sp.name} verhängt ein Embargo gegen dich!`, 'ki-embargo' + sp.id);
    return;
  }

  // 6. Krieg erklären – erst nach der Friedensfrist und mit starker Flotte
  if (state.spielzeit < KRIEG.kiFriede) return;
  if (!flotte || flotte.schiffe < sollSchiffe || flotte.pfad.length) return;
  if (!imKriegMit(sp.id, ziel.id)) {
    if (spannung < 76) return;                    // noch nicht kriegsbereit
    feindschaft[sp.id][ziel.id] = feindschaft[ziel.id][sp.id] = DIPLO.krieg.feindZiel;
    if (ziel.id === ICH) melden(`⚔️ ${sp.name} erklärt dir den Krieg!`, 'ki-erklaerung' + sp.id);
    else melden(`⚔️ ${sp.name} erklärt ${ziel.name} den Krieg`, 'ki-krieg');
    return;                                        // Angriff erst im nächsten Zug
  }
  const anker = wasserFeldNeben(ziel.kontor);
  if (!anker) return;
  const weg = truppWeg(flotte, Math.floor(anker.x), Math.floor(anker.y));
  if (!weg) return;
  flotte.pfad = weg;
  if (ziel.id === ICH)
    melden(`⚠️ ${sp.name} schickt eine Kriegsflotte zu deiner Insel!`, 'ki-angriff-' + sp.id);
  else
    melden(`⚔️ ${sp.name} greift ${ziel.name} an!`, 'ki-krieg');
}

// Ein KI-Zug alle 5 Spielsekunden: einkaufen, dann bauen
function kiTick(sp, dt) {
  sp.timer += dt;
  if (sp.timer < 5) return;
  sp.timer = 0;

  // Noch keine Insel? Zur Startzeit besiedeln.
  if (!sp.kontor) {
    if (state.spielzeit >= sp.start) kiSiedeln(sp);
    return;
  }
  const R = sp.res;
  if (R.gold < 0) return;   // pleite: erst einmal sparen

  // Einkaufen: fehlende Waren am gemeinsamen Markt besorgen –
  // das treibt die Preise auch für dich!
  for (const [ware, abStufe] of Object.entries(KI_EINKAUF)) {
    if (sp.maxStufe >= abStufe && R[ware] < 12 && R.gold > 1200)
      handelAusfuehren(sp, ware, 10);
  }
  if (R.werkzeuge < 3 && R.gold > 1200) handelAusfuehren(sp, 'werkzeuge', 10);

  // Bauen: nächster Punkt auf dem Plan, danach freies Wachstum
  let typ = sp.plan ? sp.plan[sp.planIdx] : undefined;
  const nachPlan = typ !== undefined;
  if (!nachPlan) {
    typ = sp.extra % 5 === 4 ? 'fischer'
        : (sp.extra % 9 === 8 ? 'marktplatz' : 'wohnhaus');
  }
  if (sp.maxStufe < GEBAEUDE[typ].abStufe) return;  // wartet auf Aufstieg
  if (!kostenReichen(typ, sp.id)) return;            // wartet auf Rohstoffe
  const platz = kiBauplatz(sp, typ);
  if (!platz) { if (nachPlan) sp.planIdx++; return; } // kein Platz: überspringen
  if (platziere(typ, platz.x, platz.y, sp.id)) {
    if (nachPlan) sp.planIdx++; else sp.extra++;
  }

  // Zum Schluss: ausbauen, aufrüsten und gegebenenfalls angreifen
  kiAusbauen(sp);
  kiKrieg(sp);
}


/* ---------- 5b2. DIPLOMATIE UND WIRTSCHAFTSKRIEG --------------- */
// Vor dem Schwert kommt der Handel: Mit Geschenken, Bestechung,
// Embargos und Privilegien lässt sich ein Gegner ruinieren, ohne
// einen einzigen Soldaten auszuheben.

function diploAktion(art, gegen, sid = ICH) {
  if (istGast() && sid === ICH) return befehlSenden({ art: 'diplo', aktion: art, gegen });
  const a = DIPLO[art], ich = spieler[sid], ziel = spieler[gegen];
  if (!a || gegen === sid) return false;

  if (art === 'embargo') {            // Umschalter mit laufenden Kosten
    ich.embargo[gegen] = !ich.embargo[gegen];
    if (ich.embargo[gegen]) {
      feindAendern(sid, gegen, a.feind);
      melden(`⛔ Embargo gegen ${ziel.name} verhängt – kostet ${a.proSekunde * 60} 💰/min`);
    } else melden(`Embargo gegen ${ziel.name} aufgehoben`);
    panelZeigen();
    return true;
  }

  if (art === 'krieg') {
    if (imKriegMit(sid, gegen)) { melden('Ihr seid bereits im Krieg'); return false; }
    feindschaft[ICH][gegen] = feindschaft[gegen][0] = a.feindZiel;
    melden(`⚔️ Du hast ${ziel.name} den Krieg erklärt – jetzt sind Angriffe erlaubt`);
    panelZeigen();
    return true;
  }

  if (a.gold && ich.res.gold < a.gold) {
    melden(`Dafür fehlen ${Math.ceil(a.gold - ich.res.gold)} 💰`);
    return false;
  }
  if (a.gold) ich.res.gold -= a.gold;

  if (art === 'geschenk') {
    feindAendern(sid, gegen, a.feind);
    melden(`🎁 Geschenk an ${ziel.name} – die Beziehung entspannt sich`);
  } else if (art === 'frieden') {
    feindAendern(sid, gegen, a.feind);
    for (const sp of spieler) if (sp.id !== sid) sp.embargo[sid] = false;
    ich.embargo[gegen] = false;
    melden(`🕊️ Frieden mit ${ziel.name} erkauft`);
