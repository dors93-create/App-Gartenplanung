    ctx.fillRect(x + w * 0.34, y + h * 0.06, w * 0.32, h * 0.12);
    ctx.fillStyle = st.sockel || '#a89e8c';
    ctx.fillRect(x + w * 0.06, y + h * 0.92, w * 0.88, h * 0.08);
  },

  statue(geb, st, x, y, w, h) {
    const stein = st.sockel || '#b3a994';
    const figur = st.gold || (st.sockel ? '#d8cba6' : '#c9b88c');
    // Gestufter Unterbau – mit jedem zweiten Ausbau eine Stufe mehr
    const stufen = Math.min(3, 1 + ((geb.ausbau || 1) >> 1));
    for (let i = 0; i < stufen; i++) {
      const b = 0.42 + i * 0.18;
      ctx.fillStyle = stein;
      ctx.fillRect(x + w * (0.5 - b / 2), y + h * (0.97 - 0.075 * (i + 1)), w * b, h * 0.075);
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(x + w * (0.5 - b / 2), y + h * (0.97 - 0.075 * i) - h * 0.016, w * b, h * 0.016);
    }
    const sy = y + h * (0.97 - 0.075 * stufen);
    ctx.fillStyle = stein;                        // Postament
    ctx.fillRect(x + w * 0.33, sy - h * 0.22, w * 0.34, h * 0.22);
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(x + w * 0.58, sy - h * 0.22, w * 0.09, h * 0.22);
    // Figur: Gewand, Kopf, erhobener Arm
    const fy = sy - h * 0.22;
    ctx.fillStyle = figur;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.38, fy);
    ctx.lineTo(x + w * 0.43, y + h * 0.3);
    ctx.lineTo(x + w * 0.61, y + h * 0.3);
    ctx.lineTo(x + w * 0.64, fy);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(x + w * 0.56, y + h * 0.3, w * 0.07, fy - (y + h * 0.3));
    ctx.fillStyle = figur;
    ctx.beginPath();
    ctx.arc(x + w * 0.51, y + h * 0.2, w * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = figur;
    ctx.lineWidth = Math.max(1.2, w * 0.07);
    ctx.beginPath();
    ctx.moveTo(x + w * 0.45, y + h * 0.42); ctx.lineTo(x + w * 0.26, y + h * 0.16);
    ctx.stroke();
    if ((geb.ausbau || 1) >= 5) {                 // Lorbeerkranz
      ctx.strokeStyle = '#6f9b3c';
      ctx.lineWidth = Math.max(0.9, w * 0.04);
      ctx.beginPath();
      ctx.arc(x + w * 0.51, y + h * 0.2, w * 0.17, Math.PI * 0.12, Math.PI * 0.88);
      ctx.stroke();
    }
  },

  // --- Militär --------------------------------------------------
  wachturm(geb, st, x, y, w, h) {
    const a = geb.ausbau || 1;
    const holz = a <= 2;                           // anfangs nur eine Holzwarte
    const tw = w * (0.44 + a * 0.035), tx = x + (w - w * (0.44 + a * 0.035)) / 2;
    ctx.fillStyle = holz ? '#9b7a4f' : (st.sockel || '#a8a08f');   // Turmschaft
    ctx.fillRect(tx, y + h * 0.3, tw, h * 0.64);
    ctx.fillStyle = 'rgba(0,0,0,0.17)';
    ctx.fillRect(tx + tw * 0.74, y + h * 0.3, tw * 0.26, h * 0.64);
    if (w > 16) {                                  // Balkenlage bzw. Steinfugen
      ctx.strokeStyle = holz ? 'rgba(92,64,38,0.55)' : 'rgba(0,0,0,0.16)';
      ctx.lineWidth = Math.max(0.5, w * 0.016);
      ctx.beginPath();
      for (let i = 1; i < 4; i++) {
        const yy = y + h * (0.3 + 0.64 * i / 4);
        ctx.moveTo(tx, yy); ctx.lineTo(tx + tw, yy);
      }
      if (!holz) for (let i = 1; i < 3; i++) {
        ctx.moveTo(tx + tw * i / 3, y + h * 0.3); ctx.lineTo(tx + tw * i / 3, y + h * 0.94);
      }
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(40,40,45,0.75)';         // Schießscharte
    ctx.fillRect(tx + tw * 0.4, y + h * 0.52, tw * 0.2, h * 0.16);
    // Auskragender Wehrgang mit Zinnen
    const wg = tw + w * 0.2;
    ctx.fillStyle = holz ? '#8a6a44' : (st.sockel || '#b6ae9c');
    ctx.fillRect(tx - w * 0.1, y + h * 0.19, wg, h * 0.13);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(tx - w * 0.1, y + h * 0.3, wg, h * 0.035);
    const n = 4, zb = wg / (n * 2 - 1);
    ctx.fillStyle = holz ? '#7a5f3c' : st.dachDunkel;
    for (let i = 0; i < n; i++)
      ctx.fillRect(tx - w * 0.1 + i * zb * 2, y + h * 0.08, zb, h * 0.12);
    fahnenmast(tx + tw * 0.5, y + h * 0.1, h * 0.26,
               spieler[geb.spieler] && spieler[geb.spieler].farbe);
  },

  kaserne(geb, st, x, y, w, h) {
    // Wehrmauer
    ctx.fillStyle = st.sockel || '#a39a8a';
    ctx.fillRect(x + w * 0.04, y + h * 0.3, w * 0.92, h * 0.64);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(x + w * 0.84, y + h * 0.3, w * 0.12, h * 0.64);
    // Zinnenkranz
    const n = 6, zb = w * 0.92 / (n * 2 - 1);
    ctx.fillStyle = st.dachDunkel;
    for (let i = 0; i < n; i++)
      ctx.fillRect(x + w * 0.04 + i * zb * 2, y + h * 0.2, zb, h * 0.12);
    // Ecktürme
    for (const ex of [0.02, 0.82]) {
      ctx.fillStyle = st.sockel || '#b0a797';
      ctx.fillRect(x + w * ex, y + h * 0.24, w * 0.16, h * 0.7);
      ctx.fillStyle = st.dachDunkel;
      ctx.fillRect(x + w * ex, y + h * 0.16, w * 0.16, h * 0.1);
    }
    // Tor
    ctx.beginPath();
    ctx.moveTo(x + w * 0.42, y + h * 0.94);
    ctx.lineTo(x + w * 0.42, y + h * 0.62);
    ctx.arc(x + w * 0.5, y + h * 0.62, w * 0.08, Math.PI, 0);
    ctx.lineTo(x + w * 0.58, y + h * 0.94);
    ctx.closePath();
    ctx.fillStyle = '#5c4228'; ctx.fill();
    // Wappenfahne
    fahnenmast(x + w * 0.5, y + h * 0.18, h * 0.3,
               spieler[geb.spieler] && spieler[geb.spieler].farbe);
  },

  // --- Rohstoffe und Betriebe ----------------------------------
  // Jeder Betrieb hat seinen eigenen Arbeitsplatz neben dem Haus,
  // damit man ihn auch aus der Ferne sofort erkennt.
  holzfaeller(geb, st, x, y, w, h) {
    werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
      stapel(bx, by + bh * 0.78, Math.max(1.6, bw * 0.15), 3, 3, '#a07a4c', '#dcc69c');
      ctx.strokeStyle = '#6b4a2e';                      // Axt im Hauklotz
      ctx.lineWidth = Math.max(0.9, bw * 0.08);
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.2, by + bh * 0.3); ctx.lineTo(bx + bw * 0.5, by + bh * 0.06);
      ctx.stroke();
      ctx.fillStyle = '#c3cbd3';
      ctx.fillRect(bx + bw * 0.46, by, bw * 0.3, bh * 0.14);
    });
  },

  fischer(geb, st, x, y, w, h) {
    werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
      // Netz auf dem Gestell
      gestell(bx, by, bw, bh * 0.44);
      ctx.strokeStyle = 'rgba(248,246,236,0.95)';
      ctx.lineWidth = Math.max(0.5, bw * 0.045);
      ctx.beginPath();
      for (let i = 0; i <= 3; i++) {
        ctx.moveTo(bx + bw * (0.14 + i * 0.24), by + bh * 0.06);
        ctx.lineTo(bx + bw * (0.14 + i * 0.24), by + bh * 0.44);
        ctx.moveTo(bx + bw * 0.14, by + bh * (0.06 + i * 0.127));
        ctx.lineTo(bx + bw * 0.86, by + bh * (0.06 + i * 0.127));
      }
      ctx.stroke();
      // Ruderboot
      ctx.beginPath();
      ctx.moveTo(bx, by + bh * 0.76);
      ctx.quadraticCurveTo(bx + bw * 0.5, by + bh * 0.58, bx + bw, by + bh * 0.78);
      ctx.quadraticCurveTo(bx + bw * 0.5, by + bh, bx, by + bh * 0.76);
      ctx.closePath();
      ctx.fillStyle = '#3f7fa6'; ctx.fill();
      ctx.strokeStyle = '#27536e'; ctx.lineWidth = Math.max(0.5, bw * 0.05); ctx.stroke();
    });
  },

  jagd(geb, st, x, y, w, h) {
    werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
      // Fell auf dem Spannrahmen
      gestell(bx, by, bw, bh * 0.56);
      ctx.beginPath();
      ctx.ellipse(bx + bw * 0.5, by + bh * 0.3, bw * 0.32, bh * 0.22, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#a9743f'; ctx.fill();
      ctx.strokeStyle = '#e8ddc4'; ctx.lineWidth = Math.max(0.4, bw * 0.04); ctx.stroke();
      // Geweih am Pfosten
      ctx.strokeStyle = '#ece0c2';
      ctx.lineWidth = Math.max(0.6, bw * 0.055);
      const gx = bx + bw * 0.5, gy = by + bh * 0.84;
      ctx.beginPath();
      ctx.moveTo(gx, gy); ctx.lineTo(gx - bw * 0.22, gy - bh * 0.16);
      ctx.moveTo(gx, gy); ctx.lineTo(gx + bw * 0.22, gy - bh * 0.16);
      ctx.moveTo(gx - bw * 0.12, gy - bh * 0.09); ctx.lineTo(gx - bw * 0.28, gy - bh * 0.05);
      ctx.moveTo(gx + bw * 0.12, gy - bh * 0.09); ctx.lineTo(gx + bw * 0.28, gy - bh * 0.05);
      ctx.stroke();
    });
  },

  weberei(geb, st, x, y, w, h) {
    werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
      // Webrahmen mit gespannten Fäden
      gestell(bx, by, bw, bh * 0.5);
      ctx.strokeStyle = '#cfd8e2';
      ctx.lineWidth = Math.max(0.4, bw * 0.035);
      ctx.beginPath();
      for (let i = 1; i < 6; i++) {
        ctx.moveTo(bx + bw * i / 6, by + bh * 0.06);
        ctx.lineTo(bx + bw * i / 6, by + bh * 0.5);
      }
      ctx.stroke();
      // Wollballen
      stapel(bx, by + bh * 0.9, Math.max(1.8, bw * 0.17), 2, 3, '#f3f0e6', '#dcd6c4');
    });
  },

  schneiderei(geb, st, x, y, w, h) {
    werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
      // Wäscheleine mit Kleidungsstücken
      ctx.strokeStyle = '#8a7a60';
      ctx.lineWidth = Math.max(0.4, bw * 0.035);
      ctx.beginPath();
      ctx.moveTo(bx, by + bh * 0.16); ctx.lineTo(bx + bw, by + bh * 0.16);
      ctx.stroke();
      const hemd = (hx, f) => {
        ctx.fillStyle = f;
        ctx.fillRect(hx, by + bh * 0.18, bw * 0.24, bh * 0.3);
        ctx.fillRect(hx - bw * 0.06, by + bh * 0.2, bw * 0.36, bh * 0.1);
      };
      hemd(bx + bw * 0.1, '#4a6fa5');
      hemd(bx + bw * 0.58, '#b5495b');
      // Stoffballen
      ctx.fillStyle = '#d8c7a2';
      ctx.fillRect(bx + bw * 0.1, by + bh * 0.62, bw * 0.8, bh * 0.14);
      ctx.fillStyle = '#6a8fb5';
      ctx.fillRect(bx + bw * 0.1, by + bh * 0.78, bw * 0.8, bh * 0.14);
    });
  },

  tabakladen(geb, st, x, y, w, h) {
    werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
      gestell(bx, by, bw, bh * 0.5);
      ctx.fillStyle = '#8a5a2c';                        // trocknende Blätter
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(bx + bw * (0.16 + i * 0.22), by + bh * 0.3, bw * 0.08, bh * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // Fässer mit Tabakwaren
      stapel(bx, by + bh * 0.9, Math.max(1.6, bw * 0.16), 2, 3, '#9c6b3e', '#c99a63');
    });
  },

  schaffarm(geb, st, x, y, w, h) {
    bauScheune(geb, st, x, y, w * 0.56, h * 0.94);
    koppel(x + w * 0.58, y + h * 0.26, w * 0.4, h * 0.64, 3, '#f5f2e8', null);
  },

  rinderfarm(geb, st, x, y, w, h) {
    bauScheune(geb, st, x, y, w * 0.56, h * 0.94);
    koppel(x + w * 0.58, y + h * 0.26, w * 0.4, h * 0.64, 2, '#7d4f33', '#f0ece2');
  },

  getreidefarm(geb, st, x, y, w, h) {
    bauScheune(geb, st, x, y, w * 0.6, h * 0.94);
    const bx = x + w * 0.62, by = y + h * 0.3, bw = w * 0.36, bh = h * 0.6;
    // Garben an die Wand gelehnt
    ctx.fillStyle = '#d9b457';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(bx + bw * (0.12 + i * 0.3), by + bh);
      ctx.lineTo(bx + bw * (0.26 + i * 0.3), by + bh * 0.25);
      ctx.lineTo(bx + bw * (0.34 + i * 0.3), by + bh);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#a07f3a';
    ctx.lineWidth = Math.max(0.5, w * 0.018);
    ctx.beginPath();
    ctx.moveTo(bx, by + bh * 0.66); ctx.lineTo(bx + bw, by + bh * 0.66);
    ctx.stroke();
  },

  zuckerrohr(geb, st, x, y, w, h) {
    bauScheune(geb, st, x, y, w * 0.6, h * 0.94);
    const bx = x + w * 0.62, by = y + h * 0.24, bw = w * 0.36, bh = h * 0.68;
    ctx.strokeStyle = '#6f9b3c';                        // gebündeltes Rohr
    ctx.lineWidth = Math.max(0.8, bw * 0.1);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      ctx.moveTo(bx + bw * (0.1 + i * 0.2), by + bh);
      ctx.lineTo(bx + bw * (0.18 + i * 0.2), by);
    }
    ctx.stroke();
    ctx.strokeStyle = '#8a6a44';
    ctx.lineWidth = Math.max(0.6, bw * 0.08);
    ctx.beginPath();
    ctx.moveTo(bx, by + bh * 0.55); ctx.lineTo(bx + bw, by + bh * 0.5);
    ctx.stroke();
  },

  tabakplantage(geb, st, x, y, w, h) {
    bauScheune(geb, st, x, y, w * 0.6, h * 0.94);
    const bx = x + w * 0.62, by = y + h * 0.26, bw = w * 0.36, bh = h * 0.62;
    gestell(bx, by, bw, bh * 0.9);
    ctx.fillStyle = '#9c6a30';
    for (let r = 0; r < 2; r++) for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(bx + bw * (0.22 + i * 0.28), by + bh * (0.26 + r * 0.42),
                  bw * 0.1, bh * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  },

  gewuerzplantage(geb, st, x, y, w, h) {
    bauScheune(geb, st, x, y, w * 0.6, h * 0.94);
    const bx = x + w * 0.62, by = y + h * 0.3, bw = w * 0.36, bh = h * 0.58;
    // Trockenmatte mit Gewürzen
    ctx.fillStyle = '#c9b48a';
    ctx.fillRect(bx, by, bw, bh * 0.4);
    const farben = ['#c0392b', '#e0871f', '#8a5a2c'];
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = farben[i];
      ctx.fillRect(bx + bw * (0.08 + i * 0.3), by + bh * 0.08, bw * 0.24, bh * 0.24);
    }
    // Säcke
    ctx.fillStyle = '#d6c69e';
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.ellipse(bx + bw * (0.3 + i * 0.4), by + bh * 0.76, bw * 0.17, bh * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = farben[i];
      ctx.fillRect(bx + bw * (0.22 + i * 0.4), by + bh * 0.56, bw * 0.16, bh * 0.1);
      ctx.fillStyle = '#d6c69e';
    }
  },

  eisenmine(geb, st, x, y, w, h) { mineZeichnen(st, x, y, w, h, '#9fb3c8', '#6d7d8e'); },
  goldmine(geb, st, x, y, w, h) { mineZeichnen(st, x, y, w, h, '#e9c04a', '#b8882a'); },

  ziegelei(geb, st, x, y, w, h) {
    werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
      // Brennofen als Kuppel mit Feuerloch
      const ox = bx + bw * 0.5, oy = by + bh * 0.42;
      ctx.beginPath();
      ctx.arc(ox, oy, bw * 0.42, Math.PI, 0);
      ctx.rect(ox - bw * 0.42, oy, bw * 0.84, bh * 0.4);
      ctx.fillStyle = '#9c6b4a'; ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(ox + bw * 0.2, oy, bw * 0.22, bh * 0.4);
      ctx.fillStyle = '#e8781f';
      ctx.fillRect(ox - bw * 0.14, oy + bh * 0.16, bw * 0.28, bh * 0.2);
      rauchFahne(ox, oy - bw * 0.42, bw * 0.22);
      // Ziegelstapel
      ctx.fillStyle = '#b45a3c';
      for (let r = 0; r < 3; r++)
        ctx.fillRect(bx, by + bh * (0.86 - r * 0.1), bw * 0.5, bh * 0.08);
    }, { hausBreite: 0.42 });
  },

  baeckerei(geb, st, x, y, w, h) {
    werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
      // Kuppelofen
      const ox = bx + bw * 0.46, oy = by + bh * 0.48;
      ctx.beginPath();
      ctx.arc(ox, oy, bw * 0.4, Math.PI, 0);
      ctx.rect(ox - bw * 0.4, oy, bw * 0.8, bh * 0.34);
      ctx.fillStyle = '#b08462'; ctx.fill();
      ctx.fillStyle = '#e8781f';
      ctx.fillRect(ox - bw * 0.14, oy + bh * 0.12, bw * 0.28, bh * 0.18);
      rauchFahne(ox, oy - bw * 0.4, bw * 0.2);
      // Brote auf dem Brett
      ctx.fillStyle = '#8a6a44';
      ctx.fillRect(bx, by + bh * 0.88, bw, bh * 0.07);
      ctx.fillStyle = '#d7a556';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(bx + bw * (0.2 + i * 0.3), by + bh * 0.84, bw * 0.11, bh * 0.06, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }, { hausBreite: 0.44 });
  },

  brennerei(geb, st, x, y, w, h) {
    werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
      // Kupferkessel mit Rohr
      ctx.beginPath();
      ctx.arc(bx + bw * 0.46, by + bh * 0.46, bw * 0.34, 0, Math.PI * 2);
      ctx.fillStyle = '#c47a3c'; ctx.fill();
      ctx.beginPath();
      ctx.arc(bx + bw * 0.34, by + bh * 0.36, bw * 0.12, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
      ctx.strokeStyle = '#8a5428';
      ctx.lineWidth = Math.max(0.8, bw * 0.1);
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.46, by + bh * 0.12); ctx.lineTo(bx + bw * 0.46, by);
      ctx.stroke();
      // Fässer
      stapel(bx, by + bh * 0.94, Math.max(1.8, bw * 0.18), 1, 3, '#9c6b3e', '#c99a63');
    }, { schornstein: true, rauch: true, hausBreite: 0.46 });
  },

  schmiede(geb, st, x, y, w, h) { schmiedeZeichnen(geb, st, x, y, w, h, 'werkzeug'); },
  waffenschmiede(geb, st, x, y, w, h) { schmiedeZeichnen(geb, st, x, y, w, h, 'waffe'); },
  goldschmiede(geb, st, x, y, w, h) { schmiedeZeichnen(geb, st, x, y, w, h, 'gold'); },
};

// Bergwerk: Stollen im Fels, Lore und sichtbare Erzadern
function mineZeichnen(st, x, y, w, h, erzHell, erzDunkel) {
  ctx.beginPath();
  ctx.moveTo(x + w * 0.06, y + h * 0.92);
  ctx.lineTo(x + w * 0.3, y + h * 0.16);
  ctx.lineTo(x + w * 0.54, y + h * 0.44);
  ctx.lineTo(x + w * 0.74, y + h * 0.1);
  ctx.lineTo(x + w * 0.96, y + h * 0.92);
  ctx.closePath();
  ctx.fillStyle = '#8e857a'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + w * 0.3, y + h * 0.16);
  ctx.lineTo(x + w * 0.54, y + h * 0.44);
  ctx.lineTo(x + w * 0.42, y + h * 0.92);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fill();
  // Erzader quer durch den Fels
  ctx.strokeStyle = erzDunkel;
  ctx.lineWidth = Math.max(1.4, w * 0.075);
  ctx.beginPath();
  ctx.moveTo(x + w * 0.12, y + h * 0.6);
  ctx.quadraticCurveTo(x + w * 0.5, y + h * 0.42, x + w * 0.9, y + h * 0.58);
  ctx.stroke();
  ctx.strokeStyle = erzHell;
  ctx.lineWidth = Math.max(0.8, w * 0.04);
  ctx.stroke();
  // Stollen mit Holzrahmen
  ctx.fillStyle = '#2b241d';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.38, y + h * 0.92);
  ctx.lineTo(x + w * 0.38, y + h * 0.7);
  ctx.arc(x + w * 0.5, y + h * 0.7, w * 0.12, Math.PI, 0);
  ctx.lineTo(x + w * 0.62, y + h * 0.92);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7a5f3c';
  ctx.lineWidth = Math.max(1, w * 0.045);
  ctx.beginPath();
  ctx.moveTo(x + w * 0.34, y + h * 0.94); ctx.lineTo(x + w * 0.34, y + h * 0.68);
  ctx.lineTo(x + w * 0.66, y + h * 0.68); ctx.lineTo(x + w * 0.66, y + h * 0.94);
  ctx.stroke();
  // Volle Lore davor
  ctx.fillStyle = '#6b5a46';
  ctx.fillRect(x + w * 0.04, y + h * 0.8, w * 0.24, h * 0.12);
  ctx.fillStyle = erzHell;
  ctx.beginPath();
  ctx.ellipse(x + w * 0.16, y + h * 0.79, w * 0.1, h * 0.05, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#4a4038';
  for (const rx of [0.08, 0.22]) {
    ctx.beginPath();
    ctx.arc(x + w * rx, y + h * 0.93, Math.max(0.8, w * 0.035), 0, Math.PI * 2);
    ctx.fill();
  }
  if (st.fahne) fahnenmast(x + w * 0.86, y + h * 0.46, h * 0.24, st.gold);
}

// Schmiede: Werkstatt mit glühender Esse, Amboss und Zunftzeichen
function schmiedeZeichnen(geb, st, x, y, w, h, art) {
  werkHof(geb, st, x, y, w, h, (bx, by, bw, bh) => {
    // Offene Esse mit Glut
    ctx.fillStyle = '#6b5a46';
    ctx.fillRect(bx + bw * 0.1, by + bh * 0.24, bw * 0.8, bh * 0.36);
    const glut = 0.55 + Math.sin(performance.now() / 260) * 0.3;
    ctx.globalAlpha = glut;
    ctx.fillStyle = '#ff8a2b';
    ctx.fillRect(bx + bw * 0.24, by + bh * 0.32, bw * 0.52, bh * 0.2);
    ctx.globalAlpha = 1;
    rauchFahne(bx + bw * 0.5, by + bh * 0.24, bw * 0.18);
    // Amboss
    ctx.fillStyle = '#4e5056';
    ctx.fillRect(bx + bw * 0.2, by + bh * 0.74, bw * 0.6, bh * 0.1);
    ctx.fillRect(bx + bw * 0.38, by + bh * 0.84, bw * 0.24, bh * 0.14);
    // Zunftzeichen: Werkzeug, Waffe oder Goldbarren
    if (art === 'gold') {
      ctx.fillStyle = '#e9c04a';
      ctx.fillRect(bx + bw * 0.16, by + bh * 0.1, bw * 0.3, bh * 0.1);
      ctx.fillRect(bx + bw * 0.5, by + bh * 0.1, bw * 0.3, bh * 0.1);
      ctx.fillRect(bx + bw * 0.33, by, bw * 0.3, bh * 0.1);
    } else if (art === 'waffe') {
      ctx.strokeStyle = '#c3cbd3';
      ctx.lineWidth = Math.max(0.9, bw * 0.1);
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.14, by + bh * 0.2); ctx.lineTo(bx + bw * 0.86, by + bh * 0.02);
      ctx.moveTo(bx + bw * 0.14, by + bh * 0.02); ctx.lineTo(bx + bw * 0.86, by + bh * 0.2);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#8a6a44';
      ctx.lineWidth = Math.max(0.9, bw * 0.1);
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.16, by + bh * 0.2); ctx.lineTo(bx + bw * 0.7, by + bh * 0.06);
      ctx.stroke();
      ctx.fillStyle = '#c3cbd3';
      ctx.fillRect(bx + bw * 0.62, by, bw * 0.3, bh * 0.14);
    }
  }, { hausBreite: 0.46, schornstein: true, rauch: false });
}

// Einstieg aus der Zeichenschleife
function gebaeudeZeichnen(geb, def, px0, py0, bw0, bh0) {
  const ausbau = Math.max(1, Math.min(AUSBAU_MAX, geb.ausbau || 1));
  // Mit jeder Ausbaustufe füllt das Bauwerk die Kachel etwas mehr aus.
  // Der Abstand hängt an der Kachelgröße, nicht an der Gebäudegröße –
  // sonst bekämen große Bauwerke einen übertrieben breiten Rand.
  const rand = T * (0.15 - 0.013 * (ausbau - 1));
  const x = px0 + rand, y = py0 + rand;
  const w = bw0 - rand * 2, h = bh0 - rand * 2;
  const st = stilVon(geb);

  // Die Brücke liegt flach auf der Kachel und braucht weder Rand
  // noch Schatten – sie soll ja beide Ufer berühren.
  if (geb.typ === 'bruecke') {
    BAU_ZEICHNER.bruecke(geb, st, px0, py0, bw0, bh0);
    return;
  }

  bodenFleck(x, y, w, h);
  schlagschatten(x, y, w, h);

  const zeichner = BAU_ZEICHNER[geb.typ];
  if (zeichner) zeichner(geb, st, x, y, w, h);
  else if (FELD_FARMEN.has(geb.typ)) bauScheune(geb, st, x, y, w, h);
  else bauWerkstatt(geb, st, x, y, w, h);
}

function zeichnen() {
  // Leinwandgröße an das Fenster anpassen (inkl. HiDPI)
  dpr = window.devicePixelRatio || 1;
  const b = leinwand.clientWidth, h = leinwand.clientHeight;
  if (leinwand.width !== b * dpr || leinwand.height !== h * dpr) {
    leinwand.width = b * dpr; leinwand.height = h * dpr;
  }

  if (state.terrainAlt) terrainZeichnen();
  else if (schmutzKacheln.size) kachelnAuffrischen();

  // Hintergrund: tiefes Meer
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#1a4764';
  ctx.fillRect(0, 0, b, h);

  // Ab hier in Weltkoordinaten zeichnen
  const z = kamera.zoom;
  ctx.setTransform(dpr * z, 0, 0, dpr * z, -kamera.x * dpr * z, -kamera.y * dpr * z);
  ctx.imageSmoothingEnabled = true;
  // Terrain-Puffer (TP px je Kachel) auf Weltgröße (T px je Kachel) skalieren
  ctx.drawImage(terrainPuffer, 0, 0, N * TP, N * TP, 0, 0, N * T, N * T);

  // Gitterlinien nur beim Bauen einblenden
  const bauModus = state.werkzeug !== 'zeiger' && state.werkzeug !== 'abriss';
  if (bauModus) {
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1 / z;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      ctx.moveTo(i * T, 0); ctx.lineTo(i * T, N * T);
      ctx.moveTo(0, i * T); ctx.lineTo(N * T, i * T);
    }
    ctx.stroke();
  }

  // --- Felder der Farmen (liegen unter den Gebäuden) ---
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const geb of gebaeude) {
    if (!geb.felder || !geb.felder.length) continue;
    const [farbe, symbol] = FELD_DEKO[geb.typ];
    for (const idx of geb.felder) {
      const fx = (idx % N) * T, fy = ((idx / N) | 0) * T;
      // Ackergrund
      ctx.fillStyle = farbe;
      rundRect(ctx, fx + 1, fy + 1, T - 2, T - 2, 3);
      ctx.fill();
      // Gepflügte Reihen
      ctx.strokeStyle = 'rgba(120,95,60,0.35)';
      ctx.lineWidth = Math.max(1, T * 0.04);
      ctx.beginPath();
      for (let i = 1; i < 5; i++) {
        ctx.moveTo(fx + 2, fy + (T / 5) * i);
        ctx.lineTo(fx + T - 2, fy + (T / 5) * i);
      }
      ctx.stroke();
    }
    ctx.font = `${T * 0.34}px sans-serif`;
    for (const idx of geb.felder) {
      const fx = (idx % N) * T, fy = ((idx / N) | 0) * T;
      ctx.fillText(symbol, fx + T / 2, fy + T / 2 + 1);
    }
  }

  // --- Gebäude ---
  for (const geb of gebaeude) {
    const def = GEBAEUDE[geb.typ];
    const px = geb.x * T, py = geb.y * T, bw = def.w * T, bh = def.h * T;

    // Das Bauwerk selbst
    gebaeudeZeichnen(geb, def, px, py, bw, bh);

    // Lebensbalken, sobald ein Gebäude beschädigt ist
    if (geb.hp < geb.maxHp) {
      const anteil = Math.max(0, geb.hp / geb.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(px + 4, py + bh - 8, bw - 8, 4);
      ctx.fillStyle = anteil > 0.5 ? '#16a34a' : anteil > 0.25 ? '#f59e0b' : '#dc2626';
      ctx.fillRect(px + 4, py + bh - 8, (bw - 8) * anteil, 4);
    }

    // Besitzer-Fähnchen: farbiger Punkt oben links
    ctx.beginPath();
    ctx.arc(px + 7, py + 7, 4, 0, Math.PI * 2);
    ctx.fillStyle = spieler[geb.spieler].farbe;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Bedürfnis-Punkt an jedem Wohnhaus: grün = zufrieden, rot = nicht.
    // Unzufriedene Häuser senden zusätzlich einen pulsierenden Ring aus.
    if (geb.typ === 'wohnhaus') {
      if (!geb.zufrieden) {
        const puls = (performance.now() % 1100) / 1100;
        ctx.beginPath();
        ctx.arc(px + bw - 7, py + 7, 4.5 + puls * 10, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(220,38,38,${(1 - puls) * 0.9})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(px + bw - 7, py + 7, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = geb.zufrieden ? '#16a34a' : '#dc2626';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    // Auswahl-Rahmen
    if (state.auswahl === geb) {
      rundRect(ctx, px + 1, py + 1, bw - 2, bh - 2, 7);
      ctx.strokeStyle = '#16a34a';
      ctx.lineWidth = 3 / Math.sqrt(z);
      ctx.stroke();
    }
  }

  // --- Heere und Flotten ---
  for (const t of truppen) {
    const px = t.x * T, py = t.y * T;
    const farbe = spieler[t.spieler].farbe;
    const gr = truppGroesse(t);

    // Im Gefecht pulsiert ein roter Ring um den Stapel
    if (t.kampf) {
      const puls = (performance.now() % 900) / 900;
      ctx.beginPath();
      ctx.arc(px, py, T * 0.45 + puls * T * 0.45, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(220,38,38,${(1 - puls) * 0.9})`;
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    rundRect(ctx, px - T * 0.42, py - T * 0.42, T * 0.84, T * 0.84, 7);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fill();
    ctx.strokeStyle = farbe;
    ctx.lineWidth = state.truppAuswahl === t ? 4 : 2.5;
    ctx.stroke();

    ctx.font = `${T * 0.4}px sans-serif`;
    ctx.fillText(t.art === 'flotte' ? '🚢' : '⚔️', px, py - T * 0.1);
    ctx.font = `bold ${T * 0.3}px system-ui, sans-serif`;
    ctx.fillStyle = '#1f2937';
    ctx.fillText(Math.round(gr) + (t.fracht > 0 ? '+' + Math.round(t.fracht) : ''),
                 px, py + T * 0.24);
    // Kanonen als kleine Punkte am oberen Rand des Stapels
    if (t.kanonen > 0) {
      ctx.fillStyle = '#b45309';
      for (let i = 0; i < t.kanonen; i++) {
        ctx.beginPath();
        ctx.arc(px - T * 0.2 + i * T * 0.14, py - T * 0.33, T * 0.05, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Marschziel der ausgewählten Truppe als Linie andeuten
  if (state.truppAuswahl && state.truppAuswahl.pfad.length) {
    const tA = state.truppAuswahl, zielP = tA.pfad[tA.pfad.length - 1];
    ctx.beginPath();
    ctx.moveTo(tA.x * T, tA.y * T);
    ctx.lineTo(zielP.x * T, zielP.y * T);
    ctx.strokeStyle = 'rgba(22,163,74,0.6)';
    ctx.lineWidth = 2.5 / Math.sqrt(z);
    ctx.setLineDash([8 / z, 6 / z]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // --- Das Schiff (leicht auf den Wellen schaukelnd) ---
  if (schiff.pfad.length) {   // Ziel-Fähnchen, solange gesegelt wird
    const zielP = schiff.pfad[schiff.pfad.length - 1];
    ctx.font = `${T * 0.5}px sans-serif`;
    ctx.fillText('🚩', zielP.x * T, zielP.y * T - 6);
  }
  const wippen = Math.sin(performance.now() / 650) * 1.5;
  // Zuerst die Schiffe der Gegner (mit farbigem Wimpel)
  for (const sp of spieler) {
    if (!sp.ki || !sp.schiff || sp.kontor) continue;
    segelschiff(sp.schiff.x * T, sp.schiff.y * T, T * 0.9, sp.farbe, wippen);
  }
  segelschiff(schiff.x * T, schiff.y * T, T * 1.05,
              spieler[ICH] && spieler[ICH].farbe, wippen);

  // Beim Kontor-Bau: Baureichweite rund ums Schiff anzeigen
  if (state.werkzeug === 'kontor')
    kreisZeichnen({ x: schiff.x, y: schiff.y }, SIM.schiffBauRadius);

  // Wirkungskreis des ausgewählten Gebäudes
  if (state.auswahl) {
    const def = GEBAEUDE[state.auswahl.typ];
    const radius = def.marktRadius || def.radius;
    if (radius && !FELD_FARMEN.has(state.auswahl.typ))
      kreisZeichnen(zentrum(state.auswahl), radius);
  }

  // --- Bau-Vorschau: schwebende (angetippte) Position oder Mauszeiger ---
  if (bauModus) {
    let t = null;
    if (state.vorschau && state.vorschau.modus === 'bau')
      t = { x: state.vorschau.tx, y: state.vorschau.ty };
    else if (state.hover)
      t = bildschirmZuKachel(state.hover.sx, state.hover.sy);
    if (t) {
      const def = GEBAEUDE[state.werkzeug];
      const a = ankerVon(state.werkzeug, t.x, t.y);
      const ok = platzOK(state.werkzeug, a.x, a.y).ok && kostenReichen(state.werkzeug);
      const radius = def.marktRadius || def.radius;
      if (radius && !FELD_FARMEN.has(state.werkzeug))
        kreisZeichnen({ x: a.x + def.w / 2, y: a.y + def.h / 2 }, radius);

      // Bei Farmen: die künftigen Felder im 3×3 einblenden
      if (FELD_FARMEN.has(state.werkzeug)) {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const fx = a.x + dx, fy = a.y + dy;
          const k = kachel(fx, fy);
          if (!k) continue;
          const frei = k.typ === 'gras' && !belegtAuf(fx, fy);
          ctx.fillStyle = frei ? 'rgba(22,163,74,0.30)' : 'rgba(90,90,90,0.30)';
          ctx.fillRect(fx * T + 2, fy * T + 2, T - 4, T - 4);
        }
      }

      rundRect(ctx, a.x * T + 2, a.y * T + 2, def.w * T - 4, def.h * T - 4, 6);
      ctx.fillStyle = ok ? 'rgba(22,163,74,0.35)' : 'rgba(220,38,38,0.35)';
      ctx.fill();
      ctx.strokeStyle = ok ? '#16a34a' : '#dc2626';
      ctx.lineWidth = 2 / Math.sqrt(z);
      ctx.stroke();
      ctx.font = `${Math.min(def.w, def.h) * T * 0.55}px sans-serif`;
      ctx.globalAlpha = 0.85;
      ctx.fillText(def.emoji, (a.x + def.w / 2) * T, (a.y + def.h / 2) * T);
      ctx.globalAlpha = 1;

      // Voraussichtliche Auslastung direkt an der Vorschau anzeigen
      const effWert = effVorschau(state.werkzeug, a.x, a.y);
      if (effWert !== null) {
        const prozent = Math.round(effWert * 100);
        const groesse = 15 / Math.sqrt(z);
        ctx.font = `bold ${groesse}px system-ui, sans-serif`;
        const tx = (a.x + def.w / 2) * T, ty = a.y * T - groesse * 0.7;
        ctx.lineWidth = groesse * 0.28;
        ctx.strokeStyle = 'rgba(17,24,39,0.75)';
        ctx.strokeText(prozent + ' %', tx, ty);
        ctx.fillStyle = prozent >= 80 ? '#86efac' : prozent >= 40 ? '#fde68a' : '#fca5a5';
        ctx.fillText(prozent + ' %', tx, ty);
      }
    }
  }

  // Abriss-Vorschau: gewähltes bzw. überfahrenes Gebäude rot einfärben
  if (state.werkzeug === 'abriss') {
    let geb = null;
    if (state.vorschau && state.vorschau.modus === 'abriss') geb = state.vorschau.geb;
    else if (state.hover) {
      const t = bildschirmZuKachel(state.hover.sx, state.hover.sy);
      geb = t && belegtAuf(t.x, t.y);
    }
    if (geb) {
      const def = GEBAEUDE[geb.typ];
      rundRect(ctx, geb.x * T + 2, geb.y * T + 2, def.w * T - 4, def.h * T - 4, 6);
      ctx.fillStyle = 'rgba(220,38,38,0.4)';
      ctx.fill();
    }
  }
}

// Halbtransparenter Wirkungskreis (für Reichweiten)
function kreisZeichnen(mitte, radius) {
  ctx.beginPath();
  ctx.arc(mitte.x * T, mitte.y * T, radius * T, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(22,163,74,0.08)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(22,163,74,0.55)';
  ctx.lineWidth = 2 / kamera.zoom;
  ctx.setLineDash([6 / kamera.zoom, 5 / kamera.zoom]);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- 8. KAMERA & EINGABE ------------------------------- */

function bildschirmZuWelt(sx, sy) {
  return { x: sx / kamera.zoom + kamera.x, y: sy / kamera.zoom + kamera.y };
}
function bildschirmZuKachel(sx, sy) {
  const w = bildschirmZuWelt(sx, sy);
  const x = Math.floor(w.x / T), y = Math.floor(w.y / T);
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  return { x, y };
}

function kameraBegrenzen() {
  const sb = leinwand.clientWidth / kamera.zoom;   // sichtbare Weltbreite
  const sh = leinwand.clientHeight / kamera.zoom;
  const rand = 6 * T; // etwas Meer am Rand erlauben
  kamera.x = Math.min(Math.max(kamera.x, -rand), N * T + rand - sb);
  kamera.y = Math.min(Math.max(kamera.y, -rand), N * T + rand - sh);
}

function zoomAuf(sx, sy, faktor) {
  const vorher = bildschirmZuWelt(sx, sy);
  kamera.zoom = Math.min(2.6, Math.max(0.07, kamera.zoom * faktor));
  // Der Punkt unter dem Mauszeiger bleibt an Ort und Stelle
  kamera.x = vorher.x - sx / kamera.zoom;
  kamera.y = vorher.y - sy / kamera.zoom;
  kameraBegrenzen();
}

// --- Zeiger-Ereignisse (Maus und Touch gemeinsam) ---
const zeiger = new Map();       // aktive Finger/Maustasten
let ziehStart = null;           // Startpunkt fürs Verschieben
let gezogen = false;            // wurde wirklich gezogen (kein Klick)?
let pinchAbstand = 0;

leinwand.addEventListener('pointerdown', e => {
  leinwand.setPointerCapture(e.pointerId);
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (zeiger.size === 1) {
    ziehStart = { sx: e.clientX, sy: e.clientY, kx: kamera.x, ky: kamera.y };
    gezogen = false;
  } else if (zeiger.size === 2) {
    const [a, b] = [...zeiger.values()];
    pinchAbstand = Math.hypot(a.x - b.x, a.y - b.y);
  }
});

leinwand.addEventListener('pointermove', e => {
  state.hover = { sx: e.clientX, sy: e.clientY };
  if (!zeiger.has(e.pointerId)) return;
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (zeiger.size === 1 && ziehStart) {
    const dx = e.clientX - ziehStart.sx, dy = e.clientY - ziehStart.sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) gezogen = true;
    if (gezogen) {
      kamera.x = ziehStart.kx - dx / kamera.zoom;
      kamera.y = ziehStart.ky - dy / kamera.zoom;
      kameraBegrenzen();
      leinwand.classList.add('ziehen');
    }
  } else if (zeiger.size === 2) {
    // Zwei Finger: Zoomen (Pinch)
    const [a, b] = [...zeiger.values()];
    const abstand = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchAbstand > 0) {
      zoomAuf((a.x + b.x) / 2, (a.y + b.y) / 2, abstand / pinchAbstand);
    }
    pinchAbstand = abstand;
  }
});

function zeigerEnde(e) {
  const warEinzeln = zeiger.size === 1;
  zeiger.delete(e.pointerId);
  if (warEinzeln && !gezogen && ziehStart) klickAufKarte(e.clientX, e.clientY);
  if (zeiger.size === 0) { ziehStart = null; leinwand.classList.remove('ziehen'); }
  pinchAbstand = 0;
}
leinwand.addEventListener('pointerup', zeigerEnde);
leinwand.addEventListener('pointercancel', zeigerEnde);

// Ein Klick (kein Ziehen) auf die Karte
function klickAufKarte(sx, sy) {
  if (state.vorbei) return;
  const t = bildschirmZuKachel(sx, sy);

  // Liegt dort eine eigene Truppe (z. B. eine Flotte auf dem Wasser),
  // hat sie Vorrang vor dem Handelsschiff – sonst würde beim Tippen
  // auf die eigenen Kriegsschiffe immer das Handelsschiff lossegeln.
  const truppeDort = t && truppeBei(t.x, t.y, ICH);

  // Tipp aufs Wasser: das Handelsschiff segelt dorthin. Mit dem
  // Zeiger-Werkzeug geht das jederzeit, vor dem Kontor-Bau mit jedem.
  if (t && kachel(t.x, t.y).typ === 'wasser' && !state.truppAuswahl && !truppeDort &&
      (state.werkzeug === 'zeiger' || !state.kontorGebaut)) {
    if (istGast()) {
      befehlSenden({ art: 'schiff', tx: t.x, ty: t.y });
      state.auswahl = null; panelZeigen();
      return;
    }
    const weg = segelWeg(t.x, t.y);
    if (weg) {
      schiff.pfad = weg;
      if (!state.kontorGebaut) melden('⛵ Leinen los!', 'segeln');
    } else melden('Dorthin führt kein Seeweg');
    state.auswahl = null; panelZeigen();
    return;
  }

  if (state.werkzeug === 'zeiger') {
    // Ist eine eigene Truppe ausgewählt, gilt der Tipp als Befehl
    if (state.truppAuswahl && t && truppeBei(t.x, t.y, ICH) !== state.truppAuswahl) {
      const plan = befehlPlanen(state.truppAuswahl, t.x, t.y);
      state.vorschau = { modus: 'befehl', truppe: state.truppAuswahl, plan,
                         tx: t.x, ty: t.y };
      bestaetigungZeigen();
      return;
    }
    // Nochmal auf die gewählte Truppe tippen: Auswahl aufheben
    if (state.truppAuswahl && t && truppeBei(t.x, t.y, ICH) === state.truppAuswahl) {
      truppAbwaehlen();
      return;
    }
    // Sonst: eigene Truppe auswählen …
    const eigene = t && truppeBei(t.x, t.y, ICH);
    if (eigene) {
      state.truppAuswahl = eigene;
      state.auswahl = null;
      state.vorschau = null; bestaetigungZeigen();
      panelZeigen();
      return;
    }
    // … oder wie gewohnt ein Gebäude
    state.truppAuswahl = null;
    state.auswahl = t ? belegtAuf(t.x, t.y) : null;
    panelZeigen();
  } else if (state.werkzeug === 'abriss') {
    // Nicht sofort abreißen – erst die Bestätigung einholen
    const geb = t && belegtAuf(t.x, t.y);
    if (geb && geb.spieler !== ICH) {
      melden(`Das gehört ${spieler[geb.spieler].name}!`);
      state.vorschau = null;
    } else {
      state.vorschau = geb ? { modus: 'abriss', geb } : null;
    }
    bestaetigungZeigen();
  } else if (t) {
    // Nicht sofort bauen – die Vorschau wartet auf den ✓-Knopf.
    // Erneutes Tippen an anderer Stelle verschiebt die Vorschau.
    state.vorschau = { modus: 'bau', typ: state.werkzeug, tx: t.x, ty: t.y };
    bestaetigungZeigen();
  }
}

// --- Befehl für die ausgewählte Truppe planen ---
// Liefert Beschreibung und Aktion, damit die Bestätigungsleiste vorher
// zeigt, was passieren wird (kein versehentlicher Angriff).
function befehlPlanen(t, tx, ty, sid = ICH) {
  const k = kachel(tx, ty);
  if (!k) return { ok: false, text: 'Außerhalb der Karte' };
  const gegner = truppeBei(tx, ty);
  const geb = belegtAuf(tx, ty);

  // Eigene Truppe derselben Art → vereinigen
  if (gegner && gegner !== t && gegner.spieler === sid && gegner.art === t.art)
    return { ok: true, aktion: 'vereinigen', ziel: gegner,
             text: `Truppen vereinigen (${Math.round(truppGroesse(t))} + ${Math.round(truppGroesse(gegner))})` };

  // Heer auf eigene Flotte → einschiffen
  if (t.art === 'heer' && gegner && gegner.spieler === sid && gegner.art === 'flotte') {
    if (Math.hypot(t.x - gegner.x, t.y - gegner.y) > 2.6)
      return { ok: false, text: 'Zu weit von der Flotte – erst ans Ufer marschieren' };
    return { ok: true, aktion: 'einschiffen', ziel: gegner,
             text: `${Math.round(t.mann)} Mann einschiffen` };
  }

  // Flotte auf Land getippt – aber ein feindliches Gebäude dort hat
  // Vorrang (dann wird bombardiert, siehe weiter unten)
  if (t.art === 'flotte' && k.typ !== 'wasser' && !(geb && geb.spieler !== sid)) {
    // Mit Truppen an Bord und nah genug: anlanden
    if (t.fracht >= 1 && landFrei(ty * N + tx) &&
        Math.hypot(t.x - (tx + 0.5), t.y - (ty + 0.5)) <= 2.6)
      return { ok: true, aktion: 'anlanden', tx, ty,
               text: `🏖️ ${Math.round(t.fracht)} Mann an Land setzen` };
    // Sonst: vor diese Küste segeln (nächstes freies Wasser ansteuern)
    const hafen = freiesFeldNeben(tx + 0.5, ty + 0.5, seeFrei);
    if (!hafen) return { ok: false, text: 'Dort kommt kein Schiff hin' };
    const seeweg = truppWeg(t, Math.floor(hafen.x), Math.floor(hafen.y));
    if (!seeweg) return { ok: false, text: 'Dorthin führt kein Seeweg' };
    return { ok: true, aktion: 'marsch', weg: seeweg,
             text: t.fracht >= 1
               ? `🚢 Vor die Küste segeln – dort dann erneut auf Land tippen zum Anlanden`
               : '🚢 Vor diese Küste segeln' };
  }

  // Angriff auf feindliche Truppe gleicher Art
  if (gegner && gegner.spieler !== sid && gegner.art === t.art) {
    const weg = truppWeg(t, Math.floor(gegner.x), Math.floor(gegner.y));
    if (!weg) return { ok: false, text: 'Dorthin führt kein Weg' };
    const chance = staerke(t) / (staerke(t) + staerke(gegner));
    const urteil = chance > 0.65 ? 'gute Aussichten'
                 : chance > 0.45 ? 'offener Ausgang' : '⚠️ unterlegen!';
    const warnung = imKriegMit(sid, gegner.spieler) ? ''
      : '<br><span class="grund">⚠️ Ohne Kriegserklärung – das bringt alle Nachbarn gegen dich auf!</span>';
    return { ok: true, aktion: 'marsch', weg, gegen: gegner.spieler,
             text: `${t.art === 'flotte' ? '🌊 Seeschlacht' : '⚔️ Angriff'} auf ${spieler[gegner.spieler].name}: ` +
                   `<b>${Math.round(staerke(t))}</b> gegen <b>${Math.round(staerke(gegner))}</b> – ${urteil}` + warnung };
  }

  // Angriff auf ein feindliches Gebäude
  if (geb && geb.spieler !== sid) {
    let weg = truppWeg(t, tx, ty);
    if (!weg) {
      const f = freiesFeldNeben(tx, ty, t.art === 'flotte' ? seeFrei : landFrei);
      if (f) weg = truppWeg(t, Math.floor(f.x), Math.floor(f.y));
    }
    if (!weg) return { ok: false, text: 'Dorthin führt kein Weg' };
    const warnung2 = imKriegMit(sid, geb.spieler) ? ''
      : '<br><span class="grund">⚠️ Ohne Kriegserklärung – das bringt alle Nachbarn gegen dich auf!</span>';
    return { ok: true, aktion: 'marsch', weg, gegen: geb.spieler,
             text: `${geb.typ === 'kontor' ? '🚩 Kontor' : GEBAEUDE[geb.typ].name} von ` +
                   `${spieler[geb.spieler].name} angreifen` +
                   (geb.typ === 'kontor' ? ' – bei Erfolg fällt die ganze Insel!' : '') + warnung2 };
  }

  // Einfacher Marsch bzw. Fahrt
  const weg = truppWeg(t, tx, ty);
  if (!weg) return { ok: false, text: t.art === 'flotte'
    ? 'Dorthin führt kein Seeweg' : 'Dorthin führt kein Landweg (Fluss ohne Brücke?)' };
  return { ok: true, aktion: 'marsch', weg,
           text: t.art === 'flotte' ? '🚢 Dorthin segeln' : '⚔️ Dorthin marschieren' };
}

function befehlAusfuehren(v) {
  const t = v.truppe, plan = v.plan;
  if (!truppen.includes(t) || !plan.ok) return;
  if (istGast() && t.spieler === ICH)
    return befehlSenden({ art: 'truppe', id: t.id, tx: v.tx, ty: v.ty });
  if (plan.aktion === 'marsch') {
    // Ein bewusster Angriffsbefehl eröffnet den Krieg – ohne
    // Erklärung gilt er als Überfall (die Leiste hat gewarnt)
    if (plan.gegen !== undefined && !imKriegMit(ICH, plan.gegen))
      kriegshandlung(ICH, plan.gegen);
    t.pfad = plan.weg;
  }
  else if (plan.aktion === 'vereinigen') {
    const z = plan.ziel;
    if (t.art === 'flotte') {
      z.kanonen = Math.round(((z.kanonen || 0) * z.schiffe + (t.kanonen || 0) * t.schiffe) /
                             Math.max(1, z.schiffe + t.schiffe));
      z.schiffe += t.schiffe; z.fracht += t.fracht;
    }
    else z.mann += t.mann;
    truppen = truppen.filter(x => x !== t);
    state.truppAuswahl = z;
    melden('Truppen vereinigt');
  } else if (plan.aktion === 'einschiffen') {
    plan.ziel.fracht += t.mann;
    truppen = truppen.filter(x => x !== t);
    state.truppAuswahl = plan.ziel;
    melden('⚓ Truppen an Bord – jetzt eine fremde Küste ansteuern');
  } else if (plan.aktion === 'anlanden') {
    const neu = neueTruppe(t.spieler, 'heer', plan.tx + 0.5, plan.ty + 0.5);
    neu.mann = t.fracht;
    neu.moral = t.moral;
    t.fracht = 0;
    state.truppAuswahl = neu;
    melden('🏖️ Truppen sind gelandet!');
  }
}

// Tastatur: Pfeile/WASD verschieben, Leertaste pausiert, 1–3 Tempo, Esc Zeiger
window.addEventListener('keydown', e => {
  const schritt = 90 / kamera.zoom;
  switch (e.key) {
    case 'ArrowLeft':  case 'a': kamera.x -= schritt; kameraBegrenzen(); e.preventDefault(); break;
    case 'ArrowRight': case 'd': kamera.x += schritt; kameraBegrenzen(); e.preventDefault(); break;
    case 'ArrowUp':    case 'w': kamera.y -= schritt; kameraBegrenzen(); e.preventDefault(); break;
    case 'ArrowDown':  case 's': kamera.y += schritt; kameraBegrenzen(); e.preventDefault(); break;
    case ' ': pauseUmschalten(); e.preventDefault(); break;
    case '1': tempoSetzen(1); break;
    case '2': tempoSetzen(2); break;
    case '3': tempoSetzen(3); break;
    case 'Escape':
      werkzeugWaehlen('zeiger');
      state.auswahl = null; state.truppAuswahl = null; panelZeigen();
      break;
  }
});

const $ = id => document.getElementById(id);

// Baumenü aus dem Gebäudekatalog erzeugen
function menueBauen() {
  const menue = $('baumenue');
  menue.innerHTML = '';

  // Zeiger-Werkzeug (Auswählen)
  menue.appendChild(bauKnopf('zeiger', '👆', 'Auswählen', 'Gebäude anklicken für Details'));

  for (const gruppe of MENUE_GRUPPEN) {
    const kasten = document.createElement('div');
    kasten.className = 'bau-gruppe';
    kasten.innerHTML = `<span class="gruppe-titel">${gruppe.titel}</span>`;
    const reihe = document.createElement('div');
    reihe.className = 'gruppe-knoepfe';
    for (const typ of gruppe.typen) {
      const def = GEBAEUDE[typ];
      // Weitere Kontore besiedeln neue Inseln – gegen Ausbaugebühr
      const kostenText = Object.entries(gebKosten(typ, 0))
        .map(([ware, menge]) => `${WAREN_EMOJI[ware]}${menge}`).join(' ') || 'gratis';
      const knopf = bauKnopf(typ, def.emoji, def.name, def.beschr + ' – Kosten: ' + kostenText);
      knopf.dataset.kosten = kostenText;
      knopf.querySelector('.kosten').textContent = kostenText;
      reihe.appendChild(knopf);
    }
    kasten.appendChild(reihe);
    menue.appendChild(kasten);
  }

  // Abriss-Werkzeug
  menue.appendChild(bauKnopf('abriss', '🧨', 'Abreißen', 'Gebäude entfernen (halbe Kosten zurück)'));
  menueAktualisieren();
}

function bauKnopf(werkzeug, symbol, name, tipp) {
  const b = document.createElement('button');
  b.className = 'bau-knopf';
  b.dataset.werkzeug = werkzeug;
  b.title = tipp;
  b.innerHTML = `<span class="symbol">${symbol}</span><span class="name">${name}</span><span class="kosten"></span>`;
  b.addEventListener('click', () => bauKnopfKlick(werkzeug));
  return b;
}

// Klick auf einen Bauknopf: Wenn das Gebäude (noch) nicht gebaut werden
// kann, wird der Grund als Meldung angezeigt – wichtig auf dem Handy,
// wo es keine Maus-Tooltips gibt.
function bauKnopfKlick(werkzeug) {
  const def = GEBAEUDE[werkzeug];
  if (def) {
    if (!state.kontorGebaut && werkzeug !== 'kontor') {
      melden('⚓ Baue zuerst dein Kontor an der Küste!');
      return;
    }
    if (spieler[ICH].maxStufe < def.abStufe) {
      melden(`🔒 ${def.name}: wird erst freigeschaltet, wenn ein Haus zu ${STUFEN[def.abStufe].name}n aufgestiegen ist`);
      return;
    }
    if (!kostenReichen(werkzeug)) {
      const fehlt = Object.entries(gebKosten(werkzeug, 0))
        .filter(([ware, menge]) => res[ware] < menge)
        .map(([ware, menge]) => `${WAREN_EMOJI[ware]} ${Math.ceil(menge - res[ware])}`)
        .join(', ');
      melden(`${def.name}: es fehlt ${fehlt} – produzieren oder im Kontor kaufen`);
      return;
    }
  }
  werkzeugWaehlen(werkzeug);
}

function werkzeugWaehlen(werkzeug) {
  // Vor dem Kontor kann nur das Kontor gebaut werden
  if (!state.kontorGebaut && werkzeug !== 'kontor' && werkzeug !== 'zeiger') {
    melden('Baue zuerst dein Kontor an der Küste!');
    return;
  }
  state.werkzeug = werkzeug;
  state.vorschau = null;             // offene Bestätigung verwerfen
  bestaetigungZeigen();
  if (werkzeug !== 'zeiger') { state.auswahl = null; panelZeigen(); }
  leinwand.classList.toggle('bauen', werkzeug !== 'zeiger');
  menueAktualisieren();
}

// --- Bestätigungsleiste: erst antippen, dann mit ✓ bauen/abreißen ---
function bestaetigungZeigen() {
  const leiste = $('bestaetigung');
  const v = state.vorschau;
  if (!v) { leiste.style.display = 'none'; return; }
  leiste.style.display = 'flex';

  if (v.modus === 'befehl') {
    $('bestaetigung-text').innerHTML = v.plan.text;
    $('b-ok').textContent = '✓ Befehl';
    $('b-ok').disabled = !v.plan.ok;
    return;
  }
  if (v.modus === 'abriss') {
    const def = GEBAEUDE[v.geb.typ];
    $('bestaetigung-text').innerHTML = `${def.emoji} <b>${def.name}</b> wirklich abreißen? (50 % zurück)`;
    $('b-ok').textContent = '✓ Abreißen';
    $('b-ok').disabled = false;
  } else {
    const def = GEBAEUDE[v.typ];
    const a = ankerVon(v.typ, v.tx, v.ty);
    const pruefung = platzOK(v.typ, a.x, a.y);
    const bezahlbar = kostenReichen(v.typ);
    const kostenText = Object.entries(gebKosten(v.typ, 0))
      .map(([ware, menge]) => `${WAREN_EMOJI[ware]}${menge}`).join(' ') || 'gratis';
    const eff = effVorschau(v.typ, a.x, a.y);
    const effText = eff !== null ? ` – Auslastung <b>${Math.round(eff * 100)} %</b>` : '';
    if (!pruefung.ok)
      $('bestaetigung-text').innerHTML = `${def.emoji} <span class="grund">${pruefung.grund}</span>`;
    else if (!bezahlbar)
      $('bestaetigung-text').innerHTML = `${def.emoji} <span class="grund">Zu wenig Rohstoffe</span> (${kostenText})`;
    else
      $('bestaetigung-text').innerHTML = `${def.emoji} <b>${def.name}</b> hier bauen? (${kostenText})${effText}`;
    $('b-ok').textContent = '✓ Bauen';
    $('b-ok').disabled = !(pruefung.ok && bezahlbar);
  }
}

$('b-ok').addEventListener('click', () => {
  const v = state.vorschau;
  if (!v) return;
  if (v.modus === 'befehl') {
    befehlAusfuehren(v);
    state.vorschau = null;
  } else if (v.modus === 'abriss') {
    abreissen(v.geb);
    state.vorschau = null;
  } else if (platziere(v.typ, v.tx, v.ty)) {
    state.vorschau = null;   // Werkzeug bleibt aktiv fürs nächste Gebäude
  }
  bestaetigungZeigen();
});
$('b-nein').addEventListener('click', () => {
  state.vorschau = null;
  bestaetigungZeigen();
});

// --- Handel am Kontor: Waren gegen Gold kaufen und verkaufen ---
function handel(ware, menge) {
  if (!PREISE[ware]) return;
  if (istGast()) { befehlSenden({ art: 'handel', ware, menge }); return; }
  if (!handelAusfuehren(spieler[ICH], ware, menge)) melden(handelFehler);
  uiAktualisieren();
}

function menueAktualisieren() {
  for (const b of document.querySelectorAll('.bau-knopf')) {
    const w = b.dataset.werkzeug;
    b.classList.toggle('aktiv', w === state.werkzeug);
    if (GEBAEUDE[w]) {
      // Nicht baubar = ausgegraut, aber weiterhin antippbar (der Klick
      // erklärt dann den Grund – siehe bauKnopfKlick)
      const gesperrt = spieler[ICH].maxStufe < GEBAEUDE[w].abStufe;
      const inaktiv = state.kontorGebaut ? (gesperrt || !kostenReichen(w))
                                         : (w !== 'kontor');
      b.classList.toggle('gesperrt', inaktiv);
      const kostenFeld = b.querySelector('.kosten');
      if (kostenFeld) kostenFeld.textContent = gesperrt
        ? '🔒 ab ' + STUFEN[GEBAEUDE[w].abStufe].name
        : (b.dataset.kosten || '');
    }
  }
}

// Ressourcenleiste und Panel auffrischen (ein paar Mal pro Sekunde)
function uiAktualisieren() {
  $('r-gold').textContent = Math.floor(res.gold).toLocaleString('de-DE');
  $('r-gold').parentElement.classList.toggle('warnung', res.gold < 0);
  const rate = state.goldRate;
  $('r-gold-rate').textContent = (rate >= 0 ? '+' : '') + rate.toFixed(1) + '/s';
  $('r-holz').textContent = Math.floor(res.holz);
  $('r-werkzeuge').textContent = Math.floor(res.werkzeuge);
  $('r-nahrung').textContent = Math.floor(res.nahrung);
  $('r-nahrung').parentElement.classList.toggle('warnung', state.hunger);
  $('r-ziegel').textContent = Math.floor(res.ziegel);
  $('r-stoffe').textContent = Math.floor(res.stoffe);
  $('r-alkohol').textContent = Math.floor(res.alkohol);

  // Punktestand des Wettrennens (nach Siedlern sortiert)
  const rangliste = [...spieler].sort((a, b) =>
    (b.siedlerEw - a.siedlerEw) || (b.einwohner - a.einwohner));
  $('punkte').innerHTML = '<b>🏁 Wettlauf auf ' + SIM.zielSiedler + ' Siedler</b>' +
    rangliste.map(sp => `<div class="punkte-zeile">` +
      `<span><span style="color:${sp.farbe}">●</span> ${sp.name}</span>` +
      `<span>${sp.kontor ? STUFEN[sp.maxStufe].emoji + ' ' + sp.siedlerEw : '⛵ …'}</span></div>`).join('');
  $('r-gunst').textContent = spieler[ICH].gunst || 0;
  $('r-einwohner').textContent = state.einwohner || 0;
  $('r-siedler').textContent = state.siedlerEw || 0;
  $('ziel-balken').firstElementChild.style.width =
    Math.min(100, (state.siedlerEw || 0) / SIM.zielSiedler * 100) + '%';

  // Bankrott-Warnung mit Countdown
  const warnung = $('bankrott-warnung');
  const pleite = res.gold < 0 && !state.vorbei;
  if (pleite) {
    warnung.style.display = 'block';
    warnung.textContent = '⚠️ Kasse leer! Bankrott in ' +
      Math.ceil(SIM.pleiteDauer - state.pleiteZeit) + ' s – Unterhalt senken oder Steuern steigern!';
  } else warnung.style.display = 'none';

  // Netz-Hinweis: meldet sich der Gastgeber noch?
  const netz = $('netz-warnung');
  if (istGast() && MP.hostPuls && Date.now() - MP.hostPuls > 9000) {
    netz.style.display = 'block';
    netz.textContent = '📴 Der Gastgeber ist gerade nicht erreichbar …';
  } else netz.style.display = 'none';

  // Dürre-Hinweis (eigene Insel betroffen?)
  const duerreLeiste = $('duerre-warnung');
  const eigeneDuerre = duerre.insel >= 0 && state.spielzeit < duerre.bis &&
    gebaeude.some(g => g.spieler === ICH && inselMarke &&
      inselMarke[g.y * N + g.x] === duerre.insel);
  if (eigeneDuerre) {
    duerreLeiste.style.display = 'block';
    duerreLeiste.textContent = '🌵 Dürre – deine Felder bringen nur 35 % (noch ' +
      Math.ceil(duerre.bis - state.spielzeit) + ' s)';
  } else duerreLeiste.style.display = 'none';

  // Pulsierende Mangel-Warnung: welche Waren fehlen den Einwohnern?
  const mangelWaren = Object.keys(state.mangel || {});
  const mangelLeiste = $('mangel-warnung');
  if (mangelWaren.length && (state.einwohner || 0) > 0 && !pleite) {
    mangelLeiste.style.display = 'block';
    mangelLeiste.innerHTML = '🚨 Mangel an ' +
      mangelWaren.map(w => `${WAREN_EMOJI[w]} ${WAREN_NAME[w]}`).join(', ') +
      '! Produktion ausbauen oder im Kontor zukaufen.';
  } else mangelLeiste.style.display = 'none';

  menueAktualisieren();
  if (state.auswahl) panelZeigen();
}

// Voraussichtliche Auslastung eines Gebäudes an einem Bauplatz
// (wird an der Bau-Vorschau und in der Bestätigung angezeigt)
function effVorschau(typ, ax, ay) {
  const def = GEBAEUDE[typ];
  const cx = ax + def.w / 2, cy = ay + def.h / 2;
  if (FELD_FARMEN.has(typ)) return Math.min(1, feldPlaetze(typ, ax, ay).length / 6);
  switch (typ) {
    case 'fischer':     return Math.min(1, wasserImUmkreis(cx, cy, def.radius) / 6);
    case 'jagd':        return Math.min(1, baeumeImUmkreis(cx, cy, def.radius) / 5);
    case 'holzfaeller': return Math.min(1, baeumeImUmkreis(cx, cy, def.radius) / 4);
    case 'ziegelei':  return steinKachelImUmkreis(cx, cy, def.radius) ? 1 : 0;
    case 'eisenmine': return eisenKachelImUmkreis(cx, cy, def.radius) ? 1 : 0;
    case 'goldmine':  return goldKachelImUmkreis(cx, cy, def.radius) ? 1 : 0;
    case 'goldschmiede':
      return goldKachelImUmkreis(cx, cy, def.radius) ? 1 : 0;
    default: return null;
  }
}

// Eingangswaren der Verarbeitungs-Betriebe (für die Auslastungs-Erklärung)
const VERARBEITER_REIN = { weberei: 'wolle', brennerei: 'zuckerrohr',
  muehle: 'getreide', baeckerei: 'mehl', tabakladen: 'tabakblaetter',
  schneiderei: 'stoffe' };

// Erklärt in Worten, woraus sich die Auslastung eines Betriebs ergibt
function auslastungGrund(geb) {
  const def = GEBAEUDE[geb.typ];
  const z = zentrum(geb);
  const lager = spieler[geb.spieler].res;
  switch (geb.typ) {
    case 'fischer':
      return `${wasserImUmkreis(z.x, z.y, def.radius)} von 6 nötigen Wasser-/Flussfeldern im Umkreis`;
    case 'jagd':
      return `Waldbestand im Umkreis: ${baeumeImUmkreis(z.x, z.y, def.radius).toFixed(1)} von 5 nötig`;
    case 'holzfaeller':
      return `Waldbestand im Umkreis: ${baeumeImUmkreis(z.x, z.y, def.radius).toFixed(1)} von 4 nötig (Bäume wachsen langsam nach)`;
    case 'schaffarm': case 'getreidefarm': case 'zuckerrohr':
    case 'tabakplantage': case 'gewuerzplantage': case 'rinderfarm': {
      const insel = inselMarke ? inselMarke[geb.y * N + geb.x] : -1;
      const bf = bodenFaktor(insel, geb.typ);
      const trocken = duerre.insel === insel && state.spielzeit < duerre.bis;
      return `${(geb.felder || []).length} von 6 eigenen Feldern (3×3) angelegt · ` +
             `Boden: ×${bf.toFixed(2).replace('.', ',')} (${bodenText(bf)})` +
             (trocken ? ' · <b style="color:var(--rot)">🌵 Dürre: nur 35 %</b>' : '');
    }
    case 'ziegelei':
      return steinKachelImUmkreis(z.x, z.y, def.radius)
        ? 'Gesteinsvorkommen in Reichweite – volle Leistung'
        : 'Kein Gestein mehr in Reichweite – Produktion steht!';
    case 'goldschmiede':
      return goldKachelImUmkreis(z.x, z.y, def.radius)
        ? '🪙 Goldvorkommen in Reichweite – volle Leistung'
        : 'Kein Golderz mehr in Reichweite – Produktion steht!';
    case 'eisenmine': {
      const erz = eisenKachelImUmkreis(z.x, z.y, def.radius);
      return erz ? `Eisenvorkommen in Reichweite (noch ${erz.eisen} Erz)`
                 : 'Kein Eisen mehr in Reichweite – Förderung steht!';
    }
    case 'goldmine': {
      const ader = goldKachelImUmkreis(z.x, z.y, def.radius);
      return ader ? `Goldader in Reichweite (noch ${ader.golderz})`
                  : 'Die Goldader ist erschöpft!';
    }
    default: {
      const rein = VERARBEITER_REIN[geb.typ];
      if (rein) return `Läuft nur, solange ${WAREN_EMOJI[rein]} ${WAREN_NAME[rein]} im Lager ist (${Math.floor(lager[rein])} vorrätig)`;
      return '';
    }
  }
}

// Info-Panel für das ausgewählte Gebäude
function panelZeigen() {
  const panel = $('info-panel');

  // Zuerst: ist eine Truppe ausgewählt?
  const tr = state.truppAuswahl;
  if (tr && truppen.includes(tr)) {
    panel.style.display = 'block';
    const istFlotte = tr.art === 'flotte';
    let h = `<h2><span>${istFlotte ? '🚢' : '⚔️'}</span> ${istFlotte ? 'Flotte' : 'Heer'}</h2>`;
    h += `<div class="beschr">Tippe auf ein Ziel auf der Karte – die Leiste unten zeigt vorher, was passiert. ` +
         (istFlotte
           ? 'Auf Wasser tippen = fahren, auf ein feindliches Gebäude = beschießen. Truppen an Bord setzt du ab, indem du nah an der Küste auf das Land tippst.'
           : 'Tippe auf eine eigene Flotte am Ufer, um das Heer einzuschiffen.') +
         `</div>`;
    h += `<div class="zeile"><span>${istFlotte ? 'Kriegsschiffe' : 'Soldaten'}</span>` +
         `<span>${Math.round(truppGroesse(tr))}</span></div>`;
    if (istFlotte) {
      h += `<div class="zeile"><span>Truppen an Bord</span><span>${Math.round(tr.fracht)}</span></div>`;
      const k = tr.kanonen || 0;
      h += `<div class="zeile"><span>Kanonen</span><span>` +
           '🔫'.repeat(k) + '·'.repeat(KANONEN_MAX - k) +
           (k ? ` (+${Math.round(KANONEN_SEEBONUS * k * 100)} % See)` : '') + `</span></div>`;
    }
    h += `<div class="zeile"><span>Kampfkraft</span><span>${Math.round(staerke(tr))}</span></div>`;
    h += `<div class="zeile"><span>Moral</span><span>${Math.round(tr.moral * 100)} %</span></div>`;
    h += `<div class="auslast-balken"><div style="width:${Math.round(tr.moral * 100)}%"></div></div>`;
    // Nachschub erklärt, warum eine Truppe fern der Heimat schwächer ist
    const nach = Math.round(nachschub(tr) * 100);
    h += `<div class="zeile" style="margin-top:6px"><span>Nachschub</span>` +
         `<span style="color:${nach >= 100 ? 'var(--accent-dunkel)' : nach >= 80 ? 'var(--text)' : 'var(--rot)'}">${nach} %</span></div>`;
    if (nach < 100)
      h += `<div class="beschr">Weit weg von eigenen Kontoren und Märkten kämpft es sich schlechter. Ein Marktplatz oder Kontor in der Nähe hilft.</div>`;
    h += `<div class="zeile"><span>Sold</span><span>` +
         `${((tr.mann + tr.fracht) * KRIEG.sold * 60 + tr.schiffe * KRIEG.soldSchiff * 60).toFixed(0)} 💰/min</span></div>`;
    if (tr.kampf) h += `<div class="beschr" style="color:var(--rot);font-weight:700;margin-top:6px">⚔️ Im Gefecht!</div>`;

    if (istFlotte && (tr.kanonen || 0) < KANONEN_MAX) {
      const kk = Object.entries(KANONEN_KOSTEN)
        .map(([ware, menge]) => `${WAREN_EMOJI[ware]}${menge}`).join(' ');
      const beiWerft = !!werftNahe(tr);
      h += `<button class="abriss-knopf" style="background:${beiWerft ? '#eef2ff' : '#f3f4f6'};color:${beiWerft ? '#4338ca' : 'var(--text-leise)'}" ` +
           `onclick="kanonenNachruesten(state.truppAuswahl)">🔫 Kanonen nachrüsten (${kk})` +
           (beiWerft ? '' : ' – bei der Werft') + `</button>`;
    }
    h += `<button class="abriss-knopf" style="background:#f3f4f6;color:var(--text)" onclick="truppHalt()">✋ Halt</button>`;
    h += `<button class="abriss-knopf" style="background:#f3f4f6;color:var(--text)" onclick="truppAbwaehlen()">✕ Auswahl aufheben</button>`;
    h += `<button class="abriss-knopf" onclick="truppAufloesen()">🏳️ Auflösen</button>`;
    $('panel-inhalt').innerHTML = h;
    return;
  }

  const geb = state.auswahl;
  if (!geb) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';

  const def = GEBAEUDE[geb.typ];
  const info = GEB_INFO[geb.typ] || {};
  const kopfEmoji = geb.typ === 'wohnhaus' ? STUFEN[geb.stufe].emoji : def.emoji;
  const besitzer = spieler[geb.spieler];
  let html = `<h2><span>${kopfEmoji}</span> ${def.name}</h2>`;
  html += `<div class="beschr">${def.beschr}</div>`;
  if (geb.spieler !== ICH)
    html += `<div class="zeile"><span>Besitzer</span>` +
            `<span style="color:${besitzer.farbe}">● ${besitzer.name}</span></div>`;

  // Was das Gebäude produziert, verbraucht und wo es wirkt
  if (info.produziert) html += `<div class="zeile"><span>Produziert</span><span>${info.produziert}</span></div>`;
  if (info.verbraucht) html += `<div class="zeile"><span>Verbraucht</span><span>${info.verbraucht}</span></div>`;
  if (info.standort)   html += `<div class="zeile"><span>Standort</span><span>${info.standort}</span></div>`;

  if (geb.typ === 'wohnhaus') {
    const z = zentrum(geb);
    const st = STUFEN[geb.stufe];
    const naechste = STUFEN[geb.stufe + 1];
    html += `<div class="zeile"><span>Stufe</span><span>${st.emoji} ${st.name}</span></div>`;
    html += `<div class="zeile"><span>Einwohner</span><span>${geb.ew} / ${geb.maxEw}</span></div>`;
    html += `<div class="zeile"><span>Stimmung</span><span>${geb.zufrieden ? '😊 zufrieden' : '😠 unzufrieden'}</span></div>`;
    html += '<hr><b style="font-size:12px">Bedürfnisse</b>';
    html += beduerfnis('Marktanbindung', marktAnbindung(z.x, z.y, geb.spieler));
    html += beduerfnis('🍞 Nahrung', !besitzer.hunger);
    for (const ware of Object.keys(st.brauch))
      html += beduerfnis(`${WAREN_EMOJI[ware]} ${WAREN_NAME[ware]}`, !besitzer.mangel[ware]);
    if (naechste) {
      html += `<hr><b style="font-size:12px">Für den Aufstieg zu ${st.dativ}</b>`;
      for (const ware of Object.keys(naechste.brauch))
        html += beduerfnis(`${WAREN_EMOJI[ware]} ${WAREN_NAME[ware]} im Lager`, besitzer.res[ware] > 0.5);
      if (naechste.material)
        for (const [ware, menge] of Object.entries(naechste.material))
          html += beduerfnis(`${WAREN_EMOJI[ware]} ${menge} ${WAREN_NAME[ware]} (Baumaterial)`,
                             besitzer.res[ware] >= menge);
      if (naechste.gebaeudeNah)
        html += beduerfnis(`${GEBAEUDE[naechste.gebaeudeNah].emoji} ${GEBAEUDE[naechste.gebaeudeNah].name} in Reichweite`,
                           gebaeudeInReichweite(naechste.gebaeudeNah, z.x, z.y, geb.spieler));
      html += beduerfnis(`Gut gefülltes Haus (ab ${Math.ceil(st.maxEw * 0.75)} Ew.)`,
                         geb.ew >= Math.ceil(st.maxEw * 0.75));
    }
  } else if (def.dauer) {
    const prozent = Math.round(geb.eff * 100);
    html += `<div class="zeile"><span>Auslastung</span><span>${prozent} %</span></div>`;
    html += `<div class="auslast-balken"><div style="width:${prozent}%"></div></div>`;
    const grund = auslastungGrund(geb);
    if (grund) html += `<div class="beschr" style="margin-top:5px">${grund}</div>`;
    html += `<div class="zeile" style="margin-top:6px"><span>Produktionstakt</span><span>alle ${def.dauer} s</span></div>`;
    html += `<div class="zeile"><span>Unterhalt</span><span>${(def.unterhalt * 60).toFixed(0)} 💰/min</span></div>`;
  } else {
    // Tatsächlicher Radius – wächst mit der Ausbaustufe
    if (def.marktRadius) html += `<div class="zeile"><span>Versorgungsradius</span><span>${wirkRadius(geb)} Felder</span></div>`;
    if (def.radius) html += `<div class="zeile"><span>Wirkungsradius</span><span>${wirkRadius(geb)} Felder</span></div>`;
    if (def.unterhalt) html += `<div class="zeile"><span>Unterhalt</span><span>${(def.unterhalt * 60).toFixed(0)} 💰/min</span></div>`;
  }

  // Reiter-Umschalter am eigenen Kontor
  if (geb.typ === 'kontor' && geb.spieler === ICH) {
    html += `<div class="tab-leiste">` +
      `<button class="${state.kontorTab === 'handel' ? 'aktiv' : ''}" onclick="kontorTab('handel')">⚖️ Handel</button>` +
      `<button class="${state.kontorTab === 'diplomatie' ? 'aktiv' : ''}" onclick="kontorTab('diplomatie')">🏛️ Diplomatie</button>` +
      `</div>`;
  }

  // Handel: nur am eigenen Kontor – kaufen ist teurer als verkaufen
  if (geb.typ === 'kontor' && geb.spieler === ICH && state.kontorTab === 'handel') {
    // Handelskontingent: der Markt ist endlich
    const ich = spieler[ICH];
    const anteil = Math.round(ich.kontingent / Math.max(1, ich.kontingentMax) * 100);
    html += `<hr><div class="zeile"><span>📦 Handelskontingent</span>` +
            `<span>${Math.floor(ich.kontingent)} / ${ich.kontingentMax}</span></div>`;
    html += `<div class="auslast-balken"><div style="width:${anteil}%"></div></div>`;
    html += `<div class="beschr" style="margin-top:4px">Wächst mit deiner Bevölkerung und jedem Kontor. ` +
            (ich.handelsMalus > 0 ? `<b style="color:var(--rot)">Sanktionen: −${Math.round(ich.handelsMalus * 100)} %</b> ` : '') +
            (ich.handelsBonus > 0 ? `<b style="color:var(--accent-dunkel)">Privileg: +${Math.round(ich.handelsBonus * 100)} %</b>` : '') +
            `</div>`;

    html += '<hr><b style="font-size:12px">⚖️ Handel</b>' +
      '<div class="beschr" style="margin:2px 0 4px">Preise je Stück (Kauf/Verkauf) folgen der Nachfrage und können bis auf das Sechsfache steigen – auch die Konkurrenz kauft hier ein! ▲ teuer · ▼ günstig. Mit den 🔄-Knöpfen handelt dein Kontor automatisch.</div>';
    for (const ware of Object.keys(PREISE)) {
      const f = markt[ware];
      const trend = f > 1.15 ? ' <span style="color:#dc2626">▲</span>'
                  : f < 0.87 ? ' <span style="color:#2563eb">▼</span>' : '';
      html += `<div class="handel-zeile">
        <span>${WAREN_EMOJI[ware]} <b>${Math.floor(res[ware])}</b>${trend}
          <small style="color:var(--text-leise)">${kaufpreis(ware)}/${verkaufspreis(ware)}💰</small></span>
        <span>
          <button class="handel-verkauf" title="200 verkaufen (+${verkaufspreis(ware) * 200}💰)" onclick="handel('${ware}',-200)">−200</button>
          <button class="handel-verkauf" title="50 verkaufen (+${verkaufspreis(ware) * 50}💰)" onclick="handel('${ware}',-50)">−50</button>
          <button class="handel-verkauf" title="10 verkaufen (+${verkaufspreis(ware) * 10}💰)" onclick="handel('${ware}',-10)">−10</button>
          <button class="handel-kauf" title="10 kaufen (−${kaufpreis(ware) * 10}💰)" onclick="handel('${ware}',10)">+10</button>
          <button class="handel-kauf" title="50 kaufen (−${kaufpreis(ware) * 50}💰)" onclick="handel('${ware}',50)">+50</button>
          <button class="handel-kauf" title="200 kaufen (−${kaufpreis(ware) * 200}💰)" onclick="handel('${ware}',200)">+200</button>
        </span></div>`;
      const regel = autoHandel[ware];
      html += `<div class="auto-zeile">
        <button class="${regel.kauf !== null ? 'auto-an' : ''}" onclick="autoKaufWechseln('${ware}')"
          title="Kauft automatisch nach, sobald der Bestand unter diese Grenze fällt">
          🔄 Nachkaufen: ${regel.kauf !== null ? 'unter ' + regel.kauf : 'aus'}</button>
        <button class="${regel.verkauf !== null ? 'auto-an' : ''}" onclick="autoVerkaufWechseln('${ware}')"
          title="Verkauft automatisch, sobald der Bestand über dieser Grenze liegt">
          🔄 Verkaufen: ${regel.verkauf !== null ? 'über ' + regel.verkauf : 'aus'}</button>
      </div>`;
    }
  }

  // Ausbaustufe und Ausbau-Knopf
  const stufeJetzt = geb.ausbau || 1;
  html += `<div class="zeile"><span>Ausbaustufe</span><span>` +
          '★'.repeat(stufeJetzt) + '☆'.repeat(AUSBAU_MAX - stufeJetzt) + `</span></div>`;
  html += `<div class="zeile"><span>Wirkung</span><span>${ausbauWirkung(geb, stufeJetzt)}</span></div>`;
  if (geb.spieler === ICH && stufeJetzt < AUSBAU_MAX) {
    const k = Object.entries(ausbauKosten(geb))
      .map(([ware, menge]) => `${WAREN_EMOJI[ware]}${menge}`).join(' ');
    html += `<div class="beschr" style="margin-top:4px">Stufe ${stufeJetzt + 1} bringt: ` +
            `<b>${ausbauWirkung(geb, stufeJetzt + 1)}</b>` +
            (GEBAEUDE[geb.typ].unterhalt ? ` – dafür ${(GEBAEUDE[geb.typ].unterhalt * (stufeJetzt + 1) * 60).toFixed(0)} 💰/min Unterhalt` : '') +
            `</div>`;
    html += `<button class="abriss-knopf" style="background:#eef2ff;color:#4338ca" ` +
            `onclick="ausbauen(state.auswahl)">⬆️ Auf Stufe ${stufeJetzt + 1} ausbauen (${k})</button>`;
  }

  // Zustand des Gebäudes, sobald es beschädigt ist
  if (geb.hp < geb.maxHp)
    html += `<div class="zeile"><span>Zustand</span><span style="color:var(--rot)">` +
            `${Math.max(0, Math.round(geb.hp))} / ${geb.maxHp} 🛡️</span></div>`;

  // Militärgebäude: Truppen ausheben bzw. Schiffe bauen
  if (geb.spieler === ICH && geb.typ === 'kaserne') {
    const kap = soldatenKapazitaet(ICH), jetzt = soldatenAktuell(ICH);
    html += `<div class="zeile"><span>Soldaten</span><span>${jetzt} / ${kap}</span></div>`;
    html += `<div class="auslast-balken"><div style="width:${Math.min(100, kap ? jetzt / kap * 100 : 0)}%"></div></div>`;
    html += `<div class="beschr" style="margin-top:4px">Jede Ausbaustufe schafft Platz für ${KASERNE_KAPAZITAET} weitere Soldaten.</div>`;
    const k = Object.entries(TRUPP_KOSTEN).map(([w, m]) => `${WAREN_EMOJI[w]}${m}`).join(' ');
    html += `<button class="abriss-knopf" style="background:#f0fdf4;color:var(--accent-dunkel)" ` +
            `onclick="ausheben(state.auswahl); panelZeigen()">⚔️ ${TRUPP_MANN} Mann ausheben (${k} + 👥${TRUPP_EINWOHNER})</button>`;
  }
  if (geb.spieler === ICH && geb.typ === 'werft') {
    const k = Object.entries(SCHIFF_KOSTEN).map(([w, m]) => `${WAREN_EMOJI[w]}${m}`).join(' ');
    html += `<button class="abriss-knopf" style="background:#f0fdf4;color:var(--accent-dunkel)" ` +
            `onclick="schiffBauen(state.auswahl); panelZeigen()">🚢 Kriegsschiff bauen (${k})</button>`;
  }

  // --- Diplomatie: nur am eigenen Kontor ---
  if (geb.typ === 'kontor' && geb.spieler === ICH && state.kontorTab === 'diplomatie') {
    html += `<div class="beschr" style="margin:2px 0 6px">Wirtschaft schlägt Schwert: Bestechung und Embargos kürzen das Handelskontingent des Gegners. Militärische Angriffe sind erst nach einer Kriegserklärung erlaubt.</div>`;
    html += `<div class="diplo-knoepfe"><button class="gut" onclick="diploAktion('privileg',1)">` +
            `📜 Handelsprivileg (${DIPLO.privileg.gold}💰) +${Math.round(DIPLO.privileg.bonus * 100)} %</button></div>`;
    if (!spieler.some(g => g.id !== ICH && g.kontor))
      html += `<div class="beschr" style="margin-top:8px">Noch ist keine Konkurrenz gelandet. Sobald jemand eine Insel besiedelt, kannst du hier verhandeln, sanktionieren – oder den Krieg erklären.</div>`;
    for (const geg of spieler) {
      if (geg.id === ICH || !geg.kontor) continue;
      const w = feindschaft[ICH][geg.id], st = feindStufe(ICH, geg.id);
      html += `<div class="diplo-kopf"><span style="color:${geg.farbe}">● ${geg.name}</span>` +
              `<span style="color:${st.farbe}">${st.emoji} ${st.name}</span></div>`;
      html += `<div class="diplo-balken"><div style="width:${w}%;background:${st.farbe}"></div></div>`;
      html += `<div class="diplo-knoepfe">` +
        `<button class="gut" onclick="diploAktion('geschenk',${geg.id})">🎁 ${DIPLO.geschenk.gold}💰</button>` +
        `<button onclick="diploAktion('bestechen',${geg.id})">💼 Bestechen ${DIPLO.bestechen.gold}💰</button>` +
        `<button class="${spieler[ICH].embargo[geg.id] ? 'an' : ''}" onclick="diploAktion('embargo',${geg.id})">` +
          `⛔ Embargo${spieler[ICH].embargo[geg.id] ? ' läuft' : ''}</button>` +
        (imKriegMit(ICH, geg.id)
          ? `<button class="gut" onclick="diploAktion('frieden',${geg.id})">🕊️ Frieden ${DIPLO.frieden.gold}💰</button>`
          : `<button class="boese" onclick="diploAktion('krieg',${geg.id})">⚔️ Krieg erklären</button>`) +
        `</div>`;
    }
  }

  if (geb.spieler === ICH)
    html += `<button class="abriss-knopf" onclick="abreissenAuswahl()">🧨 Abreißen</button>`;
  $('panel-inhalt').innerHTML = html;
}
function beduerfnis(name, erfuellt) {
  return `<div class="beduerfnis"><span>${name}</span>` +
         `<span class="${erfuellt ? 'ok' : 'fehlt'}">${erfuellt ? '✓' : '✗'}</span></div>`;
}
function kontorTab(name) { state.kontorTab = name; panelZeigen(); }

function truppHalt() {
  if (!state.truppAuswahl) return;
  if (istGast()) { befehlSenden({ art: 'halt', id: state.truppAuswahl.id }); return; }
  state.truppAuswahl.pfad = []; melden('Truppe hält an');
}
function truppAufloesen() {
  const t = state.truppAuswahl;
  if (!t) return;
  // Soldaten kehren als Einwohner zurück – Schiffe werden abgewrackt
  if (t.art === 'heer' || t.fracht > 0) {
    let rest = Math.round(t.mann + t.fracht);
    for (const g of gebaeude) {
      if (rest <= 0) break;
      if (g.typ !== 'wohnhaus' || g.spieler !== ICH) continue;
      const platz = Math.min(g.maxEw - g.ew, rest);
      if (platz > 0) { g.ew += platz; rest -= platz; }
    }
  }
  if (t.art === 'flotte') res.holz += Math.floor(t.schiffe * 4);
  truppen = truppen.filter(x => x !== t);
  state.truppAuswahl = null;
  panelZeigen();
  melden('Truppe aufgelöst – die Leute kehren heim');
}

// Kurze Meldung am unteren Rand; gleiche Meldungen werden gedrosselt
let toastTimer = null;
const meldungZuletzt = {};
function melden(text, schluessel) {
  const jetzt = performance.now();
  if (schluessel) {
    if (meldungZuletzt[schluessel] && jetzt - meldungZuletzt[schluessel] < 8000) return;
    meldungZuletzt[schluessel] = jetzt;
  }
  const toast = $('toast');
  toast.textContent = text;
  toast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = 0; }, 2600);
}

/* ---------- 10. MUSIK (Web Audio API) ------------------------- */
// Ein sehr ruhiger, generativer Klangteppich: alle paar Sekunden ein
// weicher Akkord aus Sinustönen – ganz ohne Audiodateien.

const musik = { an: false, ctx: null, timer: null, takt: 0 };
const AKKORDE = [                       // sanfte Folge in C-Dur
  [130.8, 261.6, 329.6, 392.0],         // C
  [110.0, 220.0, 261.6, 329.6],         // Am
  [87.3, 174.6, 220.0, 261.6],          // F
  [98.0, 196.0, 246.9, 293.7],          // G
];

function akkordSpielen() {
  const ac = musik.ctx, t = ac.currentTime;
  const noten = AKKORDE[musik.takt++ % AKKORDE.length];
  for (let i = 0; i < noten.length; i++) {
    const osc = ac.createOscillator();
    const laut = ac.createGain();
    osc.type = i === 0 ? 'triangle' : 'sine';   // Bass etwas wärmer
    osc.frequency.value = noten[i];
    // Weich ein- und ausblenden, damit nichts knackt
    laut.gain.setValueAtTime(0, t);
    laut.gain.linearRampToValueAtTime(i === 0 ? 0.035 : 0.028, t + 1.4);
    laut.gain.linearRampToValueAtTime(0, t + 4.2);
    osc.connect(laut).connect(ac.destination);
    osc.start(t);
    osc.stop(t + 4.3);
  }
}

function musikUmschalten() {
  if (!musik.an) {
    if (!musik.ctx) musik.ctx = new (window.AudioContext || window.webkitAudioContext)();
    musik.ctx.resume();
    musik.an = true;
    akkordSpielen();
    musik.timer = setInterval(akkordSpielen, 4400);
  } else {
    musik.an = false;
    clearInterval(musik.timer);
  }
  $('k-musik').classList.toggle('aktiv', musik.an);
}
$('k-musik').addEventListener('click', musikUmschalten);

/* ---------- 11. HAUPTSCHLEIFE --------------------------------- */

function kameraStart() {
  // Start: Blick aufs Schiff, so weit herausgezoomt, dass man das Meer
  // und die nächsten Inseln gut sieht (auf ca. 30 Kacheln Sichtweite)
  const wunsch = Math.min(leinwand.clientWidth, leinwand.clientHeight) / (30 * T);
  kamera.zoom = Math.min(1.1, Math.max(0.3, wunsch));
  kamera.x = schiff.x * T - leinwand.clientWidth / (2 * kamera.zoom);
  kamera.y = schiff.y * T - leinwand.clientHeight / (2 * kamera.zoom);
  kameraBegrenzen();
}

// 🧭-Knopf: Kamera zurück zum Kontor (oder zum Schiff)
function zentrieren() {
  const kontor = gebaeude.find(g => g.typ === 'kontor');
  const ziel = kontor ? zentrum(kontor) : { x: schiff.x, y: schiff.y };
  kamera.x = ziel.x * T - leinwand.clientWidth / (2 * kamera.zoom);
  kamera.y = ziel.y * T - leinwand.clientHeight / (2 * kamera.zoom);
  kameraBegrenzen();
}
$('k-mitte').addEventListener('click', zentrieren);
$('k-speichern').addEventListener('click', () => spielSpeichern(false));
$('k-netz').addEventListener('click', mpFensterZeigen);
$('k-laden').addEventListener('click', () => spielLaden(false));

// Alle 30 Sekunden und beim Verlassen automatisch sichern
setInterval(() => { if (state.kontorGebaut && !state.vorbei && !istGast()) spielSpeichern(true); }, 30000);
window.addEventListener('pagehide', () => { if (state.kontorGebaut && !istGast()) spielSpeichern(true); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && state.kontorGebaut && !istGast()) spielSpeichern(true);
});

let zuletzt = performance.now();
let uiTakt = 0;

function schleife(jetzt) {
  let dt = (jetzt - zuletzt) / 1000;
  zuletzt = jetzt;
  dt = Math.min(dt, 0.1);   // große Sprünge (Tab im Hintergrund) abfangen

  const laeuft = !state.pause && !state.vorbei && (!state.gewonnen || state.weiterspielen);
  if (laeuft) {
    if (istGast()) {
      // Der Gast rechnet nichts – er zeichnet nur, was der Gastgeber meldet
      truppenGlaetten(dt);
    } else {
      schiffUpdate(dt * state.tempo);
      kiSchiffeUpdate(dt * state.tempo);
      simSchritt(dt * state.tempo);
      mpSenden(dt);
    }
  }

  zeichnen();

  uiTakt += dt;
  if (uiTakt >= 0.25) { uiTakt = 0; uiAktualisieren(); }

  requestAnimationFrame(schleife);
}

// --- Als App: Service Worker anmelden, damit das Spiel auch
//     ohne Internet startet. Scheitert still, wenn die Datei
//     lokal (file://) geöffnet wird – dann läuft es trotzdem.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// --- Los geht's ---
for (const ware of Object.keys(PREISE)) {
  markt[ware] = 1;
  autoHandel[ware] = { kauf: null, verkauf: null };
}
// Alle starten im Frieden (leichte Grundspannung zwischen Konkurrenten)
feindschaft = spieler.map((_, a) => spieler.map((_, b) => (a === b ? 0 : 25)));
weltErzeugen();
schiffStart();
// Jede Partei bekommt ihr eigenes Schiff – alle liegen am selben Punkt
for (const sp of spieler) sp.schiff = { x: schiff.x, y: schiff.y, pfad: [] };
schiff = spieler[ICH].schiff;
menueBauen();
kameraStart();
leinwand.classList.add('bauen');   // Start-Werkzeug ist das Kontor
uiAktualisieren();
requestAnimationFrame(schleife);

// Liegt ein Spielstand vor? Dann fragen, ob fortgesetzt werden soll.
if (standVorhanden()) {
  $('overlay').style.display = 'flex';
  $('overlay-box').innerHTML = `
    <div class="gross">💾</div>
    <h1>Weiterspielen?</h1>
    <p>Es liegt ein gespeicherter Spielstand vor.<br>
       Du kannst ihn fortsetzen oder eine neue Welt beginnen.</p>
    <button class="knopf-gruen" onclick="spielFortsetzen()">Fortsetzen</button>
    <button class="knopf-grau" onclick="neueWelt()">Neue Welt</button>`;
}
function spielFortsetzen() {
  if (!spielLaden(true)) { $('overlay').style.display = 'none'; return; }
  melden('📂 Weiter geht\'s!');
}
function neueWelt() {
  standLoeschen();
  $('overlay').style.display = 'none';
}
