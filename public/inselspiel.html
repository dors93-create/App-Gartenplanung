    st.hell[0] = new Path2D(); st.hell[1] = new Path2D(); st.glanz = new Path2D();
  }
  const m = kachelMitte(x, y);
  const anzahl = baumZahl(k);
  const voll = Math.PI * 2;
  for (let i = 0; i < anzahl; i++) {
    const bx = m.x + ((k.var * 7 + i * 2.6) % 1 - 0.5) * KW * 0.55;
    const by = m.y + ((k.var * 13 + i * 3.7) % 1 - 0.5) * KH * 0.55;
    const gr = HE * (0.38 + k.baum * 0.2) * (0.8 + ((k.var * 29 + i * 1.9) % 1) * 0.45);
    if (fein) {                                   // Schatten am Boden
      st.schatten.moveTo(bx + gr * 0.7, by);
      st.schatten.ellipse(bx + gr * 0.2, by, gr * 0.5, gr * 0.22, 0, 0, voll);
    }
    if (nah) st.stamm.rect(bx - gr * 0.08, by - gr * 0.55, gr * 0.16, gr * 0.6);
    st.dunkel.moveTo(bx + gr * 0.52, by - gr * 0.72);              // Krone
    st.dunkel.arc(bx, by - gr * 0.72, gr * 0.52, 0, voll);
    const p = st.hell[((k.var * 37 + i * 2.1) % 1) < 0.5 ? 0 : 1];  // Lichtseite
    p.moveTo(bx - gr * 0.12 + gr * 0.39, by - gr * 0.85);
    p.arc(bx - gr * 0.12, by - gr * 0.85, gr * 0.39, 0, voll);
    if (nah) {                                                      // Glanzlicht
      st.glanz.moveTo(bx - gr * 0.2 + gr * 0.19, by - gr * 0.99);
      st.glanz.arc(bx - gr * 0.2, by - gr * 0.99, gr * 0.19, 0, voll);
    }
  }
}

function baeumeMalen() {
  const st = baumStapel;
  if (!st.da) return;
  st.da = false;
  ctx.fillStyle = BAUM_FARBEN.schatten; ctx.fill(st.schatten);
  ctx.fillStyle = BAUM_FARBEN.stamm;    ctx.fill(st.stamm);
  ctx.fillStyle = BAUM_FARBEN.dunkel;   ctx.fill(st.dunkel);
  ctx.fillStyle = BAUM_FARBEN.hell[0];  ctx.fill(st.hell[0]);
  ctx.fillStyle = BAUM_FARBEN.hell[1];  ctx.fill(st.hell[1]);
  ctx.fillStyle = BAUM_FARBEN.glanz;    ctx.fill(st.glanz);
}

// Nur die Landschaft (Berge und Wälder), ohne Gebäude – fürs Übersichtsbild
function landschaftZeichnen(s, fein) {
  for (let y = s.y0; y <= s.y1; y++) {
    for (let x = s.x0; x <= s.x1; x++) {
      const k = karte[y * N + x];
      if (k.typ === 'berg') { baeumeMalen(); bergKachel(x, y, fein); }
      else if (k.baum > 0.02) baeumeSammeln(x, y, k, fein, false);
    }
    baeumeMalen();
  }
}

/* ---------- Übersichtsbild für die Fernsicht -------------------
   Weit herausgezoomt wären zehntausende Kacheln zu zeichnen – jedes
   Bild aufs Neue. Stattdessen wird die ganze Welt (Boden, Gebirge,
   Flüsse, Wälder) einmal verkleinert in ein unsichtbares Bild gemalt
   und in der Fernsicht nur noch als Ganzes gestempelt. Gebäude und
   Schiffe kommen weiterhin frisch obendrauf.
   --------------------------------------------------------------- */
const FERN_ZOOM = 0.3;        // unterhalb davon gilt die Fernsicht
const UE = 0.4;               // Maßstab des Übersichtsbilds
const UE_RAND = 48;           // Luft nach oben für Gipfel am Kartenrand
let uebersicht = null;
let uebersichtAlt = true;                 // ganze Welt neu malen (Karte gewechselt)?
const uebersichtSchmutz = new Set();      // einzelne Kacheln, deren Bäume sich geändert haben
let uebersichtBaeume = null;              // wie viele Bäume je Kachel im Bild stecken
function uebersichtBauen() {
  if (!uebersicht) {
    uebersicht = document.createElement('canvas');
    uebersicht.width = Math.ceil(WELT_B * UE);
    uebersicht.height = Math.ceil((WELT_H + UE_RAND + 16) * UE);
  }
  gelaendeBereit();
  const haupt = ctx;
  ctx = uebersicht.getContext('2d');      // alle Zeichenfunktionen malen jetzt hierhin
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1a4764';
  ctx.fillRect(0, 0, uebersicht.width, uebersicht.height);
  ctx.setTransform(UE, 0, 0, UE, 0, UE_RAND * UE);
  const alles = { x0: 0, x1: N - 1, y0: 0, y1: N - 1,
                  links: -1e9, rechts: 1e9, oben: -1e9, unten: 1e9 };
  bodenZeichnen(alles, false);
  landschaftZeichnen(alles, false);
  ctx = haupt;
  uebersichtAlt = false;
  uebersichtSchmutz.clear();
  uebersichtBaeume = new Uint8Array(N * N);
  for (let i = 0; i < N * N; i++) uebersichtBaeume[i] = baumZahl(karte[i]);
}

// Gemeldete Baumänderungen ins Übersichtsbild übernehmen. Die meisten
// Meldungen sind unsichtbar (ein Baum ist nur ein wenig gewachsen) –
// gezählt wird nur, wo sich die ANZAHL der Bäume geändert hat. Wenige
// solche Stellen werden einzeln ausgebessert: ein kleines Fenster um
// die Kachel, in dem Boden und Landschaft frisch gezeichnet werden.
// Sind es viele, ist einmal alles neu malen schneller.
function uebersichtPflegen() {
  const echt = [];
  for (const idx of uebersichtSchmutz)
    if (baumZahl(karte[idx]) !== uebersichtBaeume[idx]) echt.push(idx);
  uebersichtSchmutz.clear();
  if (!echt.length) return;
  if (echt.length > 50) { uebersichtBauen(); return; }

  gelaendeBereit();
  const haupt = ctx;
  ctx = uebersicht.getContext('2d');
  const alles = { links: -1e9, rechts: 1e9, oben: -1e9, unten: 1e9 };
  for (const idx of echt) {
    uebersichtBaeume[idx] = baumZahl(karte[idx]);
    const x = idx % N, y = (idx / N) | 0;
    const cx = isoX(x + 0.5, y + 0.5), cy = isoY(x + 0.5, y + 0.5);
    ctx.save();
    ctx.setTransform(UE, 0, 0, UE, 0, UE_RAND * UE);
    ctx.beginPath();
    ctx.rect(cx - 46, cy - H_LAND - 46, 92, 46 + H_LAND + KH * 0.5);
    ctx.clip();
    // Nach vorn (größere x/y) weiter ausholen: von dort ragen Berge
    // und Bäume in das Fenster hinein
    const s = Object.assign({ x0: Math.max(0, x - 2), x1: Math.min(N - 1, x + 5),
                              y0: Math.max(0, y - 2), y1: Math.min(N - 1, y + 5) }, alles);
    bodenZeichnen(s, false);
    landschaftZeichnen(s, false);
    ctx.restore();
  }
  ctx = haupt;
}

// Einfaches Haus für die Fernsicht: Wände, Dach und ein Punkt in der
// Farbe des Besitzers – so erkennt man auf einen Blick, wem was gehört.
function gebaeudeFern(geb) {
  const def = GEBAEUDE[geb.typ];
  const hoch = hoeheBei(geb.x, geb.y);
  const cx = isoX(geb.x + def.w / 2, geb.y + def.h / 2);
  const cy = isoY(geb.x + def.w / 2, geb.y + def.h / 2) - hoch;
  const hw = (def.w + def.h) * KW / 4 * 0.8, hh = (def.w + def.h) * KH / 4 * 0.8;
  if (geb.typ === 'bruecke') { isoKasten(cx, cy, hw * 1.2, hh * 1.2, 3, '#a8814f'); return; }
  const st = stilVon(geb);
  if (geb.typ === 'marktplatz') isoKasten(cx, cy, hw * 1.15, hh * 1.15, 2, '#cbb48d');
  else {
    const wandH = HE * 0.6 * st.hoch * (def.w > 1 ? 1.3 : 1);
    isoKasten(cx, cy, hw, hh, wandH, st.wand);
    isoSattel(cx, cy, hw * 1.1, hh * 1.1, wandH, HE * 0.5, st.dach);
  }
  const r = 3.2 / kamera.zoom;
  ctx.beginPath();
  ctx.arc(cx, cy - HE * 1.4, r, 0, Math.PI * 2);
  ctx.fillStyle = spieler[geb.spieler].farbe;
  ctx.fill();
}

// Das Terrain wird jedes Bild frisch gezeichnet; dieser Rest bleibt
// nur, damit die Simulation weiter „Kachel geändert" melden kann.
const schmutzKacheln = new Set();
function kachelSchmutzig(x, y) { schmutzKacheln.add(y * N + x); uebersichtSchmutz.add(y * N + x); }
function terrainZeichnen() {
  farbListe = null; hoehCache = null;      // Gelände-Cache neu aufbauen lassen
  state.terrainAlt = false;
}

// Abgerundetes Rechteck (eigene Hilfsfunktion, läuft überall)
function rundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}


// Ein kleines Segelschiff – gezeichnet, damit es zu den Bauwerken passt.
// art: nichts = Handelsschiff, 'krieg' = Kriegsschiff (dunkler Rumpf mit
// Stückpforten, ein Segel in der Farbe des Besitzers), 'pirat' = schwarze
// Segel und Totenkopfflagge.
function segelschiff(sx, sy, gr, farbe, wippen, art) {
  const y = sy + wippen;
  const krieg = art === 'krieg', pirat = art === 'pirat';
  ctx.save();
  ctx.translate(sx, y);
  // Schatten auf dem Wasser
  ctx.beginPath();
  ctx.ellipse(0, gr * 0.3, gr * 0.52, gr * 0.16, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(10,40,60,0.28)'; ctx.fill();
  // Rumpf
  ctx.beginPath();
  ctx.moveTo(-gr * 0.5, gr * 0.1);
  ctx.quadraticCurveTo(0, gr * 0.42, gr * 0.5, gr * 0.08);
  ctx.lineTo(gr * 0.42, gr * 0.02);
  ctx.quadraticCurveTo(0, gr * 0.22, -gr * 0.42, gr * 0.04);
  ctx.closePath();
  ctx.fillStyle = pirat ? '#2b2420' : krieg ? '#5a3d28' : '#7d5230'; ctx.fill();
  ctx.fillStyle = pirat ? '#463a33' : krieg ? '#7c5637' : '#9c6a3e';
  ctx.beginPath();
  ctx.ellipse(0, gr * 0.08, gr * 0.42, gr * 0.1, 0, 0, Math.PI * 2);
  ctx.fill();
  if (krieg || pirat) {                 // Stückpforten: drei dunkle Luken
    ctx.fillStyle = '#1c1512';
    for (const lx of [-0.22, 0, 0.22])
      ctx.fillRect(lx * gr - gr * 0.035, gr * 0.2 - Math.abs(lx) * gr * 0.16, gr * 0.07, gr * 0.05);
  }
  // Mast
  ctx.strokeStyle = '#6b4a2e';
  ctx.lineWidth = Math.max(1, gr * 0.06);
  ctx.beginPath();
  ctx.moveTo(0, gr * 0.12); ctx.lineTo(0, -gr * 0.62);
  ctx.stroke();
  // Segel
  ctx.beginPath();
  ctx.moveTo(gr * 0.04, -gr * 0.58);
  ctx.quadraticCurveTo(gr * 0.46, -gr * 0.2, gr * 0.06, gr * 0.04);
  ctx.closePath();
  ctx.fillStyle = pirat ? '#3a3a40' : '#f4f0e4'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-gr * 0.04, -gr * 0.5);
  ctx.quadraticCurveTo(-gr * 0.32, -gr * 0.22, -gr * 0.06, gr * 0.02);
  ctx.closePath();
  ctx.fillStyle = pirat ? '#2a2a2f' : (krieg && farbe) ? farbe : '#e6dfcd'; ctx.fill();
  // Wimpel in Spielerfarbe – bei Piraten schwarz mit weißem Punkt
  if (farbe || pirat) {
    ctx.beginPath();
    ctx.moveTo(0, -gr * 0.62);
    ctx.lineTo(gr * 0.3, -gr * 0.54);
    ctx.lineTo(0, -gr * 0.46);
    ctx.closePath();
    ctx.fillStyle = pirat ? '#111' : farbe; ctx.fill();
    if (pirat) {
      ctx.beginPath();
      ctx.arc(gr * 0.1, -gr * 0.54, gr * 0.035, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill();
    }
  }
  ctx.restore();
}

// Ein Soldat: Beine, Rock in der Farbe des Besitzers, Kopf mit Hut, Pike
function soldatZeichnen(x, y, gr, farbe) {
  ctx.fillStyle = '#3f3a36';
  ctx.fillRect(x - gr * 0.07, y - gr * 0.24, gr * 0.14, gr * 0.24);     // Beine
  ctx.fillStyle = farbe;
  ctx.fillRect(x - gr * 0.11, y - gr * 0.52, gr * 0.22, gr * 0.3);      // Rock
  ctx.beginPath();
  ctx.arc(x, y - gr * 0.6, gr * 0.09, 0, Math.PI * 2);                  // Kopf
  ctx.fillStyle = '#e8c9a0'; ctx.fill();
  ctx.fillStyle = '#2f2a26';
  ctx.fillRect(x - gr * 0.12, y - gr * 0.7, gr * 0.24, gr * 0.06);      // Hut
  ctx.strokeStyle = '#5b4a3a';
  ctx.lineWidth = Math.max(1, gr * 0.045);
  ctx.beginPath();
  ctx.moveTo(x + gr * 0.15, y - gr * 0.08);                             // Pike
  ctx.lineTo(x + gr * 0.15, y - gr * 0.92);
  ctx.stroke();
}

/* ---------- Isometrische Bauteile ------------------------------
   Alles Gebaute besteht aus wenigen Grundkörpern, die auf einer
   Bodenraute stehen. Sichtbar sind immer die beiden dem Betrachter
   zugewandten Wände (rechts und links unten) sowie das Dach.
   --------------------------------------------------------------- */

// Eine Farbe abdunkeln bzw. aufhellen (für Licht- und Schattenseite)
function schattiert(hex, f) {
  if (typeof hex !== 'string' || hex[0] !== '#') return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * f)));
  const g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * f)));
  const b = Math.max(0, Math.min(255, Math.round((n & 255) * f)));
  return `rgb(${r},${g},${b})`;
}

// Quader auf einer Bodenraute um (cx, cy); hw/hh = halbe Rautenmaße
function isoKasten(cx, cy, hw, hh, hoehe, farbe) {
  const oben = schattiert(farbe, 1.0);
  const rechts = schattiert(farbe, 0.74);
  const links = schattiert(farbe, 0.88);
  if (hoehe > 0) {
    ctx.beginPath();                                   // rechte Wand
    ctx.moveTo(cx + hw, cy); ctx.lineTo(cx, cy + hh);
    ctx.lineTo(cx, cy + hh - hoehe); ctx.lineTo(cx + hw, cy - hoehe);
    ctx.closePath(); ctx.fillStyle = rechts; ctx.fill();
    ctx.beginPath();                                   // linke Wand
    ctx.moveTo(cx, cy + hh); ctx.lineTo(cx - hw, cy);
    ctx.lineTo(cx - hw, cy - hoehe); ctx.lineTo(cx, cy + hh - hoehe);
    ctx.closePath(); ctx.fillStyle = links; ctx.fill();
  }
  ctx.beginPath();                                     // Deckfläche
  ctx.moveTo(cx, cy - hh - hoehe); ctx.lineTo(cx + hw, cy - hoehe);
  ctx.lineTo(cx, cy + hh - hoehe); ctx.lineTo(cx - hw, cy - hoehe);
  ctx.closePath(); ctx.fillStyle = oben; ctx.fill();
}

// Satteldach über einer Bodenraute. First läuft von links nach rechts.
function isoSattel(cx, cy, hw, hh, basis, first, farbe) {
  const y = cy - basis;
  const n = { x: cx, y: y - hh }, o = { x: cx + hw, y: y };
  const s = { x: cx, y: y + hh }, w = { x: cx - hw, y: y };
  const a = { x: cx - hw / 2, y: y - hh / 2 - first };   // Firstende links
  const b = { x: cx + hw / 2, y: y + hh / 2 - first };   // Firstende rechts

  ctx.beginPath();                                   // hintere Dachfläche
  ctx.moveTo(n.x, n.y); ctx.lineTo(o.x, o.y);
  ctx.lineTo(b.x, b.y); ctx.lineTo(a.x, a.y);
  ctx.closePath(); ctx.fillStyle = schattiert(farbe, 0.8); ctx.fill();

  ctx.beginPath();                                   // vordere Dachfläche
  ctx.moveTo(w.x, w.y); ctx.lineTo(s.x, s.y);
  ctx.lineTo(b.x, b.y); ctx.lineTo(a.x, a.y);
  ctx.closePath(); ctx.fillStyle = schattiert(farbe, 1.0); ctx.fill();

  ctx.beginPath();                                   // Firstlinie
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = schattiert(farbe, 1.18);
  ctx.lineWidth = Math.max(1, hh * 0.12);
  ctx.stroke();
  return { a, b, n, o, s, w };
}

// Giebeldreieck an der rechten Stirnseite (zum Betrachter hin)
function isoGiebel(cx, cy, hw, hh, basis, first, farbe) {
  const y = cy - basis;
  ctx.beginPath();
  ctx.moveTo(cx + hw, y); ctx.lineTo(cx, y + hh);
  ctx.lineTo(cx + hw / 2, y + hh / 2 - first);
  ctx.closePath();
  ctx.fillStyle = schattiert(farbe, 0.8); ctx.fill();
}

// Walmdach / Pyramide: vier Flächen zu einer Spitze über der Mitte
function isoWalm(cx, cy, hw, hh, basis, hoehe, farbe) {
  const y = cy - basis, sp = { x: cx, y: y - hoehe };
  const n = { x: cx, y: y - hh }, o = { x: cx + hw, y: y };
  const s = { x: cx, y: y + hh }, w = { x: cx - hw, y: y };
  const flaeche = (p, q, f) => {
    ctx.beginPath();
    ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.lineTo(sp.x, sp.y);
    ctx.closePath(); ctx.fillStyle = schattiert(farbe, f); ctx.fill();
  };
  flaeche(n, o, 0.76); flaeche(n, w, 0.84);
  flaeche(w, s, 1.0);  flaeche(o, s, 0.68);
}

// Kegel (Turmhelm, Nadelbaum)
function isoKegel(cx, cy, r, hoehe, farbe) {
  ctx.beginPath();
  ctx.moveTo(cx - r, cy); ctx.lineTo(cx, cy - hoehe); ctx.lineTo(cx + r, cy);
  ctx.ellipse(cx, cy, r, r * KH / KW, 0, 0, Math.PI);
  ctx.closePath();
  ctx.fillStyle = schattiert(farbe, 0.78); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - r, cy); ctx.lineTo(cx, cy - hoehe); ctx.lineTo(cx, cy);
  ctx.ellipse(cx, cy, r, r * KH / KW, 0, Math.PI / 2, Math.PI);
  ctx.closePath();
  ctx.fillStyle = schattiert(farbe, 1.0); ctx.fill();
}

// Zylinder (Fass, Brennofen, Rundturm)
function isoZylinder(cx, cy, r, hoehe, farbe) {
  const ry = r * KH / KW;
  ctx.beginPath();
  ctx.moveTo(cx - r, cy);
  ctx.lineTo(cx - r, cy - hoehe);
  ctx.ellipse(cx, cy - hoehe, r, ry, 0, Math.PI, 0, true);
  ctx.lineTo(cx + r, cy);
  ctx.ellipse(cx, cy, r, ry, 0, 0, Math.PI);
  ctx.closePath();
  ctx.fillStyle = schattiert(farbe, 0.8); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx, cy - hoehe, r, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = schattiert(farbe, 1.05); ctx.fill();
}

// Kugel/Ballen
function isoKugel(cx, cy, r, farbe) {
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.6, r, 0, Math.PI * 2);
  ctx.fillStyle = farbe; ctx.fill();
  ctx.beginPath();
  ctx.arc(cx - r * 0.3, cy - r * 0.8, r * 0.45, 0, Math.PI * 2);
  ctx.fillStyle = schattiert(farbe, 1.12); ctx.fill();
}

// Stehender Pfosten
function pfosten(cx, cy, hoehe, dicke, farbe) {
  ctx.fillStyle = farbe;
  ctx.fillRect(cx - dicke / 2, cy - hoehe, dicke, hoehe);
}

// Fahnenmast mit wehendem Tuch
function isoFahne(cx, cy, hoehe, farbe) {
  pfosten(cx, cy, hoehe, Math.max(1.2, hoehe * 0.08), '#6b5a46');
  const weht = Math.sin(performance.now() / 420) * hoehe * 0.09;
  ctx.beginPath();
  ctx.moveTo(cx, cy - hoehe);
  ctx.lineTo(cx + hoehe * 0.55 + weht, cy - hoehe * 0.84);
  ctx.lineTo(cx, cy - hoehe * 0.66);
  ctx.closePath();
  ctx.fillStyle = farbe || '#c0392b'; ctx.fill();
}

// Aufsteigender Rauch
function isoRauch(cx, cy, gr) {
  const t = performance.now() / 1000;
  for (let i = 0; i < 3; i++) {
    const p = (t * 0.45 + i / 3) % 1;
    ctx.globalAlpha = (1 - p) * 0.38;
    ctx.beginPath();
    ctx.arc(cx + Math.sin(p * 4 + i) * gr * 0.5, cy - p * gr * 3.4, gr * (0.45 + p * 0.8), 0, Math.PI * 2);
    ctx.fillStyle = '#e8e8e8'; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- Baustil je Ausbaustufe -----------------------------
   Vom Strohdach-Schuppen bis zum Steinhaus mit Schieferdach:
   Wand, Dach, Sockel und Zierat ändern sich sichtbar.
   --------------------------------------------------------------- */
const BAUSTIL = [
  null,
  { wand: '#a37f55', dach: '#c9a868', balken: null,      sockel: null,
    gauben: 0, fahne: false, hoch: 0.72 },
  { wand: '#cdbb98', dach: '#c3a260', balken: null,      sockel: null,
    gauben: 0, fahne: false, hoch: 0.86 },
  { wand: '#ded0b2', dach: '#bb5540', balken: '#7a5636', sockel: null,
    gauben: 1, fahne: false, hoch: 1.0 },
  { wand: '#e6dac0', dach: '#c25c44', balken: '#6d4c2f', sockel: '#9d9384',
    gauben: 2, fahne: false, hoch: 1.18 },
  { wand: '#ece3d1', dach: '#6d7789', balken: null,      sockel: '#918b7f',
    gauben: 2, fahne: false, hoch: 1.36 },
  { wand: '#f3ecdc', dach: '#79839a', balken: null,      sockel: '#8a8477',
    gauben: 2, fahne: true,  hoch: 1.55, gold: '#d8b64a' },
];

function stilVon(geb) {
  const a = Math.max(1, Math.min(AUSBAU_MAX, geb.ausbau || 1));
  if (geb.typ === 'wohnhaus')
    return BAUSTIL[Math.max(1, Math.min(6, 1 + (geb.stufe || 0) + ((a - 1) >> 1)))];
  return BAUSTIL[Math.min(6, a)];
}

/* ---------- Das Standardhaus ----------------------------------- */
// cx/cy: Mitte der Bodenraute, hw/hh: halbe Rautenmaße.
// Liefert die Firsthöhe zurück, damit Aufbauten darauf passen.
function isoHaus(st, cx, cy, hw, hh, opt = {}) {
  const wandH = (opt.wandH === undefined ? HE * 0.62 : opt.wandH) * st.hoch;
  const dachH = opt.dachH === undefined ? HE * 0.52 : opt.dachH;
  const ueber = opt.ueber === undefined ? 1.12 : opt.ueber;      // Dachüberstand

  if (st.sockel) isoKasten(cx, cy, hw * 1.04, hh * 1.04, wandH * 0.22, st.sockel);
  isoKasten(cx, cy, hw, hh, wandH, st.wand);

  // Fachwerk auf der linken (helleren) Wand
  if (st.balken && hw > 9) {
    ctx.strokeStyle = st.balken;
    ctx.lineWidth = Math.max(0.8, hw * 0.05);
    ctx.beginPath();
    for (let i = 1; i <= 2; i++) {
      const t = i / 3;
      const px = cx - hw * t, py = cy + hh * (1 - t);
      ctx.moveTo(px, py); ctx.lineTo(px, py - wandH);
    }
    ctx.moveTo(cx, cy + hh - wandH * 0.5);
    ctx.lineTo(cx - hw, cy - wandH * 0.5);
    ctx.stroke();
  }
  // Tür auf der Vorderseite (linke Wandhälfte)
  if (opt.tuer !== false && hw > 10) {
    const t = 0.45;
    const px = cx - hw * t, py = cy + hh * (1 - t);
    ctx.fillStyle = '#5c4228';
    ctx.beginPath();
    ctx.moveTo(px - hw * 0.1, py + hh * 0.1);
    ctx.lineTo(px + hw * 0.1, py - hh * 0.1);
    ctx.lineTo(px + hw * 0.1, py - hh * 0.1 - wandH * 0.62);
    ctx.lineTo(px - hw * 0.1, py + hh * 0.1 - wandH * 0.62);
    ctx.closePath(); ctx.fill();
  }
  // Fenster auf der rechten Wand
  if (opt.fenster !== false && hw > 12) {
    ctx.fillStyle = 'rgba(74,100,126,0.92)';
    for (const t of (wandH > HE * 0.8 ? [0.3, 0.7] : [0.5])) {
      const px = cx + hw * t, py = cy + hh * (1 - t);
      for (const hy of (wandH > HE * 0.8 ? [0.35, 0.72] : [0.55])) {
        ctx.beginPath();
        ctx.moveTo(px - hw * 0.08, py + hh * 0.08 - wandH * hy);
        ctx.lineTo(px + hw * 0.08, py - hh * 0.08 - wandH * hy);
        ctx.lineTo(px + hw * 0.08, py - hh * 0.08 - wandH * (hy + 0.22));
        ctx.lineTo(px - hw * 0.08, py + hh * 0.08 - wandH * (hy + 0.22));
        ctx.closePath(); ctx.fill();
      }
    }
  }

  const dach = isoSattel(cx, cy, hw * ueber, hh * ueber, wandH, dachH, st.dach);
  isoGiebel(cx, cy, hw * ueber, hh * ueber, wandH, dachH, st.wand);

  // Dachgauben auf der vorderen Dachfläche
  if (st.gauben && hw > 14 && opt.gauben !== false) {
    for (let i = 0; i < st.gauben; i++) {
      const t = st.gauben === 1 ? 0.5 : 0.3 + i * 0.4;
      const gx = cx - hw * 0.5 + hw * t, gy = cy + hh * 0.25 - wandH - dachH * 0.45 + hh * t * 0.5;
      isoKasten(gx, gy, hw * 0.13, hh * 0.13, dachH * 0.45, st.wand);
      ctx.fillStyle = 'rgba(74,100,126,0.9)';
      ctx.fillRect(gx - hw * 0.06, gy - dachH * 0.42, hw * 0.12, dachH * 0.26);
    }
  }
  if (opt.schornstein !== false && hw > 11) {
    const sx = cx + hw * 0.42, sy = cy - hh * 0.3 - wandH - dachH * 0.4;
    isoKasten(sx, sy, hw * 0.1, hh * 0.1, dachH * 0.8, '#7d6a58');
    if (opt.rauch) isoRauch(sx, sy - dachH * 0.8, hw * 0.16);
  }
  if (st.fahne && opt.fahne !== false)
    isoFahne(cx - hw * 0.45, cy - wandH - dachH * 0.2, HE * 0.9, opt.fahnenFarbe || st.gold);
  return { wandH, dachH, first: wandH + dachH, dach };
}

/* ---------- Die einzelnen Gebäudearten ------------------------- */
// Alle bekommen die Mitte der Bodenraute (cx, cy) und deren halbe
// Maße (hw, hh). Oben links ist hinten, unten rechts vorn.

// Betrieb: Haus hinten links, Arbeitsplatz vorn rechts
function werkHof(st, cx, cy, hw, hh, arbeit, opt = {}) {
  const f = opt.hausAnteil === undefined ? 0.56 : opt.hausAnteil;
  isoHaus(st, cx - hw * (1 - f) * 0.55, cy - hh * (1 - f) * 0.55,
          hw * f, hh * f, Object.assign({ fahne: false }, opt));
  arbeit(cx + hw * (1 - f) * 0.55, cy + hh * (1 - f) * 0.55, hw * (1 - f), hh * (1 - f), st);
  if (st.fahne) isoFahne(cx - hw * 0.7, cy, HE, st.gold);
}

// Zaun um eine Fläche
function isoZaun(cx, cy, hw, hh, hoehe) {
  const ecke = [[cx, cy - hh], [cx + hw, cy], [cx, cy + hh], [cx - hw, cy]];
  ctx.strokeStyle = '#a07f52';
  ctx.lineWidth = 1.8;
  for (const q of [0.45, 0.9]) {
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = ecke[i], b = ecke[(i + 1) % 4];
      ctx.moveTo(a[0], a[1] - hoehe * q);
      ctx.lineTo(b[0], b[1] - hoehe * q);
    }
    ctx.stroke();
  }
  for (const e of ecke) pfosten(e[0], e[1], hoehe, 2.4, '#8a6a44');
  for (let i = 0; i < 4; i++) {
    const a = ecke[i], b = ecke[(i + 1) % 4];
    pfosten((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, hoehe * 0.9, 2, '#8a6a44');
  }
}

const BAU_ZEICHNER = {

  kontor(geb, st, cx, cy, hw, hh) {
    // Steg nach vorn ins Wasser
    isoKasten(cx + hw * 0.3, cy + hh * 0.55, hw * 0.55, hh * 0.55, 3, '#9b7a4f');
    // Lagerhaus
    const r = isoHaus(st, cx - hw * 0.2, cy - hh * 0.2, hw * 0.6, hh * 0.6,
                      { fahne: false, schornstein: false });
    // Kran am Steg
    const kx = cx + hw * 0.5, ky = cy + hh * 0.2;
    pfosten(kx, ky, HE * 1.5, 3, '#7a5f3c');
    ctx.strokeStyle = '#7a5f3c'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(kx, ky - HE * 1.5); ctx.lineTo(kx - hw * 0.45, ky - HE * 1.25);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(40,30,20,0.6)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(kx - hw * 0.43, ky - HE * 1.26); ctx.lineTo(kx - hw * 0.43, ky - HE * 0.6);
    ctx.stroke();
    isoKasten(kx - hw * 0.43, ky - HE * 0.6, hw * 0.1, hh * 0.1, 5, '#8a6a44');
    // Fässer am Kai
    for (let i = 0; i < 3; i++)
      isoZylinder(cx - hw * 0.1 + i * hw * 0.22, cy + hh * 0.5 + i * hh * 0.04,
                  hw * 0.07, 5, '#9c6b3e');
    isoFahne(cx - hw * 0.55, cy - hh * 0.2 - r.first, HE * 1.1,
             spieler[geb.spieler] && spieler[geb.spieler].farbe);
  },

  werft(geb, st, cx, cy, hw, hh) {
    isoKasten(cx + hw * 0.3, cy + hh * 0.4, hw * 0.6, hh * 0.6, 3, '#9b7a4f');
    isoHaus(st, cx - hw * 0.3, cy - hh * 0.3, hw * 0.52, hh * 0.52, { fahne: false });
    // Schiffsrumpf auf der Helling
    const sx = cx + hw * 0.32, sy = cy + hh * 0.34;
    ctx.beginPath();
    ctx.moveTo(sx - hw * 0.4, sy - 4);
    ctx.quadraticCurveTo(sx, sy + hh * 0.26, sx + hw * 0.4, sy - 6);
    ctx.quadraticCurveTo(sx, sy - hh * 0.1, sx - hw * 0.4, sy - 4);
    ctx.closePath();
    ctx.fillStyle = '#8a5f38'; ctx.fill();
    ctx.strokeStyle = '#5e4125'; ctx.lineWidth = 1.2; ctx.stroke();
    pfosten(sx, sy - 6, HE * 1.1, 2.5, '#6b4a2e');
    for (const dx of [-0.38, 0.38]) pfosten(sx + hw * dx, sy, HE * 0.8, 2, '#8a6a44');
  },

  marktplatz(geb, st, cx, cy, hw, hh) {
    // Gepflasterter Platz, leicht erhöht
    isoKasten(cx, cy, hw * 0.96, hh * 0.96, 2.5, '#cbb48d');
    // Brunnen in der Mitte
    isoZylinder(cx, cy, hw * 0.14, 6, '#9c9488');
    ctx.beginPath();
    ctx.ellipse(cx, cy - 6, hw * 0.11, hw * 0.11 * KH / KW, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#6ba3c4'; ctx.fill();
    // Zwei Marktstände: Tisch mit Waren, darüber eine gestreifte Plane
    const stand = (ox, oy, f1) => {
      const bx = cx + hw * ox, by = cy + hh * oy;
      const sw = hw * 0.3, sh = hh * 0.3;
      isoKasten(bx, by, sw, sh, HE * 0.35, '#8a6a44');          // Tisch
      for (const d of [[-1, 0], [1, 0], [0, -1], [0, 1]])
        pfosten(bx + sw * d[0], by + sh * d[1], HE * 0.95, 2, '#6b4a2e');
      const py = by - HE * 0.95;                                  // Plane
      ctx.beginPath();
      ctx.moveTo(bx, py - sh * 1.25); ctx.lineTo(bx + sw * 1.25, py);
      ctx.lineTo(bx, py + sh * 1.25); ctx.lineTo(bx - sw * 1.25, py);
      ctx.closePath(); ctx.fillStyle = '#f2ead8'; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx, py - sh * 1.25); ctx.lineTo(bx + sw * 1.25, py);
      ctx.lineTo(bx, py); ctx.closePath();
      ctx.fillStyle = f1; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx, py + sh * 1.25); ctx.lineTo(bx - sw * 1.25, py);
      ctx.lineTo(bx, py); ctx.closePath();
      ctx.fillStyle = f1; ctx.fill();
      isoKugel(bx - sw * 0.3, by - HE * 0.35, sw * 0.2, '#c76b2e');  // Waren
      isoKugel(bx + sw * 0.3, by - HE * 0.35, sw * 0.2, '#7aa845');
    };
    stand(-0.38, -0.12, '#c0392b');
    stand(0.32, 0.24, '#2d7a5f');
    if (st.fahne) isoFahne(cx + hw * 0.55, cy - hh * 0.3, HE, st.gold);
  },

  bruecke(geb, st, cx, cy, hw, hh) {
    isoKasten(cx, cy, hw * 0.98, hh * 0.98, 4, '#a8814f');
    ctx.strokeStyle = 'rgba(70,48,28,0.45)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 1; i < 5; i++) {
      const t = i / 5;
      ctx.moveTo(cx - hw + hw * t, cy - hh * t - 4);
      ctx.lineTo(cx + hw * t, cy + hh * (1 - t) - 4);
    }
    ctx.stroke();
    // Niedriges Geländer an den beiden vorderen Kanten
    ctx.strokeStyle = '#7b5c38';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + hw * 0.92, cy - 10); ctx.lineTo(cx, cy + hh * 0.92 - 10);
    ctx.lineTo(cx - hw * 0.92, cy - 10);
    ctx.stroke();
    for (const p of [[0.92, 0], [0, 0.92], [-0.92, 0]])
      pfosten(cx + hw * p[0], cy + hh * p[1] - 4, 7, 2.2, '#7b5c38');
  },

  wohnhaus(geb, st, cx, cy, hw, hh) {
    const r = isoHaus(st, cx, cy, hw * 0.74, hh * 0.74,
                      { schornstein: true, rauch: false });
    if ((geb.stufe || 0) >= 2 && hw > 16)        // Anbau ab Bürgern
      isoHaus(st, cx + hw * 0.5, cy + hh * 0.18, hw * 0.3, hh * 0.3,
              { fahne: false, schornstein: false, wandH: HE * 0.4, dachH: HE * 0.3, gauben: false });
    if ((geb.stufe || 0) >= 3 && hw > 18) {      // Vorgarten
      ctx.beginPath();
      ctx.ellipse(cx - hw * 0.45, cy + hh * 0.4, hw * 0.18, hh * 0.18, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#6f9a4e'; ctx.fill();
    }
    return r;
  },

  kapelle(geb, st, cx, cy, hw, hh) {
    // Kirchenschiff
    isoHaus(st, cx + hw * 0.16, cy + hh * 0.16, hw * 0.6, hh * 0.6,
            { fahne: false, gauben: false, schornstein: false, tuer: false,
              wandH: HE * 0.9, dachH: HE * 0.62 });
    // Glockenturm
    const tx = cx - hw * 0.42, ty = cy - hh * 0.42;
    isoKasten(tx, ty, hw * 0.2, hh * 0.2, HE * 1.5, st.wand);
    ctx.fillStyle = 'rgba(40,40,45,0.7)';
    ctx.fillRect(tx - hw * 0.07, ty - HE * 1.35, hw * 0.14, HE * 0.3);
    isoKegel(tx, ty - HE * 1.5, hw * 0.24, HE * 1.1, st.dach);
    ctx.strokeStyle = st.gold || '#e8dfc8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tx, ty - HE * 2.6); ctx.lineTo(tx, ty - HE * 3.0);
    ctx.moveTo(tx - 4, ty - HE * 2.88); ctx.lineTo(tx + 4, ty - HE * 2.88);
    ctx.stroke();
    // Rundbogenfenster am Schiff
    if (hw > 24) {
      ctx.fillStyle = 'rgba(74,100,126,0.9)';
      for (let i = 0; i < 3; i++) {
        const t = 0.25 + i * 0.25;
        const px = cx + hw * 0.16 - hw * 0.6 * t, py = cy + hh * 0.16 + hh * 0.6 * (1 - t);
        ctx.fillRect(px - 2, py - HE * 0.75, 4, HE * 0.4);
      }
    }
  },

  schule(geb, st, cx, cy, hw, hh) {
    const r = isoHaus(st, cx, cy, hw * 0.82, hh * 0.82, { wandH: HE * 0.78 });
    // Uhrengiebel über dem Eingang
    const gx = cx - hw * 0.25, gy = cy + hh * 0.25 - r.wandH - r.dachH * 0.2;
    ctx.beginPath();
    ctx.arc(gx, gy, hw * 0.12, 0, Math.PI * 2);
    ctx.fillStyle = '#f2ead8'; ctx.fill();
    ctx.strokeStyle = '#5b5346'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gx, gy); ctx.lineTo(gx, gy - hw * 0.08);
    ctx.moveTo(gx, gy); ctx.lineTo(gx + hw * 0.07, gy + hw * 0.03);
    ctx.stroke();
  },

  badehaus(geb, st, cx, cy, hw, hh) {
    isoHaus(st, cx - hw * 0.25, cy - hh * 0.25, hw * 0.55, hh * 0.55, { fahne: false });
    // Becken
    isoKasten(cx + hw * 0.32, cy + hh * 0.32, hw * 0.4, hh * 0.4, 4, '#9c9488');
    ctx.beginPath();
    ctx.moveTo(cx + hw * 0.32, cy + hh * 0.32 - hh * 0.3 - 4);
    ctx.lineTo(cx + hw * 0.32 + hw * 0.3, cy + hh * 0.32 - 4);
    ctx.lineTo(cx + hw * 0.32, cy + hh * 0.32 + hh * 0.3 - 4);
    ctx.lineTo(cx + hw * 0.32 - hw * 0.3, cy + hh * 0.32 - 4);
    ctx.closePath();
    ctx.fillStyle = '#6fb3d2'; ctx.fill();
    isoRauch(cx + hw * 0.32, cy + hh * 0.32 - 6, hw * 0.12);
  },

  theater(geb, st, cx, cy, hw, hh) {
    isoHaus(st, cx - hw * 0.12, cy - hh * 0.12, hw * 0.7, hh * 0.7,
            { fahne: false, tuer: false, wandH: HE * 0.85 });
    // Säulenvorbau
    const vx = cx + hw * 0.3, vy = cy + hh * 0.3;
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      pfosten(vx - hw * 0.35 + hw * 0.7 * t, vy - hh * 0.35 + hh * 0.7 * t,
              HE * 0.8, 3.5, st.wand);
    }
    isoKasten(vx, vy - HE * 0.8, hw * 0.44, hh * 0.44, 6, st.dach);
    if (st.fahne) {
      isoFahne(cx - hw * 0.5, cy - hh * 0.1, HE * 1.1, '#8e44ad');
      isoFahne(cx + hw * 0.1, cy - hh * 0.5, HE * 1.1, '#c0392b');
    }
  },

  ruhmeshalle(geb, st, cx, cy, hw, hh) {
    isoKasten(cx, cy, hw * 0.92, hh * 0.92, 5, st.sockel || '#a89e8c');
    // Säulenreihe ringsum
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      pfosten(cx - hw * 0.8 + hw * 0.8 * t, cy - 5 + hh * 0.8 * t, HE * 0.85, 4, st.wand);
      pfosten(cx + hw * 0.8 * t, cy - 5 + hh * 0.8 - hh * 0.8 * t, HE * 0.85, 4, schattiert(st.wand, 0.84));
    }
    isoKasten(cx, cy - HE * 0.85, hw * 0.88, hh * 0.88, 5, st.wand);
    isoWalm(cx, cy - HE * 0.85 - 5, hw * 0.88, hh * 0.88, 0, HE * 0.75, st.dach);
    ctx.beginPath();
    ctx.arc(cx, cy - HE * 0.85 - 5 - HE * 0.75, hw * 0.1, 0, Math.PI * 2);
    ctx.fillStyle = st.gold || '#cbb27a'; ctx.fill();
  },

  triumphbogen(geb, st, cx, cy, hw, hh) {
    const sockel = st.sockel || '#a89e8c';
    isoKasten(cx, cy, hw * 0.9, hh * 0.9, 5, sockel);          // Plattform
    // Zwei Pfeiler, dazwischen bleibt der Durchgang frei
    isoKasten(cx - hw * 0.44, cy + hh * 0.44 - 5, hw * 0.24, hh * 0.24, HE * 1.25, st.wand);
    isoKasten(cx + hw * 0.44, cy - hh * 0.44 - 5, hw * 0.24, hh * 0.24, HE * 1.25, st.wand);
    isoKasten(cx, cy - 5 - HE * 1.25, hw * 0.7, hh * 0.7, HE * 0.35, st.wand);
    isoKasten(cx, cy - 5 - HE * 1.6, hw * 0.74, hh * 0.74, 5, schattiert(st.wand, 0.86));
    isoKasten(cx, cy - 5 - HE * 1.75, hw * 0.26, hh * 0.26, HE * 0.4, st.gold || '#cbb27a');
  },

  statue(geb, st, cx, cy, hw, hh) {
    const stein = st.sockel || '#b3a994';
    const gold = st.gold || (st.sockel ? '#d8cba6' : '#c9b88c');
    const stufen = Math.min(3, 1 + ((geb.ausbau || 1) >> 1));
    let basis = 0;
    for (let i = 0; i < stufen; i++) {
      ctx.save(); ctx.translate(0, -basis);
      isoKasten(cx, cy, hw * (0.72 - i * 0.16), hh * (0.72 - i * 0.16), 4, stein);
      ctx.restore();
      basis += 4;
    }
    ctx.save(); ctx.translate(0, -basis);
    isoKasten(cx, cy, hw * 0.26, hh * 0.26, HE * 0.7, stein);
    ctx.restore();
    const fy = cy - basis - HE * 0.7;
    ctx.fillStyle = gold;                            // Figur
    ctx.beginPath();
    ctx.moveTo(cx - hw * 0.12, fy);
    ctx.lineTo(cx - hw * 0.08, fy - HE * 0.75);
    ctx.lineTo(cx + hw * 0.08, fy - HE * 0.75);
    ctx.lineTo(cx + hw * 0.12, fy);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, fy - HE * 0.92, hw * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = gold; ctx.lineWidth = Math.max(2, hw * 0.07);
    ctx.beginPath();
    ctx.moveTo(cx - hw * 0.06, fy - HE * 0.6); ctx.lineTo(cx - hw * 0.3, fy - HE * 1.1);
    ctx.stroke();
  },

  wachturm(geb, st, cx, cy, hw, hh) {
    const a = geb.ausbau || 1;
    const holz = a <= 2;
    const r = hw * (0.4 + a * 0.03);
    const hoehe = HE * (1.05 + a * 0.15);
    isoKasten(cx, cy, r, r * KH / KW, hoehe, holz ? '#9b7a4f' : (st.sockel || '#a8a08f'));
    ctx.fillStyle = 'rgba(40,40,45,0.75)';           // Schießscharte
    ctx.fillRect(cx - r * 0.12, cy - hoehe * 0.55, r * 0.24, hoehe * 0.2);
    // Auskragender Wehrgang mit Zinnen
    ctx.save(); ctx.translate(0, -hoehe);
    isoKasten(cx, cy, r * 1.25, r * 1.25 * KH / KW, 5, holz ? '#8a6a44' : (st.sockel || '#b6ae9c'));
    ctx.restore();
    const zinne = (ox, oy) => {
      ctx.save(); ctx.translate(0, -hoehe - 5);
      isoKasten(cx + ox, cy + oy, r * 0.22, r * 0.22 * KH / KW, 6,
                holz ? '#7a5f3c' : schattiert(st.dach, 0.9));
      ctx.restore();
    };
    zinne(0, -r * 1.1 * KH / KW); zinne(r * 1.1, 0);
    zinne(0, r * 1.1 * KH / KW); zinne(-r * 1.1, 0);
    isoFahne(cx, cy - hoehe - 10, HE * 0.9,
             spieler[geb.spieler] && spieler[geb.spieler].farbe);
  },

  kaserne(geb, st, cx, cy, hw, hh) {
    const mauer = st.sockel || '#a8a08f';
    const mh = HE * 1.15;
    isoKasten(cx, cy, hw * 0.86, hh * 0.86, mh, mauer);
    // Zinnen auf den beiden vorderen Mauerkronen
    for (let i = 0; i <= 4; i++) {
      const t = i / 4;
      // vorn rechts: von der Ostecke zur Südecke
      isoKasten(cx + hw * 0.86 * (1 - t), cy + hh * 0.86 * t - mh,
                hw * 0.08, hh * 0.08, 7, schattiert(mauer, 0.9));
      // vorn links: von der Südecke zur Westecke
      isoKasten(cx - hw * 0.86 * t, cy + hh * 0.86 * (1 - t) - mh,
                hw * 0.08, hh * 0.08, 7, schattiert(mauer, 0.98));
    }
    // Ecktürme
    for (const [ox, oy] of [[-0.86, 0], [0.86, 0], [0, -0.86], [0, 0.86]]) {
      isoKasten(cx + hw * ox, cy + hh * oy, hw * 0.16, hh * 0.16, HE * 1.6, mauer);
      isoKegel(cx + hw * ox, cy + hh * oy - HE * 1.6, hw * 0.2, HE * 0.7,
               schattiert(st.dach, 0.95));
    }
    // Tor an der Vorderseite
    ctx.fillStyle = '#5c4228';
    const px = cx - hw * 0.4, py = cy + hh * 0.6;
    ctx.beginPath();
    ctx.moveTo(px - hw * 0.1, py + hh * 0.1);
    ctx.lineTo(px + hw * 0.1, py - hh * 0.1);
    ctx.lineTo(px + hw * 0.1, py - hh * 0.1 - HE * 0.8);
    ctx.lineTo(px - hw * 0.1, py + hh * 0.1 - HE * 0.8);
    ctx.closePath(); ctx.fill();
    isoFahne(cx, cy - hh * 0.9 - HE * 1.3, HE * 1.2,
             spieler[geb.spieler] && spieler[geb.spieler].farbe);
  },

  // --- Rohstoffe und Betriebe ---------------------------------
  holzfaeller(geb, st, cx, cy, hw, hh) {
    werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      for (let r = 0; r < 2; r++) for (let i = 0; i < 3 - r; i++)
        isoZylinder(bx - bw * 0.3 + i * bw * 0.3, by + bh * 0.2 - r * 5 - i * bh * 0.1,
                    bw * 0.16, 5, '#a07a4c');
      pfosten(bx + bw * 0.4, by - bh * 0.3, HE * 0.4, 3, '#6b4a2e');
      ctx.fillStyle = '#c3cbd3';
      ctx.fillRect(bx + bw * 0.32, by - bh * 0.3 - HE * 0.45, bw * 0.2, 4);
    });
  },

  fischer(geb, st, cx, cy, hw, hh) {
    werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      // Boot
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.5, by + bh * 0.1);
      ctx.quadraticCurveTo(bx, by + bh * 0.7, bx + bw * 0.5, by + bh * 0.15);
      ctx.quadraticCurveTo(bx, by + bh * 0.3, bx - bw * 0.5, by + bh * 0.1);
      ctx.closePath();
      ctx.fillStyle = '#3f7fa6'; ctx.fill();
      ctx.strokeStyle = '#27536e'; ctx.lineWidth = 1.2; ctx.stroke();
      // Netz am Gestell
      for (const dx of [-0.45, 0.45]) pfosten(bx + bw * dx, by - bh * 0.3, HE * 0.7, 2.5, '#7a5f3c');
      ctx.strokeStyle = 'rgba(248,246,236,0.95)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 3; i++) {
        const t = i / 3;
        ctx.moveTo(bx - bw * 0.45 + bw * 0.9 * t, by - bh * 0.3 - HE * 0.7);
        ctx.lineTo(bx - bw * 0.45 + bw * 0.9 * t, by - bh * 0.3 - HE * 0.2);
        ctx.moveTo(bx - bw * 0.45, by - bh * 0.3 - HE * (0.7 - t * 0.5));
        ctx.lineTo(bx + bw * 0.45, by - bh * 0.3 - HE * (0.7 - t * 0.5));
      }
      ctx.stroke();
    });
  },

  jagd(geb, st, cx, cy, hw, hh) {
    werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      for (const dx of [-0.45, 0.45]) pfosten(bx + bw * dx, by + bh * 0.1, HE * 0.8, 2.5, '#7a5f3c');
      ctx.beginPath();
      ctx.ellipse(bx, by + bh * 0.1 - HE * 0.5, bw * 0.38, HE * 0.3, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#a9743f'; ctx.fill();
      ctx.strokeStyle = '#e8ddc4'; ctx.lineWidth = 1.2; ctx.stroke();
    });
  },

  weberei(geb, st, cx, cy, hw, hh) {
    werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      for (const dx of [-0.45, 0.45]) pfosten(bx + bw * dx, by - bh * 0.2, HE * 0.75, 2.5, '#7a5f3c');
      ctx.strokeStyle = '#cfd8e2'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 1; i < 6; i++) {
        const px = bx - bw * 0.45 + bw * 0.9 * (i / 6);
        ctx.moveTo(px, by - bh * 0.2 - HE * 0.75); ctx.lineTo(px, by - bh * 0.2 - HE * 0.1);
      }
      ctx.stroke();
      for (let i = 0; i < 3; i++)
        isoKugel(bx - bw * 0.3 + i * bw * 0.3, by + bh * 0.4, bw * 0.17, '#f3f0e6');
    });
  },

  schneiderei(geb, st, cx, cy, hw, hh) {
    werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      for (const dx of [-0.45, 0.45]) pfosten(bx + bw * dx, by, HE * 0.8, 2.5, '#8a7a60');
      ctx.strokeStyle = '#8a7a60'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.45, by - HE * 0.8); ctx.lineTo(bx + bw * 0.45, by - HE * 0.8);
      ctx.stroke();
      ctx.fillStyle = '#4a6fa5';
      ctx.fillRect(bx - bw * 0.35, by - HE * 0.78, bw * 0.3, HE * 0.45);
      ctx.fillStyle = '#b5495b';
      ctx.fillRect(bx + bw * 0.05, by - HE * 0.78, bw * 0.3, HE * 0.45);
    });
  },

  tabakladen(geb, st, cx, cy, hw, hh) {
    werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      for (const dx of [-0.45, 0.45]) pfosten(bx + bw * dx, by - bh * 0.2, HE * 0.7, 2.5, '#7a5f3c');
      ctx.fillStyle = '#8a5a2c';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(bx - bw * 0.35 + i * bw * 0.23, by - bh * 0.2 - HE * 0.45,
                    bw * 0.09, HE * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 2; i++)
        isoZylinder(bx - bw * 0.2 + i * bw * 0.4, by + bh * 0.4, bw * 0.15, 6, '#9c6b3e');
    });
  },

  schaffarm(geb, st, cx, cy, hw, hh) { hofMitKoppel(st, cx, cy, hw, hh, 3, '#f5f2e8', null); },
  rinderfarm(geb, st, cx, cy, hw, hh) { hofMitKoppel(st, cx, cy, hw, hh, 2, '#7d4f33', '#f0ece2'); },

  getreidefarm(geb, st, cx, cy, hw, hh) {
    scheuneMitGut(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      ctx.fillStyle = '#d9b457';
      for (let i = 0; i < 3; i++) {
        const gx = bx - bw * 0.3 + i * bw * 0.3, gy = by + bh * 0.1 + i * bh * 0.08;
        ctx.beginPath();
        ctx.moveTo(gx - bw * 0.12, gy);
        ctx.lineTo(gx, gy - HE * 0.8);
        ctx.lineTo(gx + bw * 0.12, gy);
        ctx.closePath(); ctx.fill();
      }
    });
  },

  zuckerrohr(geb, st, cx, cy, hw, hh) {
    scheuneMitGut(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      ctx.strokeStyle = '#6f9b3c'; ctx.lineWidth = Math.max(1.5, bw * 0.1);
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const gx = bx - bw * 0.35 + i * bw * 0.18;
        ctx.moveTo(gx, by + bh * 0.2); ctx.lineTo(gx + bw * 0.06, by + bh * 0.2 - HE * 0.9);
      }
      ctx.stroke();
    });
  },

  tabakplantage(geb, st, cx, cy, hw, hh) {
    scheuneMitGut(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      for (const dx of [-0.4, 0.4]) pfosten(bx + bw * dx, by + bh * 0.2, HE * 0.8, 2.5, '#7a5f3c');
      ctx.fillStyle = '#9c6a30';
      for (let r = 0; r < 2; r++) for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(bx - bw * 0.28 + i * bw * 0.28, by + bh * 0.2 - HE * (0.62 - r * 0.28),
                    bw * 0.1, HE * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  },

  gewuerzplantage(geb, st, cx, cy, hw, hh) {
    scheuneMitGut(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      isoKasten(bx, by, bw * 0.55, bh * 0.55, 2, '#c9b48a');
      const farben = ['#c0392b', '#e0871f', '#8a5a2c'];
      for (let i = 0; i < 3; i++)
        isoKugel(bx - bw * 0.25 + i * bw * 0.25, by - 2 + i * bh * 0.1, bw * 0.12, farben[i]);
    });
  },

  eisenmine(geb, st, cx, cy, hw, hh) { mineZeichnen(st, cx, cy, hw, hh, '#9fb3c8', '#6d7d8e'); },
  goldmine(geb, st, cx, cy, hw, hh) { mineZeichnen(st, cx, cy, hw, hh, '#e9c04a', '#b8882a'); },

  ziegelei(geb, st, cx, cy, hw, hh) {
    werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      isoZylinder(bx, by, bw * 0.45, HE * 0.8, '#9c6b4a');
      isoKegel(bx, by - HE * 0.8, bw * 0.45, HE * 0.55, '#8a5a3a');
      ctx.fillStyle = '#e8781f';
      ctx.fillRect(bx - bw * 0.14, by - HE * 0.5, bw * 0.28, HE * 0.28);
      isoRauch(bx, by - HE * 1.35, bw * 0.22);
      for (let r = 0; r < 3; r++) {
        ctx.fillStyle = '#b45a3c';
        ctx.fillRect(bx - bw * 0.7, by + bh * 0.3 - r * 4, bw * 0.4, 4);
      }
    }, { hausAnteil: 0.46 });
  },

  muehle(geb, st, cx, cy, hw, hh) {
    isoZylinder(cx, cy, hw * 0.4, HE * 1.9, st.wand);
    isoKegel(cx, cy - HE * 1.9, hw * 0.44, HE * 0.8, st.dach);
    ctx.fillStyle = '#5c4228';
    ctx.fillRect(cx - hw * 0.1, cy - HE * 0.7, hw * 0.2, HE * 0.7);
    // Drehende Flügel vor dem Turm
    const dreh = performance.now() / 2600;
    ctx.save();
    ctx.translate(cx - hw * 0.1, cy - HE * 2.0);
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(dreh + i * Math.PI / 2);
      ctx.fillStyle = '#7a5f3c';
      ctx.fillRect(-hw * 0.03, 0, hw * 0.06, hw * 0.75);
      ctx.fillStyle = 'rgba(245,240,225,0.85)';
      ctx.fillRect(hw * 0.03, hw * 0.18, hw * 0.14, hw * 0.5);
      ctx.restore();
    }
    ctx.restore();
  },

  baeckerei(geb, st, cx, cy, hw, hh) {
    werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      isoZylinder(bx, by, bw * 0.42, HE * 0.5, '#b08462');
      isoKegel(bx, by - HE * 0.5, bw * 0.42, HE * 0.45, '#a2795a');
      ctx.fillStyle = '#e8781f';
      ctx.fillRect(bx - bw * 0.12, by - HE * 0.35, bw * 0.24, HE * 0.24);
      isoRauch(bx, by - HE * 0.95, bw * 0.2);
      for (let i = 0; i < 3; i++)
        isoKugel(bx - bw * 0.3 + i * bw * 0.3, by + bh * 0.45, bw * 0.1, '#d7a556');
    }, { hausAnteil: 0.5 });
  },

  brennerei(geb, st, cx, cy, hw, hh) {
    werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
      isoZylinder(bx, by, bw * 0.34, HE * 0.7, '#c47a3c');
      isoKegel(bx, by - HE * 0.7, bw * 0.34, HE * 0.5, '#a2602c');
      ctx.strokeStyle = '#8a5428'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bx, by - HE * 1.2); ctx.lineTo(bx + bw * 0.4, by - HE * 1.0);
      ctx.stroke();
      for (let i = 0; i < 2; i++)
        isoZylinder(bx - bw * 0.2 + i * bw * 0.45, by + bh * 0.45, bw * 0.15, 6, '#9c6b3e');
    }, { schornstein: true, rauch: true, hausAnteil: 0.48 });
  },

  schmiede(geb, st, cx, cy, hw, hh) { schmiedeZeichnen(st, cx, cy, hw, hh, 'werkzeug'); },
  waffenschmiede(geb, st, cx, cy, hw, hh) { schmiedeZeichnen(st, cx, cy, hw, hh, 'waffe'); },
  goldschmiede(geb, st, cx, cy, hw, hh) { schmiedeZeichnen(st, cx, cy, hw, hh, 'gold'); },
};

// Hof mit Scheune und eingezäunter Koppel
function hofMitKoppel(st, cx, cy, hw, hh, tiere, farbe, fleck) {
  isoHaus(st, cx - hw * 0.26, cy - hh * 0.26, hw * 0.52, hh * 0.52,
          { ueber: 1.3, tuer: false, fahne: false, schornstein: false });
  const kx = cx + hw * 0.34, ky = cy + hh * 0.34, kw = hw * 0.56, kh = hh * 0.56;
  isoKasten(kx, ky, kw, kh, 1.5, '#9bb268');
  isoZaun(kx, ky, kw, kh, 7);
  for (let i = 0; i < tiere; i++) {
    const ox = (i % 2 - 0.5) * kw * 0.7, oy = (Math.floor(i / 2) - 0.25) * kh * 0.9;
    const r = Math.max(3.5, kw * 0.24);
    isoKugel(kx + ox, ky + oy, r, farbe);
    ctx.beginPath();                                   // Kopf
    ctx.arc(kx + ox - r * 1.0, ky + oy - r * 0.85, r * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = fleck || '#d8d4c6'; ctx.fill();
  }
}

// Scheune mit gelagertem Erntegut daneben
function scheuneMitGut(st, cx, cy, hw, hh, gut) {
  isoHaus(st, cx - hw * 0.24, cy - hh * 0.24, hw * 0.56, hh * 0.56,
          { ueber: 1.3, tuer: false, fahne: false, schornstein: false });
  gut(cx + hw * 0.34, cy + hh * 0.34, hw * 0.42, hh * 0.42, st);
  if (st.fahne) isoFahne(cx - hw * 0.7, cy, HE, st.gold);
}

// Bergwerk: Stollen im Fels mit Lore
function mineZeichnen(st, cx, cy, hw, hh, erzHell, erzDunkel) {
  // Felsbrocken
  isoKegel(cx - hw * 0.1, cy - hh * 0.1, hw * 0.6, HE * 1.6, '#8e857a');
  isoKegel(cx + hw * 0.35, cy + hh * 0.1, hw * 0.3, HE * 0.9, '#9a9186');
  // Erzader
  ctx.strokeStyle = erzDunkel; ctx.lineWidth = Math.max(2, hw * 0.1);
  ctx.beginPath();
  ctx.moveTo(cx - hw * 0.45, cy - HE * 0.4);
  ctx.quadraticCurveTo(cx, cy - HE * 1.0, cx + hw * 0.35, cy - HE * 0.5);
  ctx.stroke();
  ctx.strokeStyle = erzHell; ctx.lineWidth = Math.max(1, hw * 0.05);
  ctx.stroke();
  // Stolleneingang nach vorn
  const sx = cx - hw * 0.12, sy = cy + hh * 0.5;
  ctx.fillStyle = '#2b241d';
  ctx.beginPath();
  ctx.moveTo(sx - hw * 0.16, sy); ctx.lineTo(sx + hw * 0.16, sy);
  ctx.lineTo(sx + hw * 0.16, sy - HE * 0.5);
  ctx.quadraticCurveTo(sx, sy - HE * 0.75, sx - hw * 0.16, sy - HE * 0.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7a5f3c'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(sx - hw * 0.2, sy + 2); ctx.lineTo(sx - hw * 0.2, sy - HE * 0.55);
  ctx.lineTo(sx + hw * 0.2, sy - HE * 0.55); ctx.lineTo(sx + hw * 0.2, sy + 2);
  ctx.stroke();
  // Volle Lore
  isoKasten(cx + hw * 0.4, cy + hh * 0.55, hw * 0.17, hh * 0.17, 6, '#6b5a46');
  isoKugel(cx + hw * 0.4, cy + hh * 0.55 - 6, hw * 0.1, erzHell);
  if (st.fahne) isoFahne(cx - hw * 0.6, cy + hh * 0.3, HE, st.gold);
}

// Schmiede: Werkstatt mit glühender Esse, Amboss und Zunftzeichen
function schmiedeZeichnen(st, cx, cy, hw, hh, art) {
  werkHof(st, cx, cy, hw, hh, (bx, by, bw, bh) => {
    isoKasten(bx, by - bh * 0.2, bw * 0.45, bh * 0.45, HE * 0.5, '#6b5a46');
    const glut = 0.55 + Math.sin(performance.now() / 260) * 0.3;
    ctx.globalAlpha = glut;
    ctx.fillStyle = '#ff8a2b';
    ctx.fillRect(bx - bw * 0.2, by - bh * 0.2 - HE * 0.42, bw * 0.4, HE * 0.22);
    ctx.globalAlpha = 1;
    isoRauch(bx, by - bh * 0.2 - HE * 0.5, bw * 0.18);
    isoKasten(bx - bw * 0.1, by + bh * 0.5, bw * 0.2, bh * 0.2, 5, '#4e5056');
    if (art === 'gold') {
      for (let i = 0; i < 3; i++)
        isoKasten(bx + bw * 0.45, by + bh * 0.2 - i * 4, bw * 0.14, bh * 0.14, 4, '#e9c04a');
    } else if (art === 'waffe') {
      ctx.strokeStyle = '#c3cbd3'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.2, by + bh * 0.1); ctx.lineTo(bx + bw * 0.7, by - HE * 0.7);
      ctx.moveTo(bx + bw * 0.7, by + bh * 0.1); ctx.lineTo(bx + bw * 0.2, by - HE * 0.7);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.2, by + bh * 0.1); ctx.lineTo(bx + bw * 0.6, by - HE * 0.6);
      ctx.stroke();
      ctx.fillStyle = '#c3cbd3';
      ctx.fillRect(bx + bw * 0.45, by - HE * 0.72, bw * 0.3, 5);
    }
  }, { hausAnteil: 0.5, schornstein: true, rauch: false });
}

// Einstieg: ein Bauwerk an seinem Platz zeichnen
function gebaeudeZeichnen(geb) {
  const def = GEBAEUDE[geb.typ];
  const hoch = hoeheBei(geb.x, geb.y);
  const cx = isoX(geb.x + def.w / 2, geb.y + def.h / 2);
  const cy = isoY(geb.x + def.w / 2, geb.y + def.h / 2) - hoch;
  const hw = (def.w + def.h) * KW / 4;
  const hh = (def.w + def.h) * KH / 4;
  const st = stilVon(geb);

  // Schatten auf dem Boden
  ctx.beginPath();
  ctx.ellipse(cx + hw * 0.18, cy + hh * 0.2, hw * 0.78, hh * 0.78, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(30,40,20,0.18)';
  ctx.fill();

  const zeichner = BAU_ZEICHNER[geb.typ];
  if (zeichner) zeichner(geb, st, cx, cy, hw, hh);
  else if (FELD_FARMEN.has(geb.typ)) scheuneMitGut(st, cx, cy, hw, hh, () => {});
  else isoHaus(st, cx, cy, hw * 0.8, hh * 0.8, { schornstein: true, rauch: true });
  return { cx, cy, hw, hh };
}

function zeichnen() {
  // Leinwandgröße an das Fenster anpassen (inkl. HiDPI)
  dpr = window.devicePixelRatio || 1;
  const b = leinwand.clientWidth, h = leinwand.clientHeight;
  if (leinwand.width !== b * dpr || leinwand.height !== h * dpr) {
    leinwand.width = b * dpr; leinwand.height = h * dpr;
  }
  if (state.terrainAlt) terrainZeichnen();
  gelaendeBereit();                  // gilt der Gelände-Cache noch für diese Karte?
  if (schmutzKacheln.size) schmutzKacheln.clear();

  // Hintergrund: tiefes Meer
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#1a4764';
  ctx.fillRect(0, 0, b, h);

  // Ab hier in Weltkoordinaten zeichnen
  const z = kamera.zoom;
  ctx.setTransform(dpr * z, 0, 0, dpr * z, -kamera.x * dpr * z, -kamera.y * dpr * z);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const s = sichtBereich();
  const fein = z > 0.45;             // bei starker Verkleinerung ohne Kleinkram
  const fern = z < FERN_ZOOM;        // ganz weit weg: nur noch das Übersichtsbild
  if (fern) {
    // Neue Welt? Dann alles neu malen. Haben sich nur einzelne Bäume
    // geändert, werden bloß diese Stellen ausgebessert – es sei denn,
    // es sind sehr viele (etwa nach langem Spielen in der Nahsicht).
    if (!uebersicht || uebersichtAlt) {
      uebersichtBauen();
      ctx.setTransform(dpr * z, 0, 0, dpr * z, -kamera.x * dpr * z, -kamera.y * dpr * z);
    } else if (uebersichtSchmutz.size) {
      uebersichtPflegen();
      ctx.setTransform(dpr * z, 0, 0, dpr * z, -kamera.x * dpr * z, -kamera.y * dpr * z);
    }
    ctx.drawImage(uebersicht, 0, -UE_RAND, uebersicht.width / UE, uebersicht.height / UE);
  } else {
    bodenZeichnen(s, fein);
  }

  // Gitterlinien nur beim Bauen einblenden
  const bauModus = state.werkzeug !== 'zeiger' && state.werkzeug !== 'abriss';
  if (bauModus && z >= 0.4) {      // weit weg wäre es nur ein grauer Schleier
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1 / z;
    ctx.beginPath();
    for (let y = s.y0; y <= s.y1 + 1; y++) {
      ctx.moveTo(isoX(s.x0, y), isoY(s.x0, y) - H_LAND);
      ctx.lineTo(isoX(s.x1 + 1, y), isoY(s.x1 + 1, y) - H_LAND);
    }
    for (let x = s.x0; x <= s.x1 + 1; x++) {
      ctx.moveTo(isoX(x, s.y0), isoY(x, s.y0) - H_LAND);
      ctx.lineTo(isoX(x, s.y1 + 1), isoY(x, s.y1 + 1) - H_LAND);
    }
    ctx.stroke();
  }

  // Äcker, Truppen und Schiffe nach Kacheln sortieren, damit alles
  // in der richtigen Tiefenreihenfolge gezeichnet werden kann
  const aecker = new Map();
  for (const geb of gebaeude) {
    if (!geb.felder || !geb.felder.length) continue;
    for (const idx of geb.felder) aecker.set(idx, geb);
  }
  const einheiten = new Map();
  const merke = (idx, sache) => {
    const l = einheiten.get(idx);
    if (l) l.push(sache); else einheiten.set(idx, [sache]);
  };
  for (const t of truppen) {
    const tx = Math.floor(t.x), ty = Math.floor(t.y);
    if (tx >= 0 && ty >= 0 && tx < N && ty < N) merke(ty * N + tx, { art: 'trupp', t });
  }
  for (const p of piraten) {
    const tx = Math.floor(p.x), ty = Math.floor(p.y);
    if (tx >= 0 && ty >= 0 && tx < N && ty < N) merke(ty * N + tx, { art: 'pirat', p });
  }
  for (const sp of spieler)
    if (sp.ki && sp.schiff && (!sp.kontor || sp.schiff.pfad.length)) {
      const tx = Math.floor(sp.schiff.x), ty = Math.floor(sp.schiff.y);
      if (tx >= 0 && ty >= 0 && tx < N && ty < N)
        merke(ty * N + tx, { art: 'schiff', s: sp.schiff, farbe: sp.farbe, gross: false });
    }
  {
    const tx = Math.floor(schiff.x), ty = Math.floor(schiff.y);
    if (tx >= 0 && ty >= 0 && tx < N && ty < N)
      merke(ty * N + tx, { art: 'schiff', s: schiff, gross: true,
                           farbe: spieler[ICH] && spieler[ICH].farbe });
  }

  // --- Alles Aufrechte von hinten nach vorn ---
  const wippen = Math.sin(performance.now() / 650) * 1.5;
  const einheitZeichnen = e => {
    if (e.art === 'schiff')
      segelschiff(isoX(e.s.x, e.s.y), isoY(e.s.x, e.s.y),
                  KW * (e.gross ? 0.5 : 0.42) * (fern ? 1.6 : 1), e.farbe, wippen);
    else if (e.art === 'pirat') piratZeichnen(e.p, wippen);
    else truppZeichnen(e.t, wippen);
  };
  if (fern) {
    // Fernsicht: Boden, Berge und Wälder stecken schon im Übersichtsbild.
    // Frisch dazu kommen nur Äcker, vereinfachte Gebäude und Einheiten.
    for (const [idx, geb] of aecker) {
      const x = idx % N, y = (idx / N) | 0;
      if (imBild(s, x, y)) ackerZeichnen(x, y, geb);
    }
    const reihenfolge = gebaeude.slice().sort((a, b) => (a.y - b.y) || (a.x - b.x));
    for (const geb of reihenfolge) {
      if (!imBild(s, geb.x, geb.y)) continue;
      gebaeudeFern(geb);
      gebaeudeMarken(geb, false);
    }
    for (const liste of einheiten.values()) for (const e of liste) einheitZeichnen(e);
  } else {
    for (let y = s.y0; y <= s.y1; y++) {
      for (let x = s.x0; x <= s.x1; x++) {
        if (!imBild(s, x, y)) continue;
        const idx = y * N + x;

        const ackerGeb = aecker.get(idx);
        if (ackerGeb) { baeumeMalen(); ackerZeichnen(x, y, ackerGeb); }

        // Bäume werden nur gesammelt; gemalt wird am Reihenende oder
        // bevor etwas anderes an die Reihe kommt (Verdeckung!)
        const k = karte[idx];
        if (k.typ === 'berg') { baeumeMalen(); bergKachel(x, y, fein); }
        else if (k.baum > 0.02) baeumeSammeln(x, y, k, fein, z > 0.75);

        const geb = belegt[idx];
        if (geb && geb.x === x && geb.y === y) {
          baeumeMalen();
          gebaeudeZeichnen(geb);
          gebaeudeMarken(geb, fein);
        }

        const liste = einheiten.get(idx);
        if (liste) { baeumeMalen(); for (const e of liste) einheitZeichnen(e); }
      }
      baeumeMalen();
    }
  }

  // --- Überlagerungen: Wege, Reichweiten, Vorschau ---
  // (Wegpunkte sind Kachelmitten – also schon mit den „,5" darin)
  if (schiff.pfad.length) {
    const p = schiff.pfad[schiff.pfad.length - 1];
    zielFaehnchen(isoX(p.x, p.y), isoY(p.x, p.y));
  }
  if (state.truppAuswahl && state.truppAuswahl.pfad.length) {
    // Weg der ausgewählten Truppe: gestrichelte Linie bis zum Ziel
    const tA = state.truppAuswahl, p = tA.pfad[tA.pfad.length - 1];
    const zielY = isoY(p.x, p.y) - hoeheBei(Math.floor(p.x), Math.floor(p.y));
    ctx.beginPath();
    ctx.moveTo(isoX(tA.x, tA.y), isoY(tA.x, tA.y) - hoeheBei(Math.floor(tA.x), Math.floor(tA.y)));
    ctx.lineTo(isoX(p.x, p.y), zielY);
    ctx.strokeStyle = 'rgba(22,163,74,0.8)';
    ctx.lineWidth = 2.5 / Math.sqrt(z);
    ctx.setLineDash([8 / z, 6 / z]);
    ctx.stroke();
    ctx.setLineDash([]);
    zielFaehnchen(isoX(p.x, p.y), zielY, '#16a34a');
  }

  // Plaketten der Truppen über allem – kein Haus und kein Baum verdeckt sie
  for (const t of truppen)
    if (imBild(s, Math.floor(t.x), Math.floor(t.y))) truppPlakette(t);
  for (const p of piraten)
    if (imBild(s, Math.floor(p.x), Math.floor(p.y))) piratPlakette(p);

  if (state.werkzeug === 'kontor')
    kreisZeichnen({ x: schiff.x, y: schiff.y }, SIM.schiffBauRadius);

  if (state.auswahl) {
    const def = GEBAEUDE[state.auswahl.typ];
    const radius = def.marktRadius || def.radius;
    if (radius && !FELD_FARMEN.has(state.auswahl.typ))
      kreisZeichnen(zentrum(state.auswahl), radius);
  }

  // --- Bau-Vorschau ---
  if (bauModus) {
    let t = null;
    if (state.vorschau && state.vorschau.modus === 'bau')
      t = { x: state.vorschau.tx, y: state.vorschau.ty };
    else if (state.hover)
      t = bildschirmZuKachel(state.hover.sx, state.hover.sy);
    if (t) {
      const def = GEBAEUDE[state.werkzeug];
      const a = ankerVon(state.werkzeug, t.x, t.y);
      const ok = platzOK(state.werkzeug, a.x, a.y).ok && kostenReichen(state.werkzeug);
      const radius = def.marktRadius || def.radius;
      if (radius && !FELD_FARMEN.has(state.werkzeug))
        kreisZeichnen({ x: a.x + def.w / 2, y: a.y + def.h / 2 }, radius);

      if (FELD_FARMEN.has(state.werkzeug)) {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const fx = a.x + dx, fy = a.y + dy;
          const k = kachel(fx, fy);
          if (!k) continue;
          rautePfad(fx, fy, hoeheBei(fx, fy), 0);
          ctx.fillStyle = (k.typ === 'gras' && !belegtAuf(fx, fy))
            ? 'rgba(22,163,74,0.32)' : 'rgba(90,90,90,0.32)';
          ctx.fill();
        }
      }

      // Grundriss der geplanten Stelle einfärben
      for (let dy = 0; dy < def.h; dy++) for (let dx = 0; dx < def.w; dx++) {
        rautePfad(a.x + dx, a.y + dy, hoeheBei(a.x, a.y), 0);
        ctx.fillStyle = ok ? 'rgba(22,163,74,0.38)' : 'rgba(220,38,38,0.38)';
        ctx.fill();
      }
      ctx.beginPath();
      const hoch = hoeheBei(a.x, a.y);
      ctx.moveTo(isoX(a.x, a.y), isoY(a.x, a.y) - hoch);
      ctx.lineTo(isoX(a.x + def.w, a.y), isoY(a.x + def.w, a.y) - hoch);
      ctx.lineTo(isoX(a.x + def.w, a.y + def.h), isoY(a.x + def.w, a.y + def.h) - hoch);
      ctx.lineTo(isoX(a.x, a.y + def.h), isoY(a.x, a.y + def.h) - hoch);
      ctx.closePath();
      ctx.strokeStyle = ok ? '#16a34a' : '#dc2626';
      ctx.lineWidth = 2 / z;
      ctx.stroke();

      // Voraussichtliche Auslastung über der Vorschau
      const effWert = effVorschau(state.werkzeug, a.x, a.y);
      if (effWert !== null) {
        const prozent = Math.round(effWert * 100);
        const groesse = 15 / Math.sqrt(z);
        ctx.font = `bold ${groesse}px system-ui, sans-serif`;
        const tx = isoX(a.x + def.w / 2, a.y + def.h / 2);
        const ty = isoY(a.x + def.w / 2, a.y + def.h / 2) - hoch - HE * 1.6;
        ctx.lineWidth = groesse * 0.28;
        ctx.strokeStyle = 'rgba(17,24,39,0.75)';
        ctx.strokeText(prozent + ' %', tx, ty);
        ctx.fillStyle = prozent >= 80 ? '#86efac' : prozent >= 40 ? '#fde68a' : '#fca5a5';
        ctx.fillText(prozent + ' %', tx, ty);
      }
    }
  }

  // Abriss-Vorschau
  if (state.werkzeug === 'abriss') {
    let geb = null;
    if (state.vorschau && state.vorschau.modus === 'abriss') geb = state.vorschau.geb;
    else if (state.hover) {
      const t = bildschirmZuKachel(state.hover.sx, state.hover.sy);
      geb = t && belegtAuf(t.x, t.y);
    }
    if (geb) {
      const def = GEBAEUDE[geb.typ];
      const hoch = hoeheBei(geb.x, geb.y);
      for (let dy = 0; dy < def.h; dy++) for (let dx = 0; dx < def.w; dx++) {
        rautePfad(geb.x + dx, geb.y + dy, hoch, 0);
        ctx.fillStyle = 'rgba(220,38,38,0.45)';
        ctx.fill();
      }
    }
  }
}

// Acker einer Farm: eingefärbte Raute mit Pflugfurchen
function ackerZeichnen(x, y, geb) {
  const [farbe, symbol] = FELD_DEKO[geb.typ];
  const hoch = hoeheBei(x, y);
  rautePfad(x, y, hoch, 0.4);
  ctx.fillStyle = farbe;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,95,60,0.35)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i = 1; i < 4; i++) {
    const t = i / 4;
    ctx.moveTo(isoX(x + t, y), isoY(x + t, y) - hoch);
    ctx.lineTo(isoX(x + t, y + 1), isoY(x + t, y + 1) - hoch);
  }
  ctx.stroke();
  if (kamera.zoom > 0.6) {
    ctx.font = `${HE * 0.6}px sans-serif`;
    ctx.fillText(symbol, isoX(x + 0.5, y + 0.5), isoY(x + 0.5, y + 0.5) - hoch - HE * 0.2);
  }
}

// Besitzerpunkt, Mangelring und Lebensbalken über einem Gebäude
function gebaeudeMarken(geb, fein) {
  const def = GEBAEUDE[geb.typ];
  const hoch = hoeheBei(geb.x, geb.y);
  const mx = isoX(geb.x + def.w / 2, geb.y + def.h / 2);
  const my = isoY(geb.x + def.w / 2, geb.y + def.h / 2) - hoch - HE * (def.w > 1 ? 2.3 : 1.7);

  if (geb.hp < geb.maxHp) {
    const anteil = Math.max(0, geb.hp / geb.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(mx - KW * 0.22, my + 6, KW * 0.44, 4);
    ctx.fillStyle = anteil > 0.5 ? '#16a34a' : anteil > 0.25 ? '#f59e0b' : '#dc2626';
    ctx.fillRect(mx - KW * 0.22, my + 6, KW * 0.44 * anteil, 4);
  }
  if (!fein) return;

  ctx.beginPath();
  ctx.arc(mx - KW * 0.16, my, 4, 0, Math.PI * 2);
  ctx.fillStyle = spieler[geb.spieler].farbe;
  ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();

  if (geb.typ === 'wohnhaus') {
    if (!geb.zufrieden) {
      const puls = (performance.now() % 1100) / 1100;
      ctx.beginPath();
      ctx.arc(mx + KW * 0.16, my, 4.5 + puls * 10, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(220,38,38,${(1 - puls) * 0.9})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(mx + KW * 0.16, my, 4, 0, Math.PI * 2);
    ctx.fillStyle = geb.zufrieden ? '#16a34a' : '#dc2626';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
  }
}

// Heer oder Flotte als Spielstein: unten die Figuren (Kriegsschiffe bzw.
// Soldaten in der Farbe des Besitzers). Die Plakette mit der Stärke
// kommt später über allem dazu – siehe truppPlakette().
const SCHIFF_PLAETZE = [
  [[0, 0]],
  [[-0.2, -0.05], [0.2, 0.07]],
  [[0, -0.14], [-0.27, 0.04], [0.25, 0.1]],
];
const SOLDAT_PLAETZE = [
  [[-0.12, 0], [0.13, 0.05]],
  [[0, -0.1], [-0.18, 0.05], [0.17, 0.09]],
  [[-0.1, -0.15], [0.15, -0.11], [-0.25, 0.04], [0.02, 0.07], [0.27, 0.11]],
];
function truppZeichnen(t, wippen) {
  const l = steinLage(t), m = l.m;
  const farbe = spieler[t.spieler].farbe;

  // Auswahlring bzw. Gefechtspuls am Boden
  if (state.truppAuswahl === t) {
    ctx.beginPath();
    ctx.ellipse(l.x, l.y, KW * 0.46 * m, KH * 0.46 * m, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(22,163,74,0.18)'; ctx.fill();
    ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 2.5 * m; ctx.stroke();
  }
  if (t.kampf) {
    const puls = (performance.now() % 900) / 900;
    ctx.beginPath();
    ctx.ellipse(l.x, l.y, (KW * 0.3 + puls * KW * 0.3) * m, (KH * 0.3 + puls * KH * 0.3) * m,
                0, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(220,38,38,${(1 - puls) * 0.9})`;
    ctx.lineWidth = 3 * m;
    ctx.stroke();
  }

  if (t.art === 'flotte') {
    // 1, 2 oder 3 Schiffe – je nachdem, wie groß die Flotte ist
    const stufe = t.schiffe >= 4.5 ? 2 : t.schiffe >= 1.5 ? 1 : 0;
    const gr = KW * (stufe === 0 ? 0.52 : 0.44) * m;
    for (const [ox, oy] of SCHIFF_PLAETZE[stufe])
      segelschiff(l.x + ox * KW * m, l.y + oy * KH * m, gr, farbe, (wippen || 0) * m, 'krieg');
  } else {
    // Banner in der Mitte, davor 2 bis 5 Soldaten
    const stufe = t.mann >= 40 ? 2 : t.mann >= 15 ? 1 : 0;
    const gr = HE * 0.78 * m;
    pfosten(l.x, l.y - KH * 0.1 * m, HE * 0.95 * m, 1.6 * m, '#5b4a3a');
    ctx.fillStyle = farbe;
    ctx.fillRect(l.x, l.y - KH * 0.1 * m - HE * 0.95 * m, KW * 0.17 * m, HE * 0.24 * m);
    for (const [ox, oy] of SOLDAT_PLAETZE[stufe])
      soldatZeichnen(l.x + ox * KW * m, l.y + oy * KH * m, gr, farbe);
  }
}

// Piratenverband: schwarze Segel, darüber eine dunkle Plakette
function piratZeichnen(p, wippen) {
  const l = steinLage(p), m = l.m;
  if (p.kampf) {
    const puls = (performance.now() % 900) / 900;
    ctx.beginPath();
    ctx.ellipse(l.x, l.y, (KW * 0.3 + puls * KW * 0.3) * m, (KH * 0.3 + puls * KH * 0.3) * m, 0, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(220,38,38,${(1 - puls) * 0.9})`;
    ctx.lineWidth = 3 * m;
    ctx.stroke();
  }
  const stufe = p.schiffe >= 3.5 ? 2 : p.schiffe >= 1.5 ? 1 : 0;
  const gr = KW * (stufe === 0 ? 0.52 : 0.44) * m;
  for (const [ox, oy] of SCHIFF_PLAETZE[stufe])
    segelschiff(l.x + ox * KW * m, l.y + oy * KH * m, gr, null, (wippen || 0) * m, 'pirat');
}
function piratPlakette(p) {
  const l = steinLage(p), m = l.m;
  const text = '☠ ' + Math.max(1, Math.round(p.schiffe));
  const hoch = HE * 0.62 * m;
  ctx.font = `bold ${HE * 0.44 * m}px system-ui, sans-serif`;
  const breit = Math.max(hoch * 1.5, ctx.measureText(text).width + hoch * 0.9);
  rundRect(ctx, l.x - breit / 2, l.py - hoch / 2, breit, hoch, hoch / 2);
  ctx.fillStyle = 'rgba(31,41,55,0.94)';
  ctx.fill();
  ctx.strokeStyle = p.lauert ? '#dc2626' : '#9ca3af';
  ctx.lineWidth = 2.2 * m;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillText(text, l.x, l.py + hoch * 0.05);
}

// Die Plakette über einer Truppe: Stärke (bei Flotten zusätzlich die
// Soldaten an Bord), umrandet in der Farbe des Besitzers. Sie ist das
// Hauptziel für den Finger und liegt deshalb immer obenauf.
function truppPlakette(t) {
  const l = steinLage(t), m = l.m;
  const gewaehlt = state.truppAuswahl === t;
  const text = Math.round(truppGroesse(t)) + (t.fracht >= 1 ? ' +' + Math.round(t.fracht) : '');
  const hoch = HE * 0.62 * m;
  ctx.font = `bold ${HE * 0.44 * m}px system-ui, sans-serif`;
  const breit = Math.max(hoch * 1.5, ctx.measureText(text).width + hoch * 0.9);
  rundRect(ctx, l.x - breit / 2, l.py - hoch / 2, breit, hoch, hoch / 2);
  ctx.fillStyle = gewaehlt ? '#dcfce7' : 'rgba(255,255,255,0.95)';
  ctx.fill();
  ctx.strokeStyle = spieler[t.spieler].farbe;
  ctx.lineWidth = (gewaehlt ? 3.2 : 2.2) * m;
  ctx.stroke();
  ctx.fillStyle = '#1f2937';
  ctx.fillText(text, l.x, l.py + hoch * 0.05);
  if (t.kanonen > 0) {                     // Kanonenstufe als kleine Punkte
    ctx.fillStyle = '#b45309';
    for (let i = 0; i < t.kanonen; i++) {
      ctx.beginPath();
      ctx.arc(l.x + (i - (t.kanonen - 1) / 2) * 7 * m, l.py - hoch * 0.72, 2.6 * m, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function zielFaehnchen(px, py, farbe) {
  const m = steinMass();
  pfosten(px, py, HE * 0.9 * m, 2 * m, '#6b5a46');
  ctx.beginPath();
  ctx.moveTo(px, py - HE * 0.9 * m);
  ctx.lineTo(px + KW * 0.18 * m, py - HE * 0.78 * m);
  ctx.lineTo(px, py - HE * 0.66 * m);
  ctx.closePath();
  ctx.fillStyle = farbe || '#dc2626'; ctx.fill();
}

// Halbtransparenter Wirkungskreis – im Schrägbild eine Ellipse
function kreisZeichnen(mitte, radius) {
  const px = isoX(mitte.x, mitte.y), py = isoY(mitte.x, mitte.y) - H_LAND;
  ctx.beginPath();
  ctx.ellipse(px, py, radius * Math.SQRT2 * KW / 2, radius * Math.SQRT2 * KH / 2,
              0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(22,163,74,0.08)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(22,163,74,0.55)';
  ctx.lineWidth = 2 / kamera.zoom;
  ctx.setLineDash([6 / kamera.zoom, 5 / kamera.zoom]);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- 8. KAMERA & EINGABE ------------------------------- */

function bildschirmZuWelt(sx, sy) {
  return { x: sx / kamera.zoom + kamera.x, y: sy / kamera.zoom + kamera.y };
}
function bildschirmZuKachel(sx, sy) {
  const w = bildschirmZuWelt(sx, sy);
  gelaendeBereit();
  // Land liegt auf einem Plateau über dem Wasser, Gebirge ragt noch
  // weit darüber hinaus. Darum wird der Sehstrahl von oben nach unten
  // verfolgt: bei jeder Höhe h liegt er über einer anderen Kachel –
  // die erste, deren Oberfläche mindestens so hoch ist, ist die, die
  // man an dieser Bildschirmstelle wirklich sieht.
  for (let h = BERG_MAX + 16; h >= 0; h -= 2) {
    const t = kachelVonWelt(w.x, w.y + h);
    // (1 Pixel Toleranz, damit auch ein Tipp genau auf eine Gipfelspitze trifft)
    if (oberflaeche(t.x, t.y) >= h - 1) return { x: Math.floor(t.x), y: Math.floor(t.y) };
  }
  return null;
}

function kameraBegrenzen() {
  const sb = leinwand.clientWidth / kamera.zoom;   // sichtbare Weltbreite
  const sh = leinwand.clientHeight / kamera.zoom;
  const rand = 6 * KW; // etwas Meer am Rand erlauben
  kamera.x = Math.min(Math.max(kamera.x, -rand), WELT_B + rand - sb);
  kamera.y = Math.min(Math.max(kamera.y, -rand), WELT_H + rand - sh);
}

function zoomAuf(sx, sy, faktor) {
  const vorher = bildschirmZuWelt(sx, sy);
  kamera.zoom = Math.min(2.6, Math.max(0.07, kamera.zoom * faktor));
  // Der Punkt unter dem Mauszeiger bleibt an Ort und Stelle
  kamera.x = vorher.x - sx / kamera.zoom;
  kamera.y = vorher.y - sy / kamera.zoom;
  kameraBegrenzen();
}

// --- Zeiger-Ereignisse (Maus und Touch gemeinsam) ---
const zeiger = new Map();       // aktive Finger/Maustasten
let ziehStart = null;           // Startpunkt fürs Verschieben
let gezogen = false;            // wurde wirklich gezogen (kein Klick)?
let pinchAbstand = 0;

leinwand.addEventListener('pointerdown', e => {
  leinwand.setPointerCapture(e.pointerId);
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (zeiger.size === 1) {
    ziehStart = { sx: e.clientX, sy: e.clientY, kx: kamera.x, ky: kamera.y };
    gezogen = false;
  } else if (zeiger.size === 2) {
    const [a, b] = [...zeiger.values()];
    pinchAbstand = Math.hypot(a.x - b.x, a.y - b.y);
  }
});

leinwand.addEventListener('pointermove', e => {
  state.hover = { sx: e.clientX, sy: e.clientY };
  if (!zeiger.has(e.pointerId)) return;
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (zeiger.size === 1 && ziehStart) {
    const dx = e.clientX - ziehStart.sx, dy = e.clientY - ziehStart.sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) gezogen = true;
    if (gezogen) {
      kamera.x = ziehStart.kx - dx / kamera.zoom;
      kamera.y = ziehStart.ky - dy / kamera.zoom;
      kameraBegrenzen();
      leinwand.classList.add('ziehen');
    }
  } else if (zeiger.size === 2) {
    // Zwei Finger: Zoomen (Pinch)
    const [a, b] = [...zeiger.values()];
    const abstand = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchAbstand > 0) {
      zoomAuf((a.x + b.x) / 2, (a.y + b.y) / 2, abstand / pinchAbstand);
    }
    pinchAbstand = abstand;
  }
});

function zeigerEnde(e) {
  const warEinzeln = zeiger.size === 1;
  zeiger.delete(e.pointerId);
  if (warEinzeln && !gezogen && ziehStart) klickAufKarte(e.clientX, e.clientY);
  if (zeiger.size === 0) { ziehStart = null; leinwand.classList.remove('ziehen'); }
  pinchAbstand = 0;
}
leinwand.addEventListener('pointerup', zeigerEnde);
leinwand.addEventListener('pointercancel', zeigerEnde);

// ➕/➖-Knöpfe: Zoomen auf die Bildschirmmitte (gut für Touch)
document.getElementById('k-plus').addEventListener('click', () =>
  zoomAuf(leinwand.clientWidth / 2, leinwand.clientHeight / 2, 1.35));
document.getElementById('k-minus').addEventListener('click', () =>
  zoomAuf(leinwand.clientWidth / 2, leinwand.clientHeight / 2, 1 / 1.35));

// Mausrad: Zoomen auf den Mauszeiger
leinwand.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAuf(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

// Rechtsklick: Werkzeug ablegen statt Kontextmenü
leinwand.addEventListener('contextmenu', e => {
  e.preventDefault();
  werkzeugWaehlen('zeiger');
});

// --- Spielsteine der Truppen: Größe und Lage ---
// Truppen sollen in jeder Zoomstufe gut zu sehen und zu treffen sein.
// Darum schrumpfen ihre Spielsteine beim Herauszoomen nicht beliebig
// mit: unterhalb von Zoom 0,9 werden sie in Weltpixeln entsprechend
// größer gezeichnet und bleiben auf dem Bildschirm gleich groß.
function steinMass() { return Math.max(1, 0.9 / kamera.zoom); }

// Fußpunkt (x, y) und Plakettenmitte (py) eines Spielsteins in Weltpixeln
function steinLage(t) {
  const m = steinMass();
  const x = isoX(t.x, t.y);
  const y = isoY(t.x, t.y) - hoeheBei(Math.floor(t.x), Math.floor(t.y));
  return { x, y, m, py: y - HE * 1.3 * m };
}

// Welche Truppe liegt unter dem Finger? Gemessen wird auf dem BILDSCHIRM,
// nicht über die Kachel: die Plakette schwebt über der Truppe und liegt
// im Schrägbild über einer ganz anderen Kachel. Vom Fußpunkt bis hinauf
// zur Plakette zählt alles als Treffer – mit Rand für Fingerkuppen.
function truppeAmBildschirm(sx, sy) {
  const z = kamera.zoom;
  let beste = null, besterWert = Infinity;
  for (const t of truppen) {
    const l = steinLage(t);
    const fx = (l.x - kamera.x) * z;
    const fussY = (l.y - kamera.y) * z, kopfY = (l.py - kamera.y) * z;
    // Abstand zur senkrechten Strecke Plakette–Fuß
    const naheY = Math.max(kopfY, Math.min(fussY, sy));
    const abstand = Math.hypot(sx - fx, sy - naheY);
    const radius = Math.max(24, KW * 0.36 * l.m * z);
    if (abstand > radius) continue;
    // Bei fast gleichem Abstand hat die eigene Truppe Vorrang
    const wert = abstand - (t.spieler === ICH ? 8 : 0);
    if (wert < besterWert) { beste = t; besterWert = wert; }
  }
  return beste;
}

// Liegt ein Piratenverband unter dem Finger? (gleiche Messung wie bei Truppen)
function piratAmBildschirm(sx, sy) {
  const z = kamera.zoom;
  let beste = null, besteD = Infinity;
  for (const p of piraten) {
    const l = steinLage(p);
    const fx = (l.x - kamera.x) * z;
    const fussY = (l.y - kamera.y) * z, kopfY = (l.py - kamera.y) * z;
    const naheY = Math.max(kopfY, Math.min(fussY, sy));
    const abstand = Math.hypot(sx - fx, sy - naheY);
    if (abstand <= Math.max(24, KW * 0.36 * l.m * z) && abstand < besteD) { beste = p; besteD = abstand; }
  }
  return beste;
}

// Piraten angetippt (ohne eigene Flotte in der Hand): Schutzgeld anbieten
// bzw. sagen, auf wen sie es abgesehen haben
function piratAngetippt(p) {
  const n = Math.max(1, Math.round(p.schiffe));
  if (p.ziel === ICH && !p.geht) {
    state.vorschau = { modus: 'pirat', pirat: p };
    bestaetigungZeigen();
  } else {
    melden(`🏴‍☠️ Piraten (${n} ${n === 1 ? 'Schiff' : 'Schiffe'}) – ` +
           (p.geht ? 'sie ziehen ab' : p.ziel === ICH ? 'sie halten auf dein Kontor zu'
                   : `sie haben es auf ${spieler[p.ziel].name} abgesehen`));
  }
}

// Ein Klick (kein Ziehen) auf die Karte
function klickAufKarte(sx, sy) {
  if (state.vorbei) return;
  const t = bildschirmZuKachel(sx, sy);

  if (state.werkzeug === 'zeiger') {
    const stein = truppeAmBildschirm(sx, sy);
    const gewaehlt = truppen.includes(state.truppAuswahl) ? state.truppAuswahl : null;

    // Eigene Truppe angetippt: auswählen (noch einmal antippen = abwählen)
    if (stein && stein.spieler === ICH) {
      if (stein === gewaehlt) truppAbwaehlen(); else truppWaehlen(stein, false);
      return;
    }
    // Piraten angetippt: mit einer Flotte in der Hand wird gejagt,
    // sonst geht es ums Schutzgeld
    const pirat = piratAmBildschirm(sx, sy);
    if (pirat) {
      if (gewaehlt && gewaehlt.art === 'flotte') piratJagen(gewaehlt, pirat);
      else piratAngetippt(pirat);
      return;
    }
    // Ist eine Truppe ausgewählt, gilt jeder andere Tipp als Befehl
    if (gewaehlt) {
      if (t) befehlGeben(gewaehlt, t.x, t.y, stein);
      return;
    }
    // Fremde Truppe ohne eigene Auswahl: kurz sagen, was das ist
    if (stein) {
      const flotte = stein.art === 'flotte';
      melden(`${flotte ? '🚢 Flotte' : '⚔️ Heer'} von ${spieler[stein.spieler].name}: ` +
             `${Math.round(truppGroesse(stein))} ${flotte ? 'Schiffe' : 'Mann'}` +
             (imKriegMit(ICH, stein.spieler) ? ' – ihr seid im Krieg!' : ''));
      return;
    }
  }

  // Tipp aufs Wasser: das Handelsschiff segelt dorthin. Mit dem
  // Zeiger-Werkzeug geht das jederzeit, vor dem Kontor-Bau mit jedem.
  if (t && kachel(t.x, t.y).typ === 'wasser' &&
      (state.werkzeug === 'zeiger' || !state.kontorGebaut)) {
    if (istGast()) {
      befehlSenden({ art: 'schiff', tx: t.x, ty: t.y });
      state.auswahl = null; panelZeigen();
      return;
    }
    const weg = segelWeg(t.x, t.y);
    if (weg) {
      schiff.pfad = weg;
      if (!state.kontorGebaut) melden('⛵ Leinen los!', 'segeln');
    } else melden('Dorthin führt kein Seeweg');
    state.auswahl = null; panelZeigen();
    return;
  }

  if (state.werkzeug === 'zeiger') {
    // Wie gewohnt: ein Gebäude auswählen
    state.auswahl = t ? belegtAuf(t.x, t.y) : null;
    panelZeigen();
  } else if (state.werkzeug === 'abriss') {
    // Nicht sofort abreißen – erst die Bestätigung einholen
    const geb = t && belegtAuf(t.x, t.y);
    if (geb && geb.spieler !== ICH) {
      melden(`Das gehört ${spieler[geb.spieler].name}!`);
      state.vorschau = null;
    } else {
      state.vorschau = geb ? { modus: 'abriss', geb } : null;
    }
    bestaetigungZeigen();
  } else if (t) {
    // Nicht sofort bauen – die Vorschau wartet auf den ✓-Knopf.
    // Erneutes Tippen an anderer Stelle verschiebt die Vorschau.
    state.vorschau = { modus: 'bau', typ: state.werkzeug, tx: t.x, ty: t.y };
    bestaetigungZeigen();
  }
}

// --- Befehl an die ausgewählte Truppe ---
// Fahren, Marschieren und Angriffe im erklärten Krieg gehen SOFORT los –
// ein Tipp genügt. Nur ein Angriff ohne Kriegserklärung fragt vorher
// nach, denn so ein Überfall hat Folgen für die ganze Diplomatie.
function befehlGeben(t, tx, ty, zielTruppe) {
  const plan = befehlPlanen(t, tx, ty, ICH, zielTruppe);
  if (!plan.ok) {
    state.vorschau = null;
    bestaetigungZeigen();
    melden(plan.text);
    return;
  }
  const v = { modus: 'befehl', truppe: t, plan, tx, ty,
              zielId: zielTruppe && zielTruppe.spieler !== ICH ? zielTruppe.id : 0 };
  if (plan.rueckfrage) {
    state.vorschau = v;
    bestaetigungZeigen();
    return;
  }
  state.vorschau = null;
  bestaetigungZeigen();
  befehlAusfuehren(v);
  if (plan.kurz) melden(plan.kurz);
}

// Wasserfeld, von dem aus eine Flotte ein Gebäude beschießen kann –
// als fertiger Seeweg dorthin (oder null, wenn keines erreichbar ist)
function ankerplatzWeg(t, geb) {
  const def = GEBAEUDE[geb.typ];
  const reichweite = KRIEG.schussweite - 0.05;
  const kandidaten = [];
  for (let y = geb.y - 4; y < geb.y + def.h + 4; y++) for (let x = geb.x - 4; x < geb.x + def.w + 4; x++) {
    if (x < 0 || y < 0 || x >= N || y >= N || !seeFrei(y * N + x)) continue;
    if (abstandZumGrundriss(geb, x + 0.5, y + 0.5) > reichweite) continue;
    kandidaten.push({ x, y, d: Math.hypot(x + 0.5 - t.x, y + 0.5 - t.y) });
  }
  kandidaten.sort((a, b) => a.d - b.d);
  for (const k of kandidaten.slice(0, 10)) {
    const weg = truppWeg(t, k.x, k.y);
    if (weg) return weg;
  }
  return null;
}

// Seeweg vor eine Küste: zum nächsten erreichbaren Wasser bei (tx, ty)
function kuestenWeg(t, tx, ty) {
  const kandidaten = [];
  for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++) {
    const x = tx + dx, y = ty + dy;
    if (x < 0 || y < 0 || x >= N || y >= N || !seeFrei(y * N + x)) continue;
    kandidaten.push({ x, y, d: Math.hypot(dx, dy) });
  }
  kandidaten.sort((a, b) => a.d - b.d);
  for (const k of kandidaten.slice(0, 8)) {
    const weg = truppWeg(t, k.x, k.y);
    if (weg) return weg;
  }
  return null;
}

// Was bedeutet ein Tipp für diese Truppe? Liefert den Plan: hinfahren,
// angreifen, eine Küste ansteuern, landen … „rueckfrage" heißt: vorher
// bestätigen lassen. „kurz" ist die Meldung, die dabei erscheint.
function befehlPlanen(t, tx, ty, sid = ICH, zielTruppe = null) {
  const k = kachel(tx, ty);
  if (!k) return { ok: false, text: 'Außerhalb der Karte' };
  const flotte = t.art === 'flotte';
  const geb = belegtAuf(tx, ty);
