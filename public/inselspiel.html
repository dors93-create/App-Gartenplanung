<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inselgründer – Aufbauspiel</title>
<style>
  /* ============================================================
     Inselgründer – ein entspanntes Insel-Aufbauspiel
     Gestaltung: hell & ruhig, eine grüne Akzentfarbe, sanfte
     Schatten – passend zu den Konventionen des Projekts.
     ============================================================ */
  :root {
    --accent: #16a34a;
    --accent-dunkel: #15803d;
    --rot: #dc2626;
    --text: #1f2937;
    --text-leise: #6b7280;
    --flaeche: rgba(255, 255, 255, 0.92);
    --schatten: 0 4px 18px rgba(0, 0, 0, 0.16);
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: #2f5d8a; /* Tiefes Meer hinter der Karte */
    -webkit-user-select: none; user-select: none;
  }

  /* Die Spielfläche füllt das ganze Fenster */
  #karte {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    touch-action: none; /* Wir übernehmen Wischen/Zoomen selbst */
    cursor: grab;
  }
  #karte.bauen  { cursor: crosshair; }
  #karte.ziehen { cursor: grabbing; }

  /* ---------- Ressourcenleiste oben ---------- */
  #leiste-oben {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px;
    background: var(--flaeche); border-radius: var(--radius);
    box-shadow: var(--schatten);
    padding: 6px 10px;
    max-width: calc(100vw - 16px);
    overflow-x: auto; scrollbar-width: none;
    white-space: nowrap; z-index: 10;
    font-size: 14px;
  }
  #leiste-oben::-webkit-scrollbar { display: none; }
  .res {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 8px;
  }
  .res b { font-variant-numeric: tabular-nums; }
  .res small { color: var(--text-leise); font-size: 11px; }
  .res.warnung b { color: var(--rot); }
  .trenner { width: 1px; height: 20px; background: #e5e7eb; margin: 0 2px; flex: none; }

  /* Ziel-Fortschritt (500 Siedler) */
  #ziel {
    display: inline-flex; flex-direction: column; gap: 2px; padding: 2px 8px;
  }
  #ziel-balken {
    width: 90px; height: 5px; border-radius: 3px; background: #e5e7eb; overflow: hidden;
  }
  #ziel-balken > div { height: 100%; width: 0%; background: var(--accent); transition: width .4s; }

  /* Tempo-/Pause-/Musik-Knöpfe */
  .knopf {
    border: none; background: #f3f4f6; color: var(--text);
    border-radius: 8px; padding: 5px 9px; font-size: 13px; font-weight: 600;
    cursor: pointer; flex: none;
  }
  .knopf:hover { background: #e5e7eb; }
  .knopf.aktiv { background: var(--accent); color: #fff; }

  /* ---------- Baumenü unten ---------- */
  #baumenue {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: stretch;
    background: var(--flaeche); border-radius: var(--radius);
    box-shadow: var(--schatten); padding: 8px;
    max-width: calc(100vw - 16px);
    overflow-x: auto; scrollbar-width: none;
    z-index: 10;
  }
  #baumenue::-webkit-scrollbar { display: none; }
  .bau-knopf {
    border: 2px solid transparent; background: #f9fafb; border-radius: 10px;
    padding: 6px 8px 5px; cursor: pointer; text-align: center;
    min-width: 66px; flex: none;
    display: flex; flex-direction: column; gap: 1px; align-items: center;
    font-family: inherit;
  }
  .bau-gruppe {
    display: flex; flex-direction: column; gap: 2px; flex: none;
    padding-left: 8px; margin-left: 2px; border-left: 1px solid #e5e7eb;
  }
  .gruppe-titel {
    font-size: 9.5px; font-weight: 700; color: var(--text-leise);
    text-transform: uppercase; letter-spacing: 0.5px; padding-left: 2px;
  }
  .gruppe-knoepfe { display: flex; gap: 6px; }
  .bau-knopf:hover { background: #f3f4f6; }
  .bau-knopf.aktiv { border-color: var(--accent); background: #f0fdf4; }
  .bau-knopf:disabled { opacity: 0.42; cursor: not-allowed; }
  .bau-knopf.gesperrt { opacity: 0.42; }
  .bau-knopf .symbol { font-size: 22px; line-height: 1.15; }
  .bau-knopf .name   { font-size: 10.5px; font-weight: 600; }
  .bau-knopf .kosten { font-size: 9.5px; color: var(--text-leise); }

  /* ---------- Info-Panel (Klick auf ein Gebäude) ---------- */
  #info-panel {
    position: absolute; top: 64px; right: 10px; width: 248px;
    background: var(--flaeche); border-radius: var(--radius);
    box-shadow: var(--schatten); padding: 14px;
    z-index: 11; display: none; font-size: 13px;
    max-height: calc(100vh - 180px); overflow-y: auto;
  }
  #info-panel h2 { font-size: 15px; margin-bottom: 2px; display: flex; align-items: center; gap: 7px; }
  #info-panel .beschr { color: var(--text-leise); font-size: 12px; margin-bottom: 9px; }
  #info-panel .zeile { display: flex; justify-content: space-between; gap: 12px; padding: 2.5px 0; }
  #info-panel .zeile span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  #info-panel .beduerfnis { display: flex; justify-content: space-between; padding: 2px 0; }
  #info-panel .ok   { color: var(--accent-dunkel); font-weight: 600; }
  #info-panel .fehlt{ color: var(--rot); font-weight: 600; }
  #info-panel hr { border: none; border-top: 1px solid #e5e7eb; margin: 8px 0; }
  #info-panel .abriss-knopf {
    width: 100%; margin-top: 10px; border: none; border-radius: 8px;
    background: #fef2f2; color: var(--rot); font-weight: 600;
    padding: 8px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  #info-panel .abriss-knopf:hover { background: #fee2e2; }
  #panel-zu {
    position: absolute; top: 8px; right: 10px; border: none; background: none;
    font-size: 15px; color: var(--text-leise); cursor: pointer;
  }

  /* Auslastungs-Balken im Panel */
  .auslast-balken { height: 6px; border-radius: 3px; background: #e5e7eb; overflow: hidden; margin-top: 3px; }
  .auslast-balken > div { height: 100%; background: var(--accent); }

  /* ---------- Zoom-Knöpfe ---------- */
  #zoom-knoepfe {
    position: absolute; left: 10px; bottom: 118px; z-index: 9;
    display: flex; flex-direction: column; gap: 8px;
  }
  #zoom-knoepfe button {
    width: 44px; height: 44px; border: none; border-radius: 12px;
    background: var(--flaeche); box-shadow: var(--schatten);
    font-size: 22px; font-weight: 700; color: var(--text);
    cursor: pointer; line-height: 1;
  }
  #zoom-knoepfe button:active { background: #e5e7eb; }

  /* ---------- Bau-/Abriss-Bestätigung ---------- */
  #bestaetigung {
    position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
    background: var(--flaeche); border-radius: 12px; box-shadow: var(--schatten);
    padding: 10px 12px; z-index: 15; display: none;
    align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    font-size: 13px; max-width: calc(100vw - 16px); text-align: center;
  }
  #bestaetigung button {
    border: none; border-radius: 8px; padding: 9px 16px;
    font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  #bestaetigung button:disabled { opacity: 0.45; cursor: not-allowed; }
  #bestaetigung .grund { color: var(--rot); font-weight: 600; }

  /* Handel im Kontor-Panel */
  .handel-zeile {
    display: flex; align-items: center; justify-content: space-between;
    gap: 4px; padding: 2px 0; font-size: 12px;
  }
  .handel-zeile > span:last-child { display: flex; gap: 4px; flex: none; }
  .handel-zeile button {
    border: none; border-radius: 6px; padding: 4px 6px; cursor: pointer;
    font-family: inherit; font-size: 10.5px; font-weight: 600; white-space: nowrap;
  }
  .handel-kauf    { background: #eef7f0; color: var(--accent-dunkel); }
  .handel-verkauf { background: #f3f4f6; color: var(--text); }

  /* ---------- Meldungen (Toast) & Hinweise ---------- */
  #toast {
    position: absolute; bottom: 152px; left: 50%; transform: translateX(-50%);
    background: rgba(31, 41, 55, 0.92); color: #fff;
    border-radius: 10px; padding: 8px 16px; font-size: 13px;
    z-index: 20; pointer-events: none; opacity: 0; transition: opacity .25s;
    max-width: 90vw; text-align: center;
  }
  #hinweis {
    position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
    background: var(--flaeche); border-radius: 10px; box-shadow: var(--schatten);
    padding: 8px 16px; font-size: 13.5px; font-weight: 600; z-index: 9;
    color: var(--accent-dunkel);
    max-width: calc(100vw - 24px); width: max-content; text-align: center;
  }
  #punkte {
    position: absolute; top: 62px; left: 10px; z-index: 8;
    background: var(--flaeche); border-radius: 10px; box-shadow: var(--schatten);
    padding: 7px 10px; font-size: 11.5px; min-width: 132px;
  }
  #punkte b { font-size: 11px; }
  .punkte-zeile { display: flex; justify-content: space-between; gap: 10px; padding: 1.5px 0; }
  .punkte-zeile span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }

  #bankrott-warnung {
    position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
    background: #fef2f2; color: var(--rot); border-radius: 10px;
    box-shadow: var(--schatten); padding: 8px 16px;
    font-size: 13.5px; font-weight: 700; z-index: 12; display: none;
  }
  /* Pulsierende Warnung, wenn den Einwohnern etwas fehlt */
  #mangel-warnung {
    position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
    background: #fef2f2; color: var(--rot); border-radius: 10px;
    padding: 8px 16px; font-size: 13.5px; font-weight: 700;
    z-index: 11; display: none; text-align: center;
    max-width: calc(100vw - 24px);
    animation: mangel-puls 1.2s ease-in-out infinite;
  }
  @keyframes mangel-puls {
    0%, 100% { box-shadow: 0 4px 18px rgba(220, 38, 38, 0.25); }
    50%      { box-shadow: 0 0 0 7px rgba(220, 38, 38, 0.22); }
  }

  /* ---------- Großes Overlay (Sieg / Niederlage) ---------- */
  #overlay {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
  }
  #overlay .box {
    background: #fff; border-radius: 16px; box-shadow: var(--schatten);
    padding: 34px 40px; text-align: center; max-width: 420px; margin: 16px;
  }
  #overlay .box .gross { font-size: 44px; margin-bottom: 8px; }
  #overlay .box h1 { font-size: 22px; margin-bottom: 8px; }
  #overlay .box p { color: var(--text-leise); font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
  #overlay .box button {
    border: none; border-radius: 10px; padding: 10px 20px; margin: 0 5px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .knopf-gruen { background: var(--accent); color: #fff; }
  .knopf-grau  { background: #f3f4f6; color: var(--text); }
</style>
</head>
<body>

<canvas id="karte"></canvas>

<!-- Ressourcenleiste + Spielsteuerung -->
<div id="leiste-oben">
  <span class="res" title="Gold – Steuern minus Unterhalt">💰 <b id="r-gold">0</b> <small id="r-gold-rate"></small></span>
  <span class="res" title="Holz – Baustoff, wird vom Holzfäller geschlagen">🪵 <b id="r-holz">0</b></span>
  <span class="res" title="Werkzeuge – nötig für viele Gebäude, aus der Schmiede">⚒️ <b id="r-werkzeuge">0</b></span>
  <span class="res" title="Nahrung – von Fischern und Jägern, wird laufend gegessen">🍞 <b id="r-nahrung">0</b></span>
  <span class="res" title="Ziegel – aus der Ziegelei, Baumaterial für höhere Stufen">🧱 <b id="r-ziegel">0</b></span>
  <span class="res" title="Stoffe – aus der Weberei, Bedürfnis ab Siedlern">🧵 <b id="r-stoffe">0</b></span>
  <span class="res" title="Alkohol – aus der Brennerei, Bedürfnis ab Siedlern (alle weiteren Waren: Kontor anklicken)">🥃 <b id="r-alkohol">0</b></span>
  <span class="trenner"></span>
  <span class="res" title="Einwohner (Pioniere + Siedler)">👥 <b id="r-einwohner">0</b></span>
  <span id="ziel" title="Ziel: 500 Siedler erreichen">
    <small style="color:var(--text-leise);font-size:10.5px">🎯 <b id="r-siedler">0</b>/500 Siedler</small>
    <span id="ziel-balken"><div></div></span>
  </span>
  <span class="trenner"></span>
  <button class="knopf" id="k-pause" title="Pause (Leertaste)">⏸</button>
  <button class="knopf aktiv" id="k-tempo1" title="Normale Geschwindigkeit (Taste 1)">1×</button>
  <button class="knopf" id="k-tempo2" title="Doppelte Geschwindigkeit (Taste 2)">2×</button>
  <button class="knopf" id="k-tempo3" title="Dreifache Geschwindigkeit (Taste 3)">3×</button>
  <button class="knopf" id="k-musik" title="Musik ein/aus">🎵</button>
  <button class="knopf" id="k-mitte" title="Zum Kontor bzw. Schiff springen">🧭</button>
</div>

<!-- Punktestand des Wettrennens -->
<div id="punkte"></div>

<!-- Hinweis zu Spielbeginn -->
<div id="hinweis">⛵ Tippe aufs Wasser, um zu segeln. Such dir eine Insel aus und baue dort dein Kontor an der Küste!</div>
<div id="bankrott-warnung"></div>
<div id="mangel-warnung"></div>

<!-- Baumenü (wird per JavaScript gefüllt) -->
<div id="baumenue"></div>

<!-- Zoom-Knöpfe (praktisch auf dem Handy) -->
<div id="zoom-knoepfe">
  <button id="k-plus" title="Hineinzoomen">＋</button>
  <button id="k-minus" title="Herauszoomen">−</button>
</div>

<!-- Bestätigung vor dem Bauen/Abreißen (gegen Vertipper) -->
<div id="bestaetigung">
  <span id="bestaetigung-text"></span>
  <button id="b-ok" class="knopf-gruen">✓ Bauen</button>
  <button id="b-nein" class="knopf-grau">✕ Abbrechen</button>
</div>

<!-- Info-Panel für angeklickte Gebäude -->
<div id="info-panel">
  <button id="panel-zu">✕</button>
  <div id="panel-inhalt"></div>
</div>

<div id="toast"></div>

<!-- Sieg / Niederlage -->
<div id="overlay"><div class="box" id="overlay-box"></div></div>

<script>
'use strict';
/* ==============================================================
   INSELGRÜNDER
   Ein browserbasiertes Aufbau-Strategiespiel im Stil klassischer
   Insel-Aufbauspiele der 90er. Eine einzelne Datei, HTML5 Canvas,
   reines JavaScript – lauffähig ohne Server.

   Gliederung dieses Skripts:
     1. Konstanten & Gebäude-Definitionen
     2. Spielzustand
     3. Weltgenerierung (prozedurale Insel)
     4. Hilfsfunktionen (Umkreis, Küste, Marktanbindung …)
     5. Bauen & Abreißen
     6. Simulation (Produktion, Bevölkerung, Steuern)
     7. Zeichnen (Terrain-Cache + Gebäude + Overlays)
     8. Kamera & Eingabe (Maus, Touch, Tastatur)
     9. Benutzeroberfläche (Leisten, Panel, Meldungen)
    10. Musik (Web Audio API)
    11. Hauptschleife
   ============================================================== */

/* ---------- 1. KONSTANTEN ------------------------------------ */

const N = 120;  // Kacheln je Seite (120×120-Weltkarte mit vielen Inseln)
const T = 40;   // Weltpixel je Kachel (interne Zeichengröße)
const TP = 28;  // Pixel je Kachel im Terrain-Puffer (kleiner als T, damit
                // der Puffer auch auf iPhones unter dem Canvas-Limit bleibt)

// Wirtschafts-Stellschrauben – alle Werte "pro Sekunde" bei 1×-Tempo.
const SIM = {
  nahrungJeEinwohner: 0.004,   // Nahrung, die jede:r Einwohner:in isst
  // (Steuern und weiterer Verbrauch stehen je Bevölkerungsstufe in STUFEN)
  wachstumsDauer:     6,       // Sekunden bis +1 Einwohner (bei Zufriedenheit)
  aufstiegsDauer:     8,       // Sekunden erfüllte Bedürfnisse bis zum Aufstieg
  hungerBisWegzug:    14,      // Sekunden Hunger, bis jemand die Insel verlässt
  pleiteDauer:        60,      // Sekunden mit Gold < 0 bis zum Bankrott
  zielSiedler:        500,     // Siegbedingung
  baumNachwuchs:      0.02,    // Wald wächst langsam nach ("abbaubar", aber erneuerbar)
  schiffTempo:        3.2,     // Segelgeschwindigkeit in Kacheln je Sekunde
  schiffBauRadius:    6,       // so nah muss das Schiff an der Kontor-Baustelle ankern
};

// Bevölkerungsstufen wie im klassischen Vorbild: jede Stufe hat mehr
// Platz im Haus, zahlt mehr Steuern – und stellt höhere Ansprüche.
// "brauch" = laufender Verbrauch je Einwohner:in und Sekunde,
// "gebaeudeNah" = dieses Gebäude muss in Reichweite stehen.
// Fünf Bevölkerungsstufen wie im klassischen Vorbild. Jede Stufe hat mehr
// Platz im Haus, zahlt mehr Steuern – und stellt höhere Ansprüche.
// "brauch" = laufender Verbrauch je Einwohner:in und Sekunde.
// "gebaeudeNah" + "material" = Voraussetzungen, um AUF diese Stufe
// aufzusteigen (öffentliches Gebäude in Reichweite, Baumaterial).
const STUFEN = [
  { name: 'Pioniere',     dativ: 'Siedlern',    emoji: '🛖', maxEw: 8,
    steuer: 0.03, brauch: {} },
  { name: 'Siedler',      dativ: 'Bürgern',     emoji: '🏠', maxEw: 15,
    steuer: 0.07, brauch: { stoffe: 0.0012, alkohol: 0.0012 },
    gebaeudeNah: 'kapelle',  material: { holz: 2 } },
  { name: 'Bürger',       dativ: 'Kaufleuten',  emoji: '🏘️', maxEw: 25,
    steuer: 0.13, brauch: { stoffe: 0.0012, alkohol: 0.0012, tabak: 0.0008, gewuerze: 0.0007 },
    gebaeudeNah: 'schule',   material: { holz: 3, ziegel: 2 } },
  { name: 'Kaufleute',    dativ: 'Aristokraten', emoji: '🏛️', maxEw: 40,
    steuer: 0.20, brauch: { stoffe: 0.0012, alkohol: 0.0012, tabak: 0.0008, gewuerze: 0.0007, kleidung: 0.0006 },
    gebaeudeNah: 'badehaus', material: { holz: 4, ziegel: 4 } },
  { name: 'Aristokraten', dativ: null,          emoji: '🏰', maxEw: 60,
    steuer: 0.30, brauch: { stoffe: 0.0012, alkohol: 0.0012, tabak: 0.0008, gewuerze: 0.0007, kleidung: 0.0006, schmuck: 0.0004 },
    gebaeudeNah: 'theater',  material: { holz: 5, ziegel: 6 } },
];

// Handelspreise am Kontor (Gold je Einheit): Kaufen ist teurer als
// Verkaufen, damit sich eigene Produktion immer lohnt.
const PREISE = {
  holz:          { kauf: 3,  verkauf: 1 },
  werkzeuge:     { kauf: 12, verkauf: 5 },
  ziegel:        { kauf: 6,  verkauf: 2 },
  nahrung:       { kauf: 2,  verkauf: 1 },
  wolle:         { kauf: 4,  verkauf: 1 },
  stoffe:        { kauf: 8,  verkauf: 3 },
  getreide:      { kauf: 3,  verkauf: 1 },
  mehl:          { kauf: 4,  verkauf: 1 },
  zuckerrohr:    { kauf: 3,  verkauf: 1 },
  alkohol:       { kauf: 9,  verkauf: 3 },
  tabakblaetter: { kauf: 4,  verkauf: 1 },
  tabak:         { kauf: 10, verkauf: 4 },
  gewuerze:      { kauf: 8,  verkauf: 3 },
  kleidung:      { kauf: 14, verkauf: 6 },
  schmuck:       { kauf: 20, verkauf: 8 },
};
const WAREN_EMOJI = { gold: '💰', holz: '🪵', werkzeuge: '⚒️', ziegel: '🧱',
  nahrung: '🍞', wolle: '🧶', stoffe: '🧵', getreide: '🌾', mehl: '🥣',
  zuckerrohr: '🎋', alkohol: '🥃', tabakblaetter: '🍂', tabak: '🚬',
  gewuerze: '🌶️', kleidung: '👕', schmuck: '💍' };
// Dynamischer Markt: jeder Kauf treibt den Preis einer Ware nach oben,
// jeder Verkauf drückt ihn – und zwar für ALLE Spieler. Wer dieselben
// Waren braucht wie die Konkurrenz, zahlt also drauf. Mit der Zeit
// pendeln die Preise langsam zum Normalwert zurück.
const markt = {};   // Preisfaktor je Ware (1 = Normalpreis)

function kaufpreis(ware)     { return Math.max(1, Math.round(PREISE[ware].kauf * markt[ware])); }
function verkaufspreis(ware) { return Math.max(1, Math.round(PREISE[ware].verkauf * markt[ware])); }

// Führt einen Handel für einen beliebigen Spieler aus (auch die KI).
// menge > 0 = kaufen, menge < 0 = verkaufen. Liefert false bei Geldmangel.
function handelAusfuehren(sp, ware, menge) {
  const R = sp.res;
  if (menge > 0) {
    const kosten = kaufpreis(ware) * menge;
    if (R.gold < kosten) return false;
    R.gold -= kosten;
    R[ware] += menge;
    markt[ware] = Math.min(3, markt[ware] * (1 + 0.006 * menge));    // Nachfrage → teurer
  } else {
    const anzahl = Math.min(-menge, Math.floor(R[ware]));
    if (anzahl <= 0) return false;
    R[ware] -= anzahl;
    R.gold += verkaufspreis(ware) * anzahl;
    markt[ware] = Math.max(0.5, markt[ware] * (1 - 0.004 * anzahl)); // Überangebot → billiger
  }
  return true;
}

// Einfacher, wiederholbarer Zufallszahlengenerator
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Wertrauschen: grobes Zufallsgitter, weich interpoliert → sanfte Formen
function wertRauschen(rnd, gitter) {
  const g = [];
  for (let i = 0; i < (gitter + 1) * (gitter + 1); i++) g.push(rnd());
  const glatt = t => t * t * (3 - 2 * t);
  return function (u, v) {   // u, v in 0..1
    const fx = u * gitter, fy = v * gitter;
    const x0 = Math.min(Math.floor(fx), gitter - 1);
    const y0 = Math.min(Math.floor(fy), gitter - 1);
    const tx = glatt(fx - x0), ty = glatt(fy - y0);
    const w = (x, y) => g[y * (gitter + 1) + x];
    const oben  = w(x0, y0)     * (1 - tx) + w(x0 + 1, y0)     * tx;
    const unten = w(x0, y0 + 1) * (1 - tx) + w(x0 + 1, y0 + 1) * tx;
    return oben * (1 - ty) + unten * ty;
  };
}

// Erzeugt die Weltkarte: ein offenes Meer mit mehreren Inseln.
// Es wird so lange gewürfelt, bis eine Welt mit einer ordentlichen
// Hauptinsel (genug Platz, Wald und Gestein) herauskommt.
function weltErzeugen() {
  for (let versuch = 0; versuch < 80; versuch++) {
    const saat = (Math.random() * 1e9) | 0;
    const rnd = mulberry32(saat);
    const grob = wertRauschen(rnd, 8);    // große Landformen
    const fein = wertRauschen(rnd, 18);   // Details der Küstenlinien
    const waldR = wertRauschen(rnd, 12);  // wo Wald wächst

    // 6–8 Inseln auswürfeln: Mittelpunkt + Radius, mit Wasser dazwischen
    const inseln = [];
    const anzahl = 6 + Math.floor(rnd() * 3);
    for (let i = 0; i < anzahl; i++) {
      for (let probe = 0; probe < 40; probe++) {
        // Die erste Insel ist immer groß – ein guter Startplatz
        const r = i === 0 ? 18 + rnd() * 5 : 7 + rnd() * 9;
        const cx = r + 3 + rnd() * (N - 2 * r - 6);
        const cy = r + 3 + rnd() * (N - 2 * r - 6);
        // Genug Abstand zu den anderen Inseln (freie Seewege)
        let passt = true;
        for (const ins of inseln) {
          if (Math.hypot(ins.cx - cx, ins.cy - cy) < ins.r + r + 6) { passt = false; break; }
        }
        if (passt) { inseln.push({ cx, cy, r }); break; }
      }
    }

    karte = []; belegt = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        // Landfaktor: 1 am Inselmittelpunkt, 0 am Inselrand und auf See
        let f = 0;
        for (const ins of inseln) {
          f = Math.max(f, 1 - Math.hypot(x - ins.cx, y - ins.cy) / ins.r);
        }
        const u = x / (N - 1), v = y / (N - 1);
        const rausch = 0.62 * grob(u, v) + 0.38 * fein(u, v);
        const hoehe = f * (0.30 + 0.70 * rausch);

        let typ;
        if      (hoehe < 0.16) typ = 'wasser';
        else if (hoehe < 0.22) typ = 'strand';
        else if (hoehe < 0.62) typ = 'gras';
        else                   typ = 'berg';

        const k = { typ, baum: 0, stein: 0, var: rnd() };
        if (typ === 'berg') k.stein = 200 + Math.round(rnd() * 300);
        karte.push(k);
        belegt.push(null);
      }
    }

    // Strand-Saum: Land direkt am Wasser wird zu Strand
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const k = kachel(x, y);
      if (k.typ === 'gras') {
        for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const n = kachel(x + ax, y + ay);
          if (n && n.typ === 'wasser') { k.typ = 'strand'; break; }
        }
      }
    }

    // Wald auf Grasflächen verteilen (dichte Kerne, lockere Ränder)
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const k = kachel(x, y);
      if (k.typ === 'gras') {
        const w = waldR(x / (N - 1), y / (N - 1));
        if (w > 0.56) { k.typ = 'wald'; k.baum = Math.min(1, 0.4 + (w - 0.56) * 3); }
      }
    }

    // Qualitätsprüfung: zusammenhängende Landflächen vermessen (Breitensuche).
    // Die größte Insel muss Platz, Wald und Gestein für eine Stadt bieten.
    const marke = new Int16Array(N * N).fill(-1);
    const flaechen = [];
    for (let start = 0; start < N * N; start++) {
      if (karte[start].typ === 'wasser' || marke[start] !== -1) continue;
      const stapel = [start];
      marke[start] = flaechen.length;
      let groesse = 0, berg = 0, wald = 0;
      while (stapel.length) {
        const j = stapel.pop();
        groesse++;
        if (karte[j].typ === 'berg') berg++;
        if (karte[j].baum > 0) wald++;
        const x = j % N, y = (j / N) | 0;
        for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx = x + ax, ny = y + ay;
          if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          const ni = ny * N + nx;
          if (karte[ni].typ !== 'wasser' && marke[ni] === -1) {
            marke[ni] = flaechen.length;
            stapel.push(ni);
          }
        }
      }
      flaechen.push({ groesse, berg, wald });
    }
    const land = flaechen.reduce((s, f) => s + f.groesse, 0);
    const haupt = flaechen.reduce((a, b) => (b.groesse > a.groesse ? b : a), { groesse: 0, berg: 0, wald: 0 });
    if (flaechen.length < 4 || haupt.groesse < 450 || haupt.berg < 4 ||
        haupt.wald < 40 || land / (N * N) > 0.40) continue;

    // Insel-Kennzeichnung für die KI-Besiedlung aufheben
    inselMarke = marke;
    inselGroessen = flaechen.map(f => f.groesse);
    return; // Welt angenommen
  }
  // Notnagel (praktisch nie nötig): letzte gewürfelte Welt behalten
}

/* ---------- 3b. DAS SCHIFF ------------------------------------ */
// Zu Spielbeginn treibt dein Segelschiff auf dem Meer. Tippe aufs
// Wasser, um es zu einer Insel deiner Wahl zu steuern – erst wenn es
// nahe der Küste ankert, kann dort das Kontor gebaut werden.

const schiff = { x: 0, y: 0, pfad: [] };  // Position in Kacheln (Mittelpunkt), Restweg

// Startplatz: eine Wasserkachel mit etwas Abstand zum Land
function schiffStart() {
  for (let probe = 0; probe < 5000; probe++) {
    const x = 2 + ((Math.random() * (N - 4)) | 0);
    const y = 2 + ((Math.random() * (N - 4)) | 0);
    let frei = true;
    for (let dy = -2; dy <= 2 && frei; dy++) for (let dx = -2; dx <= 2; dx++) {
      const k = kachel(x + dx, y + dy);
      if (!k || k.typ !== 'wasser') { frei = false; break; }
    }
    if (frei) { schiff.x = x + 0.5; schiff.y = y + 0.5; return; }
  }
  schiff.x = 2.5; schiff.y = 2.5; // Notnagel: Kartenecke ist praktisch immer Wasser
}

// Seeweg vom Schiff zu einer Zielkachel suchen (Breitensuche über Wasser).
// Liefert die Wegpunkte oder null, wenn kein Wasserweg existiert.
function segelWeg(zx, zy) {
  const ziel = kachel(zx, zy);
  if (!ziel || ziel.typ !== 'wasser') return null;
  const sx = Math.floor(schiff.x), sy = Math.floor(schiff.y);
  const si = sy * N + sx, zi = zy * N + zx;
  if (si === zi) return [];
  const vorher = new Int32Array(N * N).fill(-1);
  vorher[si] = si;
  const schlange = [si];
  for (let kopf = 0; kopf < schlange.length; kopf++) {
    const j = schlange[kopf];
    if (j === zi) break;
    const x = j % N, y = (j / N) | 0;
    for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + ax, ny = y + ay;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const ni = ny * N + nx;
      if (vorher[ni] !== -1 || karte[ni].typ !== 'wasser') continue;
      vorher[ni] = j;
      schlange.push(ni);
    }
  }
  if (vorher[zi] === -1) return null;
  // Weg vom Ziel rückwärts einsammeln und umdrehen
  const weg = [];
  for (let j = zi; j !== si; j = vorher[j]) {
    weg.push({ x: (j % N) + 0.5, y: ((j / N) | 0) + 0.5 });
  }
  weg.reverse();
  return weg;
}

// Das Schiff fährt seinen Weg Punkt für Punkt ab
function schiffUpdate(dt) {
  let strecke = SIM.schiffTempo * dt;
  while (strecke > 0 && schiff.pfad.length) {
    const zielP = schiff.pfad[0];
    const dx = zielP.x - schiff.x, dy = zielP.y - schiff.y;
    const d = Math.hypot(dx, dy);
    if (d <= strecke) {
      schiff.x = zielP.x; schiff.y = zielP.y;
      schiff.pfad.shift();
      strecke -= d;
      if (!schiff.pfad.length && !state.kontorGebaut)
        melden('⚓ Angekommen! Baue jetzt dein Kontor an der Küste.', 'angekommen');
    } else {
      schiff.x += dx / d * strecke;
      schiff.y += dy / d * strecke;
      strecke = 0;
    }
  }
}

function kachel(x, y) {
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  return karte[y * N + x];
}
function belegtAuf(x, y) {
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  return belegt[y * N + x];
}

/* ---------- 4. HILFSFUNKTIONEN ------------------------------- */

// Mittelpunkt eines Gebäudes in Kachel-Koordinaten
function zentrum(geb) {
  const def = GEBAEUDE[geb.typ];
  return { x: geb.x + def.w / 2, y: geb.y + def.h / 2 };
}
function abstandGebaeude(a, b) {
  const za = zentrum(a), zb = zentrum(b);
  return Math.hypot(za.x - zb.x, za.y - zb.y);
}

// Alle Kacheln im Umkreis (Kreis, nicht Quadrat) um einen Punkt besuchen
function imUmkreis(cx, cy, radius, fn) {
  const r = Math.ceil(radius);
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) {
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
      const k = kachel(x, y);
      if (!k) continue;
      if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy) <= radius) fn(k, x, y);
    }
  }
}

// Liegt Wasser höchstens 2 Kacheln von der Gebäudefläche entfernt?
function kuesteNah(ax, ay, def) {
  for (let y = ay - 2; y < ay + def.h + 2; y++) {
    for (let x = ax - 2; x < ax + def.w + 2; x++) {
      const k = kachel(x, y);
      if (k && k.typ === 'wasser') return true;
    }
  }
  return false;
}

// Baumdichte im Umkreis (Summe der Bestände)
function baeumeImUmkreis(cx, cy, radius) {
  let summe = 0;
  imUmkreis(cx, cy, radius, k => { summe += k.baum; });
  return summe;
}

// Freie Graskacheln im Umkreis (Weideland für die Schaffarm)
function weideImUmkreis(cx, cy, radius) {
  let n = 0;
  imUmkreis(cx, cy, radius, (k, x, y) => {
    if ((k.typ === 'gras' || k.typ === 'wald') && !belegtAuf(x, y)) n++;
  });
  return n;
}

// Wasserkacheln im Umkreis (Fanggründe des Fischers)
function wasserImUmkreis(cx, cy, radius) {
  let n = 0;
  imUmkreis(cx, cy, radius, k => { if (k.typ === 'wasser') n++; });
  return n;
}

// Gesteinsvorkommen mit Restbestand im Umkreis finden
function steinKachelImUmkreis(cx, cy, radius) {
  let fund = null;
  imUmkreis(cx, cy, radius, (k) => {
    if (k.typ === 'berg' && k.stein > 0 && !fund) fund = k;
  });
  return fund;
}

// Ist ein Punkt an einen EIGENEN Marktplatz bzw. das Kontor angebunden?
function marktAnbindung(cx, cy, sid = 0) {
  for (const g of gebaeude) {
    const def = GEBAEUDE[g.typ];
    if (!def.marktRadius || g.spieler !== sid) continue;
    const z = zentrum(g);
    if (Math.hypot(z.x - cx, z.y - cy) <= def.marktRadius) return true;
  }
  return false;
}

// Steht ein Gebäude dieses Typs (Kapelle, Schule, Theater …) in Reichweite?
function gebaeudeInReichweite(typ, cx, cy, sid = 0) {
  for (const g of gebaeude) {
    if (g.typ !== typ || g.spieler !== sid) continue;
    const z = zentrum(g);
    if (Math.hypot(z.x - cx, z.y - cy) <= GEBAEUDE[typ].radius) return true;
  }
  return false;
}

/* ---------- 5. BAUEN & ABREISSEN ------------------------------ */

// Der Anker (linke obere Ecke) liegt so, dass der Mauszeiger
// ungefähr in der Gebäudemitte ist.
function ankerVon(typ, tx, ty) {
  const def = GEBAEUDE[typ];
  return { x: tx - Math.floor((def.w - 1) / 2), y: ty - Math.floor((def.h - 1) / 2) };
}

// Prüft, ob ein Gebäude an dieser Stelle stehen darf.
function platzOK(typ, ax, ay, sid = 0) {
  const def = GEBAEUDE[typ];
  if (spieler[sid].maxStufe < def.abStufe)
    return { ok: false, grund: 'Erst ab ' + STUFEN[def.abStufe].name + 'n verfügbar' };
  if (ax < 0 || ay < 0 || ax + def.w > N || ay + def.h > N)
    return { ok: false, grund: 'Außerhalb der Karte' };

  for (let y = ay; y < ay + def.h; y++) for (let x = ax; x < ax + def.w; x++) {
    const k = kachel(x, y);
    if (k.typ === 'wasser') return { ok: false, grund: 'Im Wasser kann nicht gebaut werden' };
    if (k.typ === 'berg')   return { ok: false, grund: 'Auf Bergen kann nicht gebaut werden' };
    if (belegtAuf(x, y))    return { ok: false, grund: 'Hier steht bereits ein Gebäude' };
  }

  if (typ === 'kontor' && sid === 0 && state.kontorGebaut)
    return { ok: false, grund: 'Es gibt bereits ein Kontor' };
  if (def.brauchtKueste && !kuesteNah(ax, ay, def))
    return { ok: false, grund: 'Muss an der Küste liegen' };

  const cx = ax + def.w / 2, cy = ay + def.h / 2;
  if (typ === 'kontor' && sid === 0 &&
      Math.hypot(schiff.x - cx, schiff.y - cy) > SIM.schiffBauRadius)
    return { ok: false, grund: 'Zu weit vom Schiff – segle zuerst vor diese Küste' };
  if (typ === 'holzfaeller' && baeumeImUmkreis(cx, cy, def.radius) < 0.5)
    return { ok: false, grund: 'Kein Wald in Reichweite' };
  if (typ === 'jagd' && baeumeImUmkreis(cx, cy, def.radius) < 0.5)
    return { ok: false, grund: 'Kein Wald in Reichweite' };
  if ((typ === 'schmiede' || typ === 'ziegelei' || typ === 'goldschmiede') &&
      !steinKachelImUmkreis(cx, cy, def.radius))
    return { ok: false, grund: 'Kein Gesteinsvorkommen (Berge) in der Nähe' };
  if (typ === 'wohnhaus' && !marktAnbindung(cx, cy, sid))
    return { ok: false, grund: 'Außerhalb der Reichweite von Marktplatz/Kontor' };

  return { ok: true };
}

function kostenReichen(typ, sid = 0) {
  const R = spieler[sid].res;
  for (const [ware, menge] of Object.entries(GEBAEUDE[typ].kosten))
    if (R[ware] < menge) return false;
  return true;
}

function platziere(typ, tx, ty, sid = 0) {
  const { x: ax, y: ay } = ankerVon(typ, tx, ty);
  const pruefung = platzOK(typ, ax, ay, sid);
  if (!pruefung.ok) { if (sid === 0) melden(pruefung.grund); return false; }
  if (!kostenReichen(typ, sid)) {
    if (sid === 0) melden('Zu wenig Rohstoffe für dieses Gebäude');
    return false;
  }

  const def = GEBAEUDE[typ];
  const R = spieler[sid].res;
  for (const [ware, menge] of Object.entries(def.kosten)) R[ware] -= menge;

  const geb = {
    id: naechsteId++, typ, x: ax, y: ay, spieler: sid,
    fortschritt: 0,   // Produktionsfortschritt in Sekunden
    eff: 0,           // Auslastung 0..1 (für das Info-Panel)
  };
  if (typ === 'wohnhaus') {
    Object.assign(geb, {
      stufe: 0,  // Index in STUFEN: 0 = Pioniere
      ew: 2, maxEw: STUFEN[0].maxEw,
      zufrieden: true, hungerZeit: 0, wachsZeit: 0, aufstiegZeit: 0,
    });
  }
  gebaeude.push(geb);

  // Kacheln belegen; Bäume auf dem Baufeld werden gerodet
  for (let y = ay; y < ay + def.h; y++) for (let x = ax; x < ax + def.w; x++) {
    belegt[y * N + x] = geb;
    const k = kachel(x, y);
    if (k.baum > 0) { k.baum = 0; kachelSchmutzig(x, y); }
  }

  if (typ === 'kontor') spieler[sid].kontor = geb;
  if (typ === 'kontor' && sid === 0) {
    state.kontorGebaut = true;
    werkzeugWaehlen('zeiger');   // zurück zum Auswahl-Werkzeug (auch Cursor)
    document.getElementById('hinweis').style.display = 'none';
    melden('Kontor errichtet – jetzt Wohnhäuser und Betriebe bauen!');
    menueBauen(); // Menü neu aufbauen (Kontor verschwindet daraus)
  }
  return true;
}

function abreissen(geb) {
  const def = GEBAEUDE[geb.typ];
  // Kacheln freigeben
  for (let y = geb.y; y < geb.y + def.h; y++)
    for (let x = geb.x; x < geb.x + def.w; x++)
      belegt[y * N + x] = null;
  gebaeude = gebaeude.filter(g => g !== geb);

  // Die Hälfte der Kosten gibt es zurück
  const R = spieler[geb.spieler].res;
  for (const [ware, menge] of Object.entries(def.kosten))
    R[ware] += Math.floor(menge / 2);

  if (geb.typ === 'kontor' && geb.spieler === 0) { state.kontorGebaut = false; menueBauen(); }
  if (state.auswahl === geb) { state.auswahl = null; panelZeigen(); }
  melden(def.name + ' abgerissen');
}

/* ---------- 5b. DIE KI-KONKURRENTEN ---------------------------- */
// Drei Computer-Spieler besiedeln nacheinander eigene Inseln, bauen
// nach einem festen Plan, kaufen fehlende Waren im Handel ein und
// nehmen am Wettrennen auf 500 Siedler teil.

// Größte noch unbesiedelte Insel suchen und dort das Kontor errichten
function kiSiedeln(sp) {
  const besetzt = new Set();
  for (const g of gebaeude)
    if (g.typ === 'kontor') besetzt.add(inselMarke[g.y * N + g.x]);
  let insel = -1, groesse = 0;
  for (let i = 0; i < inselGroessen.length; i++)
    if (!besetzt.has(i) && inselGroessen[i] > groesse) { insel = i; groesse = inselGroessen[i]; }
  if (insel < 0) return;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (inselMarke[y * N + x] !== insel) continue;
    const a = ankerVon('kontor', x, y);
    if (platzOK('kontor', a.x, a.y, sp.id).ok && platziere('kontor', x, y, sp.id)) {
      melden(`⛵ ${sp.name} hat eine Insel besiedelt!`, 'ki-siedeln');
      return;
    }
  }
}

// Bauplatz möglichst nah am eigenen Kontor suchen
function kiBauplatz(sp, typ) {
  const kz = zentrum(sp.kontor);
  let beste = null, besteD = 1e9;
  const R = 16;
  for (let y = Math.max(0, Math.floor(kz.y - R)); y < Math.min(N, kz.y + R); y++) {
    for (let x = Math.max(0, Math.floor(kz.x - R)); x < Math.min(N, kz.x + R); x++) {
      const d = Math.hypot(x - kz.x, y - kz.y);
      if (d >= besteD) continue;
      const a = ankerVon(typ, x, y);
      if (platzOK(typ, a.x, a.y, sp.id).ok) { beste = { x, y }; besteD = d; }
    }
  }
  return beste;
}

// Ein KI-Zug alle 5 Spielsekunden: einkaufen, dann bauen
function kiTick(sp, dt) {
  sp.timer += dt;
  if (sp.timer < 5) return;
  sp.timer = 0;

  // Noch keine Insel? Zur Startzeit besiedeln.
  if (!sp.kontor) {
    if (state.spielzeit >= sp.start) kiSiedeln(sp);
    return;
  }
  const R = sp.res;
  if (R.gold < 0) return;   // pleite: erst einmal sparen

  // Einkaufen: fehlende Waren am gemeinsamen Markt besorgen –
  // das treibt die Preise auch für dich!
  for (const [ware, abStufe] of Object.entries(KI_EINKAUF)) {
    if (sp.maxStufe >= abStufe && R[ware] < 12 && R.gold > 1200)
      handelAusfuehren(sp, ware, 10);
  }
  if (R.werkzeuge < 3 && R.gold > 1200) handelAusfuehren(sp, 'werkzeuge', 10);

  // Bauen: nächster Punkt auf dem Plan, danach freies Wachstum
  let typ = sp.plan ? sp.plan[sp.planIdx] : undefined;
  const nachPlan = typ !== undefined;
  if (!nachPlan) {
    typ = sp.extra % 5 === 4 ? 'fischer'
        : (sp.extra % 9 === 8 ? 'marktplatz' : 'wohnhaus');
  }
  if (sp.maxStufe < GEBAEUDE[typ].abStufe) return;  // wartet auf Aufstieg
  if (!kostenReichen(typ, sp.id)) return;            // wartet auf Rohstoffe
  const platz = kiBauplatz(sp, typ);
  if (!platz) { if (nachPlan) sp.planIdx++; return; } // kein Platz: überspringen
  if (platziere(typ, platz.x, platz.y, sp.id)) {
    if (nachPlan) sp.planIdx++; else sp.extra++;
  }
}

/* ---------- 6. SIMULATION ------------------------------------- */

function simSchritt(dt) {
  state.spielzeit += dt;

  // --- Bevölkerung zählen und den Warenbedarf JE SPIELER sammeln ---
  for (const sp of spieler) {
    sp.einwohner = 0; sp.siedlerEw = 0;
    sp._bedarf = { nahrung: 0 };   // Ware → Verbrauch je Sekunde
  }
  for (const g of gebaeude) {
    if (g.typ !== 'wohnhaus') continue;
    const sp = spieler[g.spieler];
    sp.einwohner += g.ew;
    if (g.stufe >= 1) sp.siedlerEw += g.ew;
    sp._bedarf.nahrung += g.ew * SIM.nahrungJeEinwohner;
    for (const [ware, satz] of Object.entries(STUFEN[g.stufe].brauch))
      sp._bedarf[ware] = (sp._bedarf[ware] || 0) + g.ew * satz;
  }

  // --- Verbrauch vom Lager abbuchen; leere Lager als Mangel vermerken ---
  for (const sp of spieler) {
    sp.mangel = {};
    for (const [ware, proSek] of Object.entries(sp._bedarf)) {
      sp.res[ware] = Math.max(0, sp.res[ware] - proSek * dt);
      if (proSek > 0 && sp.res[ware] <= 0.001) sp.mangel[ware] = true;
    }
    sp.hunger = sp.einwohner > 0 && !!sp.mangel.nahrung;
  }

  const steuernJe = spieler.map(() => 0);
  const unterhaltJe = spieler.map(() => 0);

  // --- Bäume wachsen langsam nach ---
  state.baumTimer = (state.baumTimer || 0) + dt;
  while (state.baumTimer >= 1) {
    state.baumTimer -= 1;
    for (let i = 0; i < 25; i++) {  // 25 Zufallsproben je Sekunde
      const idx = (Math.random() * N * N) | 0;
      const k = karte[idx];
      if (k.typ === 'wald' && k.baum < 1 && !belegt[idx]) {
        k.baum = Math.min(1, k.baum + SIM.baumNachwuchs);
        kachelSchmutzig(idx % N, (idx / N) | 0);
      }
    }
  }

  // --- Alle Gebäude durchgehen (jedes wirtschaftet für seinen Besitzer) ---
  for (const geb of gebaeude) {
    const def = GEBAEUDE[geb.typ];
    const sp = spieler[geb.spieler];
    const R = sp.res;
    unterhaltJe[geb.spieler] += def.unterhalt * dt;
    const z = zentrum(geb);

    // Kleine Helfer für die zwei Produktions-Bauarten:
    // Sammler ernten aus der Umgebung, Verarbeiter wandeln eine Ware um.
    // Liefert true, wenn in diesem Schritt eine Einheit fertig wurde.
    const sammler = (eff, ware, menge = 1) => {
      geb.eff = eff;
      geb.fortschritt += dt * eff;
      if (geb.fortschritt >= def.dauer) {
        geb.fortschritt -= def.dauer;
        R[ware] += menge;
        return true;
      }
      return false;
    };
    const verarbeiter = (rein, raus, menge = 1) => {
      if (R[rein] >= 1) {
        geb.eff = Math.min(1, geb.eff + dt);
        geb.fortschritt += dt;
        if (geb.fortschritt >= def.dauer) {
          geb.fortschritt -= def.dauer;
          R[rein] -= 1; R[raus] += menge;
        }
      } else geb.eff = Math.max(0, geb.eff - dt);
    };

    switch (geb.typ) {
      // --- Sammler: ernten aus dem Umkreis ---
      case 'fischer':
        sammler(Math.min(1, wasserImUmkreis(z.x, z.y, def.radius) / 6), 'nahrung');
        break;
      case 'jagd':
        sammler(Math.min(1, baeumeImUmkreis(z.x, z.y, def.radius) / 5), 'nahrung');
        break;
      case 'holzfaeller': {
        const geerntet = sammler(Math.min(1, baeumeImUmkreis(z.x, z.y, def.radius) / 4), 'holz');
        if (geerntet) {               // gerade geerntet → Wald etwas lichten
          let beste = null, bx = 0, by = 0;
          imUmkreis(z.x, z.y, def.radius, (k, x, y) => {
            if (k.baum > 0 && (!beste || k.baum > beste.baum)) { beste = k; bx = x; by = y; }
          });
          if (beste) { beste.baum = Math.max(0, beste.baum - 0.12); kachelSchmutzig(bx, by); }
        }
        break;
      }
      case 'schaffarm':
        sammler(Math.min(1, weideImUmkreis(z.x, z.y, def.radius) / 10), 'wolle');
        break;
      case 'getreidefarm':
        sammler(Math.min(1, weideImUmkreis(z.x, z.y, def.radius) / 10), 'getreide');
        break;
      case 'zuckerrohr':
        sammler(Math.min(1, weideImUmkreis(z.x, z.y, def.radius) / 10), 'zuckerrohr');
        break;
      case 'tabakplantage':
        sammler(Math.min(1, weideImUmkreis(z.x, z.y, def.radius) / 10), 'tabakblaetter');
        break;
      case 'gewuerzplantage':
        sammler(Math.min(1, weideImUmkreis(z.x, z.y, def.radius) / 10), 'gewuerze');
        break;
      case 'rinderfarm':
        sammler(Math.min(1, weideImUmkreis(z.x, z.y, def.radius) / 10), 'nahrung', 2);
        break;

      // --- Verarbeiter: wandeln eine Ware in eine andere um ---
      case 'weberei':     verarbeiter('wolle', 'stoffe'); break;
      case 'brennerei':   verarbeiter('zuckerrohr', 'alkohol'); break;
      case 'muehle':      verarbeiter('getreide', 'mehl'); break;
      case 'baeckerei':   verarbeiter('mehl', 'nahrung', 2); break;
      case 'tabakladen':  verarbeiter('tabakblaetter', 'tabak'); break;
      case 'schneiderei': verarbeiter('stoffe', 'kleidung'); break;

      // --- Betriebe am Gestein ---
      case 'ziegelei': {
        const stein = steinKachelImUmkreis(z.x, z.y, def.radius);
        if (stein) {
          geb.eff = Math.min(1, geb.eff + dt);
          geb.fortschritt += dt;
          if (geb.fortschritt >= def.dauer) { geb.fortschritt -= def.dauer; R.ziegel += 1; stein.stein -= 1; }
        } else geb.eff = Math.max(0, geb.eff - dt);
        break;
      }
      case 'schmiede': {
        const stein = steinKachelImUmkreis(z.x, z.y, def.radius);
        if (R.holz >= 1 && stein) {
          geb.eff = Math.min(1, geb.eff + dt);
          geb.fortschritt += dt;
          if (geb.fortschritt >= def.dauer) {
            geb.fortschritt -= def.dauer;
            R.holz -= 1; R.werkzeuge += 1; stein.stein -= 1;
          }
        } else geb.eff = Math.max(0, geb.eff - dt);
        break;
      }
      case 'goldschmiede': {
        const stein = steinKachelImUmkreis(z.x, z.y, def.radius);
        if (stein) {
          geb.eff = Math.min(1, geb.eff + dt);
          geb.fortschritt += dt;
          if (geb.fortschritt >= def.dauer) { geb.fortschritt -= def.dauer; R.schmuck += 1; stein.stein -= 1; }
        } else geb.eff = Math.max(0, geb.eff - dt);
        break;
      }

      // --- Wohnhäuser: Zufriedenheit, Steuern, Wachstum, Aufstieg ---
      case 'wohnhaus': {
        const st = STUFEN[geb.stufe];
        const markt = marktAnbindung(z.x, z.y, geb.spieler);
        // Zufrieden = Markt + satt + alle Waren der eigenen Stufe vorrätig
        let warenOK = !sp.hunger;
        for (const ware of Object.keys(st.brauch))
          if (sp.mangel[ware]) warenOK = false;
        geb.zufrieden = markt && warenOK;

        // Steuern: Unzufriedene zahlen nur die Hälfte
        steuernJe[geb.spieler] += geb.ew * st.steuer * (geb.zufrieden ? 1 : 0.5) * dt;

        // Hunger: nach einer Weile ziehen Leute weg
        if (sp.hunger) {
          geb.hungerZeit += dt;
          if (geb.hungerZeit >= SIM.hungerBisWegzug) {
            geb.hungerZeit = 0;
            if (geb.ew > 1) geb.ew -= 1;
          }
        } else geb.hungerZeit = Math.max(0, geb.hungerZeit - dt);

        // Wachstum bei Zufriedenheit
        if (geb.zufrieden && geb.ew < geb.maxEw) {
          geb.wachsZeit += dt;
          if (geb.wachsZeit >= SIM.wachstumsDauer) { geb.wachsZeit = 0; geb.ew += 1; }
        } else geb.wachsZeit = 0;

        // Aufstieg zur nächsten Stufe: Haus gut gefüllt, die Waren der
        // nächsten Stufe im Lager, ihr Gebäude in Reichweite und
        // Baumaterial (Holz/Ziegel) vorhanden
        const naechste = STUFEN[geb.stufe + 1];
        if (naechste) {
          let bereit = geb.zufrieden && geb.ew >= Math.ceil(st.maxEw * 0.75);
          for (const ware of Object.keys(naechste.brauch))
            if (R[ware] < 0.5) bereit = false;
          if (naechste.material)
            for (const [ware, menge] of Object.entries(naechste.material))
              if (R[ware] < menge) bereit = false;
          if (naechste.gebaeudeNah &&
              !gebaeudeInReichweite(naechste.gebaeudeNah, z.x, z.y, geb.spieler))
            bereit = false;
          if (bereit) {
            geb.aufstiegZeit += dt;
            if (geb.aufstiegZeit >= SIM.aufstiegsDauer) {
              if (naechste.material)   // Baumaterial wird verbaut
                for (const [ware, menge] of Object.entries(naechste.material))
                  R[ware] -= menge;
              geb.stufe++; geb.maxEw = naechste.maxEw; geb.aufstiegZeit = 0;
              const warNeu = geb.stufe > sp.maxStufe;
              sp.maxStufe = Math.max(sp.maxStufe, geb.stufe);
              if (geb.spieler === 0) {
                melden(`🎉 Ein Haus ist zu ${st.dativ} aufgestiegen!`, 'aufstieg');
                if (warNeu) menueBauen();   // neue Gebäude freigeschaltet
              }
            }
          } else geb.aufstiegZeit = 0;
        }
        break;
      }
    }
  }

  // --- Goldbilanz je Spieler ---
  for (const sp of spieler) sp.res.gold += steuernJe[sp.id] - unterhaltJe[sp.id];
  const rate = dt > 0 ? (steuernJe[0] - unterhaltJe[0]) / dt : 0;
  state.goldRate = state.goldRate * 0.95 + rate * 0.05;

  // --- Marktpreise pendeln langsam zum Normalwert zurück ---
  for (const ware of Object.keys(markt))
    markt[ware] += (1 - markt[ware]) * 0.01 * dt;

  // --- Die KI-Spieler ziehen ---
  for (const sp of spieler) if (sp.ki) kiTick(sp, dt);

  // --- Bankrott-Uhr (gilt nur für dich) ---
  if (res.gold < 0) {
    state.pleiteZeit += dt;
    if (state.pleiteZeit >= SIM.pleiteDauer && !state.vorbei) spielVorbei();
  } else state.pleiteZeit = 0;

  // --- Wettrennen: Wer erreicht zuerst das Siedler-Ziel? ---
  if (!state.rennenVorbei) {
    if (spieler[0].siedlerEw >= SIM.zielSiedler) {
      state.rennenVorbei = true; state.gewonnen = true;
      gewonnenAnzeigen();
    } else {
      for (const sp of spieler) {
        if (sp.ki && sp.siedlerEw >= SIM.zielSiedler) {
          state.rennenVorbei = true;
          verlorenAnzeigen(sp);
          break;
        }
      }
    }
  }

  // Werte für die Anzeige merken (deine Sicht)
  state.einwohner = spieler[0].einwohner;
  state.siedlerEw = spieler[0].siedlerEw;
  state.hunger = spieler[0].hunger;
  state.mangel = spieler[0].mangel;
}

/* ---------- 7. ZEICHNEN --------------------------------------- */

const leinwand = document.getElementById('karte');
const ctx = leinwand.getContext('2d');
let dpr = 1;

// Das Terrain ändert sich selten – wir zeichnen es einmal in einen
// unsichtbaren Puffer und stempeln den jedes Bild nur noch auf.
const terrainPuffer = document.createElement('canvas');
terrainPuffer.width = N * TP; terrainPuffer.height = N * TP;
const tctx = terrainPuffer.getContext('2d');

// Grundfarbe einer Kachel malen (Wasser, Strand, Gras, Wald, Berg).
// Der Puffer arbeitet mit TP Pixeln je Kachel und wird beim Zeichnen
// auf die Weltgröße (T je Kachel) hochskaliert.
function kachelHintergrund(x, y) {
  const k = kachel(x, y);
  const px = x * TP, py = y * TP;
  const v = (k.var - 0.5) * 14; // kleine Helligkeitsvariation je Kachel

  let farbe;
  if      (k.typ === 'wasser') farbe = `rgb(${64 + v},${118 + v},${168 + v})`;
  else if (k.typ === 'strand') farbe = `rgb(${232 + v},${217 + v},${168 + v})`;
  else if (k.typ === 'berg')   farbe = `rgb(${158 + v},${158 + v},${150 + v})`;
  else if (k.typ === 'wald')   farbe = `rgb(${106 + v},${156 + v},${88 + v})`;
  else                         farbe = `rgb(${127 + v},${176 + v},${105 + v})`;
  tctx.fillStyle = farbe;
  tctx.fillRect(px, py, TP, TP);

  // Wellen-Tupfer auf dem Wasser
  if (k.typ === 'wasser' && k.var > 0.72) {
    tctx.fillStyle = 'rgba(255,255,255,0.18)';
    tctx.fillRect(px + TP * 0.15 + k.var * TP * 0.25, py + TP * 0.3 + k.var * TP * 0.2, TP * 0.3, 2);
  }
}

// Symbole auf einer Kachel malen (Bäume, Berge, Gestein)
function kachelInhalt(x, y) {
  const k = kachel(x, y);
  const px = x * TP, py = y * TP;
  tctx.textAlign = 'center'; tctx.textBaseline = 'middle';

  // Bäume als kleine Nadelbaum-Symbole, Anzahl nach Bestand
  if (k.baum > 0.02) {
    const anzahl = Math.max(1, Math.round(k.baum * 3));
    for (let i = 0; i < anzahl; i++) {
      const ox = ((k.var * 7 + i * 2.6) % 1) * (TP - 10) + 5;
      const oy = ((k.var * 13 + i * 3.7) % 1) * (TP - 11) + 6;
      tctx.font = `${TP * 0.3 + k.baum * TP * 0.2}px sans-serif`;
      tctx.fillText('🌲', px + ox, py + oy);
    }
  }

  // Berge mit Gesteinssymbol
  if (k.typ === 'berg') {
    tctx.font = `${TP * 0.72}px sans-serif`;
    tctx.fillText('⛰️', px + TP / 2, py + TP / 2 + 2);
    if (k.stein > 0 && k.var > 0.5) {
      tctx.font = `${TP * 0.28}px sans-serif`;
      tctx.fillText('🪨', px + TP * 0.75, py + TP * 0.78);
    }
  }
}

// Das komplette Terrain neu malen (nur beim Start nötig)
function terrainZeichnen() {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) kachelHintergrund(x, y);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) kachelInhalt(x, y);
  state.terrainAlt = false;
  schmutzKacheln.clear();
}

// Geänderte Kacheln merken (z. B. gefällte oder nachgewachsene Bäume) …
const schmutzKacheln = new Set();
function kachelSchmutzig(x, y) { schmutzKacheln.add(y * N + x); }

// … und nur diese Stellen auffrischen statt der ganzen Karte.
// Es wird je ein 3×3-Block erneuert, weil Baum-Symbole leicht über
// die Kachelränder hinausragen.
function kachelnAuffrischen() {
  for (const idx of schmutzKacheln) {
    const x0 = idx % N, y0 = (idx / N) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (kachel(x0 + dx, y0 + dy)) kachelHintergrund(x0 + dx, y0 + dy);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (kachel(x0 + dx, y0 + dy)) kachelInhalt(x0 + dx, y0 + dy);
  }
  schmutzKacheln.clear();
}

// Abgerundetes Rechteck (eigene Hilfsfunktion, läuft überall)
function rundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function zeichnen() {
  // Leinwandgröße an das Fenster anpassen (inkl. HiDPI)
  dpr = window.devicePixelRatio || 1;
  const b = leinwand.clientWidth, h = leinwand.clientHeight;
  if (leinwand.width !== b * dpr || leinwand.height !== h * dpr) {
    leinwand.width = b * dpr; leinwand.height = h * dpr;
  }

  if (state.terrainAlt) terrainZeichnen();
  else if (schmutzKacheln.size) kachelnAuffrischen();

  // Hintergrund: tiefes Meer
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#2f5d8a';
  ctx.fillRect(0, 0, b, h);

  // Ab hier in Weltkoordinaten zeichnen
  const z = kamera.zoom;
  ctx.setTransform(dpr * z, 0, 0, dpr * z, -kamera.x * dpr * z, -kamera.y * dpr * z);
  ctx.imageSmoothingEnabled = true;
  // Terrain-Puffer (TP px je Kachel) auf Weltgröße (T px je Kachel) skalieren
  ctx.drawImage(terrainPuffer, 0, 0, N * TP, N * TP, 0, 0, N * T, N * T);

  // Gitterlinien nur beim Bauen einblenden
  const bauModus = state.werkzeug !== 'zeiger' && state.werkzeug !== 'abriss';
  if (bauModus) {
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1 / z;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      ctx.moveTo(i * T, 0); ctx.lineTo(i * T, N * T);
      ctx.moveTo(0, i * T); ctx.lineTo(N * T, i * T);
    }
    ctx.stroke();
  }

  // --- Gebäude ---
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const geb of gebaeude) {
    const def = GEBAEUDE[geb.typ];
    const px = geb.x * T, py = geb.y * T, bw = def.w * T, bh = def.h * T;

    // Sockel
    rundRect(ctx, px + 3, py + 3, bw - 6, bh - 6, 6);
    ctx.fillStyle = def.farbe;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Symbol – Wohnhäuser zeigen das Symbol ihrer Bevölkerungsstufe
    let emoji = def.emoji;
    if (geb.typ === 'wohnhaus') emoji = STUFEN[geb.stufe].emoji;
    ctx.font = `${Math.min(bw, bh) * 0.58}px sans-serif`;
    ctx.fillText(emoji, px + bw / 2, py + bh / 2 + 1);

    // Besitzer-Fähnchen: farbiger Punkt oben links
    ctx.beginPath();
    ctx.arc(px + 7, py + 7, 4, 0, Math.PI * 2);
    ctx.fillStyle = spieler[geb.spieler].farbe;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Bedürfnis-Punkt an jedem Wohnhaus: grün = zufrieden, rot = nicht.
    // Unzufriedene Häuser senden zusätzlich einen pulsierenden Ring aus.
    if (geb.typ === 'wohnhaus') {
      if (!geb.zufrieden) {
        const puls = (performance.now() % 1100) / 1100;
        ctx.beginPath();
        ctx.arc(px + bw - 7, py + 7, 4.5 + puls * 10, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(220,38,38,${(1 - puls) * 0.9})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(px + bw - 7, py + 7, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = geb.zufrieden ? '#16a34a' : '#dc2626';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    // Auswahl-Rahmen
    if (state.auswahl === geb) {
      rundRect(ctx, px + 1, py + 1, bw - 2, bh - 2, 7);
      ctx.strokeStyle = '#16a34a';
      ctx.lineWidth = 3 / Math.sqrt(z);
      ctx.stroke();
    }
  }

  // --- Das Schiff (leicht auf den Wellen schaukelnd) ---
  if (schiff.pfad.length) {   // Ziel-Fähnchen, solange gesegelt wird
    const zielP = schiff.pfad[schiff.pfad.length - 1];
    ctx.font = `${T * 0.5}px sans-serif`;
    ctx.fillText('🚩', zielP.x * T, zielP.y * T - 6);
  }
  const wippen = Math.sin(performance.now() / 650) * 1.5;
  ctx.font = `${T * 0.9}px sans-serif`;
  ctx.fillText('⛵', schiff.x * T, schiff.y * T - 4 + wippen);

  // Beim Kontor-Bau: Baureichweite rund ums Schiff anzeigen
  if (state.werkzeug === 'kontor')
    kreisZeichnen({ x: schiff.x, y: schiff.y }, SIM.schiffBauRadius);

  // Wirkungskreis des ausgewählten Gebäudes
  if (state.auswahl) {
    const def = GEBAEUDE[state.auswahl.typ];
    const radius = def.marktRadius || def.radius;
    if (radius) kreisZeichnen(zentrum(state.auswahl), radius);
  }

  // --- Bau-Vorschau: schwebende (angetippte) Position oder Mauszeiger ---
  if (bauModus) {
    let t = null;
    if (state.vorschau && state.vorschau.modus === 'bau')
      t = { x: state.vorschau.tx, y: state.vorschau.ty };
    else if (state.hover)
      t = bildschirmZuKachel(state.hover.sx, state.hover.sy);
    if (t) {
      const def = GEBAEUDE[state.werkzeug];
      const a = ankerVon(state.werkzeug, t.x, t.y);
      const ok = platzOK(state.werkzeug, a.x, a.y).ok && kostenReichen(state.werkzeug);
      const radius = def.marktRadius || def.radius;
      if (radius) kreisZeichnen({ x: a.x + def.w / 2, y: a.y + def.h / 2 }, radius);

      rundRect(ctx, a.x * T + 2, a.y * T + 2, def.w * T - 4, def.h * T - 4, 6);
      ctx.fillStyle = ok ? 'rgba(22,163,74,0.35)' : 'rgba(220,38,38,0.35)';
      ctx.fill();
      ctx.strokeStyle = ok ? '#16a34a' : '#dc2626';
      ctx.lineWidth = 2 / Math.sqrt(z);
      ctx.stroke();
      ctx.font = `${Math.min(def.w, def.h) * T * 0.55}px sans-serif`;
      ctx.globalAlpha = 0.85;
      ctx.fillText(def.emoji, (a.x + def.w / 2) * T, (a.y + def.h / 2) * T);
      ctx.globalAlpha = 1;
    }
  }

  // Abriss-Vorschau: gewähltes bzw. überfahrenes Gebäude rot einfärben
  if (state.werkzeug === 'abriss') {
    let geb = null;
    if (state.vorschau && state.vorschau.modus === 'abriss') geb = state.vorschau.geb;
    else if (state.hover) {
      const t = bildschirmZuKachel(state.hover.sx, state.hover.sy);
      geb = t && belegtAuf(t.x, t.y);
    }
    if (geb) {
      const def = GEBAEUDE[geb.typ];
      rundRect(ctx, geb.x * T + 2, geb.y * T + 2, def.w * T - 4, def.h * T - 4, 6);
      ctx.fillStyle = 'rgba(220,38,38,0.4)';
      ctx.fill();
    }
  }
}

// Halbtransparenter Wirkungskreis (für Reichweiten)
function kreisZeichnen(mitte, radius) {
  ctx.beginPath();
  ctx.arc(mitte.x * T, mitte.y * T, radius * T, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(22,163,74,0.08)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(22,163,74,0.55)';
  ctx.lineWidth = 2 / kamera.zoom;
  ctx.setLineDash([6 / kamera.zoom, 5 / kamera.zoom]);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- 8. KAMERA & EINGABE ------------------------------- */

function bildschirmZuWelt(sx, sy) {
  return { x: sx / kamera.zoom + kamera.x, y: sy / kamera.zoom + kamera.y };
}
function bildschirmZuKachel(sx, sy) {
  const w = bildschirmZuWelt(sx, sy);
  const x = Math.floor(w.x / T), y = Math.floor(w.y / T);
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  return { x, y };
}

function kameraBegrenzen() {
  const sb = leinwand.clientWidth / kamera.zoom;   // sichtbare Weltbreite
  const sh = leinwand.clientHeight / kamera.zoom;
  const rand = 6 * T; // etwas Meer am Rand erlauben
  kamera.x = Math.min(Math.max(kamera.x, -rand), N * T + rand - sb);
  kamera.y = Math.min(Math.max(kamera.y, -rand), N * T + rand - sh);
}

function zoomAuf(sx, sy, faktor) {
  const vorher = bildschirmZuWelt(sx, sy);
  kamera.zoom = Math.min(2.6, Math.max(0.1, kamera.zoom * faktor));
  // Der Punkt unter dem Mauszeiger bleibt an Ort und Stelle
  kamera.x = vorher.x - sx / kamera.zoom;
  kamera.y = vorher.y - sy / kamera.zoom;
  kameraBegrenzen();
}

// --- Zeiger-Ereignisse (Maus und Touch gemeinsam) ---
const zeiger = new Map();       // aktive Finger/Maustasten
let ziehStart = null;           // Startpunkt fürs Verschieben
let gezogen = false;            // wurde wirklich gezogen (kein Klick)?
let pinchAbstand = 0;

leinwand.addEventListener('pointerdown', e => {
  leinwand.setPointerCapture(e.pointerId);
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (zeiger.size === 1) {
    ziehStart = { sx: e.clientX, sy: e.clientY, kx: kamera.x, ky: kamera.y };
    gezogen = false;
  } else if (zeiger.size === 2) {
    const [a, b] = [...zeiger.values()];
    pinchAbstand = Math.hypot(a.x - b.x, a.y - b.y);
  }
});

leinwand.addEventListener('pointermove', e => {
  state.hover = { sx: e.clientX, sy: e.clientY };
  if (!zeiger.has(e.pointerId)) return;
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (zeiger.size === 1 && ziehStart) {
    const dx = e.clientX - ziehStart.sx, dy = e.clientY - ziehStart.sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) gezogen = true;
    if (gezogen) {
      kamera.x = ziehStart.kx - dx / kamera.zoom;
      kamera.y = ziehStart.ky - dy / kamera.zoom;
      kameraBegrenzen();
      leinwand.classList.add('ziehen');
    }
  } else if (zeiger.size === 2) {
    // Zwei Finger: Zoomen (Pinch)
    const [a, b] = [...zeiger.values()];
    const abstand = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchAbstand > 0) {
      zoomAuf((a.x + b.x) / 2, (a.y + b.y) / 2, abstand / pinchAbstand);
    }
    pinchAbstand = abstand;
  }
});

function zeigerEnde(e) {
  const warEinzeln = zeiger.size === 1;
  zeiger.delete(e.pointerId);
  if (warEinzeln && !gezogen && ziehStart) klickAufKarte(e.clientX, e.clientY);
  if (zeiger.size === 0) { ziehStart = null; leinwand.classList.remove('ziehen'); }
  pinchAbstand = 0;
}
leinwand.addEventListener('pointerup', zeigerEnde);
leinwand.addEventListener('pointercancel', zeigerEnde);
